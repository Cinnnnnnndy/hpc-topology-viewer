<style>
/*! © 2026 王欣迪 (Cindy_wxd) · SPDX-License-Identifier: Apache-2.0 · 使用、修改或再分发须保留本署名与 NOTICE */
/* 交互地图：一张无限画布。节点 = demo 的真截图，线 = 从源截图上点的位置连到目标截图上落到的位置。
   视觉同 demo：#111 底、灰阶；状态色只用在状态上（琥珀 / 红）；选中与热点一律白。 */
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap;
  src: url("./fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations"), url("./fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap;
  src: url("./fonts/jetbrains-mono-latin-ext-wght-normal.woff2") format("woff2-variations"), url("./fonts/jetbrains-mono-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root {
  --bg: #111111; --s1: #1A1A1A; --s2: #222222; --s3: #2A2A2A; --bd: #2E2E2E;
  --tx: #E8E8E8; --tx2: #8A8A8A; --tx3: #5C5C5C; --warn: #FAB219; --crit: #F85149;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --inv: 1; --bs: 1;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font-family: var(--mono); overflow: hidden; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* ── 无限画布 */
#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  background-color: var(--bg);
  background-image: radial-gradient(circle, rgba(255, 255, 255, .075) 0 .8px, transparent 1.1px);
  background-size: var(--dot-s, 24px) var(--dot-s, 24px); background-position: var(--dot-x, 0) var(--dot-y, 0); }
#vp.is-drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#vp.is-moving #world { will-change: transform; }

/* 截图卡 */
.card { position: absolute; width: 1200px; }
.card .hd { position: relative; height: 150px; }
/* 标题随缩小变大（屏上约 11px），但不超过一列的宽度（列距 IW + GV），放不下就省略号 */
.card .nm { position: absolute; left: 0; bottom: 64px; max-width: 1960px; overflow: hidden; text-overflow: ellipsis; font-size: clamp(40px, calc(11px * var(--inv)), 240px); font-weight: 600; line-height: 1.12; white-space: nowrap; color: var(--tx); }
.card .ds { position: absolute; left: 0; right: 0; bottom: 6px; height: 56px; font-size: 21px; line-height: 28px; color: var(--tx2); overflow: hidden; }
/* 深链签单独一行，放在标题上面（只在 35% 以上显示，那时标题固定 40px） */
.card .dl { position: absolute; right: 0; bottom: 114px; display: flex; gap: 8px; flex-wrap: nowrap; justify-content: flex-end; max-width: 1200px; }
.card .dl span { font-size: 18px; line-height: 28px; padding: 0 10px; border-radius: 14px; border: 1px dashed #5a5a5a; color: var(--tx2); cursor: default; white-space: nowrap; }
.card .dl span.on, .card .dl span:hover { color: #fff; border-color: #fff; }
.card .shot { position: relative; width: 1200px; height: 750px; border-radius: 14px; overflow: hidden; background: #0c0c0c; box-shadow: 0 0 0 2px var(--bd); cursor: zoom-in; }
.card .shot img { position: absolute; left: 0; top: 0; display: block; width: 1200px; height: 750px; }
.card.on .shot { box-shadow: 0 0 0 5px #fff; }
.card .hs { list-style: none; margin: 18px 0 0; padding: 0; columns: 2; column-gap: 28px; font-size: 19px; line-height: 30px; }
.card .hs li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tx); cursor: pointer; border-radius: 6px; padding: 0 6px; break-inside: avoid; }
.card .hs li b { font-weight: 500; margin-right: 4px; }
.card .hs li i { font-style: normal; color: var(--tx2); }
.card .hs li.bk { color: var(--tx2); }
.card .hs li.bk i { color: var(--tx3); }
.card .hs li:hover, .card .hs li.on { background: #fff; color: #111; }
.card .hs li:hover i, .card .hs li.on i { color: #333; }
.far .card .ds, .far .card .hs, .far .card .dl { visibility: hidden; }

/* 画布上的面板 */
.panel { position: absolute; background: var(--s1); border: 2px solid var(--bd); border-radius: 32px; padding: 56px 60px; overflow: hidden; color: var(--tx); font-size: 28px; line-height: 1.5; }
.panel h2 { margin: 0 0 10px; font-size: 56px; line-height: 1.2; font-weight: 600; }
.panel h3 { margin: 30px 0 8px; font-size: 32px; font-weight: 600; color: var(--tx); }
.panel .sub { color: var(--tx2); font-size: 27px; margin: 0 0 28px; }
.panel table { border-collapse: collapse; width: 100%; font-size: 25px; line-height: 1.42; }
.panel td, .panel th { text-align: left; vertical-align: top; padding: 8px 14px 8px 0; border-top: 1px solid var(--s3); }
.panel th { color: var(--tx2); font-weight: 500; font-size: 22px; border-top: 0; }
.panel td:first-child { white-space: nowrap; color: #fff; }
.panel code { font-family: var(--mono); color: #fff; }
.panel ul, .panel ol { margin: 0; padding-left: 1.4em; }
.panel li { margin: 4px 0; }
.panel .cols3 { columns: 3; column-gap: 72px; font-size: 28px; }
.panel .cols2 { columns: 2; column-gap: 90px; }
.panel .fx li { margin: 6px 0; }
.panel .cols2 li { break-inside: avoid; }
.panel .fn { list-style: none; padding: 0; margin: 22px 0 0; color: var(--tx2); font-size: 24px; line-height: 1.45; }
.panel .fn li { margin: 4px 0; }
.panel.p-gest li { margin: 10px 0; }
.panel .cols3 li { break-inside: avoid; }
.panel .k { color: var(--tx2); }
.panel .warn { color: var(--warn); } .panel .crit { color: var(--crit); }
.panel.jp { cursor: pointer; }
.panel.jp:hover, .panel.jp.on { border-color: #fff; }
.panel.jp ol { padding-left: 0; list-style: none; counter-reset: s; }
.panel.jp ol li { counter-increment: s; position: relative; padding-left: 64px; margin: 12px 0; font-size: 28px; }
.panel.jp ol li::before { content: counter(s); position: absolute; left: 0; top: 2px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #111; font-size: 24px; line-height: 44px; text-align: center; font-weight: 600; }
.panel.jp .mode { font-size: 24px; color: var(--tx2); border: 2px solid #444; border-radius: 20px; padding: 2px 16px; margin-left: 18px; vertical-align: middle; }
.panel .lg { display: grid; grid-template-columns: 210px 1fr; gap: 16px 26px; align-items: center; font-size: 26px; line-height: 1.35; }
.panel .lg svg { width: 210px; height: 50px; overflow: visible; }
/* 列头 / 行头：缩小时跟着变大（屏上约 12px），适配全图时也读得出深度与视图 */
.lbl { position: absolute; color: #8a8a8a; font-weight: 600; line-height: 1.18; }
.lbl.col { width: 1980px; word-break: keep-all; font-size: max(44px, calc(11.5px * var(--inv))); transform: translateY(calc(-100% - max(40px, calc(8px * var(--inv))))); }
.lbl.row { width: max(640px, calc(112px * var(--inv))); word-break: keep-all; font-size: max(38px, calc(11.5px * var(--inv))); text-align: right; transform: translateX(calc(-100% - max(40px, calc(10px * var(--inv))))); }

/* 连线层 */
#ov { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#ov .ln, #ov .cs, #ov .ht { fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#ov .cs { stroke: #0b0b0b; stroke-opacity: .75; stroke-width: 3.6px; }
#ov .ln { stroke: #B4B4B4; stroke-width: 1.5px; }
#ov .s-dash .ln { stroke-dasharray: 7 5; }
#ov .s-dot .ln { stroke-dasharray: 1.2 4.2; stroke-linecap: round; stroke-width: 1.7px; }
#ov .s-thin .ln { stroke-width: .9px; stroke: #888; }
#ov .ld .ln { stroke-dasharray: 2 3 !important; stroke-width: 1px !important; }
#ov .ht { stroke: transparent; stroke-width: 14px; pointer-events: stroke; cursor: pointer; }
#ov .ah { fill: #B4B4B4; transform-box: fill-box; transform-origin: 100% 50%; transform: scale(var(--bs)); }
#ov .lb { fill: none; stroke: #fff; stroke-width: 1.4px; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: .55; }
/* 示意落点：目标截图只是同类状态（别的卡 / Rack / 视图 / 场景），框换点划线 */
#ov .lb.ax { stroke-dasharray: 12 4 2 4; }
/* 线在源 / 目标截图里面的那一段压在内容上：平时淡，亮起时才全显 */
#ov .inn .ln { stroke-opacity: .28; }
#ov .inn .cs { stroke-opacity: .2; }
#ov .on.inn .ln { stroke-opacity: 1; }
#ov .on.inn .cs { stroke-opacity: .9; }
#ov .hb { fill: none; stroke: #fff; stroke-width: 1.6px; vector-effect: non-scaling-stroke; pointer-events: all; cursor: pointer; }
#ov .hb.area { stroke-dasharray: 3 3; }
#ov .hp { fill: none; stroke: #fff; stroke-width: 1.8px; vector-effect: non-scaling-stroke; }
#ov .bd { pointer-events: all; cursor: pointer; }
/* 编号圆放在热点框左上角的外面（右下切点贴着框角），放大缩小都绕这个切点，不压热点本身 */
#ov .bdi { transform-box: fill-box; transform-origin: 100% 100%; transform: scale(var(--bs)); }
#ov .key .bdi { transform-origin: 50% 50%; }
#ov .bdi circle { fill: #fff; stroke: #111; stroke-width: 2px; }
#ov .bdi text { fill: #111; font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: var(--mono); }
#ov .bk .bdi circle { fill: #3a3a3a; stroke: #fff; stroke-width: 1.5px; stroke-dasharray: 2 2.4; }
#ov .bk .bdi text { fill: #fff; }
#ov .bk .hb { stroke-dasharray: 2 3; opacity: .8; }
#ov .key rect { fill: #2a2a2a; stroke: #fff; stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
#ov .key text { fill: #fff; font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: var(--mono); }
#ov .chip { pointer-events: all; cursor: pointer; }
#ov .chip rect { fill: #1A1A1A; stroke: #555; stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#ov .chip .c1 { fill: #E8E8E8; font-size: 22px; font-weight: 500; font-family: var(--mono); }
#ov .chip .c2 { fill: #8A8A8A; font-size: 17px; font-family: var(--mono); }
#ov .chip .nw { fill: #111; font-size: 15px; font-weight: 700; font-family: var(--mono); }
#ov .chip .nwb { fill: #fff; }
#ov .step { display: none; }
#ov .step circle { fill: #fff; stroke: #111; stroke-width: 3px; }
#ov .step text { fill: #111; font-size: 32px; font-weight: 700; text-anchor: middle; dominant-baseline: central; font-family: var(--mono); }
#ov .stepw { transform-box: fill-box; transform-origin: 50% 50%; transform: scale(var(--bs)); }
/* 返回线 / 原地 / 深链：默认收起，高亮时出来 */
#ov .g-back, #ov .g-self, #ov .g-url { display: none; }
#ov.show-back .g-back { display: inline; }
#ov .on.g-back, #ov .on.g-self, #ov .on.g-url { display: inline; }
#ov .chip.g-back, #ov .chip.g-self { display: none; }
#ov.show-back .chip.g-back { display: inline; }
#ov .chip.on { display: inline; }
.far #ov .chip { display: none !important; }
.far #ov .chip.pin { display: inline !important; }
/* 高亮：一条（悬停）或一个场景 */
#ov.hl [data-e]:not(.on), #ov.sc [data-e]:not(.on) { opacity: .1; }
#ov.hl .on .ln, #ov.sc .on .ln { stroke: #fff; stroke-width: 3px; }
#ov.hl .on .cs, #ov.sc .on .cs { stroke-width: 7px; stroke-opacity: .9; }
#ov.hl .on .ah, #ov.sc .on .ah { fill: #fff; }
#ov .on .lb, #ov .on.lb { opacity: 1; stroke-width: 2.4px; }
#ov.hl .chip.on rect, #ov.sc .chip.on rect { stroke: #fff; stroke-width: 2px; }
#ov.sc .step.on { display: inline; }
#world.dim .card:not(.on) { opacity: .45; }
#world.dim .panel:not(.on) { opacity: .5; }
#ov [data-e] { transition: opacity .15s; }

/* ── 固定在屏幕上的一小块 */
.ui { position: fixed; z-index: 10; }
#top { left: 16px; top: 16px; max-width: calc(100vw - 32px); background: rgba(26, 26, 26, .92); border: 1px solid var(--bd); border-radius: 18px; padding: 12px 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#top h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
#top p { margin: 3px 0 0; font-size: 12px; color: var(--tx2); line-height: 1.45; }
#top a { display: inline-block; margin-top: 6px; font-size: 12px; color: #fff; text-decoration: none; border: 1px solid #555; border-radius: 12px; padding: 2px 10px; }
#top a:hover { background: #fff; color: #111; }
/* 场景面板：上面一排按钮、下面这一条的步骤；两块都能在自己里面滚，整块不高过「视口 − 顶栏」 */
#scn { left: 16px; bottom: 16px; width: 232px; max-height: calc(100vh - var(--top-h, 120px) - 28px); display: flex; flex-direction: column; background: rgba(26, 26, 26, .92); border: 1px solid var(--bd); border-radius: 18px; padding: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12px; }
#scn .bt { flex: 0 1 auto; min-height: 64px; overflow-y: auto; scrollbar-width: thin; }
#scn .gt { color: var(--tx3); font-size: 11px; margin: 8px 6px 3px; }
#scn .gt:first-child { margin-top: 2px; }
#scn button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 5px 8px; font-size: 12.5px; cursor: pointer; color: var(--tx); }
#scn button:hover { background: var(--s3); }
#scn button.on { background: #fff; color: #111; }
#scn .q { flex: 0 1 auto; min-height: 0; overflow-y: auto; color: var(--tx2); font-size: 11px; line-height: 1.4; margin: 6px 0 2px; padding: 0 6px; border-top: 1px solid var(--s3); scrollbar-width: thin; }
#scn .q:empty { display: none; }
#scn .q summary { list-style: none; cursor: default; padding-top: 6px; }
#scn .q summary::-webkit-details-marker { display: none; }
#scn .q b { color: var(--tx); font-weight: 500; }
#scn .q ol { margin: 6px 0 0; padding-left: 1.5em; color: var(--tx); }
#scn .q li { margin: 2px 0; }
#scn .q li span { color: var(--tx2); }
#ctl { right: 16px; bottom: 16px; display: flex; gap: 6px; align-items: center; background: rgba(26, 26, 26, .92); border: 1px solid var(--bd); border-radius: 22px; padding: 5px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#ctl button { min-width: 34px; height: 34px; border-radius: 17px; border: 0; background: none; cursor: pointer; font-size: 14px; padding: 0 10px; }
#ctl button:hover { background: var(--s3); }
#ctl button.on { background: #fff; color: #111; }
#ctl .zl { font-size: 11px; color: var(--tx2); min-width: 44px; text-align: center; }
#mini { right: 16px; bottom: 64px; background: rgba(17, 17, 17, .92); border: 1px solid var(--bd); border-radius: 12px; cursor: pointer; }
#mini canvas { display: block; border-radius: 12px; }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 340px; background: #1A1A1A; border: 1px solid #555; border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.45; color: var(--tx); display: none; }
#tip b { font-weight: 600; }
#tip .p { color: var(--tx2); }
#tip .ax { color: var(--tx2); margin-top: 4px; padding-top: 4px; border-top: 1px dashed #444; }
#tip.dock { pointer-events: auto; left: 8px !important; right: 8px; top: auto !important; bottom: 106px; max-width: none; font-size: 13px; padding: 9px 12px; }
/* 详情 */
#dt { position: fixed; inset: 0; z-index: 30; background: #0a0a0a; display: none; overflow: auto; -webkit-overflow-scrolling: touch; }
#dt.open { display: block; }
#dt .in { max-width: 1240px; margin: 0 auto 60px; padding: 8px 20px 0; }
/* 关闭 / 定位那一排是 .in 的直接子元素、sticky 贴顶：往下滚多远都在 */
#dt .bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: flex-end; gap: 8px; padding: 10px 0; background: #0a0a0a; }
#dt .hd { display: block; }
#dt .keys { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; font-size: 12px; }
#dt .keys span { border: 1px solid #fff; background: #2a2a2a; border-radius: 7px; padding: 2px 8px; }
#dt .keys span.on { background: #fff; color: #111; }
#dt h2 { margin: 0; font-size: 22px; font-weight: 600; }
#dt .ds { color: var(--tx2); font-size: 13px; margin: 6px 0 14px; line-height: 1.5; }
#dt .x { flex: none; border: 1px solid #555; background: var(--s1); border-radius: 16px; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px; }
#dt .x:hover { background: #fff; color: #111; }
#dt .im { position: relative; width: 100%; aspect-ratio: 1200 / 750; margin-top: 22px; border-radius: 12px; background: #0c0c0c; box-shadow: 0 0 0 1px var(--bd); }
#dt .im img, #dt .im svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#dt .im img { border-radius: 12px; }
#dt .im svg { overflow: visible; }
#dt .im .hb { fill: none; stroke: #fff; stroke-width: 2px; }
#dt .im .hb.area { stroke-dasharray: 4 3; }
#dt .im .lb { fill: none; stroke: #fff; stroke-width: 2px; stroke-dasharray: 6 4; }
#dt .im .bdc { fill: #fff; stroke: #111; stroke-width: 2px; }
#dt .im .bdt { fill: #111; font: 700 17px var(--mono); text-anchor: middle; dominant-baseline: central; }
#dt .im .bk .bdc { fill: #3a3a3a; stroke: #fff; stroke-dasharray: 2 2.4; }
#dt .im .bk .bdt { fill: #fff; }
#dt .im .lt { fill: #fff; font: 600 15px var(--mono); paint-order: stroke; stroke: #111; stroke-width: 4px; }
#dt .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 18px; }
#dt h3 { font-size: 14px; margin: 0 0 8px; color: var(--tx2); font-weight: 500; }
#dt ul { list-style: none; margin: 0; padding: 0; font-size: 13px; line-height: 1.5; }
#dt li { padding: 6px 8px; border-radius: 8px; border-top: 1px solid var(--s3); }
#dt li:hover, #dt li.on { background: var(--s2); }
#dt li .p { color: var(--tx2); font-size: 12px; display: block; }
#dt li .lk { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 1px solid #666; cursor: pointer; text-align: left; }
#dt li .lk:hover, #dt li .lk:focus-visible { border-color: #fff; outline: none; color: #fff; }
#dt li .ax { color: var(--tx2); font-size: 12px; display: block; }
#dt .im .lb.ax { stroke-dasharray: 14 5 3 5; }
#dt .x:focus-visible, #scn button:focus-visible, #ctl button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#dt li.bk { color: var(--tx2); }
@media (max-width: 760px) {
  .lbl.col { font-size: max(44px, calc(7.5px * var(--inv))); }
  .lbl.row { width: max(640px, calc(70px * var(--inv))); font-size: max(38px, calc(8px * var(--inv))); transform: translateX(calc(-100% - max(40px, calc(6px * var(--inv))))); }
  #scn { left: 8px; right: 8px; bottom: 58px; width: auto; max-height: 52vh; padding: 6px; border-radius: 14px; }
  #scn .bt { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; min-height: 0; flex: none; scrollbar-width: none; }
  #scn .bt::-webkit-scrollbar { display: none; }
  #scn .gt { display: none; }
  #scn button { flex: none; width: auto; white-space: nowrap; padding: 6px 10px; }
  /* 手机上步骤做成可收起的一页：点标题收起 / 展开 */

    if (x && world.contains(x)) hl(x.getAttribute('data-e'), ev);
    else if (hlId && hlId !== pinId) { clearTimeout(hlT); hlT = setTimeout(function () { clearHl(); showPin(); }, 60); }
    else if (hlId && hlId === pinId && !pinDock) hideTip();
  }
  // 点住一条：一直亮着，直到点空白 / Esc；触屏没有悬停，说明钉在屏幕下方
  var pinDock = false;
  function showPin() { if (!pinId) return; hl(pinId, null, pinDock); if (!pinDock) hideTip(); }
  function pin(id, ev) { pinId = id; pinDock = lastPT !== 'mouse'; if (hlId !== id || pinDock) { clearHl(true); hl(id, pinDock ? null : ev, pinDock); } }
  function unpin() { pinId = null; clearHl(true); }
  // 点：热点 / 线 / 列表 = 点住这一条并飞到它的两端；截图 = 详情；面板（场景）= 选中场景；空白 = 放开
  vp.addEventListener('click', function (ev) {
    if (moved > 4) { moved = 0; return; }
    var t = ev.target, x = t.closest ? t.closest('[data-e]') : null;
    if (x) { var id = x.getAttribute('data-e'); pin(id, ev); flyEdge(id); return; }
    var jp = t.closest ? t.closest('.panel.jp') : null;
    if (jp) { setScn(jp.getAttribute('data-p').slice(2)); return; }
    var sh = t.closest ? t.closest('.card .shot') : null;
    if (sh) { openDetail(sh.parentNode.getAttribute('data-n')); return; }
    if (pinId) unpin();
  });
  function rectOfNodes(ids) { return union(ids.map(function (id) { var n = NODE[id]; return { x: n.x, y: n.y, w: IW, h: n.h }; })); }
  // 飞到这一条：两端都框进来；框进来读不出字（手机上常见）就只框源截图和它的标签
  function flyEdge(id) {
    var e = EDGE[id], both = rectOfNodes(e.f ? [e.f, e.t] : [e.t]), ph = vpRect().w < 760;
    if (fitRect(both, true, 120, false, ph ? .1 : 0)) return;
    fitRect(union([rectOfNodes([e.f || e.t]), e.chip]), true, 60);
  }

  // 场景
  var scnKey = null, scnBox = document.getElementById('scn');
  (function () {
    var h = ['<div class="bt"><div class="gt">场景路径</div><button type="button" data-s="">全部</button>'];
    [['train', '训练'], ['infer', '推理'], ['topic', '专题']].forEach(function (m) {
      h.push('<div class="gt">' + m[1] + '</div>');
      D.journeys.filter(function (j) { return j.mode === m[0]; }).forEach(function (j) { h.push('<button type="button" data-s="' + j.k + '">' + esc(j.n) + '</button>'); });
    });
    h.push('</div><div class="q" id="scnQ"></div>');
    scnBox.innerHTML = h.join('');
    scnBox.querySelector('[data-s=""]').classList.add('on');
  })();
  scnBox.addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) setScn(b.dataset.s || null, true); });
  function reapplyScn() {
    var j = D.journeys.filter(function (x) { return x.k === scnKey; })[0]; if (!j) return;
    j.steps.forEach(function (id) { setOn(id, true); });
  }
  function setScn(k, anim) {
    if (pinId) pinId = null;
    if (hlId) clearHl(true);
    if (scnKey) {
      var old = D.journeys.filter(function (x) { return x.k === scnKey; })[0];
      old.steps.forEach(function (id) { setOn(id, false); }); (STEPS[scnKey] || []).forEach(function (g) { g.classList.remove('on'); });
      world.querySelectorAll('.card.on, .panel.on').forEach(function (c) { c.classList.remove('on'); });
    }
    scnKey = k || null;
    scnBox.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', (b.dataset.s || null) === scnKey); });
    var q = document.getElementById('scnQ');
    if (!scnKey) { ov.classList.remove('sc'); world.classList.remove('dim'); q.innerHTML = ''; if (anim !== false) fitAll(true); return; }
    var j = D.journeys.filter(function (x) { return x.k === scnKey; })[0];
    ov.classList.add('sc'); world.classList.add('dim');
    var ids = {}, rs = [];
    j.steps.forEach(function (id) { setOn(id, true); var e = EDGE[id]; if (e.f) ids[e.f] = 1; ids[e.t] = 1; if (e.chip) rs.push(e.chip); });
    Object.keys(ids).forEach(function (id) { cardOn(id, true); });
    var pn = world.querySelector('.panel[data-p="j-' + scnKey + '"]'); if (pn) pn.classList.add('on');
    (STEPS[scnKey] || []).forEach(function (g) { g.classList.add('on'); });
    q.innerHTML = '<details open><summary><b>' + esc(j.n) + '</b> · ' + esc(j.q) + '</summary><ol>' + j.steps.map(function (id) { var e = EDGE[id]; return '<li>' + esc(e.f ? NODE[e.f].name : '地址栏 ' + e.tr) + ' <span>— ' + esc(e.f ? e.tr : '打开') + ' →</span> ' + esc(e.self ? '原地' : NODE[e.t].name) + (e.ax ? ' <span>（示意落点）</span>' : '') + '</li>'; }).join('') + '</ol></details>';
    // 框住这条路上的截图、标签和步号（步号圆半径 30，远看按 --bs 放大，最多 5 倍）
    requestAnimationFrame(function () {
      var base = union([rectOfNodes(Object.keys(ids))].concat(rs)), k0 = fitK(base, 160), bsz = 34 * Math.min(5, Math.max(1, .3 / k0)), all = rs.slice();
      (STEPPOS[scnKey] || []).forEach(function (p) { all.push({ x: p[0] - bsz, y: p[1] - bsz, w: 2 * bsz, h: 2 * bsz }); });
      fitRect(union([rectOfNodes(Object.keys(ids))].concat(all)), true, 160);
    });
  }

  /* ── 详情 */
  var dt = document.getElementById('dt'), dtFrom = null, dtBack = null, BEHIND = ['vp', 'top', 'scn', 'ctl', 'mini'];
  function openDetail(id) {
    var n = NODE[id]; if (!n) return; hideTip();
    var svg = ['<svg viewBox="0 0 1200 750" aria-hidden="true">'];
    n.inc.forEach(function (e) {
      if (!e.L || e.self) return;
      var w = Math.max(e.L.w, 24), h = Math.max(e.L.h, 24), x = e.L.x - (w - e.L.w) / 2, y = e.L.y - (h - e.L.h) / 2;
      svg.push('<g data-d="' + e.id + '"><rect class="lb' + (e.ax ? ' ax' : '') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8"/></g>');
    });
    var keys = [];
    n.out.forEach(function (e) {
      if (!e.T) { keys.push('<span data-d="' + e.id + '">Esc ' + e.n + '</span>'); return; }
      var bx, by, s = '<g class="' + (e.back ? 'bk' : '') + '" data-d="' + e.id + '">';
      var T = e.T, w = Math.max(T.w, 20), h = Math.max(T.h, 20), x = T.x - (w - T.w) / 2, y = T.y - (h - T.h) / 2;
      if (e.area) { var ax = T.cx != null ? T.cx : T.x + T.w / 2, ay = T.cy != null ? T.cy : T.y + T.h / 2; s += '<circle class="hb area" cx="' + ax + '" cy="' + ay + '" r="13"/>'; bx = ax - 9; by = ay - 9; }
      else { s += '<rect class="hb" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"/>'; bx = x - 1; by = y - 1; }
      // 编号放在框左上角外面（截图外也照画，.im 不裁 SVG）
      var cx = Math.max(-14, bx - 15), cy = Math.max(-14, by - 15);
      s += '<circle class="bdc" cx="' + cx + '" cy="' + cy + '" r="15"/><text class="bdt" x="' + cx + '" y="' + (cy + 1) + '">' + e.n + '</text></g>';
      svg.push(s);
    });
    svg.push('</svg>');
    var go = function (to, label) { return '<button type="button" class="lk" data-go="' + to + '">' + esc(label) + '</button>'; };
    var outs = n.out.map(function (e) { return '<li data-d="' + e.id + '"' + (e.back ? ' class="bk"' : '') + '><b>' + circ(e.n) + '</b> ' + esc(e.tr) + ' → ' + (e.self ? '原地' : go(e.t, NODE[e.t].name) + (where(e.L) ? '（' + where(e.L) + '）' : '')) + '<span class="p">' + esc(e.p) + '</span>' + (e.ax ? '<span class="ax">示意落点（同类截图）：' + esc(e.ax) + '</span>' : '') + '</li>'; }).join('');
    var ins = n.inc.filter(function (e) { return !e.self; }).map(function (e) { return '<li data-d="' + e.id + '"' + (e.back ? ' class="bk"' : '') + '>' + (e.f ? go(e.f, NODE[e.f].name) + ' ' + circ(e.n) : '地址栏') + ' · ' + esc(e.tr) + (where(e.L) ? ' → 落在' + where(e.L) : '') + '<span class="p">' + esc(e.p) + '</span>' + (e.ax ? '<span class="ax">示意落点：' + esc(e.ax) + '</span>' : '') + '</li>'; }).join('');
    dt.innerHTML = '<div class="in"><div class="bar"><button type="button" class="x" data-loc="' + n.id + '">在地图上定位</button><button type="button" class="x" data-close="1">关闭 Esc</button></div>'
      + '<div class="hd"><h2>' + esc(n.name) + '</h2><div class="ds">' + esc(n.desc) + '</div></div>'
      + (keys.length ? '<div class="keys" aria-label="键盘">' + keys.join('') + '</div>' : '')
      + '<div class="im"><img src="' + n.img + '" alt="' + esc(n.name) + '">' + svg.join('') + '</div>'
      + '<div class="lists"><div><h3>从这里出去（' + n.out.length + '）· 白框 = 点的位置</h3><ul>' + (outs || '<li>—</li>') + '</ul></div><div><h3>从哪里进来（' + n.inc.filter(function (e) { return !e.self; }).length + '）· 虚线框 = 落在这一页的位置，点划框 = 示意</h3><ul>' + (ins || '<li>—</li>') + '</ul></div></div></div>';
    if (!dt.classList.contains('open')) {
      dtBack = document.activeElement;
      BEHIND.forEach(function (k) { var el = document.getElementById(k); if (el) el.inert = true; });
    }
    dt.classList.add('open'); dt.scrollTop = 0; dtFrom = id;
    var cb = dt.querySelector('[data-close]'); if (cb) cb.focus({ preventScroll: true });
  }
  function closeDetail() {
    dt.classList.remove('open'); dt.innerHTML = '';
    BEHIND.forEach(function (k) { var el = document.getElementById(k); if (el) el.inert = false; });
    if (dtBack && dtBack.focus && document.contains(dtBack)) dtBack.focus({ preventScroll: true }); dtBack = null;
  }
  dt.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.closest('[data-close]') || t === dt) { closeDetail(); return; }
    var g = t.closest('[data-go]'); if (g) { openDetail(g.getAttribute('data-go')); return; }
    var loc = t.closest('[data-loc]'); if (loc) { var id = loc.getAttribute('data-loc'); closeDetail(); fitRect(rectOfNodes([id]), true, 60); }
  });
  dt.addEventListener('pointerover', function (ev) {
    var li = ev.target.closest('[data-d]'); dt.querySelectorAll('.on').forEach(function (x) { x.classList.remove('on'); });
    if (!li) return; dt.querySelectorAll('[data-d="' + li.getAttribute('data-d') + '"]').forEach(function (x) { x.classList.add('on'); });
  });

  /* ── 小地图 */
  var mini = document.getElementById('mini'), mc = mini.querySelector('canvas'), mx = mc.getContext('2d');
  var MAR = (WMAX.y - WMIN.y) / (WMAX.x - WMIN.x), MH = Math.min(150, Math.round(160 * MAR)), MW = Math.round(MH / MAR); mc.width = MW * 2; mc.height = MH * 2; mc.style.width = MW + 'px'; mc.style.height = MH + 'px';
  var ms = MW / (WMAX.x - WMIN.x), miniQ = false;
  function drawMini() {
    if (miniQ) return; miniQ = true;
    requestAnimationFrame(function () {
      miniQ = false; if (getComputedStyle(mini).display === 'none') return;
      mx.setTransform(2, 0, 0, 2, 0, 0); mx.clearRect(0, 0, MW, MH);
      mx.fillStyle = '#2a2a2a'; BLOCK.forEach(function (b) { mx.fillRect((b.x - WMIN.x) * ms, (b.y - WMIN.y) * ms, b.w * ms, b.h * ms); });
      mx.fillStyle = '#6a6a6a'; D.nodes.forEach(function (n) { mx.fillRect((n.sx - WMIN.x) * ms, (n.sy - WMIN.y) * ms, IW * ms, IH * ms); });
      var V = vpRect(), x0 = (-cam.x / cam.k - WMIN.x) * ms, y0 = (-cam.y / cam.k - WMIN.y) * ms;
      mx.strokeStyle = '#fff'; mx.lineWidth = 1.2; mx.strokeRect(x0, y0, V.w / cam.k * ms, V.h / cam.k * ms);
    });
  }
  function miniGo(ev) { var r = mc.getBoundingClientRect(), wx = (ev.clientX - r.left) / ms + WMIN.x, wy = (ev.clientY - r.top) / ms + WMIN.y, V = vpRect(); flyId++; cam.x = V.w / 2 - wx * cam.k; cam.y = V.h / 2 - wy * cam.k; apply(); }
  var miniDown = false;
  mini.addEventListener('pointerdown', function (ev) { miniDown = true; mini.setPointerCapture(ev.pointerId); miniGo(ev); });
  mini.addEventListener('pointermove', function (ev) { if (miniDown) miniGo(ev); });
  mini.addEventListener('pointerup', function () { miniDown = false; });

  var nAx = D.edges.filter(function (e) { return e.ax; }).length;
  document.getElementById('sub').textContent = '版本 ' + D.v + ' · ' + D.nodes.length + ' 张截图 · ' + D.edges.filter(function (e) { return e.k !== 'url'; }).length + ' 条交互：线从源截图上点的位置连到目标截图上落到的位置；点划框 = 示意落点（' + nAx + ' 条落在同类截图上）';
  syncTopH(); fitAll(false); zoomVars();
  window.__journey = { cam: cam, fitAll: fitAll, setScn: setScn, openDetail: openDetail, fitRect: fitRect, rectOfNodes: rectOfNodes, hl: hl, pin: pin, D: D, margins: margins };
  }
  // 标签宽度按 JetBrains Mono 量：等字体到了再排（最多等 2.5s，拿不到就按退回字体排）
  var started = false;
  function start() { if (started) return; started = true; main(); }
  var fl = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('500 22px "JetBrains Mono"'), document.fonts.load('400 17px "JetBrains Mono"')]) : Promise.resolve();
  fl.then(start, start); setTimeout(start, 2500);
})();
</script>
