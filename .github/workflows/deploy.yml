name: Deploy to GitHub Pages

# 部署策略：站点框架（工作台/驾驶舱）永远从 main 构建，两个 pattern 分支都不进框架，
# 各自只贡献一个自包含的静态子目录，叠加在 main 构建产物之上一起发布：
#   · claude/rubik-view-pattern-extraction-7pk0qt
#       → /rubik/ 与 /patterns/rubik-cube-logical/（逻辑魔方 pattern 本体）
#   · claude/logic-cube-pattern-spec-3oycmv
#       → /rubik-spec/（逻辑魔方的设计 Pattern 规范页，自包含、不进框架）
#   · claude/rank-view-network-analysis-htowfc
#       → /patterns/rubik-cube-netobj/ 与 /rubik-netobj/（逻辑魔方 + 整网对象透镜）
#       → /patterns/rank-card-expansion/ 与 /rank-card/（rank 卡 = 整网的并行化展开）
#   · claude/parallel-topology-html-demo-ff10w3
#       → /parallel-topology/（参照系 + PRD + Demo 三页目录，README 一直写的路径）
#       → /patterns/parallel-topology-demo/（Demo 的规范入口，自带依赖副本）
#       → /pto-ds/（跨仓库：Cinnnnnnndy/pto-design-system 的
#         claude/rank-deck-intersection-payload 分支——纠正版 rank-deck 及其最小依赖闭包）
#       注：main 的 public/ 里已有 /parallel-reference/ 与 /parallel-prd/（同一对文档
#       在 main 的另一条路径），本分支不动它们；/parallel-topology/ 是含 Demo 的成套目录。
# push 任一分支即刷新它自己的目录。
#
# 为什么整网对象那版单独占一条路径、而不是覆盖 /patterns/rubik-cube-logical/：
# 那条链接已经发出去了，且由 rubik-view-pattern-extraction 分支持有——两个分支
# 各自的 workflow 都写同一个目录的话，谁最后跑谁赢，已发出的链接内容会随机变。
# 所以新能力走新 id（rubik-cube-netobj，契约里用 variantOf 标明它是谁的变体），
# 老链接保持指向老分支那一版，互不相干。
# 注意：Pages 每次部署整体替换——main 上的工作流没有这段叠加逻辑，且两个 pattern
# 分支各自的 workflow 只叠加自己那份，所以 main 或另一分支一发布，本分支的目录会
# 暂时消失，重跑本分支的 workflow（push 或 workflow_dispatch 选本分支）即可找回。
# 另注意：deploy 这一步走 github-pages environment，**只有被该 environment 允许的
# 分支才能部署**。新分支第一次跑会在 build 成功之后、deploy 秒失败且没有日志——
# 那不是构建有问题，是分支没在允许列表里。到
# Settings → Environments → github-pages → Deployment branches and tags
# 把分支名加进去，再重跑本次 run 即可。
on:
  push:
    branches:
      - main
      - claude/rubik-view-pattern-extraction-7pk0qt
      - claude/logic-cube-pattern-spec-3oycmv
      - claude/rank-view-network-analysis-htowfc
      - claude/parallel-topology-html-demo-ff10w3
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (site framework)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout rubik pattern branch
        uses: actions/checkout@v4
        with:
          ref: claude/rubik-view-pattern-extraction-7pk0qt
          path: rubik-src

      - name: Overlay rubik pattern at /rubik/ and /patterns/rubik-cube-logical/
        # 两个入口，同一份内容：
        #  · /rubik/                       —— 老链接，保持可用（自包含子目录）
        #  · /patterns/rubik-cube-logical/ —— 设计系统 pattern 库的规范位置：
        #    pattern.html 与 pattern.css / pattern.js / pattern.json 同级，
        #    别人可以直接 <script src=".../pattern.js"> 复用，或读 pattern.json 契约。
        # 资源链接统一打上 ?v=<短 SHA>：分享出去的链接不会吃到旧缓存。
        run: |
          SHA=$(git -C rubik-src rev-parse --short HEAD)
          SRC=rubik-src/public/vendor/rubik-cube

          # ① 老入口 /rubik/（结构不变）
          mkdir -p dist/rubik/vendor/rubik-cube
          sed -e "s#\(\./vendor/[a-z0-9./-]*\.\(js\|css\|svg\)\)#\1?v=$SHA#g" \
              rubik-src/public/rubik-pattern.html > dist/rubik/index.html
          cp dist/vendor/three-r128.min.js dist/rubik/vendor/three-r128.min.js
          cp -r dist/vendor/pto-tokens dist/rubik/vendor/pto-tokens
          cp -r rubik-src/public/vendor/pto-design-system dist/rubik/vendor/pto-design-system
          cp $SRC/pattern.js $SRC/pattern.css $SRC/pattern.json $SRC/favicon.svg dist/rubik/vendor/rubik-cube/

          # ② 规范入口 /patterns/rubik-cube-logical/（pattern.* 同级）
          PAT=dist/patterns/rubik-cube-logical
          mkdir -p $PAT/vendor
          sed -e 's#\./vendor/rubik-cube/#./#g' \
              -e "s#\(\./\(pattern\.\(js\|css\)\|favicon\.svg\|vendor/[a-z0-9./-]*\.\(js\|css\)\)\)#\1?v=$SHA#g" \
              rubik-src/public/rubik-pattern.html > $PAT/pattern.html
          cp $SRC/pattern.js $SRC/pattern.css $SRC/pattern.json $SRC/favicon.svg $PAT/
          cp dist/vendor/three-r128.min.js $PAT/vendor/three-r128.min.js
          cp -r rubik-src/public/vendor/pto-design-system $PAT/vendor/pto-design-system
          # 版本落到契约里，方便对方核对拿到的是哪一版
          node -e "const f='$PAT/pattern.json',j=require('fs');const o=JSON.parse(j.readFileSync(f,'utf8'));o.version='$SHA';j.writeFileSync(f,JSON.stringify(o,null,2)+'\n')"
          echo "published: /patterns/rubik-cube-logical/pattern.html?v=$SHA"

      - name: Checkout spec branch
        uses: actions/checkout@v4
        with:
          ref: claude/logic-cube-pattern-spec-3oycmv
          path: spec-src

      - name: Overlay pattern spec at /rubik-spec/
        # 规范页自己一条链接，不并进 /patterns/ 那套目录：那里放的是「可复用的
        # pattern 本体」（pattern.html/css/js/json 同级），规范页是讲这套 pattern
        # 怎么用的文档，混在一起会让 <script src=".../pattern.js"> 该引哪个变得含糊。
        # 目录自包含（自带 vendor 依赖），页面里指向 pattern 的那几条链接改写到
        # /patterns/rubik-cube-logical/ 的规范位置——文档告诉读者去哪儿取，
        # 取的就是别人能直接引用的那一份。
        # 资源链接统一打上 ?v=<短 SHA>（代码示例那几行含 &lt; 的不动）。
        run: |
          SHA=$(git -C spec-src rev-parse --short HEAD)
          SPEC=dist/rubik-spec
          mkdir -p $SPEC/vendor/rubik-cube
          cp spec-src/public/vendor/three-r128.min.js $SPEC/vendor/three-r128.min.js
          cp -r spec-src/public/vendor/pto-design-system $SPEC/vendor/pto-design-system
          cp spec-src/public/vendor/rubik-cube/pattern.js \
             spec-src/public/vendor/rubik-cube/pattern.css \
             spec-src/public/vendor/rubik-cube/pattern.json \
             spec-src/public/vendor/rubik-cube/favicon.svg \
             $SPEC/vendor/rubik-cube/
          sed -e 's#class="res-card" href="\./vendor/rubik-cube/#class="res-card" href="../patterns/rubik-cube-logical/#g' \
              -e 's#class="res-card" href="\./vendor/pto-design-system/#class="res-card" href="../patterns/rubik-cube-logical/vendor/pto-design-system/#g' \
              -e 's#href="\./rubik-pattern\.html"#href="../patterns/rubik-cube-logical/pattern.html"#g' \
              -e '/&lt;/!s#\(\(src\|href\)="\)\(\.\./patterns/[A-Za-z0-9._/-]*\|\./vendor/[A-Za-z0-9._/-]*\)\(\.\(js\|css\|svg\|json\|html\)\)"#\1\3\4?v='"$SHA"'"#g' \
              spec-src/public/rubik-pattern-spec.html > $SPEC/index.html
          echo "published: /rubik-spec/?v=$SHA"

      - name: Checkout netobj branch
        uses: actions/checkout@v4
        with:
          ref: claude/rank-view-network-analysis-htowfc
          path: netobj-src

      - name: Overlay 整网对象透镜版 at /patterns/rubik-cube-netobj/ 与 /rubik-netobj/
        # 逻辑魔方 + 整网对象透镜（选一个整网对象 → 承载它的卡按「持有第几片」着色，
        # 切到该对象的主屏后分片 snap 成整块/整墙）。自成一条链接的理由见文件头注释。
        # 两个入口同一份内容：
        #  · /patterns/rubik-cube-netobj/ —— 规范位置，pattern.html 与 pattern.css /
        #    pattern.js / pattern.json 同级，别人可直接 <script src> 复用或先读契约；
        #  · /rubik-netobj/               —— 短链接，好念、好发。
        # 目录自包含（自带 three 与设计系统快照），不依赖 main 构建产物里有什么。
        run: |
          set -euo pipefail
          SHA=$(git -C netobj-src rev-parse --short HEAD)
          SRC=netobj-src/public/vendor/rubik-cube

          # ① 规范入口：pattern.* 同级（把 ./vendor/rubik-cube/ 拍平成 ./）
          PAT=dist/patterns/rubik-cube-netobj
          mkdir -p $PAT/vendor
          sed -e 's#\./vendor/rubik-cube/#./#g' \
              -e "s#\(\./\(pattern\.\(js\|css\)\|favicon\.svg\|vendor/[a-z0-9./-]*\.\(js\|css\)\)\)#\1?v=$SHA#g" \
              netobj-src/public/rubik-pattern.html > $PAT/pattern.html
          cp $SRC/pattern.js $SRC/pattern.css $SRC/pattern.json $SRC/favicon.svg $PAT/
          cp netobj-src/public/vendor/three-r128.min.js $PAT/vendor/three-r128.min.js
          cp -r netobj-src/public/vendor/pto-design-system $PAT/vendor/pto-design-system
          # 契约落地：version 供对账；id 与所在路径一致（否则读契约的人拿到的 id
          # 指向另一条链接）；variantOf 保留血缘，说明它是 rubik-cube-logical 的变体。
          node -e "
            const fs=require('fs'), f='$PAT/pattern.json';
            const o=JSON.parse(fs.readFileSync(f,'utf8'));
            o.variantOf=o.id; o.id='rubik-cube-netobj'; o.version='$SHA';
            o.name=(o.name||'')+' + 整网对象透镜';
            fs.writeFileSync(f, JSON.stringify(o,null,2)+'\n');
          "

          # ② 短链接别名：同一份内容，保持 ./vendor/rubik-cube/ 结构
          ALIAS=dist/rubik-netobj
          mkdir -p $ALIAS/vendor/rubik-cube
          sed -e "s#\(\./vendor/[a-z0-9./-]*\.\(js\|css\|svg\)\)#\1?v=$SHA#g" \
              netobj-src/public/rubik-pattern.html > $ALIAS/index.html
          cp $SRC/pattern.js $SRC/pattern.css $SRC/favicon.svg $ALIAS/vendor/rubik-cube/
          cp $PAT/pattern.json $ALIAS/vendor/rubik-cube/pattern.json
          cp netobj-src/public/vendor/three-r128.min.js $ALIAS/vendor/three-r128.min.js
          cp -r netobj-src/public/vendor/pto-design-system $ALIAS/vendor/pto-design-system

          echo "published: /patterns/rubik-cube-netobj/pattern.html?v=$SHA"
          echo "published: /rubik-netobj/?v=$SHA"

      - name: Overlay rank 卡（并行化展开）at /patterns/rank-card-expansion/ 与 /rank-card/
        # rank 卡 = 整网图的**并行化展开**（共享布局 + 差分着色的 small multiples）。
        # 与逻辑魔方是互补的两个 pattern，各自一条链接：魔方讲「谁和谁一组」，
        # 这张讲「一张卡里的算子图相对逻辑整网既减了什么、又增了什么」。
        # 依赖 model-graphviz 的预定位图数据（graph.js 里的 window.OPENPANGU_GRAPH）。
        run: |
          set -euo pipefail
          SHA=$(git -C netobj-src rev-parse --short HEAD)
          SRC=netobj-src/public/vendor/net-sharding

          PAT=dist/patterns/rank-card-expansion
          mkdir -p $PAT/vendor/model-graphviz
          sed -e 's#\./vendor/net-sharding/#./#g' \
              -e "s#\(\./\(pattern\.\(js\|css\)\|favicon\.svg\|vendor/[a-z0-9./-]*\.\(js\|css\)\)\)#\1?v=$SHA#g" \
              netobj-src/public/net-sharding-pattern.html > $PAT/pattern.html
          cp $SRC/pattern.js $SRC/pattern.css $SRC/pattern.json $SRC/favicon.svg $PAT/
          cp netobj-src/public/vendor/model-graphviz/graph.js \
             netobj-src/public/vendor/model-graphviz/pattern.js \
             netobj-src/public/vendor/model-graphviz/pattern.css $PAT/vendor/model-graphviz/
          cp -r netobj-src/public/vendor/pto-design-system $PAT/vendor/pto-design-system
          node -e "
            const fs=require('fs'), f='$PAT/pattern.json';
            const o=JSON.parse(fs.readFileSync(f,'utf8'));
            o.id='rank-card-expansion'; o.version='$SHA';
            fs.writeFileSync(f, JSON.stringify(o,null,2)+'\n');
          "

          ALIAS=dist/rank-card
          mkdir -p $ALIAS/vendor/net-sharding
          sed -e "s#\(\./vendor/[a-z0-9./-]*\.\(js\|css\|svg\)\)#\1?v=$SHA#g" \
              netobj-src/public/net-sharding-pattern.html > $ALIAS/index.html
          cp -r netobj-src/public/vendor/model-graphviz $ALIAS/vendor/model-graphviz
          cp -r netobj-src/public/vendor/pto-design-system $ALIAS/vendor/pto-design-system
          cp $SRC/pattern.js $SRC/pattern.css $SRC/favicon.svg $ALIAS/vendor/net-sharding/
          cp $PAT/pattern.json $ALIAS/vendor/net-sharding/pattern.json

          echo "published: /patterns/rank-card-expansion/pattern.html?v=$SHA"
          echo "published: /rank-card/?v=$SHA"

      - name: Checkout parallel-topology branch
        uses: actions/checkout@v4
        with:
          ref: claude/parallel-topology-html-demo-ff10w3
          path: ptopo-src

      - name: Overlay 并行拓扑（参照系/PRD/Demo）at /parallel-topology/ 与 /patterns/parallel-topology-demo/
        # 三页一套：concept-map（参照系）、prd、demo（应用形态，单文件、CSS/JS 内联）。
        # 两个入口：
        #  · /parallel-topology/            —— README 与站内一直写的目录路径，整套照搬；
        #    demo 的设计系统链接是 ../vendor/pto-design-system/…，恰好落在 main 构建
        #    产物已有的 /vendor/ 上，只补 ?v= 版本戳。
        #  · /patterns/parallel-topology-demo/ —— 规范入口，pattern.html 与 pattern.json
        #    同级、自带依赖副本；文档链接改指 /parallel-topology/ 那份（同一次发布同一版）。
        run: |
          set -euo pipefail
          SHA=$(git -C ptopo-src rev-parse --short HEAD)
          SRC=ptopo-src/public/parallel-topology

          # ① 目录入口 /parallel-topology/
          DIR=dist/parallel-topology
          mkdir -p $DIR
          cp $SRC/index.html $SRC/concept-map.html $SRC/prd.html $SRC/prd.md $DIR/
          sed -e "s#\(\.\./vendor/[A-Za-z0-9./_-]*\.\(css\|js\)\)#\1?v=$SHA#g" \
              $SRC/demo.html > $DIR/demo.html
          node -e "
            const fs=require('fs');
            const o=JSON.parse(fs.readFileSync('$SRC/pattern.json','utf8'));
            o.version='$SHA';
            fs.writeFileSync('$DIR/pattern.json', JSON.stringify(o,null,2)+'\n');
          "

          # ② 规范入口 /patterns/parallel-topology-demo/（自包含）
          PAT=dist/patterns/parallel-topology-demo
          mkdir -p $PAT/vendor
          sed -e 's#\.\./vendor/pto-design-system/#./vendor/pto-design-system/#g' \
              -e 's#href="\.\./favicon\.svg"#href="./favicon.svg"#g' \
              -e 's#href="\./\(prd\|concept-map\|index\)\.html"#href="../../parallel-topology/\1.html"#g' \
              -e "s#\(\./vendor/[A-Za-z0-9./_-]*\.\(css\|js\)\)#\1?v=$SHA#g" \
              $SRC/demo.html > $PAT/pattern.html
          cp -r ptopo-src/public/vendor/pto-design-system $PAT/vendor/pto-design-system
          cp ptopo-src/public/favicon.svg $PAT/favicon.svg
          cp $DIR/pattern.json $PAT/pattern.json

          echo "published: /parallel-topology/demo.html?v=$SHA"
          echo "published: /patterns/parallel-topology-demo/pattern.html?v=$SHA"

      - name: Checkout pto-design-system（rank-deck 交集载荷分支，公开仓库）
        uses: actions/checkout@v4
        with:
          repository: Cinnnnnnndy/pto-design-system
          ref: claude/rank-deck-intersection-payload
          path: ptods-src

      - name: Overlay 纠正版 rank-deck at /pto-ds/
        # 载荷原子修正版（Rank 装的是交集片，不是缩小的整网）。pattern.html 的相对引用
        # （../../tokens、../model-graphviz、./vendor/three）要求保持原目录结构，
        # 所以按原树叠加最小依赖闭包：tokens/ + css/ + 三个 pattern 目录（含 pinned three）。
        # 不做任何 sed 改写——发布件与 fork 分支逐字节一致，方便对账。
        run: |
          set -euo pipefail
          SHA=$(git -C ptods-src rev-parse --short HEAD)
          DST=dist/pto-ds
          mkdir -p $DST/patterns
          cp -r ptods-src/tokens $DST/tokens
          cp -r ptods-src/css $DST/css
          cp -r ptods-src/patterns/model-graphviz $DST/patterns/model-graphviz
          cp -r ptods-src/patterns/model-architecture-3d-deck $DST/patterns/model-architecture-3d-deck
          cp -r ptods-src/patterns/model-parallel-rank-deck $DST/patterns/model-parallel-rank-deck
          echo "published: /pto-ds/patterns/model-parallel-rank-deck/pattern.html (rank-deck@$SHA)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Source = GitHub Actions) on first run if possible.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
