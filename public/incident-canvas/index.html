<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 入口 HTML 不进浏览器缓存：资源已带 ?v=，但页面本身没有这层保护，
     收藏过的旧链接会一直拿旧副本（与 combo-workbench/index.html 同一处理）。 -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>故障故事线 · 无限画布</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<!--
  ══════════════════════════════════════════════════════════════════════
  故障故事线 · 无限画布 —— 两个台面的整合形态

  合的是哪两份：
    · config-relation-observer（compute-graph-viewer / training-run-twin-standalone）
      —— 出**故事线与数据**：两条问题线、11 个运行事件、每个事件的传播源→受影响、
      机制相位（mechanism.phases）、证据图表（evidence.chart）与读数（evidence.metrics）。
      数值逐条照搬，没有再编第二套。
    · combo-workbench（本仓 /combo-workbench/）
      —— 出**形制与视觉语言**：PTO token（浅色优先 + [data-theme=dark] 单块覆盖）、
      ide-frame 的渐变光晕底与磨砂面板、顶栏 + 舞台的骨架、URL 即这一屏、
      `pto:state` 主题桥。

  它自己新出的那一件事，是**编排**：
    组合工作台是「摞格子」——格子的位置是台面定的，格与格之间靠消息对齐；
    这一页是「一个主视图 + 四周卫星」——主视图坐在无限画布的正中，五块卫星
    （故事线 / 作用面 / 读数 / 证据 / 泳道）围着它，用贝塞尔连线接回中心。
    **点主视图里的东西就下钻**：集群 → 事件 → 机制相位 → 单卡 → 泳道，
    每下钻一级，主视图换一张图，四周五块同时改写自己的内容。
    退回走面包屑。看到哪一屏，URL 就是哪一屏。

  自包含单文件：token、样式、数据、全部图元都在这一份里，零外部依赖，
  也不引 CDN。整页可直接拷走、可内嵌（认 ?embed=1 收顶栏、认 pto:state 换主题）。
  ══════════════════════════════════════════════════════════════════════
-->
<style>
/* ═══ ① Foundation —— 与 combo-workbench 同一套底 ═══════════════════ */
:root{
  --ark-blue-500:#4369EF; --ark-blue-600:#5A92E6;
  --ark-green-500:#04D793; --ark-orange-500:#FFAA3B; --ark-red-500:#FF4B7B;
  --font-sans:'Inter','Source Han Sans SC','PingFang SC','Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --duration-fast:120ms;
}
/* ② Semantic —— 浅色（默认） */
:root, :root[data-theme="light"]{
  --background:#F5F5F5; --surface-1:#FFFFFF; --surface-2:#F2F2F2; --surface-3:#E6E6E6;
  --foreground:rgba(0,0,0,.90); --foreground-secondary:rgba(0,0,0,.55); --foreground-muted:rgba(0,0,0,.38);
  --border-subtle:rgba(0,0,0,.07); --border-default:rgba(0,0,0,.12); --border-strong:rgba(0,0,0,.18);
  --primary:var(--ark-blue-500); --primary-hover:var(--ark-blue-600);
  --success:var(--ark-green-500); --warning:var(--ark-orange-500); --danger:var(--ark-red-500);
  --focus-ring:rgba(67,105,239,.36);
  --state-hover:rgba(0,0,0,.05); --state-press:rgba(0,0,0,.09);
  --state-selected:rgba(67,105,239,.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,.10); --shadow-md:0 6px 18px rgba(0,0,0,.12);
  --shadow-lg:0 18px 44px rgba(0,0,0,.16);
  --grid-dot:rgba(19,26,42,.13);
  --cell-base:#dfe3ea; --cell-mid:#9aa6bf;
}
/* ② Semantic —— 深色（单块覆盖） */
:root[data-theme="dark"]{
  --background:#101010; --surface-1:#161616; --surface-2:#1c1c1c; --surface-3:#262626;
  --foreground:rgba(255,255,255,.90); --foreground-secondary:rgba(255,255,255,.60); --foreground-muted:rgba(255,255,255,.40);
  --border-subtle:rgba(255,255,255,.07); --border-default:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.18);
  --focus-ring:rgba(67,105,239,.42);
  --state-hover:rgba(255,255,255,.06); --state-press:rgba(255,255,255,.10);
  --state-selected:rgba(67,105,239,.16);
  --shadow-sm:0 1px 3px rgba(0,0,0,.30); --shadow-md:0 6px 18px rgba(0,0,0,.36);
  --shadow-lg:0 18px 44px rgba(0,0,0,.46);
  --grid-dot:rgba(255,255,255,.10);
  --cell-base:#262a33; --cell-mid:#525d74;
}
/* ③ ide-frame —— 四团光晕压在一条竖向渐变上（照 combo-workbench） */
:root{
  --ide-bg-start:#fdfdff; --ide-bg-mid:#f6f7fb; --ide-bg-end:#eceff6;
  --ide-glow-left:155 96 170; --ide-glow-right:24 99 220;
  --ide-glow-center:20 184 166; --ide-glow-lower:245 158 11;
  --ide-a-left:.16; --ide-a-right:.14; --ide-a-center:.08; --ide-a-lower:.06;
  --page-bg:
    radial-gradient(circle at top left,  rgb(var(--ide-glow-left)   / var(--ide-a-left)),   transparent 28%),
    radial-gradient(circle at top right, rgb(var(--ide-glow-right)  / var(--ide-a-right)),  transparent 30%),
    radial-gradient(circle at 48% 6%,    rgb(var(--ide-glow-center) / var(--ide-a-center)), transparent 34%),
    radial-gradient(circle at 18% 86%,   rgb(var(--ide-glow-lower)  / var(--ide-a-lower)),  transparent 34%),
    linear-gradient(180deg, var(--ide-bg-start) 0%, var(--ide-bg-mid) 42%, var(--ide-bg-end) 100%);
}
:root[data-theme="dark"]{
  --ide-bg-start:#17181d; --ide-bg-mid:#101114; --ide-bg-end:#0c0d10;
  --ide-glow-right:67 105 239;
  --ide-a-left:.12; --ide-a-right:.12; --ide-a-center:.06; --ide-a-lower:.05;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  font:400 14px/1.55 var(--font-sans);
  color:var(--foreground);
  background:var(--page-bg) fixed;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ═══ 应用外壳 ═══════════════════════════════════════════════════════ */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
body[data-embed="1"] #topbar{display:none}
body[data-embed="1"] #app{grid-template-rows:minmax(0,1fr)}

#topbar{
  display:flex;align-items:center;gap:10px;
  height:46px;padding:0 14px;
  border-bottom:1px solid var(--border-subtle);
  background:color-mix(in srgb, var(--surface-1) 72%, transparent);
  backdrop-filter:blur(18px) saturate(1.18);
  -webkit-backdrop-filter:blur(18px) saturate(1.18);
  position:relative;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:20px;height:20px;flex:none;color:var(--primary)}
.brand b{font:600 13px/1.2 var(--font-sans);white-space:nowrap}
.brand span{font:400 11.5px/1.2 var(--font-sans);color:var(--foreground-secondary);white-space:nowrap}
a.btn{text-decoration:none}
a.btn sup{font-size:9px;line-height:1;color:var(--foreground-muted);margin-left:1px}
.spacer{flex:1 1 auto}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 10px;border-radius:var(--radius-md);
  border:1px solid var(--border-default);background:var(--surface-1);
  font:500 12px/1 var(--font-sans);color:var(--foreground);
  transition:background var(--duration-fast),border-color var(--duration-fast),color var(--duration-fast);
  white-space:nowrap;
}
.btn:hover{background:var(--state-hover);border-color:var(--border-strong)}
.btn:active{background:var(--state-press)}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.btn--ghost{background:transparent;border-color:transparent}
.btn--ghost:hover{background:var(--state-hover)}
.btn--icon{width:28px;padding:0;justify-content:center}
.btn--icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{background:var(--state-selected);border-color:color-mix(in srgb,var(--primary) 38%,transparent);color:var(--primary)}
.btn--sm{height:24px;padding:0 8px;font-size:11.5px}

/* 故事线选择：顶栏正中的段控 */
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:var(--radius-md);
  background:var(--surface-2);border:1px solid var(--border-subtle)}
.seg button{
  height:24px;padding:0 11px;border:0;border-radius:6px;background:transparent;
  font:500 12px/1 var(--font-sans);color:var(--foreground-secondary);
  transition:background var(--duration-fast),color var(--duration-fast);
}
.seg button:hover{background:var(--state-hover);color:var(--foreground)}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--foreground);box-shadow:var(--shadow-sm)}

/* ═══ 画布视口 ═══════════════════════════════════════════════════════ */
#viewport{
  position:relative;overflow:hidden;
  cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1px);
  background-size:var(--dot,26px) var(--dot,26px);
  background-position:var(--dotx,0) var(--doty,0);
}
#viewport.is-panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;pointer-events:none;overflow:visible}

/* ═══ 面板（中心舞台与卫星同一套壳）══════════════════════════════════ */
.panel{
  position:absolute;display:flex;flex-direction:column;
  border-radius:var(--radius-lg);
  border:1px solid var(--ide-frame-pane-border,var(--border-subtle));
  background:color-mix(in srgb, var(--surface-1) 88%, transparent);
  backdrop-filter:blur(18px) saturate(1.18);
  -webkit-backdrop-filter:blur(18px) saturate(1.18);
  box-shadow:var(--shadow-md);
  overflow:hidden;
}
.panel--stage{box-shadow:var(--shadow-lg);border-color:var(--border-default)}
.panel--sat{background:color-mix(in srgb, var(--surface-1) 82%, transparent)}
.panel.is-linked{border-color:color-mix(in srgb,var(--primary) 42%,transparent)}
.panel__head{
  display:flex;align-items:center;gap:8px;flex:none;
  height:34px;padding:0 12px;
  border-bottom:1px solid var(--border-subtle);
  background:color-mix(in srgb, var(--surface-2) 55%, transparent);
}
.panel__dot{width:6px;height:6px;border-radius:99px;background:var(--primary);flex:none}
.panel__title{font:600 13px/1.2 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel__sub{font:400 11.5px/1.2 var(--font-sans);color:var(--foreground-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel__acts{margin-left:auto;display:flex;gap:4px;flex:none}
.panel__body{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 14px}
.panel__body--flush{padding:0}

/* 卫星面板的方位徽标 */
.sat-badge{
  flex:none;padding:1px 7px;border-radius:var(--radius-pill);
  border:1px solid var(--border-default);background:var(--surface-2);
  font:600 10px/1.6 var(--font-mono);letter-spacing:.05em;
  color:var(--foreground-muted);white-space:nowrap;
}
.panel.is-linked .sat-badge{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}

/* ═══ 通用零件 ═══════════════════════════════════════════════════════ */
.k{font:600 11px/1.4 var(--font-mono);letter-spacing:.04em;color:var(--foreground-muted);
   text-transform:uppercase}
.muted{color:var(--foreground-secondary)}
.mono{font-family:var(--font-mono)}
.hr{height:1px;background:var(--border-subtle);margin:11px 0}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:var(--radius-pill);
  border:1px solid var(--border-default);background:var(--surface-2);
  font:500 11.5px/1.5 var(--font-sans);color:var(--foreground-secondary);
  white-space:nowrap;
}
.chip--act{cursor:pointer;transition:background var(--duration-fast),border-color var(--duration-fast),color var(--duration-fast)}
.chip--act:hover{background:var(--state-hover);border-color:var(--border-strong);color:var(--foreground)}
.chip--on{background:var(--state-selected);border-color:color-mix(in srgb,var(--primary) 42%,transparent);color:var(--primary)}
.chip--danger{background:color-mix(in srgb,var(--danger) 12%,transparent);
  border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger)}
.chip--warn{background:color-mix(in srgb,var(--warning) 16%,transparent);
  border-color:color-mix(in srgb,var(--warning) 46%,transparent);
  color:color-mix(in srgb,var(--warning) 76%,var(--foreground))}
.chip i{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none;font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:5px}

.tone-danger{color:var(--danger)}
.tone-warning{color:color-mix(in srgb,var(--warning) 78%,var(--foreground))}
.tone-good{color:color-mix(in srgb,var(--success) 74%,var(--foreground))}

/* 读数格 */
.mgrid{display:grid;grid-template-columns:1fr;gap:7px}
.mrow{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:7px 10px;border-radius:var(--radius-md);
  background:var(--surface-2);border:1px solid var(--border-subtle);
}
.mrow__l{font:400 11.5px/1.35 var(--font-sans);color:var(--foreground-secondary)}
.mrow__v{font:600 13px/1.3 var(--font-mono);text-align:right}

/* 结论 / 根因 / 影响 三段 */
.facts{display:grid;gap:9px}
.fact{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:start}
.fact__k{font:600 11px/1.6 var(--font-mono);color:var(--foreground-muted);letter-spacing:.04em}
.fact__v{font:400 12.5px/1.55 var(--font-sans)}
.fact--hi .fact__v{color:var(--danger);font-weight:500}

/* ═══ 卫星 · 故事线时间轴 ═══════════════════════════════════════════ */
.tl{position:relative;padding:8px 6px 6px;height:100%;display:flex;flex-direction:column}
.tl__spine{position:absolute;left:14px;right:14px;top:44px;height:2px;
  background:linear-gradient(90deg,var(--border-subtle),var(--border-strong),var(--border-subtle));border-radius:2px}
.tl__row{display:flex;gap:8px;align-items:stretch;flex:1 1 auto;min-height:0}
.tlc{
  position:relative;flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;gap:6px;
  padding:8px 9px 9px;border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);background:var(--surface-2);
  text-align:left;cursor:pointer;
  transition:background var(--duration-fast),border-color var(--duration-fast),transform var(--duration-fast);
}
.tlc:hover{background:var(--state-hover);border-color:var(--border-strong);transform:translateY(-1px)}
.tlc[aria-pressed="true"]{background:var(--state-selected);
  border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:var(--shadow-sm)}
.tlc__top{display:flex;align-items:center;gap:6px}
.tlc__pin{width:9px;height:9px;border-radius:99px;flex:none;
  background:var(--cell-mid);box-shadow:0 0 0 2px var(--surface-1)}
.tlc[data-sev="danger"] .tlc__pin{background:var(--danger)}
.tlc[data-sev="warning"] .tlc__pin{background:var(--warning)}
.tlc__t{font:600 11px/1.2 var(--font-mono);color:var(--foreground-muted)}
.tlc__title{font:600 12.5px/1.35 var(--font-sans);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlc__dim{font:400 10.5px/1.3 var(--font-sans);color:var(--foreground-muted)}
.tlc__mech{position:absolute;top:7px;right:8px;font:600 9.5px/1.4 var(--font-mono);
  padding:0 5px;border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}

/* ═══ 主视图 · 集群矩阵 ═════════════════════════════════════════════ */
.stagewrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
.stagebar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none;
  padding:9px 14px;border-bottom:1px solid var(--border-subtle);
  background:color-mix(in srgb,var(--surface-2) 40%,transparent);
}
.stagebar__t{font:600 13.5px/1.2 var(--font-sans)}
.stagebar__s{font:400 11.5px/1.2 var(--font-sans);color:var(--foreground-secondary)}
.stagecanvas{flex:1 1 auto;min-height:0;position:relative;padding:12px 14px}
/* 只管**直接挂在画布上**的那张主图（集群矩阵那一档）。写成后代选择器时，
   传播图里那几枚 16px 的链路箭头也是 .stagecanvas 的后代，会被这条
   (0,1,1) 的规则盖过它自己那条 (0,1,0)——实机涨成半屏高一支箭头。
   其余各档的 svg 各有自己的容器规则（.mech__scene / .lane__grid / .chartwrap）。 */
.stagecanvas > svg{display:block;width:100%;height:100%;overflow:visible}
.stagenote{
  flex:none;padding:9px 14px;border-top:1px solid var(--border-subtle);
  font:400 12px/1.5 var(--font-sans);color:var(--foreground-secondary);
  background:color-mix(in srgb,var(--surface-2) 40%,transparent);
}
.stagenote b{color:var(--foreground);font-weight:600}

.cell{cursor:pointer}
.cell:hover{stroke:var(--foreground);stroke-width:1.2}
.lbl{font:600 10px/1 var(--font-mono);fill:var(--foreground-muted);letter-spacing:.04em}
.lbl--big{font-size:12px;fill:var(--foreground-secondary)}
.axis{stroke:var(--border-default);stroke-width:1}

/* ═══ 主视图 · 传播图 ═══════════════════════════════════════════════ */
.objcard{cursor:pointer}
.objcard rect{transition:opacity var(--duration-fast)}
.objcard:hover rect.objbg{opacity:.92}

/* ═══ 主视图 · 机制舞台 ═════════════════════════════════════════════ */
.phaserow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phase{
  display:inline-flex;align-items:center;gap:6px;
  height:26px;padding:0 10px;border-radius:var(--radius-pill);
  border:1px solid var(--border-default);background:var(--surface-2);
  font:500 11.5px/1 var(--font-sans);color:var(--foreground-secondary);
  transition:background var(--duration-fast),color var(--duration-fast),border-color var(--duration-fast);
}
.phase:hover{background:var(--state-hover);color:var(--foreground)}
.phase[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.phase__clock{font:600 10.5px/1 var(--font-mono);opacity:.78}

/* ═══ 卫星 · 证据图 ═════════════════════════════════════════════════ */
.chartwrap{width:100%;height:190px}
.chartwrap svg{display:block;width:100%;height:100%;overflow:visible}
.cnote{margin:9px 0 0;font:400 11.5px/1.55 var(--font-sans);color:var(--foreground-secondary)}

/* ═══ HUD（屏幕坐标，不随画布缩放）═══════════════════════════════════ */
.hud{position:absolute;z-index:20;display:flex;align-items:center;gap:6px;
  padding:5px;border-radius:var(--radius-md);
  border:1px solid var(--border-subtle);
  background:color-mix(in srgb,var(--surface-1) 84%, transparent);
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  box-shadow:var(--shadow-sm);
}
#crumbs{left:14px;top:14px;max-width:calc(100% - 220px);flex-wrap:wrap}
#zoomhud{right:14px;bottom:14px}
#legendhud{left:14px;bottom:14px;gap:10px;padding:7px 11px;flex-wrap:wrap;max-width:calc(100% - 220px)}
.crumb{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
  border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
  font:500 12px/1 var(--font-sans);color:var(--foreground-secondary);white-space:nowrap;
}
.crumb:hover{background:var(--state-hover);color:var(--foreground)}
.crumb[aria-current="true"]{background:var(--state-selected);color:var(--primary);

/* ══════════════════════════════════════════════════════════════════════
   ② 拓扑模型
   2048 卡 = PP4 × EDP8 × EP64。global rank = stage×512 + edp×64 + ep，
   这条式子同时解释了故事线里那两个门牌：1559 = 3×512 + 0×64 + 23（PP3/EP23），
   1553 = 3×512 + 0×64 + 17（PP3/EP17）——问题2 与问题1 的首个失败卡各一张。
   46 层按 PP 分四段，L38 落在 PP3（两条故事线的病灶都在这一层）。
   ══════════════════════════════════════════════════════════════════════ */
var TOPO = {
  pp: 4, edp: 8, ep: 64, world: 2048,
  layers: 46, experts: 256, topK: 2,
  stageRange: [[0,11],[12,23],[24,33],[34,45]],
  rank: function (stage, edp, ep) { return stage * 512 + edp * 64 + ep; },
  decode: function (r) { return { stage: (r / 512) | 0, edp: ((r % 512) / 64) | 0, ep: r % 64 }; },
  stageOfLayer: function (l) {
    for (var i = 0; i < 4; i++) if (l >= TOPO.stageRange[i][0] && l <= TOPO.stageRange[i][1]) return i;
    return 3;
  }
};

/* ══════════════════════════════════════════════════════════════════════
   ③ 画布引擎：平移 / 缩放 / 适配
   ══════════════════════════════════════════════════════════════════════ */
var vp = document.getElementById('viewport');
var world = document.getElementById('world');
var links = document.getElementById('links');
var tip = document.getElementById('tip');
var view = { x: 0, y: 0, k: 1 };
var MINK = 0.22, MAXK = 2.6;

function applyView() {
  world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')';
  vp.style.setProperty('--dot', (26 * view.k) + 'px');
  vp.style.setProperty('--dotx', view.x + 'px');
  vp.style.setProperty('--doty', view.y + 'px');
  var z = document.getElementById('zVal');
  if (z) z.textContent = Math.round(view.k * 100) + '%';
}
function clampK(k) { return Math.max(MINK, Math.min(MAXK, k)); }
function zoomAt(cx, cy, nk) {
  nk = clampK(nk);
  var wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = nk; view.x = cx - wx * nk; view.y = cy - wy * nk;
  applyView();
}
function fitBox(box, pad) {
  var r = vp.getBoundingClientRect();
  pad = pad == null ? 40 : pad;
  var k = clampK(Math.min((r.width - pad * 2) / box.w, (r.height - pad * 2) / box.h));
  view.k = k;
  view.x = (r.width - box.w * k) / 2 - box.x * k;
  view.y = (r.height - box.h * k) / 2 - box.y * k;
  applyView();
}
function fitAll() {
  fitBox({ x: LAY.west.x, y: LAY.north.y,
           w: (LAY.east.x + LAY.east.w) - LAY.west.x,
           h: (LAY.south.y + LAY.south.h) - LAY.north.y }, 34);
}
function fitStage() { fitBox(LAY.stage, 56); }

/* 平移：在空白处（或面板头）按下拖动。面板正文里的滚动与点击不受影响。 */
(function () {
  var down = null;
  vp.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    if (e.target.closest('.hud')) return;
    if (e.target.closest('button, a, input, .panel__body')) {
      if (!e.target.closest('.stagecanvas') && !e.target.closest('.panel__head')) return;
      if (e.target.closest('button, a, input')) return;
    }
    down = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    vp.classList.add('is-panning');
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) down.moved = true;
    view.x = down.vx + dx; view.y = down.vy + dy;
    applyView();
  });
  var up = function (e) {
    if (!down) return;
    down = null; vp.classList.remove('is-panning');
    try { vp.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);

  vp.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = vp.getBoundingClientRect();
    /* trackpad 的双指滚动惯性很大，除以 380 之后手感与鼠标滚轮接近 */
    zoomAt(e.clientX - r.left, e.clientY - r.top, view.k * Math.exp(-e.deltaY / 380));
  }, { passive: false });

  vp.addEventListener('dblclick', function (e) {
    if (e.target.closest('.panel') || e.target.closest('.hud')) return;
    fitAll();
  });
})();

document.getElementById('zIn').addEventListener('click', function () {
  var r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.k * 1.25);
});
document.getElementById('zOut').addEventListener('click', function () {
  var r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, view.k / 1.25);
});
document.getElementById('fitBtn').addEventListener('click', fitAll);
document.getElementById('focusBtn').addEventListener('click', fitStage);

/* ══════════════════════════════════════════════════════════════════════
   ④ 悬浮提示（一处实现，全页共用 data-tip）
   ══════════════════════════════════════════════════════════════════════ */
function bindTip(el, text) { el.setAttribute('data-tip', text); }
document.addEventListener('pointerover', function (e) {
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) return;
  tip.textContent = t.getAttribute('data-tip');
  tip.setAttribute('data-on', '1');
});
document.addEventListener('pointermove', function (e) {
  if (tip.getAttribute('data-on') !== '1') return;
  var w = tip.offsetWidth, h = tip.offsetHeight;
  var x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('pointerout', function (e) {
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t) tip.removeAttribute('data-on');
});

/* ══════════════════════════════════════════════════════════════════════
   ⑤ 状态：一条下钻栈 + 当前故事线
   栈里每一层是 { view, label, ... }，面包屑就是它的可视形态；
   URL 写的也是它——看到哪一屏，链接就是哪一屏。
   ══════════════════════════════════════════════════════════════════════ */
var S = {
  group: GROUPS[0].id,
  eventId: null,     // 下钻到事件之后非空
  phase: 0,          // 机制相位
  rank: null,        // 下钻到单卡之后非空
  lane: false,       // 是否把泳道推进中心
  auto: false
};
function curGroup() { return GROUPS.filter(function (g) { return g.id === S.group; })[0] || GROUPS[0]; }
function curEvent() {
  var g = curGroup();
  if (!S.eventId) return null;
  return g.events.filter(function (e) { return e.id === S.eventId; })[0] || null;
}
/* 主视图是栈顶决定的，不另存一份——两处各存一份迟早对不上 */
function curView() {
  if (S.lane) return 'lane';
  if (S.rank != null) return 'rank';
  var ev = curEvent();
  if (ev && ev.mechanism && S.phase >= 0 && S.mech) return 'mech';
  if (ev) return 'flow';
  return 'cluster';
}

var el = function (tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
function svgEl(tag, attrs) {
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ══════════════════════════════════════════════════════════════════════

   位置全部来自 LAY，DOM 只建一次，之后只换 body 的内容——
   重建整块面板会把滚动位置与过渡一起丢掉。

  var head = el('div', 'panel__head');

/* 一张卡离震中多远：0 无关 / 1 同 stage / 2 同 EP 组 / 3 震中本身。
   集群矩阵、构成图、泳道三处都读它，判据只写一遍。 */
function impactTier(r) {
  var ev = curEvent(), g = curGroup();
  var focusRank = null, stage = null;
  if (ev) {
    if (ev.focus.kind === 'rank') focusRank = ev.focus.rank;
    else if (ev.origin && Array.isArray(ev.origin.ranks)) focusRank = ev.origin.ranks[0];
    if (ev.focus.kind === 'stage') stage = ev.focus.stage;
    else if (ev.focus.kind === 'layer') stage = TOPO.stageOfLayer(ev.focus.layer);
    else if (ev.scope && ev.scope.stage != null) stage = ev.scope.stage;
  } else {
    focusRank = (g.context.ranks && Array.isArray(g.context.ranks)) ? g.context.ranks[0] : null;
    stage = g.context.stages ? g.context.stages[0]
          : (g.context.layers ? TOPO.stageOfLayer(g.context.layers[0]) : 3);
  }
  if (focusRank == null && stage == null) return 0;
  if (focusRank != null && r === focusRank) return 3;
  var p = TOPO.decode(r);
  if (focusRank != null) {
    var f = TOPO.decode(focusRank);
    if (p.stage === f.stage && p.edp === f.edp) return 2;
    if (p.stage === f.stage) return 1;
    return 0;
  }
  return p.stage === stage ? 1 : 0;
}

function viewCluster() {

  var gridW = cols * CW;

/* ── 档 2 · 传播图 ──────────────────────────────────────────────────

    vs.forEach(function (v, i) { d += (i ? ' L' : 'M') + X(i) + ' ' + Y(v); });
    area = d + ' L' + X(n - 1) + ' ' + (H - B) + ' L' + X(0) + ' ' + (H - B) + ' Z';
    svg.appendChild(svgEl('path', { d: area, fill: 'color-mix(in srgb,var(--primary) 18%,transparent)' }));
    svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: 'var(--primary)', 'stroke-width': 2 }));
    vs.forEach(function (v, i) {
      var isMark = c.mark && c.mark.index === i;
      svg.appendChild(svgEl('circle', { cx: X(i), cy: Y(v), r: isMark ? 4.4 : 2.6,
        fill: isMark ? tc(c.mark.tone) : 'var(--primary)',
        'data-tip': '第 ' + (i + 1) + ' 个采样点 · ' + v + (c.unit || '') }));
    });
    if (c.mark) svg.appendChild(T(Math.min(W - R, X(c.mark.index) + 6), Y(vs[c.mark.index]) - 8,
      c.mark.label, { anchor: 'end', size: 9.5, w: 700, fill: tc(c.mark.tone) }));
    svg.appendChild(T(L, H - 8, c.x[0], { size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(W - R, H - 8, c.x[c.x.length - 1], { anchor: 'end', size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(0, Y(hi) + 4, String(hi), { size: 9, mono: true, fill: 'var(--foreground-muted)' }));
    svg.appendChild(T(0, Y(lo) + 4, String(lo), { size: 9, mono: true, fill: 'var(--foreground-muted)' }));

  } else if (c.kind === 'bars') {
    var items = c.items, L2 = 112, rh = Math.min(20, (H - 10) / items.length - 3);
    var mx = Math.max.apply(null, items.map(function (i) { return i.value; }).concat(c.threshold ? [c.threshold.value] : []));
    items.forEach(function (it, i) {
      var y = 6 + i * ((H - 10) / items.length);
      svg.appendChild(T(L2 - 6, y + rh / 2 + 3.5, it.label, { anchor: 'end', size: 10, fill: 'var(--foreground-secondary)' }));
      svg.appendChild(svgEl('rect', { x: L2, y: y, width: W - L2 - 42, height: rh, rx: 2, fill: 'var(--surface-2)' }));
      var w = Math.max(1.5, (it.value / (mx || 1)) * (W - L2 - 42));
      svg.appendChild(svgEl('rect', { x: L2, y: y, width: w, height: rh, rx: 2, fill: tc(it.tone),
        'data-tip': it.label + ' · ' + it.value + (c.unit || '') }));
      svg.appendChild(T(W - 38, y + rh / 2 + 3.5, it.value + (c.unit || ''),
        { size: 9.5, mono: true, w: 700, fill: it.tone ? tc(it.tone) : 'var(--foreground)' }));
    });
    if (c.threshold) {
      var tx = L2 + (c.threshold.value / (mx || 1)) * (W - L2 - 42);
      svg.appendChild(svgEl('line', { x1: tx, y1: 2, x2: tx, y2: H - 14,
        stroke: 'var(--warning)', 'stroke-width': 1.3, 'stroke-dasharray': '5 4' }));
      svg.appendChild(T(tx + 3, H - 4, c.threshold.label, { size: 9,
        fill: 'color-mix(in srgb,var(--warning) 80%,var(--foreground))', w: 600 }));
    }

  } else if (c.kind === 'stack') {
    var tot = c.items.reduce(function (a, b) { return a + b.value; }, 0);
    var x = 8, bw = W - 16, by = 12, bh = 34;
    c.items.forEach(function (it) {
      var w = it.value / tot * bw;
      svg.appendChild(svgEl('rect', { x: x, y: by, width: Math.max(1, w - 1), height: bh,
        rx: 2, fill: tc(it.tone), 'data-tip': it.label + ' · ' + it.value + (c.unit || '') +
          '（' + (it.value / tot * 100).toFixed(it.value / tot < .01 ? 2 : 1) + '%）' }));
      x += w;
    });
    var ly = by + bh + 20;
    c.items.forEach(function (it, i) {
      svg.appendChild(svgEl('rect', { x: 8, y: ly + i * 22 - 8, width: 9, height: 9, rx: 2, fill: tc(it.tone) }));
      svg.appendChild(T(23, ly + i * 22, it.label, { size: 10.5, fill: 'var(--foreground-secondary)' }));
      svg.appendChild(T(W - 8, ly + i * 22, it.value + (c.unit || '') + '　' +
        (it.value / tot * 100).toFixed(it.value / tot < .01 ? 2 : 1) + '%',
        { anchor: 'end', size: 10, mono: true, w: 700, fill: it.tone ? tc(it.tone) : 'var(--foreground)' }));
    });

  } else if (c.kind === 'capacity') {
    /* 等距容器而不是构成条：这张图的分母是一张卡的 64 GB，装满了就是 OOM，
       平面色条表达不了「框满了」这件事。自底向上摞。 */
    var cap = c.cap, bx = 96, bw2 = 92, byy = 8, bhh = H - 26;
    svg.appendChild(svgEl('rect', { x: bx, y: byy, width: bw2, height: bhh, rx: 4,
      fill: 'var(--surface-2)', stroke: 'var(--border-strong)', 'stroke-width': 1.5 }));
    var acc = 0, labels = [];
    c.items.forEach(function (it) {
      var h = it.value / cap * bhh, y = byy + bhh - (acc + it.value) / cap * bhh;
      var rect = svgEl('rect', { x: bx + 1.5, y: y, width: bw2 - 3, height: Math.max(1, h),
        fill: tc(it.tone), opacity: it.void ? .5 : .9,
        'data-tip': it.label + ' · ' + it.value + (c.unit || '') + '（占 ' + (it.value / cap * 100).toFixed(1) + '%）' });
      svg.appendChild(rect);
      if (it.void) {
        var hatch = svgEl('rect', { x: bx + 1.5, y: y, width: bw2 - 3, height: Math.max(1, h),
          fill: 'url(#vd)', opacity: .8 });
        svg.appendChild(hatch);
      }
      labels.push({ y: y + h / 2, h: h, label: it.label,
        v: it.value + (c.unit || ''), tone: it.tone });
      acc += it.value;
    });
    /* 自顶向下推挤：上一条标签底下至少留 13px 再放下一条 */
    labels.sort(function (a, b) { return a.y - b.y; });
    var lastY = -99;
    labels.forEach(function (L) {
      var ly2 = Math.max(L.y, lastY + 13);
      lastY = ly2;
      if (Math.abs(ly2 - L.y) > 2.5) svg.appendChild(svgEl('line',
        { x1: bx - 5, y1: L.y, x2: bx - 5, y2: ly2 - 3, stroke: 'var(--border-strong)', 'stroke-width': .9 }));
      svg.appendChild(T(bx - 7, ly2 + 3.5, L.label, { anchor: 'end', size: 9.5,
        fill: L.tone ? tc(L.tone) : 'var(--foreground-secondary)' }));
      svg.appendChild(T(bx + bw2 + 7, ly2 + 3.5, L.v,
        { size: 9.5, mono: true, w: 700, fill: L.tone ? tc(L.tone) : 'var(--foreground)' }));
    });
    var defs = svgEl('defs');
    var pat = svgEl('pattern', { id: 'vd', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
    pat.appendChild(svgEl('rect', { width: 4, height: 8, fill: 'var(--surface-1)', opacity: .55 }));
    defs.appendChild(pat); svg.appendChild(defs);
    svg.appendChild(T(bx + bw2 / 2, H - 6, cap + ' GB 容量', { anchor: 'middle', size: 9.5, mono: true, fill: 'var(--foreground-muted)' }));
  }
  wrap.appendChild(svg);
  host.appendChild(wrap);
  if (c.note) host.appendChild(el('p', 'cnote', c.note));
}

/* ══════════════════════════════════════════════════════════════════════
   ⑮ 主题桥 —— 认 ?theme=，也认 pto:state（与 combo-workbench 同一套约定，
   这一页因此可以直接当成那块台面上的一格嵌进去）
   ══════════════════════════════════════════════════════════════════════ */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.body.dataset.theme = t;
  var b = document.getElementById('themeBtn');
  b.title = t === 'dark' ? '切回浅色' : '切换到深色';
  writeURL();
}
document.getElementById('themeBtn').addEventListener('click', function () {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.type !== 'pto:state') return;
  if (d.theme === 'dark' || d.theme === 'light') setTheme(d.theme);
  if (d.group && GROUPS.some(function (g) { return g.id === d.group; })) { S.group = d.group; S.eventId = null; render(); }
  if (d.event) {
    var hit = null;
    GROUPS.forEach(function (g) { g.events.forEach(function (ev) { if (ev.id === d.event) { hit = g.id; } }); });
    if (hit) { S.group = hit; S.eventId = d.event; S.mech = false; S.rank = null; S.lane = false; render(); }
  }
  if (typeof d.rank === 'number' && d.rank >= 0 && d.rank < TOPO.world) { S.rank = d.rank; render(); }
});

/* ══════════════════════════════════════════════════════════════════════
   ⑯ 自动播放 —— 按故事线顺序走一遍，带机制图的事件在原地把相位播完
   给的是「第一次打开这一页的人」一条不用动手的完整路径。
   ══════════════════════════════════════════════════════════════════════ */
var autoTimer = null;
function autoStop() {
  S.auto = false; clearInterval(autoTimer); clearInterval(playTimer);
  document.getElementById('autoBtn').setAttribute('aria-pressed', 'false');
  document.getElementById('autoLbl').textContent = '自动播放';
}
function autoStart() {
  var g = curGroup();
  S.auto = true;
  document.getElementById('autoBtn').setAttribute('aria-pressed', 'true');
  document.getElementById('autoLbl').textContent = '停止';
  var i = 0;
  var step = function () {
    if (!S.auto) return;
    var ev = g.events[i % g.events.length];
    S.eventId = ev.id; S.rank = null; S.lane = false;
    if (ev.mechanism) { S.mech = true; S.phase = 0; render(); playPhases(); }
    else { S.mech = false; render(); }
    i++;
  };
  step();
  autoTimer = setInterval(step, 9000);
}
document.getElementById('autoBtn').addEventListener('click', function () {
  if (S.auto) autoStop(); else autoStart();
});
/* 手动操作即停：自动播放与人抢方向盘是最讨厌的一种交互 */
['pointerdown', 'wheel', 'keydown'].forEach(function (t) {
  vp.addEventListener(t, function () { if (S.auto) autoStop(); }, { passive: true });
});
document.getElementById('lineSeg').addEventListener('click', function () { if (S.auto) autoStop(); });

/* 键盘：← → 在事件间走，Esc 退一级，0 总览，F 回中心 */
window.addEventListener('keydown', function (e) {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  var g = curGroup(), idx = g.events.map(function (x) { return x.id; }).indexOf(S.eventId);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    var n = idx + (e.key === 'ArrowRight' ? 1 : -1);
    if (n < 0) n = g.events.length - 1;
    if (n >= g.events.length) n = 0;
    S.eventId = g.events[n].id; S.mech = false; S.phase = 0; S.rank = null; S.lane = false; render();
  } else if (e.key === 'Escape') {
    var trail = crumbTrail();
    if (trail.length > 1) { trail[trail.length - 2].go(); render(); }
  } else if (e.key === '0') { fitAll(); }
  else if (e.key === 'f' || e.key === 'F') { fitStage(); }
});

/* ══════════════════════════════════════════════════════════════════════
   ⑰ 启动
   ══════════════════════════════════════════════════════════════════════ */
readURL();
setTheme(document.documentElement.dataset.theme || 'light');
booting = false;
render();
/* 第一屏给总览：主视图坐中间、五块卫星围一圈——这一页的主张就是这张构图，
   进来先看见它，再自己推近。 */
requestAnimationFrame(function () { fitAll(); });
window.addEventListener('resize', function () {
  clearTimeout(window.__rz);
  window.__rz = setTimeout(function () { if (view.k <= 0.95) fitAll(); }, 160);
});
})();
</script>
