<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>组合工作台 · 并行拓扑 × 微批次生命周期</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<!--
  ══════════════════════════════════════════════════════════════════════
  组合工作台 —— 一块可以往上摞卡片的台面。

  形态是**应用外壳**，不是文档页：顶栏 + 一整块舞台 + 底部抽屉，铺满视口、
  自己不滚动（滚动都发生在格子里面）。视觉语言照抄 cube-cockpit.html：
  同一套 PTO token（浅色优先、[data-theme=dark] 单块覆盖）、同一种面板圆角与
  段控、底部抽屉就是它那张「Profiling 视图」卡（标题的琥珀色 #8a5f00 也照搬）。
  token 是**内联**的（值抄自驾驶舱的 ①②③④ 四段），不引 vendor：这一页少一条
  外部依赖，主题就少一次闪白。

  和已有那两个工作台/驾驶舱的分工：
    · /            统一工作台   —— React 应用，一个主视图
    · /parallel-topology/cockpit.html  并行拓扑驾驶舱 —— 一块大画布 + 切换轨，
      一次只看一个组件（切走的只 hidden 不 destroy）
    · 本页          组合工作台   —— **同屏上下摞多个格子**，每格是一个完整的
      已有页面，格头统一收编它的视图切换。为的是把「同一件事的不同层」上下
      对齐着看：上面回答「这张卡装的是模型的哪一块」（空间），下面回答
      「这块东西在一个 step 里什么时候动」（时间）。

  现在台面上两格（后续往 SLOTS 里加即可，格头、段控、折叠/关闭、URL 状态
  都是按 N 格写的，不是硬编两格）：
    ① 舞台 · 并行拓扑     iframe → ../parallel-topology/demo.html?embed=1
       embed=1 把它自带的顶栏和页脚收起来，只剩画布；视图由格头的段控代管，
       用 postMessage {type:'pto:state', view} 驱动，不重载 iframe。
       需要预置/图层那些开关时点格头的「工具条」，把它自己的顶栏放回来。
    ② 抽屉 · 微批次生命周期泳道  iframe → ./swimlane.html?chrome=0
       上游拷贝（见 swimlane.html 顶部说明），同一套 pto:state 约定。
  舞台与抽屉之间是可拖的分隔条；抽屉高度、各格看哪个视图都写进 URL。

  依赖（都在 main 的构建产物里，本目录不复制第二份）：
    · /parallel-topology/demo.html   —— 发布时由该 pattern 分支的版本覆盖同路径
    · /vendor/pto-design-system/     —— swimlane.html 的 ../vendor/ 落在这上面
  本页自身是自包含单文件，上面两条哪条 404 都只坏那一格，外壳还在。
  ══════════════════════════════════════════════════════════════════════
-->
<style>
/* ① Foundation —— 抄自 cube-cockpit.html（浅色优先 + 主题无关的比例尺） */
:root{
  --ark-neutral-1:#F5F5F5; --ark-neutral-2:#FFFFFF;
  --ark-blue-500:#4369EF; --ark-blue-600:#5A92E6; --ark-domain-aux:#7C8DB8;
  --ark-green-500:#04D793; --ark-orange-500:#FFAA3B; --ark-red-500:#FF4B7B;
  --ark-violet-400:#9B3CF6;
  --font-sans:'Inter','Source Han Sans SC','PingFang SC','Noto Sans SC',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --panel-shell-radius:14px;
  --duration-fast:100ms;
  --comp-toolbar-h:44px; --scrollbar-w:5px;
}
/* ② Semantic —— 浅色（默认） */
:root, :root[data-theme="light"]{
  --background:var(--ark-neutral-1); --surface-1:#FFFFFF; --surface-2:#F2F2F2; --surface-3:#E6E6E6;
  --foreground:rgba(0,0,0,.90); --foreground-secondary:rgba(0,0,0,.55); --foreground-muted:rgba(0,0,0,.38);
  --border-subtle:rgba(0,0,0,.07); --border-default:rgba(0,0,0,.12); --border-strong:rgba(0,0,0,.18);
  --primary:var(--ark-blue-500); --primary-hover:var(--ark-blue-600);
  --success:var(--ark-green-500); --warning:var(--ark-orange-500); --danger:var(--ark-red-500);
  --focus-ring:rgba(67,105,239,.36);
  --state-hover:rgba(0,0,0,.05); --state-press:rgba(0,0,0,.09);
  --state-muted:rgba(0,0,0,.05); --state-selected:rgba(67,105,239,.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,.10); --shadow-md:0 6px 18px rgba(0,0,0,.12);
  --stage-bg:#f5f5f5;
  --dock-title:#8a5f00;      /* 驾驶舱抽屉标题那抹琥珀，浅色下的取值 */
}
/* ② Semantic —— 深色（单块覆盖） */
:root[data-theme="dark"]{
  --background:#0b0b0b; --surface-1:#161616; --surface-2:#1c1c1c; --surface-3:#262626;
  --foreground:rgba(255,255,255,.90); --foreground-secondary:rgba(255,255,255,.60); --foreground-muted:rgba(255,255,255,.40);
  --border-subtle:rgba(255,255,255,.06); --border-default:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
  --focus-ring:rgba(67,105,239,.42);
  --state-hover:rgba(255,255,255,.06); --state-press:rgba(255,255,255,.10);
  --state-muted:rgba(255,255,255,.06); --state-selected:rgba(67,105,239,.14);
  --shadow-sm:0 1px 3px rgba(0,0,0,.28); --shadow-md:0 6px 18px rgba(0,0,0,.34);
  --stage-bg:#101010;
  --dock-title:var(--warning);
}
/* ③ 数据编码色 —— 主题无关 */
:root{ --dv-tp:#39c5cf; --dv-pp:var(--warning); --dv-dp:var(--primary); --dv-ep:var(--ark-violet-400); }
/* ④ 兼容别名 —— 与驾驶舱同名，方便两边互看 */
:root{
  --sys-border:var(--border-default); --sys-border-strong:var(--border-strong);
  --sys-raised:var(--surface-2); --sys-raised-hover:var(--surface-3);
  --bg:var(--background); --panel:var(--surface-1); --panel2:var(--surface-2);
  --border:var(--border-default); --txt:var(--foreground); --dim:var(--foreground-secondary);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font-sans);font-size:13px;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.28) transparent}
::-webkit-scrollbar{width:var(--scrollbar-w);height:var(--scrollbar-w)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(127,127,127,.28);border-radius:var(--radius-pill)}

button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:28px;
  background:var(--sys-raised);color:var(--txt);border:1px solid var(--sys-border);border-radius:var(--radius-lg);
  padding:0 11px;font:500 12px/1 var(--font-sans);white-space:nowrap;
  transition:background var(--duration-fast),border-color var(--duration-fast),color var(--duration-fast)}
button:hover{background:var(--sys-raised-hover);border-color:var(--sys-border-strong)}
button:active{background:var(--state-press)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
button.on{background:var(--state-selected);border-color:color-mix(in srgb,var(--primary) 45%,var(--sys-border-strong));color:var(--primary)}
a.btn{text-decoration:none}

#app{display:flex;flex-direction:column;height:100vh}

/* ═══ 顶栏 ═══ */
#topbar{height:var(--comp-toolbar-h);flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:color-mix(in srgb,var(--panel) 94%,var(--bg));border-bottom:1px solid var(--sys-border)}
#topbar .title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--txt);margin-right:6px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
#topbar .title::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--primary);flex-shrink:0}
#topbar .title small{font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0}
#topbar .spacer{flex:1 1 auto}
.icon-btn{min-width:30px;padding:0 8px;font-size:13px}

/* 视图控制 ▾ —— 台面级开关（哪几格在场、拓扑工具条、恢复默认布局） */
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:40;display:none;
  min-width:250px;padding:8px;background:var(--panel);border:1px solid var(--sys-border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
.menu.open .menu-pop{display:block}
.menu-lab{display:block;padding:6px 8px 4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--foreground-muted)}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:var(--radius-md);
  background:transparent;color:var(--txt);font:500 12px/1.3 var(--font-sans);text-align:left;min-height:30px;justify-content:flex-start}
.menu-item:hover{background:var(--state-hover);border-color:transparent}
.menu-item .tick{width:14px;flex:0 0 14px;color:var(--primary);font-size:11px}
.menu-item[aria-checked="false"] .tick{color:transparent}
.menu-sep{height:1px;margin:6px 4px;background:var(--border-subtle)}

/* ═══ 舞台（上面那格） ═══ */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 8px 0;background:var(--stage-bg)}

/* 面板 = 一格。舞台格铺满剩余高度，抽屉格定高可拖。 */
.slot{display:flex;flex-direction:column;min-height:0;background:var(--panel);
  border:1px solid var(--sys-border);border-radius:var(--panel-shell-radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.slot[hidden]{display:none}
#slot-topology{flex:1 1 auto}
.slot[data-folded="1"]{flex:0 0 auto}
.slot[data-folded="1"] .slot-body{display:none}

/* 格头：标题 + 段控 + 动作，就是驾驶舱抽屉那一排 */
.slot-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;
  border-bottom:1px solid var(--border-subtle);background:var(--panel)}
.slot-title{font-size:12px;font-weight:600;color:var(--txt);margin-right:2px;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.slot-title i{width:8px;height:8px;border-radius:2px;background:var(--accent-dot,var(--primary));flex:0 0 auto}
.slot-title span{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--foreground-muted)}
.slot-head .spacer{flex:1 1 auto}

/* 段控：灰轨 + 白色活动块（驾驶舱 .drtabs 同款） */
.tabs{display:flex;gap:3px;background:var(--state-muted);border-radius:var(--radius-md);padding:3px}
.tabs button{border:none;background:transparent;box-shadow:none;border-radius:calc(var(--radius-md) - 2px);
  padding:4px 10px;color:var(--dim);font-weight:500;min-height:24px;font-size:12px}
.tabs button:hover{background:var(--state-hover);border-color:transparent;color:var(--txt)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--txt);font-weight:600;box-shadow:var(--shadow-sm)}

.slot-body{flex:1 1 auto;position:relative;min-height:0;background:var(--panel)}
.slot-body > iframe{display:block;width:100%;height:100%;border:0}
.slot-fallback{position:absolute;inset:0;display:none;place-content:center;text-align:center;padding:24px;
  font-size:12px;line-height:1.8;color:var(--dim)}
.slot[data-broken="1"] .slot-fallback{display:grid}
.slot[data-broken="1"] .slot-body > iframe{visibility:hidden}
.slot-fallback b{color:var(--txt)}
.slot-fallback code{font-family:var(--font-mono);font-size:11.5px;background:var(--state-muted);padding:1px 5px;border-radius:4px}

/* ═══ 抽屉（下面那格）—— 驾驶舱 #drawer 的形制 ═══ */
#dock{flex:0 0 auto;height:var(--dock-h,340px);min-height:120px;display:flex;flex-direction:column;
  margin:0 8px 8px;background:var(--panel);border:1px solid var(--sys-border);
  border-radius:var(--panel-shell-radius);overflow:hidden;box-shadow:var(--shadow-sm)}
#dock[hidden]{display:none}
#dock[data-folded="1"]{height:auto;min-height:0}
#dock .slot-title{color:var(--dock-title)}
#dock .slot-title i{background:var(--dock-title)}

/* 舞台与抽屉之间的分隔条 */
#splitter{flex:0 0 auto;height:10px;margin:0 8px;cursor:ns-resize;display:grid;place-items:center;touch-action:none}
#splitter::after{content:"";width:52px;height:3px;border-radius:2px;background:var(--border-strong);opacity:.5}
#splitter:hover::after{background:var(--primary);opacity:1}
#splitter[hidden]{display:none}
body.is-resizing{user-select:none;cursor:ns-resize}
body.is-resizing iframe{pointer-events:none}

@media (max-width:1080px){
  .slot-head{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">

  <!-- ═══ 顶栏 ═══ -->
  <header id="topbar">
    <span class="title">组合工作台<small>并行拓扑 × 微批次生命周期</small></span>
    <a class="btn" href="../launch.html" style="min-height:28px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid var(--sys-border);border-radius:var(--radius-lg);background:var(--sys-raised);color:var(--txt);font:500 12px/1 var(--font-sans)">项目启动页</a>
    <a class="btn" href="../parallel-topology/cockpit.html" style="min-height:28px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid var(--sys-border);border-radius:var(--radius-lg);background:var(--sys-raised);color:var(--txt);font:500 12px/1 var(--font-sans)">并行拓扑驾驶舱</a>

    <span class="spacer"></span>
    <div class="menu" id="viewMenu">
      <button id="viewMenuBtn" aria-haspopup="true" aria-expanded="false">视图控制 <span aria-hidden="true">▾</span></button>
      <div class="menu-pop" role="menu">
        <span class="menu-lab">台面上的格子</span>
        <button class="menu-item" role="menuitemcheckbox" data-menu="slot" data-slot="topology" aria-checked="true"><span class="tick">✓</span>并行拓扑</button>
        <button class="menu-item" role="menuitemcheckbox" data-menu="slot" data-slot="swimlane" aria-checked="true"><span class="tick">✓</span>微批次生命周期泳道</button>
        <div class="menu-sep"></div>
        <span class="menu-lab">格子选项</span>
        <button class="menu-item" role="menuitemcheckbox" data-menu="chrome" data-slot="topology" aria-checked="false"><span class="tick">✓</span>并行拓扑 · 显示它自带的工具条</button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-menu="reset"><span class="tick"></span>恢复默认布局</button>
      </div>
    </div>
    <span class="spacer"></span>

    <button class="icon-btn" id="themeBtn" title="切换明暗：外壳与两格里的页面一起换（与驾驶舱的主题桥同一套约定）" aria-label="切换明暗">☾</button>
  </header>

  <!-- ═══ 舞台：并行拓扑 ═══ -->
  <main id="stage">
    <section class="slot" id="slot-topology" style="--accent-dot:var(--dv-dp)">
      <header class="slot-head">
        <span class="slot-title"><i aria-hidden="true"></i>并行拓扑<span>parallel-topology · demo</span></span>
        <div class="tabs" role="tablist" aria-label="并行拓扑视图" data-tabs="topology"></div>
      </header>
      <div class="slot-body">
        <iframe data-slot="topology" title="并行拓扑 Demo" allow="fullscreen"></iframe>
        <div class="slot-fallback">
          <p><b>这一格没能加载。</b><br />
            它引的是 <code>/parallel-topology/demo.html</code>，那份目录由 pattern 分支的 workflow 叠加发布；<br />
            别的分支刚发布过的话会暂时 404，重跑一次对应分支的 Deploy 即可找回。</p>
        </div>
      </div>
    </section>
  </main>

  <div id="splitter" role="separator" aria-orientation="horizontal" aria-label="拖动调整下方抽屉高度"></div>

  <!-- ═══ 抽屉：微批次生命周期泳道（驾驶舱「Profiling 视图」那张卡的形制） ═══ -->
  <section class="slot" id="dock">
    <header class="slot-head">
      <span class="slot-title"><i aria-hidden="true"></i>微批次生命周期泳道<span>MB07 · step 18420</span></span>
      <div class="tabs" role="tablist" aria-label="泳道时间范围" data-tabs="swimlane"></div>
      <span class="spacer"></span>
      <button data-act="fold" title="收起这一格，只留格头">收起</button>
    </header>
    <div class="slot-body">
      <iframe data-slot="swimlane" title="MB07 微批次生命周期泳道"></iframe>
      <div class="slot-fallback">
        <p><b>这一格没能加载。</b><br />
          它引的是同目录的 <code>./swimlane.html</code> 与 <code>/vendor/pto-design-system/</code>。</p>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
'use strict';

/* ══════════════════════════════════════════════════════════════════════
   台面逻辑。按 **N 格** 写：加第三格只需要往 SLOTS 里加一条 + 照抄一节
   <section class="slot">，下面这些（段控、折叠、关闭、URL 状态）都不用改。
   ══════════════════════════════════════════════════════════════════════ */

/* 发布时由 deploy.yml 的「Overlay 组合工作台」一步 sed 成本分支短 SHA。
   iframe 的 src 是 JS 拼的，没法像别处那样在构建时给 href/src 打版本戳——
   不带它的话 ./swimlane.html?chrome=0&theme=light&range=global 这条 URL
   逐字不变，重新发布后浏览器照旧吃缓存里那一份。本地开发时是空串，不加参数。 */
var BUILD = '';

var SLOTS = [
  {
    id: 'topology',
    el: 'slot-topology',
    key: 'a',                  // URL 里代表「这一格当前看哪个视图」的参数名
    def: 'chain',
    /* demo.html 认 ?view=；embed=1 收起它自带的顶栏与页脚，只留画布 */
    src: function (s) {
      var q = new URLSearchParams();
      q.set('theme', shellDark ? 'dark' : 'light');
      q.set('view', s.value);
      if (!s.chrome) q.set('embed', '1');
      if (BUILD) q.set('v', BUILD);
      return '../parallel-topology/demo.html?' + q.toString();
    },
    /* embed 模式下 demo 会在画布左上角自己写一遍名字——它假设自己是「一条链接
       就是一张图」、周围没人替它报名。摞进格子以后格头已经写过了，这是第二遍。 */
    dedupe: '.pt-root.embed .pt-stagetitle{display:none}',
    /* 不重载也能换视图：demo.html 的 pto:state 白名单里就有 view */
    msg: function (v) { return { type: 'pto:state', view: v }; },
    tabs: [
      { v: 'chain',   t: '整网切分',   d: '五把刀按嵌套序串成一条链' },
      { v: 'story',   t: '一个 step',  d: '五幕：前向 / 反向 / 通信 / 更新' },
      { v: 'dim',     t: '单维切分',   d: '一次只看一把刀' },
      { v: 'compose', t: '合成·卡阵',  d: '全部卡摆成阵列' },
      { v: 'anatomy', t: '卡内解剖',   d: '层 → 算子 → kernel → 流' },
      { v: 'solid',   t: '交集腔',     d: '权重体 ∩ 激活体 = 这张卡的那一腔' },
      { v: 'time',    t: '时间·流',    d: '时间轴与通信流' }
    ]
  },
  {
    id: 'swimlane',
    el: 'dock',
    key: 'b',
    def: 'global',
    foldable: true,        // 只有它的格头上有「收起」，见下面 readURL 里的守卫
    src: function (s) {
      var q = new URLSearchParams();
      q.set('chrome', '0');                       // 藏掉上游自带的顶栏，段控归格头
      q.set('theme', theme());
      q.set('range', s.value);
      if (BUILD) q.set('v', BUILD);
      return './swimlane.html?' + q.toString();
    },
    msg: function (v) { return { type: 'pto:state', range: v }; },
    tabs: [
      { v: 'global', t: '训练步全貌',   d: 'MB07 从 PP0 前向到 PP0 反向的完整链路' },
      { v: 'pp2',    t: 'PP2 生命周期', d: 'PP2 的等待 / 计算 / 通信 / 激活驻留' },
      { v: 'l34',    t: 'L34 对象链',   d: 'L34 模块与保存激活的生产—消费关系' }
    ]
  }
];

var BY_ID = {};
SLOTS.forEach(function (s) { BY_ID[s.id] = s; });

var DEFAULT_DOCK_H = 340;
var state = {};      // id → { value, closed, folded, chrome, loaded }
var dockH = DEFAULT_DOCK_H;
var shellDark = false;

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var theme = function () { return shellDark ? 'dark' : 'light'; };
var slotEl = function (id) { return document.getElementById(BY_ID[id].el); };

/* ── URL ⇄ 状态 ──────────────────────────────────────────────────────
   URL 即这一屏：?a=solid&b=pp2&h=520&off=swimlane&fold=topology&dark=swimlane
   off/fold/bar/dark 都是「格子 id 的逗号表」，加第三第四格 URL 不会膨胀；
   只写非默认值，链接才不会一眼全是噪声。 */
var FLAGS = { closed: 'off', folded: 'fold', chrome: 'bar' };

function readURL() {
  var q = new URLSearchParams(location.search);
  var has = {};
  Object.keys(FLAGS).forEach(function (f) { has[f] = (q.get(FLAGS[f]) || '').split(','); });
  SLOTS.forEach(function (c) {
    var v = q.get(c.key);
    var s = { value: c.tabs.some(function (t) { return t.v === v; }) ? v : c.def, loaded: false };
    Object.keys(FLAGS).forEach(function (f) { s[f] = has[f].indexOf(c.id) >= 0; });
    /* 格头上没有「收起」的格子不认 fold=：否则 ?fold=topology 这种链接会把舞台
       折起来、而页面上没有任何一颗按钮能再把它展开——一条打不开的死链。 */
    if (!c.foldable) s.folded = false;
    state[c.id] = s;
  });
  var h = parseInt(q.get('h'), 10);
  dockH = (isFinite(h) && h >= 120 && h <= 1600) ? h : DEFAULT_DOCK_H;
  shellDark = q.get('ui') === 'dark';
}

function writeURL() {
  var q = new URLSearchParams();
  var bags = {};
  Object.keys(FLAGS).forEach(function (f) { bags[f] = []; });
  SLOTS.forEach(function (c) {
    var s = state[c.id];
    if (s.value !== c.def) q.set(c.key, s.value);
    Object.keys(FLAGS).forEach(function (f) { if (s[f]) bags[f].push(c.id); });
  });
  Object.keys(FLAGS).forEach(function (f) { if (bags[f].length) q.set(FLAGS[f], bags[f].join(',')); });
  if (dockH !== DEFAULT_DOCK_H) q.set('h', String(dockH));
  if (shellDark) q.set('ui', 'dark');
  var qs = q.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

/* ── 段控 ─────────────────────────────────────────────────────────── */
function buildTabs(slot) {
  var host = $('[data-tabs="' + slot.id + '"]');
  host.innerHTML = slot.tabs.map(function (t) {
    return '<button type="button" role="tab" data-v="' + t.v + '" title="' + t.d + '" aria-selected="false">' + t.t + '</button>';
  }).join('');
  host.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-v]');
    if (btn) select(slot.id, btn.dataset.v, true);
  });
}

function syncTabs(id) {
  var slot = BY_ID[id], v = state[id].value;
  var host = $('[data-tabs="' + id + '"]');
  Array.prototype.forEach.call(host.querySelectorAll('button[data-v]'), function (b) {
    b.setAttribute('aria-selected', String(b.dataset.v === v));
  });
}

/* 驱动优先走 postMessage（不重载 = 不丢格子里的选中态）；
   iframe 还没 load 完就退回重载，让 src 参数把状态带进去。 */
function select(id, value, push) {
  var slot = BY_ID[id], s = state[id];
  if (!slot.tabs.some(function (t) { return t.v === value; })) return;
  s.value = value;
  var frame = $('iframe[data-slot="' + id + '"]');
  if (s.loaded && frame.contentWindow) frame.contentWindow.postMessage(slot.msg(value), '*');
  else load(id);
  syncTabs(id);
  if (push) writeURL();
}

/* ── iframe ───────────────────────────────────────────────────────── */
function load(id) {
  var frame = $('iframe[data-slot="' + id + '"]');
  var next = BY_ID[id].src(state[id]);
  if (frame.getAttribute('src') === next) return;
  state[id].loaded = false;
  frame.setAttribute('src', next);
}

function wireFrame(slot) {
  var frame = $('iframe[data-slot="' + slot.id + '"]');
  var host = slotEl(slot.id);
  var timer = setTimeout(function () {
    /* 没 load 事件 = 大概率 404 / 被挡。别把一片空白留给用户，说清是哪一条链接。 */
    if (!state[slot.id].loaded) host.dataset.broken = '1';
  }, 12000);
  frame.addEventListener('load', function () {
    clearTimeout(timer);
    state[slot.id].loaded = true;
    delete host.dataset.broken;
    dedupe(slot, frame);
  });
}

/* 同源时往格子里塞一条样式，按掉它重复报的名字（见 SLOTS[].dedupe）。
   跨源就够不着——静默跳过：多印一个标题不值得让整格出错。 */
function dedupe(slot, frame) {
  if (!slot.dedupe) return;
  try {
    var doc = frame.contentDocument;
    if (!doc || !doc.head || doc.getElementById('wb-dedupe')) return;
    var style = doc.createElement('style');
    style.id = 'wb-dedupe';
    style.textContent = slot.dedupe;
    doc.head.appendChild(style);
  } catch (err) { /* 跨源，放弃 */ }
}

/* ── 显隐 / 折叠 / 抽屉高度 ───────────────────────────────────────── */
function applySlotVisibility() {
  SLOTS.forEach(function (c) {
    var host = slotEl(c.id);
    var s = state[c.id];
    host.hidden = s.closed;
    if (s.folded) host.dataset.folded = '1'; else delete host.dataset.folded;
    var fold = host.querySelector('[data-act="fold"]');
    if (fold) fold.textContent = s.folded ? '展开' : '收起';
  });
  /* 抽屉不在场（关了或折了）时分隔条也没意义 */
  var dock = state.swimlane;
  $('#splitter').hidden = dock.closed || dock.folded || state.topology.closed;
  syncMenu();
}

function applyDockH() {
  document.getElementById('dock').style.setProperty('--dock-h', dockH + 'px');
}

/* 主题桥：一颗月亮同时管外壳和两格里的页面（与驾驶舱嵌进宿主时那套约定一样）。
   格子已经装载好就 postMessage 过去——重载一次要几百毫秒，还会把用户在里面
   选中的卡 / 事件清掉；没装载好的下一次 load 会从 src 的 ?theme= 带进去。 */
function applyShellTheme() {
  document.documentElement.setAttribute('data-theme', theme());
  $('#themeBtn').textContent = shellDark ? '☀' : '☾';
  SLOTS.forEach(function (slot) {
    var frame = $('iframe[data-slot="' + slot.id + '"]');
    if (state[slot.id] && state[slot.id].loaded && frame && frame.contentWindow) {
      frame.contentWindow.postMessage({ type: 'pto:state', theme: theme() }, '*');
    }
  });
}

/* ── 视图控制菜单 ─────────────────────────────────────────────────── */
function syncMenu() {
  Array.prototype.forEach.call(document.querySelectorAll('.menu-item[data-slot]'), function (item) {
    var s = state[item.dataset.slot];
    var on = item.dataset.menu === 'slot' ? !s.closed : !!s[item.dataset.menu];
    item.setAttribute('aria-checked', String(on));
  });
}

function wireMenu() {
  var menu = $('#viewMenu'), btn = $('#viewMenuBtn');
  btn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    var open = !menu.classList.contains('open');
    menu.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function (ev) {
    if (!menu.contains(ev.target)) { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
  });
  menu.addEventListener('click', function (ev) {
    var item = ev.target.closest('.menu-item');
    if (!item) return;
    var kind = item.dataset.menu;
    if (kind === 'reset') { location.href = location.pathname; return; }
    var id = item.dataset.slot;
    if (kind === 'slot') {
      state[id].closed = !state[id].closed;
      if (!state[id].closed) load(id);
      applySlotVisibility();
    } else {
      setOption(id, kind, !state[id][kind]);
    }
    writeURL();
  });
}

/* chrome（demo 自带的顶栏）是 CSS class，只能靠重载 ?embed= 切——如实标注：
   这一下会重载那一格，格子里的选中态会回到默认。 */
function setOption(id, kind, on) {
  state[id][kind] = on;
  var btn = slotEl(id).querySelector('[data-act="' + kind + '"]');
  if (btn) {
    btn.setAttribute('aria-pressed', String(on));
    btn.classList.toggle('on', on);
  }
  load(id);
  syncMenu();
}

/* ── 格头动作 ─────────────────────────────────────────────────────── */
function wireHead(slot) {
  slotEl(slot.id).querySelector('.slot-head').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.dataset.act;
    if (act === 'fold') { state[slot.id].folded = !state[slot.id].folded; applySlotVisibility(); }
    else if (act === 'close') { state[slot.id].closed = true; applySlotVisibility(); }
    else { setOption(slot.id, act, !state[slot.id][act]); }
    writeURL();
  });
}

/* ── 分隔条 ───────────────────────────────────────────────────────── */
/* 监听挂在 window 上而不是分隔条上：指针一旦滑进 iframe，事件就归 iframe 的
   文档了，挂在元素上的 pointermove 会断（setPointerCapture 跨文档也不成立）。
   拖动期间给 body 打 .is-resizing，把 iframe 的 pointer-events 关掉。 */
function wireSplitter() {
  var grip = $('#splitter');
  grip.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    var startY = ev.clientY, startH = dockH;
    document.body.classList.add('is-resizing');
    function move(e) {
      /* 往下拖 = 抽屉变矮，所以是 startY - clientY；上限留 180px 给舞台 */
      var max = Math.max(160, window.innerHeight - 180);
      dockH = Math.max(120, Math.min(max, Math.round(startH - (e.clientY - startY))));
      applyDockH();
    }
    function up() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      document.body.classList.remove('is-resizing');
      writeURL();
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

/* ── 回灌：格子里自己换了视图/范围，段控要跟上 ───────────────────── */
window.addEventListener('message', function (ev) {
  var d = ev && ev.data;
  if (!d || (d.type !== 'pto:state-ack' && d.type !== 'pto:select')) return;
  SLOTS.forEach(function (c) {
    var frame = $('iframe[data-slot="' + c.id + '"]');
    if (!frame || frame.contentWindow !== ev.source) return;
    var v = d.view || d.range;
    if (v && v !== state[c.id].value && c.tabs.some(function (t) { return t.v === v; })) {
      state[c.id].value = v;
      syncTabs(c.id);
      writeURL();
    }
  });
});

/* ── 起步 ─────────────────────────────────────────────────────────── */
readURL();
document.documentElement.setAttribute('data-theme', theme());  /* 首帧就落主题，别闪 */
applyDockH();
SLOTS.forEach(function (slot) {
  buildTabs(slot);
  syncTabs(slot.id);
  wireFrame(slot);
  wireHead(slot);
  var btn = slotEl(slot.id).querySelector('[data-act="chrome"]');
  if (btn) {
    btn.setAttribute('aria-pressed', String(!!state[slot.id].chrome));
    btn.classList.toggle('on', !!state[slot.id].chrome);
  }
  load(slot.id);
});
applySlotVisibility();
applyShellTheme();
wireMenu();
wireSplitter();

$('#themeBtn').addEventListener('click', function () {
  shellDark = !shellDark;
  applyShellTheme();
  writeURL();
});
})();
</script>
</body>
</html>
