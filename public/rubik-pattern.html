<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>逻辑魔方 Pattern · TP×PP×DP=rank · EP 折入 DP（默认 128 卡 2·4·16·8）</title>
<link rel="icon" type="image/svg+xml" href="./vendor/rubik-cube/favicon.svg">
<script src="./vendor/three-r128.min.js"></script>
<!-- PTO Design System：唯一 token/类实现入口（上游快照，见 vendor/pto-design-system/README.md） -->
<link rel="stylesheet" href="./vendor/pto-design-system/styles.css">
<link rel="stylesheet" href="./vendor/rubik-cube/pattern.css">
<script src="./vendor/rubik-cube/pattern.js"></script>
<style>
  /* 页面外壳：只做布局，视觉一律取自设计系统 token */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--background); }
  #app { width: 100%; height: 100%; }
  /* 主题按钮由 pattern 的工具插槽收纳（见下方 mount 后的 appendChild）；
     插槽不存在时（旧版 pattern）退回右上角绝对定位。 */
  #themeBtn.is-floating { position: absolute; top: var(--space-3); right: var(--space-3); z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<button id="themeBtn" class="btn btn-sm prc-iconbtn" type="button" aria-label="切换明暗主题"></button>
<script>
/* 逻辑魔方 pattern 的独立迭代页：全屏挂载，主题支持 ?theme= 初始值与宿主 postMessage 联动
   （与 cube-cockpit.html 同一套约定，之后可被宿主以 iframe 嵌入）。 */
(function(){
  /* ── URL 即状态：链接本身就能带着一个具体视图发出去 ─────────────────────
     ?theme=light|dark
     ?mode=std|dp|ep|tp|pp（或 0-4）      形态
     ?view=3d|top|front|side（或 0-3）    视角
     ?tp= &pp= &dp= &ep=                  并行度（四个都给才重建）
     ?color=load|tp|pp|dp|ep|host|pod     着色镜头
     ?anom=none|tp|pp|dp|ep               异常注入
     ?phase=TP|PP|EP|DP  或 ?t=0..1       时间轴位置
     ?play=0|1                            是否自动播放
     ?sel=<rank>                          直接选中某张卡
     ?v=<任意串>                          版本戳，仅用于跳过缓存，页面忽略它
     不认识的参数一律忽略；参数非法时退回默认值，不报错。 */
  var qs = new URLSearchParams(location.search);
  var theme = qs.get('theme') === 'dark' ? 'dark' : 'light';   // 默认浅色
  var num = function(k){ var v = parseInt(qs.get(k), 10); return isFinite(v) && v > 0 ? v : null; };
  var pick = function(k, map, dflt){
    var v = (qs.get(k) || '').toLowerCase();
    if (v === '') return dflt;
    if (map[v] != null) return map[v];
    var n = parseInt(v, 10);
    return isFinite(n) ? n : dflt;
  };
  var MODES = { std: 0, standard: 0, dp: 1, dpt: 1, ep: 2, tp: 3, tps: 3, pp: 4, ppf: 4 };
  var VIEWS = { '3d': 0, iso: 0, top: 1, front: 2, side: 3 };
  var cfg = { tp: 2, pp: 4, dp: 16, ep: 8 };   // 默认 = 128 卡小规格（看得清每一张卡）
  ['tp', 'pp', 'dp', 'ep'].forEach(function(k){ if (num(k)) cfg[k] = num(k); });

  var handle = window.PtoRubikCubePattern.mount(document.getElementById('app'), {
    theme: theme,
    mode: pick('mode', MODES, 4),        // 落地 = PP流水（能直接读出「哪一段慢」；标准是基准投影，排在最后）
    // 全局字牌字号（?label=16）：整套 3D 标注只此一个入口，越界回落 16
    labelPx: num('label'),
    // 并行度配置（默认值，工具栏「并行」输入排可随时改）：128 卡小规格
    // rank = tp×pp×dp = 2×4×16 = 128（EP 不参与乘法，折入 DP 轴：ep8 把 16 副本
    // 分成 8 桶 × 2 个 A2A 域）。落地这一档是因为每张卡看得清、每一段数得出，
    // 四种形态的差别当场成立；真实体量用工具栏的「盘古ProMoE 8·5·100·2」预设。
    config: cfg,
    onSelect: function(sel){
      // 联动挂点：选中 rank 的多维身份回报宿主（整网图/专家图结合时使用）
      try { parent.postMessage({ type: 'rubik-select', sel: sel }, '*'); } catch(e) {}
    },
    onSelectEdge: function(edge){
      // 联动挂点：点中一条通信边 → 谁到谁、哪一维、哪种原语、跨了哪层物理链路。
      // 驾驶舱可据此点亮自己那套物理路径（本 pattern 不搬运物理拓扑几何）。
      try { parent.postMessage({ type: 'rubik-edge', edge: edge }, '*'); } catch(e) {}
    },
  });
  window.rubik = handle;   // 控制台可直接迭代调试：rubik.setMode(2) / rubik.selectBucket(3) …

  // 把余下的 URL 参数落到句柄上（mount 之后依次应用，非法值由各 setter 自行忽略）
  var view = pick('view', VIEWS, null);
  if (view != null) handle.setView(view);
  if (qs.get('color')) handle.setColorBy(qs.get('color').toLowerCase());
  if (qs.get('anom')) handle.setAnomaly(qs.get('anom').toLowerCase());
  if (qs.get('phase')) handle.setTime({ phase: qs.get('phase').toUpperCase() });
  else if (qs.get('t') != null) handle.setTime(parseFloat(qs.get('t')));
  if (qs.get('play') != null) handle.setPlaying(qs.get('play') !== '0' && qs.get('play') !== 'false');
  if (qs.get('sel') != null) {
    var r = parseInt(qs.get('sel'), 10);
    if (isFinite(r) && r >= 0 && r < handle.model.N) handle.select(r);
  }

  // 把主题按钮放进 pattern 顶栏的工具插槽，和「更多」等按钮成套
  var slot = document.querySelector('.prc-toolslot');
  var themeBtn = document.getElementById('themeBtn');
  if (slot) slot.appendChild(themeBtn); else themeBtn.classList.add('is-floating');

  // Lucide 风格线性图标（stroke=currentColor · 24×24 viewBox · stroke-width 2），不用 emoji
  var ICON_SUN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function applyTheme(t){
    theme = t === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);   // token 随之切换，按钮/底色走 CSS 变量
    var tb = document.getElementById('themeBtn');
    tb.innerHTML = (theme === 'light' ? ICON_MOON : ICON_SUN);   // 只要图标，不要文字
    tb.title = theme === 'light' ? '切换到深色' : '切换到浅色';
    tb.setAttribute('aria-label', tb.title);
    handle.setTheme(theme);
  }
  applyTheme(theme);
  document.getElementById('themeBtn').addEventListener('click', function(){
    applyTheme(theme === 'light' ? 'dark' : 'light');
  });
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'rubik-theme' || d.type === 'cockpit-theme') applyTheme(d.theme);
    if (d.type === 'rubik-cmd'){                   // 宿主 → pattern 指令桥（与 cockpit-cmd 同思路）
      if (d.cmd === 'mode') handle.setMode(d.value|0);
      else if (d.cmd === 'layer') handle.selectLayer(d.value == null ? null : d.value|0);
      else if (d.cmd === 'bucket') handle.selectBucket(d.value == null ? null : d.value|0);
      else if (d.cmd === 'anom') handle.setAnomaly(d.value || 'none');
      else if (d.cmd === 'time') handle.setTime(d.value);
    }
  });
})();
</script>
</body>
</html>
