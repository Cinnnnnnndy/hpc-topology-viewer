      if(hasSel) body.push(fsTxt((sxa+sxb)/2, y0 - 2, 'rank '+g+' 在这一段', 6.4, VC.dp, 'middle',
        'font-weight="800" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.4"'));
    }
    var rackTop = y1 + ANN + 22;               /* 训练轨块占掉了条带正下方，卡架顺移到它下面 */
    var CCr = D.cp, colsR = D.dp * D.cp, rowsR = D.tp;
    body.push(fsTxt(x0 - 8, rackTop + 8, '卡架', 6.2, 'var(--pt-fg2)', 'end', 'font-weight="800"'));
    for(var stR = 0; stR < D.pp; stR++){
      var rxa = xOf(stR*lps), rxb = xOf(Math.min(L-1, (stR+1)*lps - 1)) + colW;
      var dw = Math.min(9, (rxb - rxa - 4) / colsR - 1.4);
      var dh = Math.min(8, (BM - ANN - 44) / rowsR - 1.4);
      if(dw < 2 || dh < 2){
        fsPill(body, hit, (rxa+rxb)/2, rackTop + 10, 'PP'+stR+' · ×'+fmt(D.world/D.pp)+' 卡', VC.pp, stR === selStage, ['p', stR], 6.2);
        continue;
      }
      var rgx = rxa + ((rxb - rxa) - colsR*(dw+1.4))/2;
      for(var rr9 = 0; rr9 < rowsR; rr9++) for(var cc9 = 0; cc9 < colsR; cc9++){
        var dR = Math.floor(cc9 / CCr), cR = cc9 % CCr;
        var rk9 = rankOf(rr9, cR, dR, stR, D);
        var onR = hasSel && rk9 === g;
        body.push('<rect x="'+(rgx + cc9*(dw+1.4)).toFixed(1)+'" y="'+(rackTop + rr9*(dh+1.4)).toFixed(1)
          +'" width="'+dw.toFixed(1)+'" height="'+dh.toFixed(1)+'" rx="1.4" style="fill:'
          +(onR ? VC.dp : mix(VC.dp, stR === selStage ? 20 : 8))+';stroke:'+VC.dp+';stroke-width:'+((onR?1.2:.35)/FS_Z).toFixed(2)+'"/>');
        hit.push('<rect x="'+(rgx + cc9*(dw+1.4) - .7).toFixed(1)+'" y="'+(rackTop + rr9*(dh+1.4) - .7).toFixed(1)
          +'" width="'+(dw+1.4).toFixed(1)+'" height="'+(dh+1.4).toFixed(1)+'" style="fill:transparent;cursor:pointer" '
          +'data-act="chainpick" data-k="card" data-i="'+rk9+'"><title>r'+rk9+' · TP'+rr9+'·CP'+cR+'·DP'+dR+'·PP'+stR+'</title></rect>');
      }
      if(rowsR > 1 && stR === 0){
        body.push(fsTxt(rgx - 4, rackTop + dh/2 + 2, 'TP·SP0', 4.9, VC.tp, 'end'));
        body.push(fsTxt(rgx - 4, rackTop + (rowsR-1)*(dh+1.4) + dh/2 + 2, 'TP·SP'+(rowsR-1), 4.9, VC.tp, 'end'));
      }
    }
  }
  var CID = 'ssClip';
  var wrapped = '<defs>'+hatchDefsSVG(FS_Z)+'<clipPath id="'+CID+'"><rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'"/></clipPath></defs>'
    + '<g clip-path="url(#'+CID+')">' + body.join('') + '</g>';
  var hitWrapped = '<g clip-path="url(#'+CID+')">'+hit.join('')+'</g>';
  /* 展开某一层：不是浮一张卡盖在原图上（那样背景只是被蒙暗，没有真的让位）。
     把 wrapped/hitWrapped 原样再画两份，各裁一半（以这一层原来的位置为界，
     左半/右半分别向左右边缘挤扁），中间腾出来的缝就是这一层的真图——效果接近
     pto-training-sidecar 那套「点一层、镜头推近、两边让位」的弹簧相机，但这里
     没有相机可推，改用等比挤压 + 裁剪，代价是被挤扁那半区的字会跟着缩小、
     命中面索性整片关掉（挤扁之后不该再让人在那儿点算子），只留「点哪儿都能收起」。 */
  if(ui.openLayer !== null && ui.openLayer !== undefined){
    var openLiSq = clamp(Math.floor(+ui.openLayer), 0, L-1);
    var centerXSq = xOf(openLiSq) + colW/2;
    var lyo = layerDetailOverlay(D, box, centerXSq);
    var gx0 = lyo.CX, gx1 = lyo.CX + lyo.CW;
    var clipY0 = box.y - 40, clipH = box.h + 80;
    var origLx0 = box.x, origLx1 = xOf(openLiSq);
    var origRx0 = xOf(openLiSq) + colW, origRx1 = box.x + box.w;
    var lSc = (gx0 - box.x) / Math.max(1, origLx1 - origLx0);
    var lTx = box.x - lSc*box.x;
    var rSc = ((box.x+box.w) - gx1) / Math.max(1, origRx1 - origRx0);
    var rTx = (box.x+box.w) - rSc*(box.x+box.w);
    var sqParts = [];
    sqParts.push('<defs><clipPath id="ssSqL"><rect x="'+origLx0.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,origLx1-origLx0).toFixed(1)+'" height="'+clipH.toFixed(1)+'"/></clipPath>'
      +'<clipPath id="ssSqR"><rect x="'+origRx0.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,origRx1-origRx0).toFixed(1)+'" height="'+clipH.toFixed(1)+'"/></clipPath></defs>');
    sqParts.push('<g clip-path="url(#ssSqL)" transform="translate('+lTx.toFixed(2)+',0) scale('+lSc.toFixed(4)+',1)">'+wrapped+'</g>');
    sqParts.push('<g clip-path="url(#ssSqR)" transform="translate('+rTx.toFixed(2)+',0) scale('+rSc.toFixed(4)+',1)">'+wrapped+'</g>');
    /* 字号不跟着横向挤压缩小（只挤了 x，没挤 y），窄下去之后同一批字挤在一起
       糊成一片——横向挤压表达的是「这些层还在、往边上让位」，不是拿来读的，
       补一层半透明蒙版把这团糊字压暗，读成「让开的背景」而不是「画错了」。 */
    sqParts.push('<rect x="'+origLx0.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,gx0-origLx0).toFixed(1)+'" height="'+clipH.toFixed(1)
      +'" style="fill:var(--pt-bg);opacity:.62;pointer-events:none"/>');
    sqParts.push('<rect x="'+gx1.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,(box.x+box.w)-gx1).toFixed(1)+'" height="'+clipH.toFixed(1)
      +'" style="fill:var(--pt-bg);opacity:.62;pointer-events:none"/>');
    /* 挤扁那两半不留命中面（缩过的算子点不准，也不该点）——只留「点这两片
       随便哪儿都收起这一层」，跟卡片自己的关闭钮、Esc 三条路殊途同归。 */
    var sqHit = '<rect x="'+origLx0.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,gx0-origLx0).toFixed(1)+'" height="'+clipH.toFixed(1)
      +'" style="fill:transparent;cursor:pointer" data-act="layerclose"/>'
      + '<rect x="'+gx1.toFixed(1)+'" y="'+clipY0.toFixed(1)+'" width="'+Math.max(0,(box.x+box.w)-gx1).toFixed(1)+'" height="'+clipH.toFixed(1)
      +'" style="fill:transparent;cursor:pointer" data-act="layerclose"/>';
    return {body:sqParts.join(''), hit:sqHit,
            fixed:lyo.fixed, fixedHit:lyo.fixedHit,
            nodes:0, sawn:0, whole:0, step:0, steps:[], zoom:false,
            cut:{dp:cutDP, pp:cutPP, cp:cutCP, tp:cutTP, ep:cutEP}, note:''};
  }
  return {body:wrapped, hit:hitWrapped,
          fixed:'', fixedHit:'',
          nodes:0, sawn:0, whole:0, step:0, steps:[], zoom:false,
          cut:{dp:cutDP, pp:cutPP, cp:cutCP, tp:cutTP, ep:cutEP}, note:''};
}
/* 侧视点开某一层的「展开」：真图的真节点 · 真层级 · 真连边（与「story」第2幕
   放大一层、正视卡片同一个 graphSVG，读数按点开的那一层算，不是代表层）。
   钉在 fixedLayer（render() 里那个不吃手势 transform 的 <g>）——这样它自己的
   缩放/字号不跟着 zoom3 走，读数字号不用重新对一遍 FS_Z 那一套。

      + '<div class="opts" style="margin:4px 3px">' + dimP.opts.map(function(o){
          return '<button data-act="qdim" data-v="'+o+'" style="--c:'
            + (o==='sp'?VC.tp:VC[o])+'">'+o.toUpperCase()+'</button>';
        }).join('') + '</div>'
      + '</div>';
  } else if(ui.qOpen && ui.qOpen.indexOf('dim:')===0){
    var dimN = ui.qOpen.slice(4), dimBase = dimN==='sp'?'tp':dimN;
    var dimSz = dimBase==='ep'?D.ep:D[dimBase];
    pane9 = '<div class="pt-pmenu">'
      + '<div class="hd">'+dimN.toUpperCase()+' · 哪一组（共 '+dimSz+' 组）</div>'
      + '<input type="number" min="0" max="'+(dimSz-1)+'" id="qVal" data-k="dim:'+dimN+'" placeholder="组号 0–'+(dimSz-1)+'，留空选当前卡的组" autofocus>'
      + '<div class="tip">填好按 Enter，留空则跟随选中卡</div>'
      + '</div>';
  } else if(ui.qOpen){
    var p9 = propOf(ui.qOpen);
    if(p9){
      var maxV9 = p9.k==='layer'?(D.layers-1):p9.k==='rank'?(D.world-1):0;
      pane9 = '<div class="pt-pmenu">'
        + '<div class="hd">'+esc(p9.n)+' · '+esc(p9.hint)+'</div>'
        + '<input type="number" min="0" max="'+maxV9+'" id="qVal" data-k="'+p9.k+'" placeholder="0–'+maxV9+'" autofocus>'
        + '<div class="tip">填好按 Enter</div>'
        + '</div>';
    }
  }
  var revBtn = '<span class="pt-psearch'+(ui.qOpen?' is-open':'')+'">'
    + chipHTML
    + '<button class="pt-padd'+(ui.chips.length?'':' is-empty')+'" data-act="qopen"'
    + ' title="属性搜索：先选属性，再填值，落成一枚标签；标签可以并存">'
    + (ui.chips.length ? '＋' : '＋ 搜索') + '</button>'
    + (ui.chips.length ? '<button class="pt-pclr" data-act="revclear" title="清空全部条件">×</button>' : '')
    + pane9 + '</span>';
  /* 两颗模式开关用**开关组件**：它们是二元状态（开着 / 关着），不是筛选器也不是
     动作按钮。写成「关闭 Rank」这种动作名，按钮上说的是「按下去会发生什么」，
     读者得先反推现在是什么状态；开关把状态直接摆在那儿，名字只说这是什么。
     也不上颜色——颜色在这一屏是有含义的（每种刀一个色），模式开关借用会串味。 */
  function swBtn(act, name, on, tip){
    return '<button class="pt-sw'+(on?' is-on':'')+'" data-act="'+act+'" title="'+esc(tip)+'">'
      + '<i></i>'+esc(name)+'</button>';
  }
  var cBtn = swBtn('cardmode', 'Rank', ui.cardMode,
        ui.cardMode ? '关掉：退回整网切分场景' : '打开：把四刀交集收进一张卡，只看这张卡真正持有的那份')
    /* 「整网 / 容量」是**同一只卡壳的两种看法**，本来就互斥：壳里要么装算子（这张卡
       持有模型的哪一块），要么装字节（这张卡的显存装到什么程度）。两个填充不可能叠。
       原来做成两个独立开关，于是存在「两个都关」这种谁也答不上来的状态（空壳），
       而且读者得先想清楚它们的先后依赖。改成二选一的段控，状态就只剩两个，
       名字直接说这一屏在回答哪一问。 */
    + (ui.cardMode ? '<span class="pt-seg">'
        + '<button'+(ui.netOff?' class="is-on"':'')+' data-act="cardview" data-v="cap">容量</button>'
        + '<button'+(!ui.netOff?' class="is-on"':'')+' data-act="cardview" data-v="net">整网</button>'
        + '</span>' : '');
  /* 「当前路径」那条读数去掉了——同一组坐标场景里已经用高亮标出来了（实心的
     那一份就是它），再抄一遍文字只是占着画布右上角。 */
  /* 关掉整网之后画面整屏交给魔方，它自带一整套控制（着色维度 PP/TP/EP/DP/标准、
     视角 3D/前 PP-TP 面/顶 DP-PP 面）。我们这排刀开关和视角 tab 跟它讲的是同一
     件事、按钮却各按各的，留着就是两套打架的控件——只留进出这个模式的开关。 */
  /* 排序按「这一屏在讲什么」由粗到细：先定模式（Rank / 整网），再定切法（四把刀），
     再定机位（3D / 正视 / 侧视 / 顶视），最后才是叠在图上的注解层（图例 / 通信 / 数据）。 */
  $('stagebar').innerHTML = cBtn + kBtns + vBtns + lBtns + mvBtn + dispBtn;
  /* 搜索走中间那个容器，不进右侧工具条 */
  var qb = $('qbar');
  if(qb){ qb.innerHTML = revBtn; qb.hidden = false; }
  renderLegend(D);
  renderRevBar(D);
  requestAnimationFrame(layoutQBar);
}

function renderDimBar(D, dim){
  var size = {tp:D.tp, pp:D.pp, cp:D.cp, dp:D.dp, ep:D.ep}[dim] || 1, col2 = VC[dim];
  /* 每个维的「动词」——切的动作本质不同，先用一句话钉住，再由几何呈现 */
  var VERB = {tp:'锯开算子（同一算子 → N 片）', pp:'层的接力（一段传一段，有序）', cp:'切输入序列（首尾对称双段）', dp:'整套复印（模型不动，切样本）', ep:'专家分桶 + 按 token 路由'};
  /* 按嵌套序组织（与刀序·切分链同一根轴）：模型侧 刀1 DP → 刀2 PP → 刀3 TP → 刀4 EP；输入侧 CP。
     角标 = 决策顺位（§11），与嵌套序反向。 */
  var NEST_M = [['dp','⑤'],['pp','②'],['tp','①'],['ep','④']], NEST_I = [['cp','③']];
  function pill(dm, ord, k){
    return '<button class="pb mono'+(dim===dm?' is-on':'')+'" data-act="cutdim" data-d="'+dm+'" style="--c:'+VC[dm]+'" title="嵌套第'+k+'刀 · 决策顺位'+ord+'">'
      + '刀'+k+'·'+DIMN[dm]+'<span class="cmn">'+ord+'</span></button>';
  }
  var sb = '<span class="pt-cap">按嵌套序看刀（角标=决策顺位）</span>'
    + NEST_M.map(function(nm,i){ return pill(nm[0], nm[1], i+1); }).join('')
    + '<span class="pt-sep"></span><span class="pt-cap">输入侧</span>' + pill('cp','③','—')
    + '<span class="pt-chip" style="border-color:'+col2+';color:'+col2+';font-weight:800">'+DIMN[dim]+' = '+VERB[dim]+'</span>';
  /* 刀序带：前面的刀已切（把视野缩到本组），本刀在切，后面的刀待切——
     取代旧「折叠上下文」：固定坐标不是任意折叠，是前序刀的选择 */
  var CUTS = {dp:D.dp, pp:D.pp, tp:D.tp, ep:(D.moe?D.ep:1), cp:D.cp};
  var PICK = {dp:'副本0', pp:'stage0', tp:'片0', ep:'桶0', cp:'段0∪'+(2*D.cp-1)};
  var seq = dim==='cp' ? ['dp','cp'] : ['dp','pp','tp','ep'];
  var cur = seq.indexOf(dim);
  var strip = seq.map(function(dm, i){
    var n2 = CUTS[dm], st;
    if(n2<=1) st = '<s style="opacity:.6">未开</s>';
    else if(i<cur) st = '已切→'+PICK[dm];
    else if(i===cur) st = '<b>本刀 ×'+n2+'</b>';
    else st = '待切 ×'+n2;
    var hot = i===cur;
    return '<span class="pt-chip" style="'+(hot?'border-color:'+VC[dm]+';color:'+VC[dm]+';font-weight:800':'')+'">'+DIMN[dm]+' '+st+'</span>';
  }).join('<span style="color:var(--pt-fg3);font-size:10px">▸</span>');
  sb += '<span class="pt-sep"></span><span class="pt-cap">'+(dim==='cp'?'输入链':'模型链')+'</span>' + strip
     + (size>1 ? '<span class="pt-chip">本刀组：全网 '+fmt(D.world)+' 卡 = '+fmt(Math.round(D.world/size))+' 组 × '+size+'</span>' : '');
  if(dim==='cp' && D.cp>1){
    sb += '<span class="pt-sep"></span><span class="pt-cap">原语（N:M 可换，A1）</span>'
      + [['p2p','Ring'],['alltoall','Ulysses'],['allgather','朴素']].map(function(pr){
          var on = (ui.commPrim===pr[0]) || (['p2p','alltoall','allgather'].indexOf(ui.commPrim)<0 && pr[0]==='p2p');
          return '<button class="pb mono'+(on?' is-on':'')+'" data-act="commprim" data-p="'+pr[0]+'" style="--c:'+VC.cp+'">'+pr[1]+'</button>';
        }).join('');
  }
  sb += '<span class="pt-chip">柱=卡（容器）· 块的横跨=共有 · 门牌=rank（1:N，同一张卡在别的维还有别的号 §10）</span>';
  $('stagebar').innerHTML = sb;
}

/* ═════════ V1 卡阵 ═════════ */
var GEO = {w:.78, d:.78, h:.16};
function v1Layout(D){
  var dpShown;
  /* 全量优先，但只在**画得动的规模**上：默认 128 卡那套全部画出；
     盘古 4000 卡不默认全量渲染（4000 个实例要 4s+），要看全量点「全部画出」。
     ui.unfoldSet 记住用户是否显式表过态——表过就听他的，不要偷偷替他折叠。 */
  var big = D.tp*D.dp*D.pp > 1000;
  if(ui.unfold && (!big || ui.unfoldSet)){ dpShown = D.dp; }
  else{
    dpShown = Math.min(D.dp, Math.floor(88/D.pp - D.tp - 1.1));
    dpShown = Math.max(Math.min(D.dp,2), Math.min(dpShown, Math.max(1, Math.floor(1600/(D.tp*D.pp)))));
    if(!isFinite(dpShown) || dpShown<1) dpShown = 1;
  }
  var ypitch = (D.tp+dpShown)*S + 0.55 + GEO.h;
  return {dpShown:dpShown, folded:dpShown<D.dp, ypitch:ypitch, scale:30};
}
function yawXZ(x,z,X,Z){
  switch(ui.yaw & 3){
    case 1: return [z, X-x];
    case 2: return [X-x, Z-z];
    case 3: return [Z-z, x];
    default: return [x, z];
  }
}
function cardAnchor(t,d,p,D,LY){
  var xz = yawXZ(t+.5, d+.5, D.tp, LY.dpShown);
  return proj(xz[0], p*LY.ypitch+GEO.h, xz[1], LY.scale);
}
function renderV1(D){
  var LY = v1Layout(D), TPn=D.tp, DPn=LY.dpShown, PPn=D.pp, s=LY.scale, ypitch=LY.ypitch;
  var facet = clamp(ui.cpFacet, 0, D.cp-1); ui.cpFacet = facet;
  var Xe = (ui.yaw%2)?DPn:TPn, Ze=(ui.yaw%2)?TPn:DPn;
  var yMax = (PPn-1)*ypitch + GEO.h + .55, pad=26;
  var vb = [(-Ze*C-1)*s-pad-56, -yMax*s-pad-16, ((Xe+Ze)*C+3.1)*s+2*pad+56, (yMax+(Xe+Ze)*S)*s+2*pad+20];

  var showLabel = layerOn('L4') && TPn*DPn*PPn <= 480;
  var L3 = layerOn('L3'), L2 = layerOn('L2'), commActive = layerOn('L5');
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, facet, 0, 0, D);
  var spot = spotlightHit(D);
  var axisSet = {};
  if(!spot && layerOn('L4') && ui.axis) groupMembers(ui.axis, refG, D).forEach(function(r){ axisSet[r]=1; });
  var maxB = 1, pi;
  if(L2) for(pi=0;pi<PPn;pi++) maxB = Math.max(maxB, 2*paramsPerCard(D,pi));

  var boxes=[],p,d,t;
  for(p=0;p<PPn;p++) for(d=0;d<DPn;d++) for(t=0;t<TPn;t++){
    var xz = yawXZ(t+(1-GEO.w)/2, d+(1-GEO.d)/2, TPn, DPn);
    boxes.push({t:t,d:d,p:p,g:rankOf(t,facet,d,p,D), x:xz[0], z:xz[1]});
  }
  boxes.sort(function(a,b){ return (a.x+a.z+a.p*999)-(b.x+b.z+b.p*999); });

  var cells='';
  boxes.forEach(function(b){
    var y0 = b.p*ypitch, isSel = sel===b.g, inAxis = axisSet[b.g];
    var spotHit = spot && spot.ranks[b.g];
    var spotMiss = spot && !spotHit;
    var st = 'var(--pt-bds)', sw = .9, topFill = '';
    if(spotHit){ st = VC.dp; sw = 1.6; topFill = mix(VC.dp, 16); }
    else if(inAxis){ st = VC[ui.axis]; topFill = mix(VC[ui.axis], 16); }
    if(isSel && !spot){ st = 'var(--pt-fg)'; sw = 2; }
    var inner = '';
    if(L2){
      var share = (2*paramsPerCard(D,b.p))/maxB;
      var ih = GEO.h*.9*share, iw = GEO.w*.58, idp = GEO.d*.58;
      inner = boxSVG(b.x+(GEO.w-iw)/2, y0+GEO.h, b.z+(GEO.d-idp)/2, iw, ih, idp, s, {fill:'var(--pt-fg2)', stroke:'transparent', attrs:' pointer-events="none"'});
    }
    var lbl = showLabel ? txt.apply(null, (function(){ var c2 = proj(b.x+GEO.w/2, y0+GEO.h, b.z+GEO.d/2, s); return [c2[0], c2[1]+3.2, b.g, clamp(s*.34,7.5,11), spotHit||inAxis||isSel?'var(--pt-fg)':'var(--pt-fg2)', 'middle', 'pointer-events="none" font-weight="600"']; })()) : '';
    var cardOp = spotMiss ? 0.10 : (L3 ? 1 : .16);
    cells += '<g class="cardg" data-g="'+b.g+'" style="cursor:pointer;opacity:'+cardOp+(spotMiss?';filter:saturate(.25)':'')+'">'
      + boxSVG(b.x, y0, b.z, GEO.w, GEO.h, GEO.d, s, {stroke:st, sw:sw, topFill:topFill, inner:inner})
      + lbl + '</g>';
  });
  /* stage 标注（L4：文字门牌） */
  if(layerOn('L4')){
    for(var ps=0;ps<PPn;ps++){
      var lp = proj(Xe, ps*ypitch+GEO.h, 0, s);
      cells += txt(lp[0]+10, lp[1]+4, 'stage '+ps, 10.5, VC.pp, 'start', 'font-weight="700"')
             + txt(lp[0]+10, lp[1]+16, 'L'+(ps*D.layersPerStage)+'–L'+((ps+1)*D.layersPerStage-1), 9, 'var(--pt-fg3)', 'start');
    }
  }
  /* 轴箭头 */
  var uT = yawXZ(1,0,TPn,DPn), o = yawXZ(0,0,TPn,DPn), uD = yawXZ(0,1,TPn,DPn), ax='';
  function arrow(dim, a, b, label, dy){
    var A = proj(a[0],a[1],a[2],s), B2 = proj(b[0],b[1],b[2],s);
    return '<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B2[0]+'" y2="'+B2[1]+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>'
      + txt(B2[0], B2[1]+dy, label, 11, VC[dim], 'middle', 'font-weight="700"');
  }
  ax += arrow('tp', [o[0],-.55,o[1]], [o[0]+(uT[0]-o[0])*Math.min(TPn,3), -.55, o[1]+(uT[1]-o[1])*Math.min(TPn,3)], 'TP', 14);
  ax += arrow('dp', [o[0],-.55,o[1]], [o[0]+(uD[0]-o[0])*Math.min(DPn,3), -.55, o[1]+(uD[1]-o[1])*Math.min(DPn,3)], 'DP', 14);
  var ppx = (-Ze*C-.6)*s;
  ax += '<line x1="'+ppx+'" y1="0" x2="'+ppx+'" y2="'+(-((PPn-1)*ypitch+.6)*s)+'" style="stroke:'+VC.pp+';stroke-width:1.6;marker-end:url(#arrpp)"/>'
      + txt(ppx, -((PPn-1)*ypitch+.9)*s, 'PP↑', 11, VC.pp, 'middle', 'font-weight="700"');

  /* L5 通信 */
  var comm='';
  if(commActive && ui.commDim!=='cp'){
    var mem = groupMembers(ui.commDim, refG, D).filter(function(r){
      var c2 = coordsOf(r,D); return c2.c===facet && c2.d<DPn;
    });
    var pts = mem.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t,c2.d,c2.p,D,LY); });
    comm = '<g opacity=".95">'+edgeSVG(pts, ui.commPrim, VC[ui.commDim], {mid:ui.commDim})+'</g>';
  }
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'
    + defsSVG() + '<g>'+cells+'</g><g id="commLayer">'+comm+'</g><g id="animLayer"></g><g pointer-events="none">'+ax+'</g></svg>';

  /* 舞台工具条 */
  var sb = '';
  sb += '<span class="pt-cap">CP 分面</span>';
  if(D.cp===1) sb += '<span class="pt-chip">CP=1 无分面</span>';
  else for(var ci=0; ci<D.cp; ci++) sb += '<button class="pb mono" data-act="facet" data-i="'+ci+'" style="--c:'+VC.cp+'"'+(facet===ci?' aria-pressed="true" ':'')+(facet===ci?' class="pb mono is-on"':'')+'>'+(facet===ci?'cp'+ci:'cp'+ci)+'</button>';
  sb += '<span class="pt-sep"></span><button class="pb" data-act="yaw" data-d="-1">⟲</button><button class="pb" data-act="yaw" data-d="1">⟳</button>'
      + (ui.yaw!==0?'<button class="pb" data-act="yawreset">复位等轴测</button>':'')
      + '<span class="pt-sep"></span><button class="pb'+(anim.on?' is-on':'')+'" data-act="anim">'+(anim.on?'■ 停止':'▶ 播放一个训练步')+'</button>';
  $('stagebar').innerHTML = sb;
  fixFacetButtons(facet);

  /* 折叠提示 */
  var LYf = LY.folded;
  if(LYf || (ui.unfold && D.dp*D.tp*D.pp>1600)){
    $('stageNote').hidden = false;
    $('stageNote').innerHTML = LYf
      ? (D.tp*D.dp*D.pp>1000
          ? '这套配置 '+fmt(D.tp*D.dp*D.pp)+' 个实例，默认不全量渲染（要几秒）——先画前 '+DPn+' 个 DP 副本。DP 是对称维，看一组等于看全部（DP-3）。<button class="pb" data-act="unfold">仍要全部画出</button>'
          : 'DP='+D.dp+' 为对称维，只画前 '+DPn+' 个副本——看一个组等于看全部（DP-3/DP-5）。<button class="pb" data-act="unfold">全部画出</button>')
      : fmt(D.tp*DPn*D.pp)+' 张卡全量渲染中。<button class="pb" data-act="refold">恢复折叠</button>';
  }else{ $('stageNote').hidden = true; }

  /* 抽离图（R2；CP 组唯一入口） */
  if(commActive && (ui.detach || ui.commDim==='cp')){
    $('detach').hidden = false;
    $('detach').innerHTML = detachHTML(D, refG);
  }else{ $('detach').hidden = true; }
}
function fixFacetButtons(facet){ /* 简化 is-on 写法（字符串拼接里难做干净） */
  var btns = document.querySelectorAll('[data-act="facet"]');
  btns.forEach(function(b){ b.classList.toggle('is-on', +b.getAttribute('data-i')===facet); });
}
function detachHTML(D, refG){
  var dim = ui.commDim, col = VC[dim], mem = groupMembers(dim, refG, D);
  var n = mem.length;
  if(n===1) return '<b style="font-size:12px">抽离 · '+DIMN[dim]+' 组</b><div style="font-size:11.5px;color:var(--pt-fg2);margin-top:4px">'+DIMN[dim]+'=1：组内只有一张卡（rank '+mem[0]+'），无通信发生。</div>';
  var w = Math.max(340, Math.min(560, n*64)), h = 170, pts=[], i;
  if(ui.commPrim!=='p2p'){

    for(i=0;i<n;i++){ var a=-Math.PI/2+i*2*Math.PI/n; pts.push([cx+R*Math.cos(a)*1.9, cy+R*Math.sin(a)]); }
  }else{
    for(i=0;i<n;i++) pts.push([40+i*(w-80)/Math.max(1,n-1), h/2-8]);
  }
  var nodes = pts.map(function(p2,i3){
    return '<rect x="'+(p2[0]-13)+'" y="'+(p2[1]-10)+'" width="26" height="20" rx="3" style="fill:var(--pt-s2);stroke:var(--pt-bds)"/>'
      + txt(p2[0], p2[1]+4, mem[i3], 10, 'var(--pt-fg)', 'middle', 'font-weight="700"')
      + txt(p2[0], p2[1]+23, dim+'_rank '+i3, 8.5, col);
  }).join('');
  var edges = edgeSVG(pts.map(function(p2){ return [p2[0], p2[1]-13]; }), ui.commPrim, col, {mid:dim, ring:true});
  return '<b style="font-size:12px">抽离模式 · 只看连线（R2）</b> '
    + '<span class="mono" style="font-size:10.5px;color:var(--pt-fg2)">'+DIMN[dim]+' 组 × '+PRIMS.filter(function(x){return x.id===ui.commPrim;})[0].name+' · '+n+' 张卡'+(sel===null?'（示意 0 号组）':'')+(dim==='cp'?' · CP 组跨分面，只在此呈现':'')+'</span>'
    + '<svg viewBox="0 0 '+w+' '+h+'">'+defsSVG()+edges+nodes+'</svg>';
}

/* ═════════ FR-10 动画 ═════════ */
function buildPhases(D){
  var ph=[], MB=Math.min(D.ga,2), m, s2, s3;
  for(m=1;m<=MB;m++) for(s2=0;s2<D.pp;s2++){
    ph.push({k:'tp',s:s2,m:m,dir:'前向'});
    if(D.moe) ph.push({k:'a2a',s:s2,m:m,dir:'前向'});
    if(s2<D.pp-1) ph.push({k:'p2p',s:s2,to:s2+1,m:m,dir:'前向'});
  }
  for(m=1;m<=MB;m++) for(s3=D.pp-1;s3>=0;s3--){
    ph.push({k:'tp',s:s3,m:m,dir:'反向'});
    if(s3>0) ph.push({k:'p2p',s:s3,to:s3-1,m:m,dir:'反向'});
  }
  ph.push({k:'dp'});
  return ph;
}
function animTick(D){
  var lay = document.getElementById('animLayer');
  if(!lay){ stopAnim(); return; }
  if(anim.i >= anim.phases.length){ stopAnim(); render(); return; }
  var p = anim.phases[anim.i++], LY = v1Layout(D);
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, ui.cpFacet, 0, 0, D);
  var co = coordsOf(refG, D); if(co.d >= LY.dpShown) co.d = 0;
  var html='', capEl = $('animCap');
  function anchors(list){ return list.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t, Math.min(c2.d,LY.dpShown-1), c2.p, D, LY); }); }
  if(p.k==='tp'){
    var mem=[]; for(var t=0;t<D.tp;t++) mem.push(rankOf(t, ui.cpFacet, co.d, p.s, D));
    html = '<g class="pulse2">'+edgeSVG(anchors(mem),'allreduce',VC.tp,{mid:'tp'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · stage '+p.s+' · <b>TP AllReduce</b>（每层两下，按 stage 折叠示意）';
  }else if(p.k==='p2p'){
    var a = cardAnchor(co.t,co.d,p.s,D,LY), b = cardAnchor(co.t,co.d,p.to,D,LY);
    html = '<g class="pulse1"><line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" style="stroke:'+VC.pp+';stroke-width:3;marker-end:url(#arrpp)"/></g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · <b>PP P2P</b> stage '+p.s+'→'+p.to;
  }else if(p.k==='a2a'){
    var memE = D.moe ? epMembers(rankOf(co.t,ui.cpFacet,co.d,p.s,D),D).filter(function(r){ var c3=coordsOf(r,D); return c3.c===ui.cpFacet && c3.d<LY.dpShown; }) : [];
    html = '<g class="pulse1">'+edgeSVG(anchors(memE),'alltoall',VC.ep,{mid:'ep'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · stage '+p.s+' · <b>MoE All-to-All</b> 成片爆发';
  }else if(p.k==='dp'){
    var memD=[]; for(var d2=0; d2<Math.min(D.dp,LY.dpShown); d2++) memD.push(rankOf(co.t,ui.cpFacet,d2,co.p,D));
    html = '<g class="pulse2">'+edgeSVG(anchors(memD),'allreduce',VC.dp,{mid:'dp'})+'</g>';
    capEl.innerHTML = '<b>DP 梯度 AllReduce</b>——整步静默，末尾闪一次';
  }
  lay.innerHTML = html;
}
function startAnim(D){
  anim.on = true; anim.phases = buildPhases(D); anim.i = 0;
  $('animCap').style.display = 'block';
  anim.timer = setInterval(function(){ animTick(derive(cfg)); }, 620);
}
function stopAnim(){
  anim.on = false;
  if(anim.timer){ clearInterval(anim.timer); anim.timer = null; }
  var c = $('animCap'); if(c) c.style.display = 'none';
  var l = document.getElementById('animLayer'); if(l) l.innerHTML = '';
}

/* ═════════ V2 时间·流（FR-7/8）：流=容器，容量是时间 ═════════ */
function renderV2(D){
  var sch = schedule(D), T = sch.T, PP = D.pp;
  var W=920, LBL=128, rowH=40, px=(W-LBL-20)/T, H=PP*rowH+56;
  var selCo = (sel!==null && sel<D.world) ? coordsOf(sel,D) : null;
  var rows='', blocks='', ticks='';
  for(var s2=0;s2<PP;s2++){
    var y = 22+s2*rowH, hot = selCo && selCo.p===s2;
    if(layerOn('L3')) rows += '<rect x="'+LBL+'" y="'+(y-2)+'" width="'+(W-LBL-16)+'" height="'+(rowH-10)+'" class="lane" style="'+(hot?'stroke:var(--pt-dp);stroke-width:1.4;fill:'+mix(VC.dp,7):'')+'"/>';
    if(layerOn('L4')) rows += txt(LBL-8, y+rowH/2-4, 'stage '+s2+(hot?' ◀ r'+sel:''), 10.5, hot?VC.dp:'var(--pt-fg3)', 'end', hot?'font-weight="700"':'');
  }
  sch.blocks.forEach(function(b){
    var y=22+b.s*rowH, x=LBL+b.t0*px, w2=(b.t1-b.t0)*px-1.2;
    if(b.type==='AR'){
      blocks += '<g data-act="zoomar" style="cursor:pointer"><rect x="'+x+'" y="'+(y+1)+'" width="'+w2+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.dp,26)+';stroke:'+VC.dp+';stroke-width:1.1"/>'
        + (w2>36?txt(x+w2/2, y+rowH/2-4, 'AllReduce', 8.5, VC.dp):'')+'</g>';
    }else{
      var fw = b.type==='F';
      blocks += '<rect x="'+x+'" y="'+(y+1)+'" width="'+Math.max(1,w2)+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.pp, fw?22:46)+';stroke:'+VC.pp+';stroke-width:.7"/>'
        + (w2>15?txt(x+w2/2, y+rowH/2-4, (fw?'F':'B')+b.m, 8.2, 'var(--pt-fg2)'):'');
      if(layerOn('L5') && b.recv) ticks += '<path d="M'+x+' '+(y-3)+' l4 -5 l-8 0 z" style="fill:'+VC.pp+'"/>';
    }
  });
  var axis = '<line x1="'+LBL+'" y1="'+(22+PP*rowH+2)+'" x2="'+(W-14)+'" y2="'+(22+PP*rowH+2)+'" style="stroke:var(--pt-fg);stroke-width:1"/>'
    + txt(W-14, 22+PP*rowH+15, '时间 →  F=1 B=2 · 1F1B 合成'+(sch.truncated?' · 只画前 '+sch.GA+' 个 μbatch':''), 9, 'var(--pt-fg3)', 'end');
  var zoom = ui.zoomAR ? arZoomSVG(D) : '';
  $('stage').innerHTML = '<svg viewBox="0 0 '+W+' '+(H+(ui.zoomAR?236:0))+'" preserveAspectRatio="xMidYMid meet">'
    + rows+blocks+ticks+axis + (zoom?'<g transform="translate(0 '+(H+8)+')">'+zoom+'</g>':'') + '</svg>';
  $('stagebar').innerHTML =
    '<button class="pb'+(ui.skew?' is-on':'')+'" data-act="skew">注入偏斜（某副本慢）</button>'
    + '<button class="pb'+(ui.zoomAR?' is-on':'')+'" data-act="zoomar">放大末尾 AllReduce</button>'
    + '<span class="pt-chip">流 = 时间容器：装 kernel，装满不会崩，只是变慢（§08）</span>';
  $('stageNote').hidden = true; $('detach').hidden = true;
}
function arZoomSVG(D){
  var n = Math.min(D.dp,6), base=1.0, xfer=0.9, culprit = ui.skew ? Math.min(2,n-1) : -1;
  var entries=[], i;
  for(i=0;i<n;i++) entries.push(base + ((i*37)%7)/40 + (i===culprit?.85:0));
  var exit = Math.max.apply(0,entries)+xfer;
  var W=920, LBL=128, rowH=27, px=(W-LBL-30)/(exit+.4);
  var spans = entries.map(function(e){ return exit-e; });
  var shortest = spans.indexOf(Math.min.apply(0,spans));
  var out = txt(LBL, 12, '放大：stage '+((sel!==null&&sel<D.world)?coordsOf(sel,D).p:0)+' 的 DP 组梯度 AllReduce ——虚线=进入 · 实线=共同退出 · 条长=在集合里耗的时间'+(D.dp>n?' · 前 '+n+' 个副本':''), 9.5, 'var(--pt-fg2)', 'start');
  for(var r=0;r<n;r++){
    var y=22+r*rowH, x0=LBL+entries[r]*px, x1=LBL+exit*px, isCul = r===shortest && ui.skew;
    out += txt(LBL-8, y+13, 'dp_rank '+r, 10, 'var(--pt-fg2)', 'end')
      + '<line x1="'+LBL+'" y1="'+(y+9)+'" x2="'+(W-20)+'" y2="'+(y+9)+'" style="stroke:var(--pt-bd)"/>'
      + '<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="18" style="fill:'+(isCul?mix('var(--pt-danger)',14):mix(VC.dp,22))+';stroke:'+(isCul?'var(--pt-danger)':VC.dp)+';stroke-width:'+(isCul?1.6:1)+'"/>'
      + '<line x1="'+x0+'" y1="'+(y-3)+'" x2="'+x0+'" y2="'+(y+21)+'" style="stroke:var(--pt-fg);stroke-width:1.3;stroke-dasharray:2 2"/>'
      + (isCul?txt(x0+4, y+13, '最后进入 · 段最短 = 嫌疑人', 9, 'var(--pt-danger)', 'start', 'font-weight="700"'):'');
  }
  out += '<line x1="'+(LBL+exit*px)+'" y1="14" x2="'+(LBL+exit*px)+'" y2="'+(22+n*rowH)+'" style="stroke:var(--pt-fg);stroke-width:1.1"/>'
      + txt(LBL+exit*px, 10, '共同退出', 8.5, 'var(--pt-fg)');
  return out;
}

/* ═════════ V3 卡内解剖：容器打开 —— 层 → 算子 → kernel → 流 ═════════ */
function renderV3(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g,D), Lps = D.layersPerStage, l0 = co.p*Lps;
  var ops = opBytes(D);
  var s = 46;
  var maxOpB = Math.max.apply(0, ops.map(function(o){return Math.max(o.b,1);}));
  var CW = 4.6, CH = 2.6, CD = Math.max(2.2, Math.min(6, Lps*.42));
  var picked = clamp(ui.selLayerOff, 0, Lps-1);
  var CIRC = '①②③④⑤⑥⑦⑧⑨⑩';   /* 算子编号：算子↔kernel 用同号对应（N:M） */
  var opIdx = {}, opFront = {};
  var parts = [];
  /* 包围盒：边生成边登记（文字给出估算宽度），最后据此定 viewBox */
  var bx=[], by=[];
  function reg(p, wL, wR, hU, hD){ bx.push(p[0]-(wL||0), p[0]+(wR||0)); by.push(p[1]-(hU||0), p[1]+(hD||0)); }
  function regBox(x,y,z,w,h,d){
    [[x,y,z],[x+w,y,z],[x,y,z+d],[x+w,y,z+d],[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d]]
      .forEach(function(c){ reg(proj(c[0],c[1],c[2],s)); });
  }

  /* ① 卡容器（线框=容量边界）+ 门牌（地址=文字，§15） */
  parts.push(boxSVG(0, 0, 0, CW, CH, CD, s, {wire:true, stroke:'var(--pt-fg)', sw:1.4}));
  regBox(0,0,0,CW,CH,CD);
  var door = proj(0, CH, CD, s);   /* 容器左上角外侧 */
  parts.push(txt(door[0]-6, door[1]-26, '卡 = 容器（容量 = 显存 '+D.hbm+'GB）', 11, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(door[0]-6, door[1]-12, '门牌: global_rank '+g+' · tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(D.moe?(function(){var me=epOf(co.t,co.c,co.d,D);return ' ep'+me.ep;})():'')+'（地址只标不画）', 9.5, 'var(--pt-fg2)', 'start'));
  reg([door[0]-6, door[1]-26], 0, 320, 14, 0);

  /* ② 层 slabs（这段的 Lps 层；点选） */
  for(var li=0; li<Lps; li++){
    var lz = .25 + li*(CD-.5)/Lps, lh = .42, isPick = li===picked;
    parts.push('<g class="l3pick" data-li="'+li+'" style="cursor:pointer">'
      + boxSVG(.3, .2, lz, CW-.6, lh, Math.max(.16,(CD-.7)/Lps*.72), s,
        {stroke: isPick?VC.pp:'var(--pt-bds)', sw:isPick?1.8:.8, topFill:isPick?mix(VC.pp,26):''})
      + '</g>');
    /* 端点 + 选中层标全局层号：只标选中那层会让人以为 L 是卡内序号，逐层都标又会糊成一团 */
    var lc = proj(CW-.3, .2+lh, lz, s);
    if(isPick){
      parts.push(txt(lc[0]+8, lc[1]-2, 'L'+(l0+li), 10, VC.pp, 'start', 'font-weight="800"'));
      reg([lc[0]+8, lc[1]-2], 0, 34, 8, 4);
    }else if(li===0 || li===Lps-1){
      parts.push(txt(lc[0]+7, lc[1]-1, 'L'+(l0+li), 7.2, 'var(--pt-fg3)', 'start'));
      reg([lc[0]+7, lc[1]-1], 0, 26, 6, 3);
    }
  }
  var capL = proj(CW, 0, CD, s);   /* 容器最低点下方，谁也不压 */
  parts.push(txt(capL[0], capL[1]+20, '层段 L'+l0+'–L'+(l0+Lps-1)+'（'+Lps+' 层 · 点任一层抽出）', 9.5, 'var(--pt-fg3)', 'middle'));
  parts.push(txt(capL[0], capL[1]+32, 'L = 整网的全局层号（ℓ 轴 · 整网共 '+D.layers+' 层 L0–L'+(D.layers-1)+'）——不是卡内序号；PP 刀把它切成 '+D.pp+' 段，这张卡只装 stage'+co.p+' 这一段', 8.2, 'var(--pt-fg2)', 'middle'));
  parts.push(txt(capL[0], capL[1]+44, '当前抽出：L'+(l0+picked)+' = 整网第 '+(l0+picked)+' 层 · 段内第 '+(picked+1)+'/'+Lps, 8.6, VC.pp, 'middle', 'font-weight="700"'));
  reg([capL[0], capL[1]+44], 300, 300, 0, 10);

  /* ③ 抽出的层 → 算子块（体积∝字节；切法着色） */
  var opW = 1.05, gap = .38, opsDrawn = ops.filter(function(o){ return o.b>0 || o.id==='attn.core'; });
  var bandW = opsDrawn.length*(opW+gap);
  var ox = CW + 2.4, oy = 0, hookPts = {};   /* 算子带放容器右前方，同一地面 */
  opsDrawn.forEach(function(o, oi){
    var hgt = o.b>0 ? .3 + 1.35*(o.b/maxOpB) : .26;
    var x0 = ox + oi*(opW+gap);
    var col = o.cut==='tp' ? VC.tp : o.cut==='ep' ? VC.ep : 'var(--pt-fg3)';
    if(o.b>0) parts.push(boxSVG(x0, oy, 0, opW, hgt, .9, s, {fill:mix(col,70), stroke:col, sw:1, attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    else parts.push(boxSVG(x0, oy, 0, opW, .26, .9, s, {wire:true, stroke:col, sw:1, dash:'3 3', attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    regBox(x0, oy, 0, opW, Math.max(hgt,.9), .9);
    var tc = proj(x0+opW/2, oy, .9, s);   /* 标注放块的前下方，斜排避让 */
    var ty = tc[1] + 14 + (oi%2)*18;
    opIdx[o.id] = CIRC.charAt(oi); opFront[o.id] = tc;
    parts.push(txt(tc[0], ty, opIdx[o.id]+' '+o.id, 8.8, 'var(--pt-fg)', 'middle', 'font-weight="600"'));
    parts.push(txt(tc[0], ty+10, o.how, 7.6, col));
    reg([tc[0], ty+10], 40, 40, 0, 8);
    hookPts[o.id] = proj(x0+opW/2, oy+hgt, .45, s);
  });
  /* 层→算子 展开引线（结构：无厚度虚线） */
  var pickedZ = .25 + picked*(CD-.5)/Lps;
  var pa = proj(CW-.3, .2+.21, pickedZ, s), pb = proj(ox-.15, .5, .45, s);
  parts.push('<path d="M'+pa[0]+' '+pa[1]+' C '+(pa[0]+60)+' '+(pa[1]-30)+', '+(pb[0]-60)+' '+(pb[1]-30)+', '+pb[0]+' '+pb[1]+'" style="fill:none;stroke:'+VC.pp+';stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrpp)"/>');
  var bandTop = proj(ox+bandW/2, 2.2, 0, s);
  parts.push(txt(bandTop[0], bandTop[1], '抽出的 L'+(l0+picked)+' = 一排算子的「片」（结构无厚度 · 内容有体积 · 切法看颜色）', 9.5, 'var(--pt-fg2)', 'middle', 'font-weight="600"'));
  reg([bandTop[0], bandTop[1]], 230, 230, 10, 0);

  /* ④ 通信钩子（动作：发生在切口上） */
  if(layerOn('L5')){
    var hook = function(opId, dim, label, dx){
      if(!hookPts[opId]) return;
      var hp = hookPts[opId], gx = hp[0]+dx, gy = hp[1]-46;
      parts.push('<line x1="'+hp[0]+'" y1="'+(hp[1]-8)+'" x2="'+gx+'" y2="'+gy+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>');
      parts.push(txt(gx+3, gy-4, label, 8.6, VC[dim], 'start', 'font-weight="700"'));
      reg([gx+3, gy-4], 0, 120, 12, 0);
    };
    hook('attn.out', 'tp', 'TP AllReduce ①', 14);
    hook(D.moe?'experts':'mlp.down', D.moe?'ep':'tp', D.moe?'EP All-to-All':'TP AllReduce ②', 20);
    if(D.moe) hook('router', 'ep', '路由', 6);
    var edge = proj(CW, CH*.86, 0, s);
    parts.push('<line x1="'+edge[0]+'" y1="'+edge[1]+'" x2="'+(edge[0]+58)+'" y2="'+(edge[1]-20)+'" style="stroke:'+VC.pp+';stroke-width:1.8;marker-end:url(#arrpp)"/>');
    parts.push(txt(edge[0]+62, edge[1]-24, 'PP P2P → '+(co.p+1<D.pp?'stage '+(co.p+1):'（末段→loss）'), 8.8, VC.pp, 'start', 'font-weight="700"'));
    reg([edge[0]+62, edge[1]-24], 0, 130, 12, 0);
    var edge2 = proj(0, .25, 0, s);   /* 左前棱下部，远离门牌 */
    parts.push('<line x1="'+edge2[0]+'" y1="'+edge2[1]+'" x2="'+(edge2[0]-58)+'" y2="'+(edge2[1]+14)+'" style="stroke:'+VC.dp+';stroke-width:1.5;stroke-dasharray:6 3;marker-end:url(#arrdp)"/>');
    parts.push(txt(edge2[0]-62, edge2[1]+18, 'DP AllReduce（整步静默，步末一次）', 8.6, VC.dp, 'end'));
    reg([edge2[0]-62, edge2[1]+18], 210, 0, 6, 10);
  }

  /* ⑤ 流 = 时间容器：kernel 排队（算子→kernel N:M）——压到算子带正下方更深处 */
  var fw = Math.max(bandW+.6, 5.4), fh = .6, fx = ox - .2, fy = -3.9;
  parts.push(boxSVG(fx, fy, 0, fw, fh, .8, s, {wire:true, stroke:'var(--pt-fg)', sw:1.1}));
  regBox(fx, fy, 0, fw, fh, .8);
  /* kernel 用 src 声明它由哪些算子来——标签打同号，并逐条画对应引线 */
  var kdefs = D.moe
    ? [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:.7, src:['router'], c:VC.ep},
       {w:.8, from:'组批 1/2', src:['experts'], c:VC.ep}, {w:.8, from:'组批 2/2', src:['experts'], c:VC.ep}]
    : [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:1.1, src:['mlp.gate/up'], c:VC.tp},
       {w:.45, from:'分段 1/2', src:['mlp.down'], c:VC.tp}, {w:.45, from:'分段 2/2', src:['mlp.down'], c:VC.tp}];
  var kx = fx+.15, kLines = [];
  kdefs.forEach(function(k, ki){
    parts.push(boxSVG(kx, fy+.07, .12, k.w, fh-.18, .5, s, {fill:mix(k.c,52), stroke:k.c, sw:.8}));
    var badges = k.src.map(function(id){ return opIdx[id]||'·'; }).join('+');
    var kc = proj(kx+k.w/2, fy, .8, s);              /* 前下棱：标签落在轨道外侧 */
    var kty = kc[1] + 24 + (ki%2)*13;
    parts.push(txt(kc[0], kty, badges+(k.from?' '+k.from:''), 7.6, k.c, 'middle', 'font-weight="700"'));
    reg([kc[0], kty], 38, 38, 0, 8);
    var kTop = proj(kx+k.w/2, fy+fh, .3, s);
    k.src.forEach(function(id){ if(opFront[id]) kLines.push([opFront[id], kTop, k.c]); });
    kx += k.w + .12;
  });
  kLines.forEach(function(L){                        /* 算子 → kernel：同号 + 引线双保险 */
    parts.push('<path d="M'+L[0][0]+' '+(L[0][1]+34)+' C '+L[0][0]+' '+(L[0][1]+90)+', '+L[1][0]+' '+(L[1][1]-60)+', '+L[1][0]+' '+L[1][1]+'" style="fill:none;stroke:'+L[2]+';stroke-width:.8;stroke-dasharray:3 4;opacity:.6"/>');
  });
  var fl = proj(fx, fy+fh/2, .4, s);   /* 轨道左端外侧的空白区（容器正下方） */
  parts.push(txt(fl[0]-16, fl[1]-4, '流 = 另一个容器（容量 = 时间）', 10, 'var(--pt-fg)', 'end', 'font-weight="700"'));

function revHTML(D){

    + '<label style="font-size:11px">第 <input type="number" min="0" max="'+(D.layers-1)+'" id="revLayer" value="'+esc(ui.revLayer)+'" placeholder="L?"> 层在哪些卡上？</label><div id="revOut"></div></div>';

/* 反查一层落在哪几张卡上——**正向那一问的逆命题**。
   这一屏别处答的都是「这张卡装了什么」，而这里问的是「这一层住在哪」：
   两个方向合起来才是完整的映射。光给一串 rank 号码说明不了什么，真正要讲的是
   那几刀**各自决定了什么**（也就是三者叠加时每一刀的分工）：
     PP 决定这一层去哪几张卡 · TP/EP 决定它在那几张卡里怎么碎 · DP 决定这套安排
     复制几遍；层作为概念自始至终没变，变的只是它被映射到硬件上的方式。
   末一行是结论：一层牵动 world/PP 张卡，而 TP 或 EP 只要落下，就没有哪一张
   持有完整的它。 */
function layerHome(D, L){
  var stage = Math.floor(L / D.layersPerStage);
  var l0 = stage*D.layersPerStage, l1 = Math.min(D.layers-1, l0+D.layersPerStage-1);
  var isMoe = D.moe && L >= Math.min(2, D.layers);       /* 与 netScene 的 denseTop 同口径 */
  var tot = D.tp * D.cp * D.dp;
  var frag = (ui.kTP && D.tp>1 ? D.tp : 1) * (isMoe && ui.kEP && D.ep>1 ? D.ep : 1);
  return {stage:stage, l0:l0, l1:l1, isMoe:isMoe, tot:tot, frag:frag};
}
function renderRevOut(D){
  var out = document.getElementById('revOut');
  if(!out) return;
  var v = ui.revLayer;
  if(v===''||isNaN(+v)){ out.innerHTML=''; return; }
  var L = clamp(Math.floor(+v), 0, D.layers-1), h = layerHome(D, L), stage = h.stage;
  var mem=[], d,c,t;
  for(d=0;d<D.dp&&mem.length<20;d++) for(c=0;c<D.cp&&mem.length<20;c++) for(t=0;t<D.tp&&mem.length<20;t++) mem.push(rankOf(t,c,d,stage,D));
  function step(dim, txt2){
    return '<div style="margin:1px 0 1px 0"><span class="dk" style="--c:'+VC[dim]+'">'+dim.toUpperCase()
      + '</span> <span style="font-size:10.5px">'+txt2+'</span></div>';
  }
  out.innerHTML = '<div class="formula" style="margin:5px 0 4px">'
    + '<b>L'+L+'</b> 住在哪'
    + step('pp', '落在 <b>stage '+stage+'</b>（L'+h.l0+'–L'+h.l1+'）—— 决定它<b>去哪几张卡</b>')
    + step('tp', (D.tp>1 ? '段内切成 <b>'+D.tp+' 份</b>（带着 SP）' : '×1，不切')
        + ' —— 决定它<b>在那几张卡里怎么碎</b>')
    + (D.moe ? step('ep', h.isMoe
        ? '这一层是 MoE，专家再分 <b>'+D.ep+' 桶</b>（重分组，<b>不新增卡</b>）'
        : '这一层是 Dense，<b>没有 e 轴</b>，EP 这一刀落不下来') : '')
    + (D.cp>1 ? step('cp', '输入再切 <b>'+D.cp+' 段</b>（切的是 s，不减权重）') : '')
    + step('dp', '上述整个安排<b>复制 '+D.dp+' 份</b>')
    + '<div style="margin-top:4px;border-top:1px solid var(--pt-bd);padding-top:3px">= 共 <b>'+fmt(h.tot)
    + '</b> 张卡与 L'+L+' 有关（world/PP）'
    + (h.frag>1 ? '，<b>无一张持有完整的它</b>（各持 1/'+h.frag+'）' : '，每张持有<b>完整</b>的它')
    + '</div></div>'
    + '<div class="rankchips">'+mem.map(function(r){return '<button data-act="pick" data-g="'+r+'">'+r+'</button>';}).join('')
    + (h.tot>mem.length?'<span style="font-size:10px;color:var(--pt-fg3)">…共 '+fmt(h.tot)+'</span>':'')+'</div>';
}

      + '<button class="pb mono" disabled title="CP 不是卡网格的轴——输入分布见 V5，CP 通信组走抽离图（P2 修正 / A4）">CP⊘</button>';
    out += '<span class="pt-sep"></span><span class="pt-cap">L5 维度</span>'
      + COMM_DIMS.map(function(dm){
          var dis = dm==='ep' && !D.moe;
          return '<button class="pb mono'+(ui.commDim===dm&&layerOn('L5')?' is-on':'')+'" data-act="commdim" data-d="'+dm+'" style="--c:'+VC[dm]+'"'+(dis?' disabled':'')+'>'+DIMN[dm]+'</button>';
        }).join('')
      + '<span class="pt-cap" title="原语两类：P2P 是点对点，集合原语由一串 P2P 接成。两类都在计算图里以算子节点出现（send/recv、hcom_*），但在参照系里都是动作——不持有字节、不被切">⊗ 原语</span>'
      + PRIMS.map(function(pr){
          var cmn = (COMMON[ui.commDim]||[]).indexOf(pr.id)>=0;
          return '<button class="pb mono'+(ui.commPrim===pr.id&&layerOn('L5')?' is-on':'')+'" data-act="commprim" data-p="'+pr.id+'" title="'+esc(pr.kind+'：'+pr.why)+'">'+pr.name+'<span class="cmn">'+pr.kind+(cmn?'·常见':'')+'</span></button>';
        }).join('')
      + '<button class="pb'+(ui.detach?' is-on':'')+'" data-act="detach">抽离</button>';
  }
  $('footCtl').innerHTML = out;
}

/* 画布左上角那个名字。整屏只认这一个标题——就四个字，不带副标题：此刻在看哪一幕、
   Rank 开着没有，右上角那排开关自己写着，标题再抄一遍只是把同一件事说两遍。 */
function renderStageTitle(){
  var el = $('stageTitle'); if(!el) return;
  if(el.firstChild) return;
  el.innerHTML = '<b>并行拓扑</b>';
  if(document.querySelector('.pt-root.embed')){
    var qb = $('qbar'); if(qb) el.appendChild(qb);
  }
}

/* ══ 二级读数：读出卡里点开的那一**块**显存 ═══════════════════════════════
   选中一张卡答的是「这张卡装了什么」；再点一块答的是「这一块自己是怎么来的」——
   它占的字节按什么口径算、被哪把刀切、本卡拿到的是哪一段。三问一组，缺一段
   读者就只能盯着一个 GB 数干瞪眼。
   三把常驻的账（权重/梯度/优化器态）**共用同一份分法**：它们是同一份参数的
   ×2 / ×2 / ×12 B，所以逐块切法只在权重那一档展开一次，另两档指回去、不抄第二遍。 */
/* ── 体腔小图：一格 = 一份，填实的那格就是本卡持有的 ─────────────────────
   与交集腔 L3 的①②两只体腔、以及读出卡里那两只缩略图同一个语汇（网格 + 实心
   一格），只是缩到读出卡的宽度里。**画出来的东西不用再用文字说一遍**：
   「×8 里的第 5 桶」画成八格里第五格填实，比写一行字快得多，也不会和图打架。
   ax = {nx, ix, lx, ny, iy, ly, c}：两根轴各自的份数、本卡的下标、轴名，c 是刀色。 */
function cavityGrid(ax){
  var BW = 200, BH = 52, PAD = 18;
  var nx = Math.max(1, ax.nx), ny = Math.max(1, ax.ny);
  /* 份数多到一格不足 3px 时不逐格画——画出来是一团糊，反而把「本卡是哪一格」盖掉。
     这时退回「整条 + 一段实心」：位置照旧准确，只是不再数得出格数（格数写在轴标上）。 */
  var cw = BW/nx, ch = BH/ny, fine = cw >= 3 && ch >= 3;
  var cells = '';
  if(fine){
    for(var y = 0; y < ny; y++) for(var x = 0; x < nx; x++){
      var on = (x === ax.ix && y === ax.iy);
      cells += '<rect x="'+(x*cw+0.5).toFixed(1)+'" y="'+(y*ch+0.5).toFixed(1)
        + '" width="'+(cw-1).toFixed(1)+'" height="'+(ch-1).toFixed(1)
        + '" style="fill:'+(on ? ax.c : 'transparent')
        + ';stroke:'+(on ? 'none' : 'var(--pt-bd)')+';stroke-width:.5'
        + (on ? '' : ';stroke-dasharray:2 2')+'"/>';
    }
  } else {
    cells += '<rect x="0.5" y="0.5" width="'+(BW-1)+'" height="'+(BH-1)
      + '" style="fill:none;stroke:var(--pt-bd);stroke-width:.5;stroke-dasharray:2 2"/>'
      + '<rect x="'+(ax.ix*cw).toFixed(1)+'" y="'+(ax.iy*ch).toFixed(1)
      + '" width="'+Math.max(1.5, cw).toFixed(1)+'" height="'+Math.max(1.5, ch).toFixed(1)
      + '" style="fill:'+ax.c+';stroke:none"/>';
  }
  return '<svg width="'+(BW+PAD+30)+'" height="'+(BH+15)+'" style="margin:2px 0 1px;overflow:visible">'
    + '<g transform="translate(1,1)">'+cells
    + '<rect x="0" y="0" width="'+BW+'" height="'+BH+'" style="fill:none;stroke:var(--pt-fg3);stroke-width:.9;stroke-dasharray:3 2"/></g>'
    /* 份数只在**真被分开**时才写：一根没切的轴写「×1」是在说一件没发生的事，
       而且和轴名连起来读成「复印16×1」这种自相矛盾的串。 */
    + '<text x="'+(BW+6)+'" y="'+(BH/2+4)+'" style="font-size:9.5px;fill:var(--pt-fg3)">'+esc(ax.ly)+(ny>1?'×'+ny:'')+'</text>'
    + '<text x="0" y="'+(BH+13)+'" style="font-size:9.5px;fill:var(--pt-fg3)">'+esc(ax.lx)+(nx>1?'×'+nx:'')+'</text>'
    + '</svg>';
}

/* ── 整条带的构成：按字节分宽度，每段上它自己那把刀的色 ────────────────────
   权重（以及跟着它的梯度/优化器态）**不能用一张网格说**：网格说的是「一根轴切
   成几份、我拿第几份」，可这条带里 experts 走 EP、attn.* 走 TP、router/norm 不切
   ——一张图填一格，等于替读者选了一块去代表全体，那正是最容易读错的一步。
   所以这一档画的是**它自己的横截面**：谁占多宽、各是什么色。与卡上那条带、
   以及交集腔 L3 的权重带是同一张图，三处对得上。 */
function compStrip(blocks, wide){
  var BW = wide || 210, BH = 20, tot = 0;
  blocks.forEach(function(b9){ tot += b9.bytes; });
  if(!(tot > 0)) return '';
  var x9 = 0, segs9 = '', labs9 = [];
  blocks.forEach(function(b9){
    var w9 = BW*b9.bytes/tot;
    if(w9 > 0.4){
      segs9 += '<rect x="'+x9.toFixed(1)+'" y="0" width="'+w9.toFixed(1)+'" height="'+BH
        + '" style="fill:'+cutColor(b9.cut)+';fill-opacity:'+(b9.cut==='none'?.28:.62)
        + ';stroke:var(--pt-bg);stroke-width:.6"/>';
      /* 只给放得下的那几段挂名字：挤不下就交给下面那张表，图上不叠字 */
      if(w9 >= 28) labs9.push('<text x="'+(x9+w9/2).toFixed(1)+'" y="'+(BH/2+3)
        + '" style="font-size:7.6px;fill:var(--pt-fg);font-weight:700" text-anchor="middle">'+esc(b9.id)+'</text>');
    }
    x9 += w9;
  });
  return '<svg width="'+BW+'" height="'+(BH+2)+'" style="margin:2px 0 0;overflow:visible">'
    + segs9 + labs9.join('')
    + '<rect x="0" y="0" width="'+BW+'" height="'+BH+'" style="fill:none;stroke:var(--pt-fg3);stroke-width:.8"/>'
    + '</svg>';
}

/* ── 体腔（缩到读出卡里的那只）─────────────────────────────────────────────
   与「映射·双链/交集腔」那一幕的①权重体 / ②激活体是同一只盒子、同一套语汇：
   三根轴各被自己那把刀切出格子（线用刀色），本卡持有的那一格填实。
   为什么不直接调那边的 solidBox：它是 renderSolidCav 的闭包，挂着 L1–L4 分层
   开关、轴尺、刀面板、门牌那一整套，是给 880px 画布写的；塞进 260px 的读出卡
   只会剩一团糊。这里复用的是它**自己也在用**的两个模块级原语（proj / boxSVG），
   所以形状、明暗、剔背面的规矩逐条一致，只是把注解留给旁边那行字。
   ax/ay/az = {n, dim, i}：份数、哪把刀（决定颜色）、本卡在这根轴上的下标。 */
function cavityBox3D(ax, ay, az, o){
  o = o || {};
  var W = o.w || 98, HH = o.h || 60, DD = o.d || 52;
  var dx = W/Math.max(1,ax.n), dy = HH/Math.max(1,ay.n), dz = DD/Math.max(1,az.n);
  var body = '';
  /* ln 在这份文件里是各渲染函数各自的局部小工具（同一段代码写了三遍），
     模块级没有——这里自带一只，别去够别人作用域里的那个。 */
  function ln(a9, b9, st9){
    return '<line x1="'+a9[0].toFixed(1)+'" y1="'+a9[1].toFixed(1)
      + '" x2="'+b9[0].toFixed(1)+'" y2="'+b9[1].toFixed(1)+'" style="'+st9+'"/>';
  }
  /* 外壳：虚线细框——腔是「索引空间」，不是实心物件 */
  body += boxSVG(0,0,0,W,HH,DD,1,{wire:true, stroke:'var(--pt-bd)', sw:.9, dash:'3 3'});
  /* 每把刀在它自己那根轴上留下的格线。格距小到 2px 以下就不画：
     那时线比格子还密，画出来是一片灰，把「本卡是哪一格」盖掉。 */
  function gl(step, dim){
    return 'stroke:'+(VC[dim]||'var(--pt-bd)')+';stroke-width:'+(step>5?.7:.5)
      + ';stroke-opacity:'+(step>5?.5:.32);
  }
  var i9;
  if(dy >= 2) for(i9=1;i9<ay.n;i9++)
    body += ln(proj(0,i9*dy,DD,1), proj(W,i9*dy,DD,1), gl(dy, ay.dim))
          + ln(proj(W,i9*dy,0,1), proj(W,i9*dy,DD,1), gl(dy, ay.dim));
  if(dx*C >= 2) for(i9=1;i9<ax.n;i9++)
    body += ln(proj(i9*dx,HH,0,1), proj(i9*dx,HH,DD,1), gl(dx*C, ax.dim))
          + ln(proj(i9*dx,0,DD,1), proj(i9*dx,HH,DD,1), gl(dx*C, ax.dim));
  if(dz*C >= 2) for(i9=1;i9<az.n;i9++)
    body += ln(proj(0,HH,i9*dz,1), proj(W,HH,i9*dz,1), gl(dz*C, az.dim))
          + ln(proj(W,0,i9*dz,1), proj(W,HH,i9*dz,1), gl(dz*C, az.dim));
  /* 本卡持有的那一格：实心 + 描边。三根轴上各取自己的下标，交出来就是这张卡。 */
  var cx = ax.i*dx, cy = ay.i*dy, cz = az.i*dz;
  body += boxSVG(cx, cy, cz, dx, dy, dz, 1, {fill:o.cell || 'var(--pt-fg)'});
  body += boxSVG(cx, cy, cz, dx, dy, dz, 1, {wire:true, stroke:o.cell || 'var(--pt-fg)', sw:.8});
  /* 视野按投影后八个角算，别写死——三根轴的份数一变，盒子在屏幕上的包围盒就变 */
  var xs = [], ys = [];
  [[0,0,0],[W,0,0],[W,HH,0],[0,HH,0],[0,0,DD],[W,0,DD],[W,HH,DD],[0,HH,DD]].forEach(function(v){
    var q = proj(v[0],v[1],v[2],1); xs.push(q[0]); ys.push(q[1]);
  });
  var x0 = Math.min.apply(null,xs)-3, x1 = Math.max.apply(null,xs)+3;
  var y0 = Math.min.apply(null,ys)-3, y1 = Math.max.apply(null,ys)+3;
  return '<svg viewBox="'+x0.toFixed(1)+' '+y0.toFixed(1)+' '+(x1-x0).toFixed(1)+' '+(y1-y0).toFixed(1)
    + '" width="'+(x1-x0).toFixed(0)+'" height="'+(y1-y0).toFixed(0)+'" style="margin:2px 0 0;overflow:visible">'
    + body + '</svg>';
}

/* 选中的块被哪几根轴切——渲染（点亮兄弟卡）与读出卡（写哪几组）共用同一份，
   免得两处各写一遍、往后改一处漏一处。 */
function memSibDims(key){
  if(!key) return [];
  if(key.indexOf('w:') === 0){
    var id9 = key.slice(2);
    if(id9 === 'experts') return ['pp','ep'];
    if(id9 === 'embed' || id9 === 'lm_head') return ['tp'];   /* 只住一个 stage，ℓ 轴不适用 */
    if(id9 === 'router' || id9 === 'norm×2') return ['pp'];   /* 复制块：只有 PP 把它分进各段 */
    return ['pp','tp'];                                        /* attn.* / mlp.* 走 TP */
  }
  if(key === 'w' || key === 'g' || key === 'opt' || key === 'otmp') return ['pp','tp','ep'];
  if(key === 'act') return ['pp','cp'];
  return [];                                                   /* rsv：不参与任何一把刀 */
}

function memBlockDetail(D, g, key){
  if(!key) return '';
  var co = coordsOf(g, D), lps = D.layersPerStage, p = co.p;
  var L = rankLoad(D, g), Pn = paramsPerCard(D, p, L);
  var segs = memParts(D, p, g);
  var me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var rows = [], title = '', tint = 'var(--pt-fg)', note = '', figs = [];
  function kv(k9, v9){ rows.push('<dt>'+esc(k9)+'</dt><dd>'+v9+'</dd>'); }
  function fig(ax, cap){ figs.push('<div class="rm-fig">'+cavityGrid(ax)
    + (cap ? '<span class="rm-cap">'+esc(cap)+'</span>' : '')+'</div>'); }
  /* ①腔（权重/梯度/优化器态共用）：h←TP 横着分，e←EP 竖着分，本卡持有交叉那一格 */
  function figW(c9){
    fig({nx:(D.tp>1?D.tp:1), ix:co.t, lx:'h←TP',
         ny:(D.moe&&D.ep>1?D.ep:1), iy:(me?me.ep:0), ly:'e←EP', c:c9 || cutColor('ep')});
  }
  /* 三把常驻账共用的那一句：ℓ 由 PP 定段，h 由 TP 切，e 由 EP 分桶。 */
  function holdLine(){
    return 'ℓ '+lps+'/'+D.layers
      + ' · h '+fmt(Math.floor(D.hidden/D.tp))+'/'+fmt(D.hidden)
      + (D.moe ? ' · e '+(D.experts/D.ep)+'/'+D.experts : '');
  }
  var sub = key.indexOf('w:') === 0 ? key.slice(2) : null;
  if(sub){
    /* ── 权重带里的某一块 ─────────────────────────────────────────────── */
    var blk = null, wl = wCutBlocks(D, p, L), i9;
    for(i9 = 0; i9 < wl.length; i9++) if(wl[i9].id === sub){ blk = wl[i9]; break; }
    if(!blk) return '';
    var shp = '', ob = opBytes(D), j9;
    for(j9 = 0; j9 < ob.length; j9++) if(ob[j9].id === sub){ shp = ob[j9].shape; break; }
    var vOwn = L ? L.vocabOwn : Math.ceil(D.vocab/D.tp);
    if(sub === 'embed')   shp = '['+fmt(vOwn)+', '+fmt(D.hidden)+']';
    if(sub === 'lm_head') shp = '['+fmt(D.hidden)+', '+fmt(vOwn)+']';
    title = sub; tint = cutColor(blk.cut);
    kv('这一块', fmtGB(blk.bytes)+' GB'+(shp ? ' · 每层 '+esc(shp) : ''));
    /* 切法画出来，不写出来：「桶切 ×8、本卡第 5 桶」= 八格里第五格填实。
       图里已经说的事不再用文字抄一遍，两边还容易对不上。 */
    /* 单块也画①腔，但**只把切它那把刀的那根轴分开**：experts 只被 EP 分桶，
       attn.* 只被 TP 切 h，router/norm 一刀没挨。同一只盒子、不同的切法——
       并排点过去就看得出「这条带里每块的刀各不相同」，那正是上一级说不清的事。 */
    var cavW9 = {n:1, dim:'tp', i:0}, cavE9 = {n:1, dim:'ep', i:0}, cap9 = blk.how;
    if(blk.cut === 'tp'){ cavW9 = {n:D.tp, dim:'tp', i:co.t}; cap9 = blk.how+' · 本卡第 '+co.t+' 片'; }
    else if(blk.cut === 'ep' && me){
      var kE = D.experts/D.ep, e0 = me.ep*kE;
      cavE9 = {n:D.ep, dim:'ep', i:me.ep}; cap9 = blk.how+' · 本卡 E'+e0+'–E'+(e0+kE-1);
    } else if(blk.cut === 'none') cap9 = '不切——每张卡逐字节相同';
    figs.push('<div class="rm-fig">'
      + cavityBox3D(cavW9, {n:D.pp, dim:'pp', i:p}, cavE9, {cell:tint})
      + '<span class="rm-cap">'+esc(cap9)+'</span></div>');
    if(sub === 'experts'){
      note = D.etp > 1 ? 'ETP='+D.etp+'：桶内每个专家的 ffn 维还被再切 '+D.etp+' 份。'
                       : 'ETP=1：桶内每个专家是整份的，h 方向没再切——盒子上 h 那根轴因此没有格线。';
    }
    if(sub === 'embed')   note = '只有 stage 0 有：PP 那一刀把词嵌入留在了第一段。';
    if(sub === 'lm_head') note = '只有末 stage 有：出口那一层不重复，PP 的另一头。';
  } else {
    /* ── 五档里的某一档 ──────────────────────────────────────────────── */
    var sg = null, s9;
    for(s9 = 0; s9 < segs.length; s9++) if(segs[s9].k === key){ sg = segs[s9]; break; }
    if(!sg) return '';
    title = sg.label; tint = sg.k === 'act' ? VC.dp : (sg.k === 'rsv' ? 'var(--pt-fg3)' : MEMC[sg.k] || 'var(--pt-fg)');
    var per = key === 'w' ? 2 : (key === 'g' ? 2 : (key === 'opt' ? 12 : 3.2));
    kv('这一档', fmtGB(sg.bytes)+' GB'
      + ((key==='w'||key==='g'||key==='opt'||key==='otmp')
          ? ' · '+fmt(Math.round(Pn/1e6))+' M 参数 × '+per+' B' : ''));
    /* ①腔三档共用同一张图（同一份参数、同一分法，只是每份几个字节不同）——
       画同一张正是「×1 / ×6」那句话本身，用不着再写一遍。 */
    if(key === 'w' || key === 'g' || key === 'opt' || key === 'otmp'){
      /* 整条带一起说：谁占多宽、各被哪把刀切。一格一格地填「本卡拿第几份」是
         **单块**才答得上来的问题（带里每块的刀都不一样），留给点开某一块时再答。 */
      figs.push('<div class="rm-fig">'+compStrip(wCutBlocks(D, p, L))
        + '<span class="rm-cap">'+esc('宽度=字节占比 · 颜色=切它那把刀')+'</span></div>');
      /* ①腔本体：ℓ←PP × h←TP × e←EP，本卡持有交出来那一格 */
      figs.push('<div class="rm-fig">'
        + cavityBox3D({n:D.tp, dim:'tp', i:co.t},
                      {n:D.pp, dim:'pp', i:p},
                      {n:(D.moe?D.ep:1), dim:'ep', i:(me?me.ep:0)},
                      {cell:MEMC[key]})
        + '<span class="rm-cap">'+esc('①权重体 ℓ×h×e · 本卡 = 三根轴的交集那一格')+'</span></div>');
      kv('层段', 'ℓ '+lps+'/'+D.layers+' · L'+(p*lps)+'–L'+((p+1)*lps-1)+'（PP 定段，不切张量）');
    }
    if(key === 'w')   note = '每块的刀各不相同——点下面任意一块，才谈得上「本卡拿的是哪一份」。';
    if(key === 'g')   note = '反向才产生，优化器步用完才放得掉——和权重是同时压在卡上的两份。';
    if(key === 'opt') note = '主参数 fp32 + 动量 m + 二阶矩 v。面积最大的一档，'
      + '也是「换 optimizer 能省多少」的全部战场。';
    if(key === 'otmp') note = '只在一步的最后 12% 冒出来：梯度归约成 fp32 + 主参数更新的临时量。'
      + '整步都好好的、最后一下 OOM，说的就是这一档。';
    if(key === 'act'){
      var mub = Math.max(1, Math.min(D.pp, D.ga) - p);
      /* ②腔：ℓ←PP 竖着分段、s←CP 横着分段，本卡持有交叉那一格。
         h 这一轴上激活与权重**分道**——权重被 TP 切成 h/tp，激活却按整条 h 记：
         SP 把 s 切开省下的那份，进 TP 区之前要 AllGather 回全长，算子之间压着的
         就是全长那一份（memParts 里 act 用的正是整条 D.hidden，不除 tp）。
         所以这张图上没有 TP 那根轴，不是漏了。 */
      /* ②腔本体：ℓ←PP × s←CP × b←DP。同一把 DP 刀在这只盒子上**是轴**
         （整盒真被切成 dp 份），而在①上只能整只复印——两只盒子并排看正是这件事。 */
      figs.push('<div class="rm-fig">'
        + cavityBox3D({n:(D.cp>1?D.cp:1), dim:'cp', i:co.c},
                      {n:D.pp, dim:'pp', i:p},
                      {n:D.dp, dim:'dp', i:co.d},
                      {cell:MEMC.act})
        + '<span class="rm-cap">'+esc('②激活体 ℓ×s×b · h 全长 '+fmt(D.hidden)+'（TP 不切，算子间 AllGather 回全长）')+'</span></div>');
      /* 在途几份微批 = 卡上激活带被竖着分成几格，两处画同一件事 */
      fig({nx:mub, ix:0, lx:'在途 μb', ny:1, iy:0, ly:'', c:MEMC.act},
          '1F1B：stage '+p+' 此刻压着 '+mub+' 份');
      note = '唯一随时间轴动的一档。它不是切出来的常驻账，是流——装满不会崩的是流，'
        + '装满会崩的是常驻那三档。';
    }
    if(key === 'rsv'){
      fig({nx:1, ix:0, lx:'没有轴', ny:1, iy:0, ly:'不参与任何一把刀', c:MEMC.rsv},
          'allocator 碎片与 workspace');
      note = '每张卡的分配历史不同，这一截本来就不是同一个数。';
    }
  }
  /* 兄弟卡：写清点亮的是哪几组、各几张，颜色与阵列里的棱同色。
     组员名单不列——EP 组 8 张全写出来是一串没人读的数字，阵列上亮着的就是名单。 */
  var sibLine = '';
  var sibDs = memSibDims(key).filter(function(dm9){
    if(dm9 === 'ep') return D.moe && D.ep > 1;
    return D[dm9] > 1;
  });
  if(sibDs.length){
    sibLine = '<div class="rm-note">兄弟卡已点亮：'
      + sibDs.map(function(dm9){
          var n9 = dm9 === 'ep' ? D.ep : D[dm9];
          return '<b style="color:'+VC[dm9]+'">'+DIMN[dm9]+' 组</b> '+(n9-1)+' 张';
        }).join(' · ')
      + '——沿这几根轴与本卡凑齐一整份（棱色=刀色）</div>';
  }
  return '<div class="rm-d" style="--rmc:'+tint+'">'
    + '<div class="rm-dh"><b style="color:'+tint+'">'+esc(title)+'</b>'
    + '<button class="rm-dx" data-act="memblockpick" data-mk="" title="收起这一块">✕</button></div>'
    + '<dl>'+rows.join('')+'</dl>'
    + figs.join('')
    + (note ? '<div class="rm-note">'+esc(note)+'</div>' : '')
    + sibLine
    + '</div>';
}

/* ══ 选中 rank 的容器卡（Rank + 关整网）═════════════════════════════════
   128 只壳里画不下「卡里装了什么」（试过一版塞进去，只剩噪声）——改成
   **点亮哪只卡，就给哪只卡浮出这张容器图**：与交集腔 L3 / card-container
   独立页同一张图的静置版。固定机位、不跟转台——它读的是这张卡的账，不是机位。 */
function renderRankMem(D){
  var el = $('rankMem');
  if(!el) return;
  /* 过路的高亮不浮读出卡：那时亮着的常常是一整片卡（比如「这一层住在哪 32 张卡上」），
     再浮一张「rank 0 装了什么」，读者会把那一张的读数当成整片的读数。
     读出卡只跟**这一屏自己选中的那张卡**走。 */
  var on = ui.view==='chain' && ui.cardMode && ui.netOff && sel!==null && !ui.hlSel && D.ok && sel < D.world;
  if(!on){ el.hidden = true; ui.memSel = null; ui.memSelG = null; return; }
  var g = sel, co = coordsOf(g, D), p = co.p, lps = D.layersPerStage;
  /* 点开的那一块只属于**点开它时那张卡**：换了卡还留着上一张的展开，读者会把
     这一张的 GB 数配到上一张的切法上。跟着卡走，不跟着 key 走。 */
  if(ui.memSelG !== g){ ui.memSel = null; ui.memSelG = g; }
  var me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var segs = memParts(D, p, g), tot = segs.reduce(function(a,x){ return a+x.bytes; },0);
  var cap = D.hbm*Math.pow(2,30);
  var TONE = {w:MEMC.w, g:MEMC.g, opt:MEMC.opt, act:MEMC.act, rsv:MEMC.rsv};
  var groups = [];
  segs.forEach(function(sg){
    var rows = [];   /* 这一档自己的行：档头 + 明细 + 腔，组内顺序不动 */
    groups.push(rows);
    if(!sg.bytes) return;                       /* 这一刻是 0 的档（比如没跑走带时的优化器临时区）不占一行 */
    var col = sg.k==='act' ? VC.dp : (sg.k==='rsv' ? 'var(--pt-fg3)' : 'var(--pt-fg)');
    /* 整行可点 → 展开这一档自己的读数（见 memBlockDetail）。选中态反白它自己的
       签名色，与卡上那条带同一个颜色，不用回头对照图例。 */
    var onSg = ui.memSel === sg.k;
    rows.push('<tr class="rm-p'+(onSg?' on':'')+'" data-act="memblockpick" data-mk="'+esc(sg.k)+'" style="--rmc:'+TONE[sg.k]+'">'
      + '<td style="width:14px"><span style="display:inline-block;width:9px;height:9px;background:'+TONE[sg.k]+';border:1px solid var(--pt-bds);border-radius:2px;vertical-align:middle"></span></td>'
      + '<td style="color:'+col+';font-weight:700">'+esc(sg.label)+'</td>'
      + '<td style="text-align:right;color:'+col+';font-weight:700">'+fmtGB(sg.bytes)+' GB</td></tr>');
    if(onSg) rows.push('<tr><td colspan="3">'+memBlockDetail(D, g, sg.k)+'</td></tr>');
    /* 权重带的内部：图上那一条已经按刀色分块画出来了，但「哪一块是被哪把刀切的」
       只有颜色说不全——把块名与切法逐条列在它下面，颜色与图上一一对上。
       梯度与优化器态是同一份参数的 ×1 / ×6，同一套分法，不再抄两遍。 */
    if(sg.k === 'w' && sg.sub){
      sg.sub.forEach(function(x){
        if(!x.bytes) return;
        var mk = 'w:'+x.id, onX = ui.memSel === mk;
        rows.push('<tr class="rm-p'+(onX?' on':'')+'" data-act="memblockpick" data-mk="'+esc(mk)+'" style="--rmc:'+cutColor(x.cut)+'">'
          + '<td></td><td style="padding-left:2px;color:var(--pt-fg2)">'
          + '<span style="display:inline-block;width:7px;height:7px;background:'+cutColor(x.cut)+';border-radius:1px;margin-right:5px"></span>'
          + esc(x.id) + ' <span style="color:var(--pt-fg3)">' + esc(x.how) + '</span></td>'
          + '<td style="text-align:right;color:var(--pt-fg2)">'+fmtGB(x.bytes)+' GB</td></tr>');
        if(onX) rows.push('<tr><td colspan="3">'+memBlockDetail(D, g, mk)+'</td></tr>');
      });
    }
    /* 缩略图**不再常驻**：点开那一档时明细里已经有一张更完整的（见 memBlockDetail），
       两张挨在一起说同一件事，读者会先花一秒确认它们是不是同一张。图只在
       点开的时候出现——没点开时这张表就该是一张干净的账。 */
  });
  /* 图例按**卡上从上往下**的顺序排。卡是从底往上垒的（权重在最下、余量在最上），
     而读者是照着卡从上往下看的——图例若按垒的顺序列，读者得在脑子里把两张表倒过来
     对，每一行都要数一次。倒过来之后，图例第 n 档就是卡上从上数第 n 层。
     倒的是**档与档**：档内的明细（逐块切法、腔）仍然跟在自己那个档头下面，
     整组倒过来会让明细跑到档头上方、而且自己也颠倒，那是另一种乱。 */
  var rows = [];
  groups.reverse().forEach(function(gr){ rows = rows.concat(gr); });
  el.innerHTML =
    '<div class="rm-h"><b>rank '+g+'</b>'
    /* 层段这一行就是 **PP 的切**：PP 不切任何一个张量（所以它不在权重带的分块里），
       它切的是「哪几层住在这张卡上」。`stage0 · L0–L11` 已经把这件事说完了——
       后面再补一句「12/48 层 · PP 刀切 4 段」是同一句话换个说法，删掉。 */
    + '<span>tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+p+(me?' ep'+me.ep:'')+' · stage'+p+' · L'+(p*lps)+'–L'+((p+1)*lps-1)+'</span>'
    + '<button class="rm-x" data-act="rankmemclose" title="收起（同时取消选中）">✕</button></div>'
    + '<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 3px;font-family:var(--pt-mono)">'
    + rows.join('')
    + '<tr><td colspan="2" style="border-top:1px solid var(--pt-bd);padding-top:5px;font-weight:800;font-size:13px;color:'+(tot>cap?'var(--pt-danger)':'var(--pt-fg)')+'">合计 '+fmtGB(tot)+' / '+D.hbm+' GB</td>'
    + '<td style="border-top:1px solid var(--pt-bd);padding-top:5px;text-align:right;font-size:10.5px;color:var(--pt-fg3)">余量 '+fmtGB(cap-tot)+'</td></tr></table>'
;
  el.hidden = false;
}

/* ═════════ 总渲染 ═════════ */
function render(){
  var D = derive(cfg);
  if(sel!==null && (!D.ok || sel>=D.world)) sel = null;
  if(!D.moe){ if(ui.axis==='ep') ui.axis='tp'; if(ui.commDim==='ep') ui.commDim='tp'; }
  renderBar(D);
  renderStageTitle();
  /* 魔方与缩放 HUD 只服务切分链视图，别的视图一律先收起来 */
  if(ui.view!=='chain'){
    $('rubik').hidden = true; $('stage').hidden = false;
    var zh9 = $('zoomHud'); if(zh9) zh9.hidden = true;
    var gh9 = $('groupHud'); if(gh9) gh9.hidden = true;
    var oc9 = $('opCard'); if(oc9) oc9.hidden = true;
  }
  var foot = document.querySelector('.pt-foot');
  if(ui.view==='chain' || ui.view==='story'){ foot.style.display = 'none'; }
  else { foot.style.display = ''; renderFoot(D); }
  if(!D.ok){
    $('stage').innerHTML = '';
    $('stagebar').innerHTML = '';
    $('stageNote').hidden = true; $('detach').hidden = true;
    $('stage').innerHTML = '<div class="pt-blocked"><div><b>✕ 配置不合法，不渲染视图</b><br><span style="font-size:12px">'+D.errors.length+' 条整除约束未满足（DP-5 宁缺毋误）</span><br><button class="pb" data-act="drawer" data-d="cfg">打开配置修正</button></div></div>';
  }else{
    if(ui.view==='dim') renderDim(D);
    else if(ui.view==='chain') renderChain(D);
    else if(ui.view==='compose') renderV1(D);
    else if(ui.view==='anatomy') renderV3(D);
    else if(ui.view==='solid') renderSolid(D);
    else if(ui.view==='story') renderStory(D);
    else renderV2(D);
  }
  renderRankMem(D);
  renderDetail(D);
  var dr = $('drawer');
  if(ui.drawer){ dr.hidden = false; dr.innerHTML = drawerHTML(D); }
  else dr.hidden = true;
  urlWrite();
}

/* ═════════ 事件 ═════════ */
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(t.matches('[data-cfg]')){
    var k = t.getAttribute('data-cfg'), v = parseInt(t.value,10);
    if(isNaN(v)) return;
    cfg[k] = Math.max(k==='experts'?0:1, v);
    if(k==='experts' && v===0){ cfg.ep=1; cfg.etp=1; }
    activePreset = null; stopAnim(); render();
    var nf = document.querySelector('[data-cfg="'+k+'"]'); if(nf) nf.focus();
  }
  if(t.id==='revLayer'){
    var Dv = derive(cfg);
    ui.chips = ui.chips.filter(function(c){ return c.k!=='layer'; });
    if(t.value !== '') ui.chips.push({k:'layer', v:t.value});
    ui.revLayer = t.value;
    /* 高亮与拆解卡都要跟着输入走，但**不能走 render()**：那会重建工具条与读出卡，
       输入框当场失焦，第二个数字就打不进去了。所以只重画场景与拆解卡，
       工具条上那圈高亮手动切一下。正视/侧视现在也是本页自己的 SVG（原生重画），
       层反查在那两张图上同样有落点（正视换代表层、侧视描层列），一并重画。 */
    renderRevOut(Dv);
    renderRevBar(Dv);
    var pill = t.closest('.pt-revl');
    if(pill) pill.classList.toggle('is-on', revLiOn(Dv));
    if(Dv.ok && ui.view==='chain'){
      barFrozen = true;
      try{ renderChain(Dv); } finally { barFrozen = false; }
    }
    urlWrite();
  }
});
/* ── 拖动转场景（刀序视图 + 交集腔视图）──
   全量重绘挂在指针移动上会卡，所以用 rAF 合并：一帧最多重绘一次。
   拖动中不写 URL（不然 history 会被刷爆），松手才写一次。 */
var drag3 = null;
$('stage').addEventListener('pointerdown', function(ev){
  var isCav = ui.view === 'solid' && ui.persp === 'cav';
  if(ui.view !== 'chain' && !isCav) return;
  var pan = isCav ? false : (ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.button === 1 || ui.viewTab !== '3d');
  if(ev.button === 1 || ev.ctrlKey) ev.preventDefault();
  var cs = 1;
  var svg = $('stage').querySelector('svg');
  if(svg){
    var ctm = svg.getScreenCTM();
    if(ctm) cs = 1/ctm.a;
  }
  drag3 = {x:ev.clientX, y:ev.clientY,
            yaw: isCav ? (ui.cavYaw||0) : ui.yaw3,
            pitch: isCav ? (ui.cavPitch||0) : ui.pitch3,
            panX:ui.panX3, panY:ui.panY3, pan:pan, cs:cs,
            moved:false, raf:0, cap:false, id:ev.pointerId, cav:isCav};
});
$('stage').addEventListener('pointermove', function(ev){
  if(!drag3) return;
  var dx = ev.clientX - drag3.x, dy = ev.clientY - drag3.y;
  if(Math.abs(dx) + Math.abs(dy) > 3) drag3.moved = true;
  if(drag3.moved && !drag3.cap){
    drag3.cap = true;
    try{ $('stage').setPointerCapture(drag3.id); }catch(e){}
    $('stage').style.cursor = 'grabbing';
  }
  if(!drag3.moved) return;
  if(drag3.cav){
    ui.cavYaw = drag3.yaw - dx*0.008;
    ui.cavPitch = clamp(drag3.pitch + dy*0.006, -1.2, 1.2);
    if(!drag3.raf) drag3.raf = requestAnimationFrame(function(){
      if(drag3) drag3.raf = 0;
      var D9 = derive(cfg); if(D9.ok) renderSolidCav(D9);
    });
    return;
  }
  if(drag3.pan){
    ui.panX3 = drag3.panX + dx*drag3.cs;
    ui.panY3 = drag3.panY + dy*drag3.cs;
    applyViewTransform();
    return;
  }
  ui.yaw3 = drag3.yaw - dx*0.008;
  ui.pitch3 = clamp(drag3.pitch + dy*0.006, -0.9, 1.57);
  lowDetail = true;
  if(!drag3.raf) drag3.raf = requestAnimationFrame(function(){
    if(drag3) drag3.raf = 0;
    var D9 = derive(cfg); if(D9.ok && ui.view==='chain') renderChain(D9);
  });
});
var swallowClick = false;
function endDrag3(ev){
  if(!drag3) return;
  var moved = drag3.moved, wasPan = drag3.pan;
  lowDetail = false;
  if(drag3.raf) cancelAnimationFrame(drag3.raf);
  var cap = drag3.cap;
  drag3 = null;
  $('stage').style.cursor = '';
  if(cap) try{ $('stage').releasePointerCapture(ev.pointerId); }catch(e){}
  /* 拖过就不是点击：吞掉紧跟着的那一次 click，否则松手会顺手换掉选中卡 */
  swallowClick = moved;
  if(moved){
    /* 平移的画面已经由 transform 摆对了，立刻全量重画只是把停手的瞬间变成一次
       卡顿——写回 URL，让 crisp 防抖去补那帧清晰的。转台松手才需要立即全量
       （lowDetail 期间少画的东西要立刻补回来）。 */
    if(wasPan){ urlWrite(); scheduleCrisp(); }
    else render();
  }
}
$('stage').addEventListener('click', function(ev){
  if(swallowClick){ swallowClick = false; ev.stopPropagation(); ev.preventDefault(); return; }
  /* 点画布空白 = 散掉过路的高亮。空白是「我不看这个了」最自然的说法，而高亮本来
     就没有 × 可摘（有 × 的是标签，那是读者自己下的条件，点空白不该动它）。
     点在任何控件/卡壳/算子上都不算空白——那些是「换一个看」，不是「不看了」。 */
  if(ev.target.closest && (ev.target.closest('[data-act]') || ev.target.closest('.cardg') || ev.target.closest('.opblk'))) return;
  if(clearHL()) render();
}, true);
$('stage').addEventListener('pointerup', endDrag3);
$('stage').addEventListener('pointercancel', endDrag3);
/* ── 滚轮缩放（向光标位置缩放）：只改 transform，不重建场景 ── */
$('stage').addEventListener('wheel', function(ev){
  if(ui.view !== 'chain') return;
  ev.preventDefault();
  var svg = $('stage').querySelector('svg');
  if(!svg) return;
  var factor = ev.deltaY > 0 ? 1/1.15 : 1.15;
  var next = clamp(ui.zoom3 * factor, 0.2, 20);
  var r = next / ui.zoom3;
  var ctm = svg.getScreenCTM();
  if(ctm){
    var inv = ctm.inverse();
    var sx = inv.a*ev.clientX + inv.c*ev.clientY + inv.e;
    var sy = inv.b*ev.clientX + inv.d*ev.clientY + inv.f;
    var vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    var cx9 = vb[2]/2, cy9 = vb[3]/2;
    /* getScreenCTM 给的是**渲染基线**的用户坐标——连续滚动时上面还压着一层
       gesture 的 CSS transform，先把光标换算到「当前 ui 状态」的约定坐标系里，
       缩放锚点才不会一格一格漂。 */
    var vr9 = viewRendered;
    if(vr9){
      var kk = ui.zoom3 / vr9.zoom;
      sx = kk*(sx - cx9 - vr9.panX) + cx9 + ui.panX3;
      sy = kk*(sy - cy9 - vr9.panY) + cy9 + ui.panY3;
    }
    /* 场景约定 screen = C + pan + zoom·(base − C)，C = viewBox 中心。
       让光标那点不动 ⇒ pan' = (1−r)(光标 − C) + r·pan。 */
    ui.panX3 = (1-r)*(sx - cx9) + r*ui.panX3;
    ui.panY3 = (1-r)*(sy - cy9) + r*ui.panY3;
  }
  ui.zoom3 = next;
  applyViewTransform();
}, {passive:false});
/* ── 双击复位到**当前视角 tab**的标准机位 ── */
$('stage').addEventListener('dblclick', function(ev){
  if(ui.view !== 'chain') return;
  if(ev.target.closest('[data-act]') || ev.target.closest('.cardg')) return;
  var tp0 = VTAB_POSE[ui.viewTab] || VTAB_POSE['3d'];
  ui.yaw3 = tp0[0]; ui.pitch3 = tp0[1]; ui.zoom3 = 1; ui.panX3 = 0; ui.panY3 = 0;
  render();
});
/* ── 触屏双指缩放+平移 ── */
var touch3 = null;
$('stage').addEventListener('touchstart', function(ev){
  if(ui.view !== 'chain' || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  touch3 = {mx:mx, my:my, dist:dist, zoom:ui.zoom3, panX:ui.panX3, panY:ui.panY3, cs:1};
  var svg = $('stage').querySelector('svg');
  if(svg){ var ctm = svg.getScreenCTM(); if(ctm) touch3.cs = 1/ctm.a; }
}, {passive:false});
$('stage').addEventListener('touchmove', function(ev){
  if(!touch3 || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  var r = dist / touch3.dist;
  ui.zoom3 = clamp(touch3.zoom * r, 0.2, 20);

  }
  /* 宿主（驾驶舱）驱动：不重载 iframe 也能换视图 / 选中卡 / 换预置。
     只认白名单字段，非法值忽略——宿主传错不该让这一格白屏。 */
  if(d.type==='pto:state'){
    if(VIEWS.some(function(x){ return x.id===d.view; })) ui.view = d.view;
    if(COMM_DIMS.indexOf(d.cut)>=0) ui.cutDim = d.cut;
    if(d.preset){
      var p2 = PRESETS.filter(function(x){ return x.id===d.preset; })[0];
      if(p2){ cfg = JSON.parse(JSON.stringify(p2.cfg)); activePreset = p2.id; }
    }
    /* sel = 「宿主替这一屏选了一张卡」，是**选中**，读出卡照浮。
       hl  = 「另一格点了什么，这一屏跟着照亮」，是**过路的高亮**：不落标签、
             不浮读出卡、点画布空白就散（见 ui.hlLayer / ui.hlSel 那段说明）。
       台面两格之间走的一律是 hl —— 一格里的点击不该在另一格留下一句没人下过的条件。 */
    if(typeof d.sel === 'number' && d.sel >= 0){ sel = d.sel; ui.hlSel = false; }
    if(d.sel === null){ sel = null; ui.hlSel = false; }
    /* 训练步进度（0–1）：泳道那条游标走到哪儿，逐卡的激活体就按 1F1B 的形状算到哪儿。
       null 收回游标，回到峰值（默认态）。只改逐卡读数，聚合口径不动。 */
    if(d.step !== undefined){
      ACT_T = (typeof d.step === 'number' && isFinite(d.step)) ? clamp(d.step, 0, 1) : null;
    }
    if(d.hl !== undefined){
      if(d.hl === null) clearHL();
      else{
        if(typeof d.hl.layer === 'number'){ ui.revLayer = String(d.hl.layer); ui.hlLayer = true; }
        else if(d.hl.layer === null && ui.hlLayer){ ui.revLayer = ''; ui.hlLayer = false; }
        if(typeof d.hl.rank === 'number'){ sel = d.hl.rank; ui.hlSel = true; }
        else if(d.hl.rank === null && ui.hlSel){ sel = null; ui.hlSel = false; }
      }
    }
    if(d.l5 === true || d.l5 === false) (ui.layersUser[ui.view] = ui.layersUser[ui.view]||{}).L5 = d.l5;
    if(d.theme==='dark'||d.theme==='light') document.documentElement.setAttribute('data-theme', d.theme);
    render();
    /* 回报当前状态，宿主据此对齐别的格（选中卡可能被本页夹紧过） */
    if(ev.source) ev.source.postMessage({type:'pto:state-ack', view:ui.view, cut:ui.cutDim, sel:sel, preset:activePreset}, '*');
  }
});
/* 页内换选中卡时主动上报，宿主用它联动别的组件（A8 的跨组件版）。
   独立打开时 parent===window，函数存在但什么也不做。 */
window.ptoNotifyHost = function(){
  if(window.parent && window.parent !== window)
    window.parent.postMessage({type:'pto:select', sel:sel, view:ui.view, cut:ui.cutDim}, '*');
};

/* 刀序视图的 viewBox 宽度是**按舞台实测长宽比**反解的（见 renderChain）。
   首帧量到的是布局还没落定的高度，之后底部图例一排下来舞台会缩——不重画就永远按错的比例
   letterbox。盯着舞台的尺寸变化重画一次；重画只换 SVG 内容、不改舞台本身，不会自激。 */
if(window.ResizeObserver){
  var roLast = 0, roTimer = 0;
  new ResizeObserver(function(){
    var el = $('stage'); if(!el || ui.view!=='chain' || el.clientHeight<60) return;
    var ar = (el.clientWidth-20)/(el.clientHeight-12);
    if(Math.abs(ar - roLast) < 0.02) return;
    roLast = ar;
    clearTimeout(roTimer); roTimer = setTimeout(render, 60);
  }).observe($('stage'));
}

urlLoad();
/* q= 带进来的那句话要真的生效（选中卡、落下刀），不能只是把字填回框里 */
(function(){ var D0 = derive(cfg); if(D0.ok && ui.chips.length) applyQuery(D0); })();
render();
})();
</script>
</body>
</html>
