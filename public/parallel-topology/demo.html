<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<title>并行拓扑 · PRD Demo（应用形态）</title>
<!-- PTO Design System：与逻辑魔方 / net-sharding 同一 token 层；缺失时以下所有 var() 均带回退值 -->
<link rel="stylesheet" href="../vendor/pto-design-system/styles.css">
<!-- 真数据层（缺失时本页自动退回内置口径，单文件打开仍可用）：
     · model-graphviz/graph.js   —— openPangu 整网图：55 个真节点（35 个算子 + 6 个通信算子）
     · net-sharding/pattern.js   —— createModel() 是**纯数据层**（它自己的契约写明无 DOM/无渲染），
       带一张手工标注的 SHARD 表：每个节点被哪把刀沿哪根张量轴切、为什么、是否 partial、
       通信原语把分片状态从什么搬到什么。shardOfNode(id, rank) 还给出这张卡实际持有的区间。
     真图**没有 shape**，所以字节仍由配置算——算子行的宽度按类别权重，不冒充字节。 -->
<script src="../vendor/model-graphviz/graph.js"></script>
<script src="../vendor/net-sharding/pattern.js"></script>
<!-- 正视/侧视不自己画：直接挂 pto-design-system 的 model-architecture 系列。
     侧视 = right view（46 层沿层深 + PP Stage 分段），正视 = front view（一层的算子
     DAG）。切分链画的本来就是同一个对象，那边画得准，所以是复用不是重画。
     依赖必须按 model-graphviz → 3d-deck → training-sidecar 的顺序加载。 -->
<link rel="stylesheet" href="../vendor/pto-tokens/foundation.css">
<link rel="stylesheet" href="../vendor/pto-tokens/semantic.css">
<link rel="stylesheet" href="../vendor/pto-tokens/components.css">
<link rel="stylesheet" href="../vendor/pto-design-system/css/style.css">
<link rel="stylesheet" href="../vendor/model-architecture-3d-deck/pattern.css">
<link rel="stylesheet" href="../vendor/model-architecture-training-sidecar/pattern.css">
<link rel="stylesheet" href="../vendor/rubik-cube/pattern.css">
<script src="../vendor/model-graphviz/pattern.js"></script>
<script src="../vendor/model-architecture-3d-deck/pattern.js"></script>
<script src="../vendor/model-architecture-training-sidecar/pattern.js"></script>
<style>
/* ════════════════════════════════════════════════════════════════════
   parallel-topology demo —— PRD 的应用形态呈现（参照逻辑魔方 pattern 的壳）。
   纪律与 net-sharding 相同：视觉一律取 token（带回退），维度只用签名色；
   五类对象五种画法：容器=线框、内容=实心体积、结构=无厚度线、地址=文字、动作=连线。
   ════════════════════════════════════════════════════════════════════ */
.pt-root{
  --pt-tp: var(--dim-tp, #22d3ee);
  --pt-pp: var(--warning, #ffaa3b);
  --pt-dp: var(--primary, #4369ef);
  --pt-ep: var(--highlight-l0a-violet-400, #9b3cf6);
  --pt-cp: var(--highlight-ub-green-600, #86c70f);
  --pt-bg: var(--background, #f6f7f9);
  --pt-s1: var(--surface-1, #ffffff);
  --pt-s2: var(--surface-2, #eef0f3);
  --pt-fg: var(--foreground, rgba(10,14,20,.92));
  --pt-fg2: var(--foreground-secondary, rgba(10,14,20,.62));
  --pt-fg3: var(--foreground-muted, rgba(10,14,20,.42));
  --pt-bd: var(--border-default, rgba(10,14,20,.14));
  --pt-bds: var(--border-strong, rgba(10,14,20,.26));
  --pt-danger: var(--danger, #d1242f);
  --pt-face1: color-mix(in srgb, var(--pt-s1) 94%, #ffffff 6%);
  --pt-face2: color-mix(in srgb, var(--pt-s1) 88%, #000000 12%);
  --pt-face3: color-mix(in srgb, var(--pt-s1) 78%, #000000 22%);
  --pt-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
  --pt-sans: var(--font-sans, -apple-system, "PingFang SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif);
  position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--pt-bg); color:var(--pt-fg); font-family:var(--pt-sans); font-size:13px;
}
.pt-root *{box-sizing:border-box}
.pt-root button{font-family:inherit; cursor:pointer}
.pt-root .mono{font-family:var(--pt-mono)}

/* ── 顶栏 ── */
.pt-bar{
  flex:none; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
  padding:8px 14px; border-bottom:1px solid var(--pt-bd); background:var(--pt-s1); z-index:12;
}
.pt-title{line-height:1.25; margin-right:2px}
.pt-title b{font-size:14px}
.pt-title .sub{display:block; font-size:10.5px; color:var(--pt-fg2)}
.pt-title .sub a{color:inherit}
.pt-seg{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--pt-bd); border-radius:999px; background:var(--pt-s2)}
.pt-seg button{
  min-height:26px; padding:0 12px; font-size:12px; font-weight:600; border:none; border-radius:999px;
  background:transparent; color:var(--pt-fg2);
}
.pt-seg button:hover{color:var(--pt-fg)}
.pt-seg button.is-on{background:var(--c, var(--pt-fg)); color:var(--pt-bg)}
.pt-chips{display:inline-flex; gap:5px; flex-wrap:wrap; align-items:center}
.pt-chip{
  font-family:var(--pt-mono); font-size:11px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s1);
}
.pt-chip b{color:var(--pt-fg)}
.pt-chip.is-btn:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-chip.err{color:#fff; background:var(--pt-danger); border-color:var(--pt-danger); font-weight:700}
.pt-actions{margin-left:auto; display:inline-flex; gap:6px}
.pt-actions button{
  min-height:28px; padding:0 13px; font-size:12px; font-weight:600; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
.pt-actions button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-actions button.is-on{background:var(--pt-fg); border-color:var(--pt-fg); color:var(--pt-bg)}

/* ── 主区 ── */
.pt-main{flex:1 1 auto; position:relative; min-height:0}
.pt-stage{position:absolute; inset:0; padding:0}
.pt-stage svg{width:100%; height:100%; display:block}
/* sidecar 的挂载面：和 SVG 舞台同一个盒子，二选一显示 */
.pt-deck{position:absolute; inset:0; min-height:0}
.pt-rubik{position:absolute; inset:0; min-height:0}
.pt-rubik[hidden]{display:none}
/* 魔方自带一整条顶栏（着色/注入/连线/并行度输入/预设，就是它的配置面板入口）。
   不能像 sidecar 那样一藏了之——藏掉配置就没了。往下挪开我们那排胶囊即可，
   两套控件各管各的：我们的管「看哪一维、切哪几刀」，它的管魔方自己的读法。 */
.pt-rubik .prc-topbar{top:56px !important}
.pt-rubik .prc-more{top:104px !important}
.pt-rubik .prc-root{--prc-topbar-offset:56px}
.pt-deck[hidden]{display:none}
.pt-deckhost{width:100%; height:100%; min-height:0}
/* DP 复印：整张正视图复制成方阵，每格一份副本。DP 切的是整网不是某一层，
   所以每格都是完整的一张图，不是抠出来的一层。 */
/* scrollbar-gutter 必须 stable：副本一插进来就撑出滚动条，容器宽度一变
   sidecar 会重新 fit，而已经克隆好的副本停在旧缩放上，16 格就对不齐了 */
.pt-deck.is-tiled{
  display:grid; grid-auto-flow:column; grid-auto-rows:auto; gap:6px;
  overflow:auto; scrollbar-gutter:stable;
  padding:52px 14px 14px; align-content:center;
}
/* 一屏摆 16 份时每格才 80 来 px 宽，badge 比图还大、直接把内容盖死。
   窄到这个程度就先收起来，放大到看得清算子了再露出来。 */
.pt-deck.is-tiled.is-dense .pto-model-deck__annotation{display:none !important}
.pt-deck.is-tiled.is-dense .pt-dpcap{font-size:9px; padding:0 5px; left:4px; top:4px}
/* 每格底部的切分角标。sidecar 自带的「TP ×2 · attention shard」是给整屏宽度设计
   的一条横幅，80px 的格子里放不下（is-dense 把它整条藏了），可 TP/EP 到底切没切
   是这一屏必须回答的事——换成只有份数的紧凑版顶上，格子再小也读得出。 */
/* 轴标签：DP 沿列头排一行、TP 沿行头排一列，和 3D 那边同一套语法。
   原来每格左下角挂一枚「TP×2 EP×8」的角标——那是把轴的信息抄进了每一个格子，
   32 份重复，还占掉卡片底部。轴上标一次就够。 */
.pt-deck .pt-axlab{
  position:absolute; z-index:6; pointer-events:none;
  font-family:var(--pt-mono); font-size:9.5px; font-weight:800; line-height:15px;
  padding:0 7px; border-radius:999px; border:1px solid currentColor; background:var(--pt-bg);
  white-space:nowrap;
}
.pt-deck .pt-axlab.is-on{color:var(--pt-bg) !important; background:currentColor; box-shadow:0 0 0 1px currentColor}
.pt-deck .pt-axlab.is-on b{color:var(--pt-bg)}
.pt-deck .pt-dpcut{
  position:absolute; left:4px; right:4px; bottom:4px; z-index:3;
  display:none;
}
/* 叠在 sidecar 算子上的刀口条：这个算子被锯成几片、本卡拿的是哪一片。
   sidecar 自己只给一条说明性 badge，图元上看不出切没切——3D 那边是实心/斜纹
   分得清清楚楚的，这两个视图不能只剩一句话。算子带 data-node，id 和整网图
   同一套，所以 3D 用的那份切分表可以直接叠上来。 */
/* 刀口画成**沿算子宽度的竖直分割**，不是底下一条细杠：TP 锯的就是算子的 h 轴，
   EP 分的就是专家序号，两者都是把这个盒子横着均分成 n 份。本卡那份铺底色，
   份与份之间留虚线刀痕——3px 的细杠在 80px 的格子里等于没画。 */
.pt-deck .pt-cutbar{
  position:absolute; inset:0; display:flex; pointer-events:none; z-index:4;
  border-radius:inherit; overflow:hidden;
}
.pt-deck .pt-cutbar i{flex:1; border-right:1px dashed var(--c); opacity:.55}
.pt-deck .pt-cutbar i:last-child{border-right:none}
.pt-deck .pt-cutbar i.on{background:var(--c); opacity:.3}
.pt-deck .pt-dpcut i{
  font-style:normal; padding:0 4px; border-radius:4px; line-height:13px;
  border:1px solid currentColor; background:var(--pt-bg);
}
/* 高度不占满容器，按正视图自身的内容比例走。3d-deck 的 front fit 是
   min(w/850, h/1810)：格子一高，缩放就被宽度卡死，多出来的高度全是空白，
   卡片看着就是「一条特别高的白板中间浮着一小张图」。 */
/* 正视是竖长的（3d-deck 的 front fit 基准 850×1810），侧视是宽扁的（3000×1900）——
   两者共用一个比例的话，侧视那份会被压成一条。 */
.pt-deck.is-tiled.is-side > *{aspect-ratio:3000/1900}
.pt-deck.is-tiled > *{
  position:relative; overflow:hidden; aspect-ratio:850/1810; height:auto;
  border:1px solid var(--pt-bd); border-radius:10px; background:var(--pt-s1);
}
.pt-deck.is-tiled .pt-dpcap{
  position:absolute; left:8px; top:6px; z-index:3; font-family:var(--pt-mono);
  font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px;
  border:1px solid var(--pt-dp); color:var(--pt-dp); background:var(--pt-bg);
}
/* 副本是死的克隆：不吃指针，也别让它里面的浮层跑到格子外面去 */
.pt-deck.is-tiled > .pt-dpclone{pointer-events:none}
/* sidecar 自带一整条顶栏（3D/正视/侧视 + PP/TP/EP/DP + 数据/主题/适配）——
   视角和刀都由本页工具条统管，它那条会是第二套互相打架的控件，藏掉。 */
.pt-deck .pto-model-deck__toolbar,
.pt-deck .pto-model-deck__topbar,
.pt-deck .pto-model-deck__title,
.pt-deck .pto-training-sidecar__toolbar{display:none !important}
/* 正视格子里的 TP/EP 标注是挂在具体算子上的小 badge，要留着——那正是这一格
   里「锯到哪、分到哪」的读数。只把横幅式的整体标注（is-side）挡掉：它是给
   整张侧视图用的一条通栏，塞进 190px 宽的格子只会被裁成半句话。 */
/* sidecar 自带的那两条大 badge（TP ×2 · attention shard / EP ×8 · expert routing）
   一概不要：它是给单张整屏图设计的一条横幅，在这里会横穿卡片、还重复 32 遍，
   而且它只说「切成几份」，不说这张卡拿的是哪一份。切分改由刀口条直接画在算子
   上、编号由角标给。 */
.pt-deck .pto-model-deck__annotation{display:none !important}
.pt-deck.is-tiled .pto-model-deck__annotation.is-side{display:none !important}
/* badge 是给整屏宽度设计的一条横排，塞进 320px 的格子会被右边缘切掉半句话。
   统一贴到格子左边、限宽换行，才读得完整。 */
.pt-deck.is-tiled .pto-model-deck__annotation{
  left:5px !important; right:auto !important; max-width:calc(100% - 10px);
  white-space:normal; font-size:9px; line-height:1.3; text-align:left;
}
.pt-stagebar{
  position:absolute; top:10px; right:14px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  justify-content:flex-end; max-width:min(72%, 780px);
}
.pb{
  min-height:26px; padding:0 11px; font-size:11.5px; font-weight:600; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
.pb:hover{border-color:var(--c, var(--pt-bds)); color:var(--pt-fg)}
.pb.is-on{background:var(--c, var(--pt-fg)); border-color:var(--c, var(--pt-fg)); color:var(--pt-bg)}
.pb:disabled{opacity:.38; cursor:not-allowed; text-decoration:line-through}
.pb.mono{font-family:var(--pt-mono); font-weight:600}
.pb .cmn{font-size:9px; opacity:.75; margin-left:4px; font-weight:400}
.pt-cap{font-family:var(--pt-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--pt-fg3); align-self:center; margin:0 2px}

/* 浮动卡通用 */
.pt-card{
  position:absolute; z-index:8; background:var(--pt-s1); border:1px solid var(--pt-bd);
  border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.14); padding:12px 14px;
}
/* 右侧读出卡（FR-3） */
/* 从工具条下面起头：top:10px 时它会顶到胶囊那一排底下，把「EP」和「卡维度」
   这两颗按钮压住——读出卡是次要信息，不该挡住控件。 */
.pt-detail{top:52px; right:14px; width:290px; max-height:calc(100% - 64px); overflow:auto; font-size:12px}
.pt-detail h4{margin:0 0 6px; font-family:var(--pt-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--pt-fg3); display:flex; justify-content:space-between; align-items:center; gap:8px}
.pt-detail .grank{font-family:var(--pt-mono); font-size:21px; font-weight:800}
.pt-detail .grank small{font-size:10px; font-weight:400; color:var(--pt-fg3); margin-left:6px}
.pt-x{border:none; background:none; color:var(--pt-fg3); font-size:14px; padding:0 3px}
.pt-x:hover{color:var(--pt-danger)}
.coords{display:flex; flex-wrap:wrap; gap:4px; margin:7px 0}
.coords .c{font-family:var(--pt-mono); font-size:10.5px; border:1px solid var(--pt-bd); border-radius:5px; padding:1.5px 7px; color:var(--pt-fg2)}
.coords .c.hot{color:#fff; border-color:transparent; background:var(--c)}
.pt-detail .formula{font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg2); background:var(--pt-s2); border-radius:6px; padding:6px 8px; margin:7px 0; line-height:1.7; overflow-x:auto}
.pt-detail table{width:100%; border-collapse:collapse; font-size:11.5px; margin:4px 0}
.pt-detail td{padding:2.5px 3px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.pt-detail td:first-child{color:var(--pt-fg3); font-family:var(--pt-mono); font-size:10.5px; white-space:nowrap}
.pt-detail code{font-family:var(--pt-mono); font-size:10.5px; background:var(--pt-s2); padding:.5px 4px; border-radius:4px}
.pt-detail .rev{margin-top:9px; border-top:1px solid var(--pt-bd); padding-top:8px}
.pt-detail .rev input{width:56px; font-family:var(--pt-mono); font-size:11px; padding:2px 6px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.rankchips{display:flex; flex-wrap:wrap; gap:3px; margin-top:5px}
.rankchips button{font-family:var(--pt-mono); font-size:10px; padding:1px 6px; border-radius:5px; border:1px solid var(--pt-bd); background:var(--pt-s2); color:var(--pt-fg2)}
.rankchips button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-go{display:inline-block; margin-top:7px; font-size:11px; font-weight:600; color:var(--pt-dp); cursor:pointer}

/* 抽屉（配置 / 验收）：从顶栏落下，右侧 */
.pt-drawer{top:10px; right:14px; width:min(680px, calc(100% - 28px)); max-height:calc(100% - 20px); overflow:auto; z-index:11}
.pt-drawer h4{margin:0 0 8px; font-family:var(--pt-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--pt-fg3)}
.cfg-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:10px 16px}
.frow{display:flex; align-items:center; gap:7px; margin-bottom:6px; font-size:12px}
.frow label{flex:0 0 108px; color:var(--pt-fg2); display:flex; align-items:center; gap:5px}
.frow input{width:84px; font-family:var(--pt-mono); font-size:12px; padding:3px 7px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.frow input:disabled{opacity:.5}
.frow .hint{font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg3)}
.frow.derived{background:color-mix(in srgb, var(--pt-dp) 10%, transparent); border-radius:7px; padding:4px 6px; margin-left:-6px}
.frow.derived .val{font-family:var(--pt-mono); font-weight:800; font-size:13px; color:var(--pt-dp)}
.stepn{display:inline-block; font-family:var(--pt-mono); font-size:9px; color:var(--pt-bg); background:var(--pt-fg3); border-radius:50%; width:14px; height:14px; line-height:14px; text-align:center; flex:none}
.dk{font-family:var(--pt-mono); font-weight:700; font-size:10px; padding:0 5px; border-radius:4px; color:#fff; background:var(--c)}
.verr,.vwarn,.vok{border-radius:8px; padding:7px 11px; margin-top:7px; font-size:12px; border:1px solid}
.verr{background:color-mix(in srgb, var(--pt-danger) 9%, transparent); border-color:color-mix(in srgb, var(--pt-danger) 40%, transparent); color:var(--pt-danger)}
.vwarn{background:color-mix(in srgb, var(--pt-pp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-pp) 40%, transparent); color:color-mix(in srgb, var(--pt-pp) 70%, var(--pt-fg) 30%)}
.vok{background:color-mix(in srgb, var(--pt-cp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-cp) 40%, transparent); color:color-mix(in srgb, var(--pt-cp) 60%, var(--pt-fg) 40%)}
.fixes{margin-top:5px; display:flex; flex-wrap:wrap; gap:5px}
.fixes button{font-family:var(--pt-mono); font-size:10.5px; padding:2px 9px; border-radius:999px; border:1px solid currentColor; background:transparent; color:inherit}
.fixes button:hover{background:var(--pt-danger); border-color:var(--pt-danger); color:#fff}
.diagrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.dstat{font-family:var(--pt-mono); font-size:10.5px; padding:3px 9px; border-radius:7px; border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s2)}
.dstat.warn{border-color:color-mix(in srgb, var(--pt-pp) 55%, transparent); color:color-mix(in srgb, var(--pt-pp) 75%, var(--pt-fg) 25%)}
.acc-t{width:100%; border-collapse:collapse; font-size:11.5px}
.acc-t td{padding:5px 7px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.acc-t td:first-child{font-family:var(--pt-mono); font-weight:700; white-space:nowrap}
.badge{font-family:var(--pt-mono); font-size:9.5px; padding:1.5px 7px; border-radius:999px; white-space:nowrap; border:1px solid}
.badge.pass{color:color-mix(in srgb, var(--pt-cp) 65%, var(--pt-fg) 35%); border-color:color-mix(in srgb, var(--pt-cp) 50%, transparent); background:color-mix(in srgb, var(--pt-cp) 10%, transparent)}
.badge.manual{color:var(--pt-fg2); border-color:var(--pt-bd); background:var(--pt-s2)}
.badge.fail{color:var(--pt-danger); border-color:var(--pt-danger)}

/* 抽离图 / 折叠提示：舞台内底部浮动 */
.pt-detach{left:14px; bottom:12px; width:min(600px, 62%); z-index:7; padding:10px 12px}
.pt-detach svg{width:100%; height:auto; display:block}
.pt-note{
  position:absolute; left:14px; bottom:12px; z-index:5; max-width:min(520px, 60%);
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-left:3px solid var(--pt-fg);
  border-radius:8px; padding:7px 11px; font-size:11.5px; color:var(--pt-fg2);
}
.pt-note .pb{margin-left:6px; min-height:22px; padding:0 9px; font-size:10.5px}
.pt-detach:not([hidden]) ~ .pt-note{bottom:auto; top:10px; left:50%; transform:translateX(-50%)}
/* 动画字幕 */
.pt-animcap{
  position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:9; display:none;
  font-family:var(--pt-mono); font-size:11px; background:color-mix(in srgb, var(--pt-fg) 92%, transparent);
  color:var(--pt-bg); border-radius:999px; padding:6px 16px; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pt-animcap b{color:var(--pt-bg)}
/* 舞台被配置错误封锁 */
.pt-blocked{position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--pt-fg2); z-index:4; font-size:13px}
.pt-blocked b{color:var(--pt-danger)}
.pt-blocked .pb{margin-top:10px; justify-self:center}

/* ── 底栏 ── */
/* 嵌入模式（?host=cockpit）：藏掉本页顶栏——驾驶舱的格头已经写了这是哪一格，
   配置与选中卡由宿主统一驱动，再留一条自己的顶栏就是两套控制器打架。
   底部图层条保留：L5 通信 / 原语这些是**本格自己的**开关，宿主并不代管。 */
.pt-root.embed .pt-bar{display:none}
.pt-root.embed .pt-main{border-top:0}
.pt-foot{flex:none; border-top:1px solid var(--pt-bd); background:var(--pt-s1); padding:6px 14px 8px; z-index:10; display:flex; flex-direction:column; gap:5px}
.pt-lrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pt-sep{width:1px; height:16px; background:var(--pt-bd); margin:0 4px}
.pt-krow{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--pt-fg2)}
.pt-key{display:inline-flex; align-items:center; gap:5px; font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg2); white-space:nowrap}
.pt-key svg{display:block}
.pt-say{flex:1 1 260px; min-width:200px; line-height:1.55; max-height:110px; overflow-y:auto}
.pt-say b{color:var(--pt-fg)}
.pt-say .a5{color:var(--pt-danger); font-weight:700}

/* tooltip */
#tip{position:fixed; z-index:50; pointer-events:none; display:none; background:var(--pt-fg); color:var(--pt-bg);
  font-family:var(--pt-mono); font-size:10.5px; padding:5px 9px; border-radius:7px; line-height:1.6; max-width:270px}

/* SVG 通用类：容器面 / 文字（颜色全走 token，明暗随主题翻转） */
.f1{fill:var(--pt-face1)} .f2{fill:var(--pt-face2)} .f3{fill:var(--pt-face3)}
.tI{fill:var(--pt-fg)} .tII{fill:var(--pt-fg2)} .tIII{fill:var(--pt-fg3)}
.lane{fill:var(--pt-s2); stroke:var(--pt-bd)}
@keyframes pulse2{0%,100%{opacity:.06} 30%,70%{opacity:1}}
.pulse2{animation:pulse2 .46s ease-in-out 2}
.pulse1{animation:pulse2 .8s ease-in-out 1}
/* 刀序链的变形效果：变形带自上而下生长、子块随后浮现 */
.mband{transform-box:fill-box;transform-origin:top center;animation:mgrow .5s ease-out both}
@keyframes mgrow{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}
.cgrow{animation:cfade .55s ease-out both;animation-delay:.22s}
@keyframes cfade{from{opacity:0}to{opacity:1}}

@media (max-width:900px){
  .pt-detail{width:min(86%, 304px)}
  .pt-stagebar{max-width:96%}
}
</style>

  </footer>
</div>
<div id="tip"></div>
<script>
(function(){
"use strict";

/* ═════════ 基础 ═════════ */
var C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGB(b){ return (b/Math.pow(2,30)).toFixed(b >= Math.pow(2,30)*10 ? 0 : 1); }
function fmtP(n){ return n>=1e9 ? (n/1e9).toFixed(2)+' B' : n>=1e6 ? (n/1e6).toFixed(1)+' M' : fmt(n); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function proj(x,y,z,s){ return [(x-z)*C*s, ((x+z)*S - y)*s]; }
function ptsStr(p){ return p.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); }
/* 维度签名色：与逻辑魔方 / net-sharding 同一套 token */
var VC = {tp:'var(--pt-tp)', cp:'var(--pt-cp)', pp:'var(--pt-pp)', dp:'var(--pt-dp)', ep:'var(--pt-ep)'};
var DIMN = {tp:'TP', cp:'CP', pp:'PP', dp:'DP', ep:'EP'};
function mix(colVar, pct){ return 'color-mix(in srgb, '+colVar+' '+pct+'%, transparent)'; }

/* A4 锚点：卡网格 axis 取值域（常量，不含 cp） */
var AXIS_DOMAIN = ['tp','pp','dp','ep'];
var COMM_DIMS = ['tp','cp','pp','dp','ep'];
/* 原语两类（§08）：P2P 是点对点，是所有集合原语的底座——ring AllReduce / AllGather
   本身就是一串 send/recv 接起来的；集合原语是「一组卡一起完成一次状态转换」的封装。
   两类都在计算图里以算子节点出现（send/recv、hcom_*），但在参照系里都是动作（线）：
   不持有字节、不被切，只占链路与时间。 */
var PRIMS = [
  {id:'p2p', name:'P2P(Ring)', kind:'点对点', why:'send/recv 一对一：不是集合通信，而是集合原语的底座——ring AllReduce/AllGather 都由一串 P2P 接成'},
  {id:'allgather', name:'AllGather', kind:'集合', why:'组内每张卡把自己的片给所有人 → 人人持全份'},
  {id:'reducescatter', name:'ReduceScatter', kind:'集合', why:'求和后按片散开 → 人人持一片的和'},
  {id:'allreduce', name:'AllReduce', kind:'集合', why:'ReduceScatter + AllGather：人人持全份的和'},
  {id:'alltoall', name:'All-to-All', kind:'集合', why:'每张卡给每张卡各发一份不同载荷 → 载荷不等（MoE 路由）'}
];
var COMMON = { tp:['allreduce','reducescatter','allgather'], cp:['p2p','alltoall','allgather'], pp:['p2p'], dp:['allreduce'], ep:['alltoall'] };

var PRESETS = [
  {id:'default128', name:'默认·128卡 tp2·pp4·dp16·ep8', cfg:{world:128, tp:2, cp:1, pp:4, ep:8, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:2048, vocab:128256, seq:8192, experts:64, topk:8, mbs:1, ga:8, hbm:64}},
  {id:'dense64', name:'稠密·64卡', cfg:{world:64, tp:4, cp:1, pp:4, ep:1, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:14336, vocab:128256, seq:8192, experts:0, topk:0, mbs:1, ga:8, hbm:64}},
  {id:'longcp', name:'长序列CP·64卡', cfg:{world:64, tp:4, cp:4, pp:2, ep:1, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:14336, vocab:128256, seq:131072, experts:0, topk:0, mbs:1, ga:16, hbm:64}},
  {id:'moe64', name:'MoE折叠·64卡', cfg:{world:64, tp:2, cp:1, pp:4, ep:8, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:2048, vocab:128256, seq:8192, experts:64, topk:2, mbs:1, ga:8, hbm:64}},
  {id:'story128', name:'故事·128卡 tp2·pp4·dp16（48层·H8192）', cfg:{world:128, tp:2, cp:1, pp:4, ep:1, etp:1, layers:48, hidden:8192, heads:64, kv:8, ffn:32768, vocab:128256, seq:8192, experts:0, topk:0, mbs:4, ga:8, hbm:64}},
  {id:'pangu', name:'盘古ProMoE·4000卡', cfg:{world:4000, tp:8, cp:1, pp:5, ep:2, etp:1, layers:40, hidden:5120, heads:40, kv:8, ffn:12800, vocab:153376, seq:4096, experts:64, topk:8, mbs:1, ga:20, hbm:64}},
  {id:'bad', name:'非法示例(A6)', bad:true, cfg:{world:64, tp:16, cp:1, pp:4, ep:1, etp:1, layers:32, hidden:4096, heads:33, kv:8, ffn:14336, vocab:128256, seq:8192, experts:0, topk:0, mbs:1, ga:8, hbm:64}}
];

/* ═════════ 状态（URL 即状态） ═════════ */
var cfg = JSON.parse(JSON.stringify(PRESETS[0].cfg));
var activePreset = 'default128';
var sel = null;
var ui = {
  view:'chain', cutDim:'dp', axis:'tp', commDim:'tp', commPrim:'allreduce', detach:false,   /* 默认落在「整网切分」——先看整张网怎么被切开，再拆单维 */
  cpFacet:0, yaw:0, unfold:true, unfoldSet:false, skew:true, zoomAR:false,   /* 全量优先；超大规模除外，见 v1Layout */
  act:0, act2:false, persp:'map',
  yaw3:0.42, pitch3:0.30, zoom3:1, panX3:0, panY3:0, spread:true, knife:99, kDP:true, kPP:true, kTP:true, kEP:true, viewTab:'3d',
  cardMode:false,   /* 卡维度：四刀切完的交集恰好是一张卡持有的东西，把它单独收进一只卡壳里看 */
  netOff:false,     /* 关掉整网：卡里不再画算子，只剩 world 只实心方块——那就是魔方 */
  layersUser:{}, revLayer:'', drawer:'', selLayerOff:0
};
var anim = {on:false, timer:null, phases:[], i:0};

var VIEWS = [
  {id:'chain', name:'整网切分'},
  {id:'story', name:'一个 step · 五幕'},
  {id:'dim', name:'单维切分'},
  {id:'compose', name:'合成·卡阵'},
  {id:'anatomy', name:'卡内解剖'},
  {id:'solid', name:'映射 · 双链/交集腔'},
  {id:'time', name:'时间·流'}
];
var LAYERS = ['L1','L2','L3','L4','L5'];
var LAYER_NAME = {L1:'L1 结构', L2:'L2 内容', L3:'L3 容器', L4:'L4 地址', L5:'L5 通信'};
var AVAIL = {
  dim:{L1:true, L2:true, L3:true,L4:true,L5:true},
  chain:{L1:false,L2:true, L3:true,L4:true,L5:false},
  compose:{L1:false,L2:true,L3:true,L4:true,L5:true},
  time:{L1:false,L2:false,L3:true,L4:true,L5:true},
  anatomy:{L1:true, L2:true, L3:true,L4:true,L5:true},
  solid:{L1:true, L2:true, L3:true,L4:true,L5:false},
  story:{L1:true, L2:true, L3:true,L4:true,L5:true}
};
var DEFAULTS = {
  dim:{L1:true,L2:true,L3:true,L4:true,L5:true},
  chain:{L2:true,L3:true,L4:true},
  compose:{L2:false,L3:true,L4:true,L5:false},
  time:{L3:true,L4:true,L5:true},
  anatomy:{L1:true,L2:true,L3:true,L4:true,L5:true},
  solid:{L1:true,L2:true,L3:true,L4:true},
  story:{L1:true,L2:true,L3:true,L4:true,L5:true}
};
function layerOn(L){
  var v = ui.view;
  if(!AVAIL[v][L]) return false;
  var u = ui.layersUser[v];
  if(u && (L in u)) return u[L];
  return !!(DEFAULTS[v] && DEFAULTS[v][L]);
}
function setLayer(L, val){
  ui.layersUser[ui.view] = ui.layersUser[ui.view] || {};
  ui.layersUser[ui.view][L] = val;
}

/* URL 读入 / 写出（与逻辑魔方同一约定：不认识的参数忽略，非法退默认） */
function urlLoad(){
  var q = new URLSearchParams(location.search);
  var theme = q.get('theme')==='dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var p = PRESETS.filter(function(x){ return x.id===q.get('preset'); })[0];
  if(p){ cfg = JSON.parse(JSON.stringify(p.cfg)); activePreset = p.id; }
  ['world','tp','cp','pp','ep','etp','layers','hidden','heads','kv','ffn','vocab','seq','experts','topk','mbs','ga','hbm'].forEach(function(k){
    var v = parseInt(q.get(k),10);
    if(isFinite(v) && v>=0){ cfg[k]=v; if(p===undefined) activePreset=null; }
  });
  /* 旧链接别名：v1..v5 仍可用（发出去的链接不能失效） */
  var vw = q.get('view');
  var LEGACY = {v1:'compose', v2:'time', v3:'anatomy', v4:['dim','dp'], v5:['dim','cp']};
  if(LEGACY[vw]){ var lg = LEGACY[vw]; if(Array.isArray(lg)){ ui.view = lg[0]; ui.cutDim = lg[1]; } else ui.view = lg; }
  else if(VIEWS.some(function(x){return x.id===vw;})) ui.view = vw;
  if(COMM_DIMS.indexOf(q.get('cut'))>=0) ui.cutDim = q.get('cut');
  var sl = parseInt(q.get('sel'),10); if(isFinite(sl) && sl>=0) sel = sl;
  if(q.get('host')==='cockpit') $('app').classList.add('embed');
  if(AXIS_DOMAIN.indexOf(q.get('axis'))>=0) ui.axis = q.get('axis');
  if(COMM_DIMS.indexOf(q.get('dim'))>=0) ui.commDim = q.get('dim');
  if(PRIMS.some(function(x){return x.id===q.get('prim');})) ui.commPrim = q.get('prim');
  if(q.get('l5')==='1') (ui.layersUser[ui.view]=ui.layersUser[ui.view]||{}).L5 = true;
  var fc = parseInt(q.get('facet'),10); if(isFinite(fc)&&fc>=0) ui.cpFacet = fc;
  if(q.get('skew')==='0') ui.skew = false;
  var ac = parseInt(q.get('act'),10); if(isFinite(ac) && ac>=0) ui.act = ac;
  if(q.get('act2')==='1') ui.act2 = true;
  if(q.get('p')==='cav'||q.get('p')==='map') ui.persp = q.get('p');
  if(q.get('stack')==='1') ui.spread = false;
  var kf = parseInt(q.get('knife'),10); if(isFinite(kf) && kf>=0) ui.knife = kf;
  if(q.has('cuts')){ var cs=q.get('cuts'); ui.kDP=cs.indexOf('d')>=0; ui.kPP=cs.indexOf('p')>=0; ui.kTP=cs.indexOf('t')>=0; ui.kEP=cs.indexOf('e')>=0; }
  if(q.has('vtab')) ui.viewTab = q.get('vtab');
  var yw = parseFloat(q.get('yaw')); if(isFinite(yw)) ui.yaw3 = yw;
  var pt = parseFloat(q.get('pitch')); if(isFinite(pt)) ui.pitch3 = clamp(pt, -0.9, 1.57);
  var zm = parseFloat(q.get('zoom')); if(isFinite(zm) && zm>0) ui.zoom3 = clamp(zm, 0.2, 20);
  var px3 = parseFloat(q.get('px')); if(isFinite(px3)) ui.panX3 = px3;
  var py3 = parseFloat(q.get('py')); if(isFinite(py3)) ui.panY3 = py3;
}
function urlWrite(){
  var q = new URLSearchParams();
  var theme = document.documentElement.getAttribute('data-theme');
  if(theme==='dark') q.set('theme','dark');
  if(ui.view!=='dim') q.set('view', ui.view);
  if(ui.view==='dim' && ui.cutDim!=='dp') q.set('cut', ui.cutDim);
  if(activePreset && activePreset!=='default128') q.set('preset', activePreset);
  if(!activePreset){
    ['world','tp','cp','pp','ep','etp','layers','seq','experts'].forEach(function(k){ q.set(k, cfg[k]); });
  }
  if(sel!==null) q.set('sel', sel);
  if(ui.view==='story' && ui.act) q.set('act', ui.act);
  if(ui.view==='chain' && !ui.spread) q.set('stack','1');
  if(ui.view==='chain'){ var cs2=(ui.kDP?'d':'')+(ui.kPP?'p':'')+(ui.kTP?'t':'')+(ui.kEP?'e':''); if(cs2!=='dpte') q.set('cuts',cs2); if(ui.viewTab!=='3d') q.set('vtab',ui.viewTab); }
  if(ui.view==='chain' && (Math.abs(ui.yaw3-0.42)>1e-3 || Math.abs(ui.pitch3-0.30)>1e-3)){
    q.set('yaw', ui.yaw3.toFixed(3)); q.set('pitch', ui.pitch3.toFixed(3));
  }
  if(ui.view==='chain' && Math.abs(ui.zoom3-1)>1e-3) q.set('zoom', ui.zoom3.toFixed(3));
  if(ui.view==='chain' && (Math.abs(ui.panX3)>0.5 || Math.abs(ui.panY3)>0.5)){
    q.set('px', ui.panX3.toFixed(1)); q.set('py', ui.panY3.toFixed(1));
  }
  if(ui.view==='solid' && ui.act2) q.set('act2','1');
  if(ui.view==='solid' && ui.persp!=='map') q.set('p', ui.persp);
  if(layerOn('L5') && (ui.view==='compose'||ui.view==='time')) q.set('l5','1');
  if(ui.commDim!=='tp') q.set('dim', ui.commDim);
  if(ui.commPrim!=='allreduce') q.set('prim', ui.commPrim);
  if(ui.cpFacet) q.set('facet', ui.cpFacet);
  var s = q.toString();
  history.replaceState(null, '', s ? '?'+s : location.pathname);
}

/* ═════════ 校验与推导（FR-1） ═════════ */
function divisorsOf(n){ var d=[],i; for(i=1;i<=n;i++) if(n%i===0) d.push(i); return d; }
function nearDiv(n,x){ var d=divisorsOf(n),lo=null,hi=null; d.forEach(function(v){ if(v<=x) lo=v; if(hi===null&&v>=x) hi=v; }); var o=[]; if(lo&&lo!==x)o.push(lo); if(hi&&hi!==x)o.push(hi); return o; }
function nearMult(v,m){ var lo=Math.max(m,Math.floor(v/m)*m),hi=lo+m,o=[]; if(lo!==v)o.push(lo); if(hi!==v)o.push(hi); return o.filter(function(x,i,a){return a.indexOf(x)===i;}); }

function derive(c){
  var D = {tp:+c.tp, cp:+c.cp, pp:+c.pp, world:+c.world, layers:+c.layers, hidden:+c.hidden,
    heads:+c.heads, kv:+c.kv, ffn:+c.ffn, vocab:+c.vocab, seq:+c.seq, experts:+c.experts,
    topk:+c.topk, mbs:+c.mbs, ga:+c.ga, hbm:+c.hbm, errors:[], warns:[]};
  D.moe = D.experts > 0;
  D.ep = D.moe ? +c.ep : 1; D.etp = D.moe ? +c.etp : 1;
  var denom = D.tp*D.cp*D.pp;
  D.dpOk = denom>0 && D.world % denom === 0;
  D.dp = D.dpOk ? D.world/denom : Math.max(1, Math.round(D.world/denom));
  function err(id,msg,fx){ D.errors.push({id:id,msg:msg,fixes:fx||[]}); }
  if(!D.dpOk) err('world_div','world % (TP·CP·PP) ≠ 0：world='+D.world+' 不能被 '+denom+' 整除，DP 算不出整数（残差维，§11）。',
    nearMult(D.world,denom).map(function(w){return {label:'world → '+w, patch:{world:w}};}));
  if(D.heads % D.tp !== 0) err('heads_tp','heads % TP ≠ 0：heads='+D.heads+' 不能被 TP='+D.tp+' 整除——注意力头须均分到 TP 组（§11）。',
    nearDiv(D.heads,D.tp).map(function(t){return {label:'TP → '+t, patch:{tp:t}};})
    .concat(nearMult(D.heads,D.tp).map(function(h){return {label:'heads → '+h, patch:{heads:h}};})));
  if(D.layers % D.pp !== 0) err('layers_pp','layers % PP ≠ 0：layers='+D.layers+' 不能被 PP='+D.pp+' 整除——层须均分成 stage（§11）。',
    nearDiv(D.layers,D.pp).map(function(p){return {label:'PP → '+p, patch:{pp:p}};})
    .concat(nearMult(D.layers,D.pp).map(function(l){return {label:'layers → '+l, patch:{layers:l}};})));
  if(D.seq % (2*D.cp) !== 0) err('seq_cp','seq % (2·CP) ≠ 0：seq='+D.seq+' 不能被 '+(2*D.cp)+' 整除——因果负载均衡取首尾对称两段（§11，V5 可见）。',
    nearMult(D.seq,2*D.cp).map(function(s){return {label:'seq → '+s, patch:{seq:s}};}));
  if(D.moe){
    if(D.experts % D.ep !== 0) err('experts_ep','experts % EP ≠ 0：experts='+D.experts+' 不能被 EP='+D.ep+' 整除（§11）。',
      nearDiv(D.experts,D.ep).map(function(e){return {label:'EP → '+e, patch:{ep:e}};}));
    D.moeMin = D.pp * Math.max(D.tp*D.cp, D.ep*D.etp);
    if(D.world < D.moeMin) err('moe_min','总卡数不足：MoE 最小卡数 = PP × max(TP·CP, EP·ETP) = '+D.moeMin+'（不是各维连乘）。当前 '+D.world+'。',
      [{label:'world → '+D.moeMin, patch:{world:D.moeMin}}]);
    if(D.dpOk){
      D.plane = D.tp*D.cp*D.dp;
      if(D.plane % (D.ep*D.etp) !== 0) err('plane_ep','(TP·CP·DP) % (EP·ETP) ≠ 0：stage 内平面 '+D.plane+' 张卡折不成 EP·ETP='+(D.ep*D.etp)+' 组（folding）。', []);
    }
  }
  if(D.hidden % D.heads !== 0) D.warns.push('hidden % heads ≠ 0：headDim 非整数，按取整显示。');
  if(D.kv % D.tp !== 0) D.warns.push('kvHeads='+D.kv+' 不被 TP='+D.tp+' 整除：KV 头复制（GQA 常见）。');
  if(D.ga < D.pp) D.warns.push('GA='+D.ga+' < PP='+D.pp+'：流水线灌不满，气泡率恶化（FR-11）。');
  D.ok = D.errors.length === 0;
  D.layersPerStage = D.ok ? D.layers/D.pp : Math.ceil(D.layers/D.pp);
  D.headDim = Math.floor(D.hidden/D.heads) || 1;
  D.gbs = D.mbs*D.ga*D.dp;
  D.bubble = D.pp>1 ? (D.pp-1)/D.ga : 0;

}

/* ═════════ 坐标算术（FR-3，可逆）：order = tp‑cp‑dp‑pp ═════════ */
function coordsOf(g,D){
  return { t: g % D.tp, c: Math.floor(g/D.tp) % D.cp,

}
function rankOf(t,c,d,p,D){ return ((p*D.dp + d)*D.cp + c)*D.tp + t; }

}

  for(e=0;e<D.ep;e++){

    out.push(rankOf(q % D.tp, Math.floor(q/D.tp) % D.cp, Math.floor(q/(D.tp*D.cp)) % D.dp, co.p, D));
  }
  return out;
}
/* EP 组跨了哪几根轴——实算，不靠印象。
   折叠是 q=(d·CP+c)·TP+t，低位是 t、再 c、再 d；EP 组是 q 上一段步长 ETP 的连续位置
   （共 EP·ETP 个），所以它先填满 TP、再填 CP、最后才咬到 DP。判据就是大小比较：
   EP·ETP ≤ TP·CP → 整组落在同一份 DP 副本里；> 才跨 DP。p 恒等于 co.p ⇒ 永不跨 PP。 */
function epSpanText(D){
  if(!D.moe) return '';
  var g0 = (sel!==null && sel<D.world) ? sel : 0;
  var co = epMembers(g0, D).map(function(r){ return coordsOf(r, D); });
  function nUniq(k){ var s = {}; co.forEach(function(x){ s[x[k]] = 1; }); return Object.keys(s).length; }
  var tot = D.ep*D.etp, plane2 = D.tp*D.cp, wide = tot > plane2;
  return ' <b>这一组跨哪几根轴</b>：EP 组是折叠序 q 上连续 EP·ETP='+tot+' 个位置（步长 ETP），'
    + 'q 的低位依次是 tp→cp→dp，所以先填满 TP、再 CP、最后才咬到 DP——判据只有一个大小比较：'
    + '<b>'+tot+(wide?' &gt; ':' ≤ ')+'TP·CP='+plane2+'</b> ⇒ 本配置一组 '+co.length+' 张卡跨 '
    + 'tp×'+nUniq('t')+(D.cp>1?' · cp×'+nUniq('c'):'')+' · <b>dp×'+nUniq('d')+'</b> · pp×'+nUniq('p')
    + '。EP·ETP ≤ TP·CP 时整组落在<b>同一份 DP 副本</b>里（例：tp8·ep4 → 4 张卡全在 dp0）；'
    + '<b>不跨 PP 恒成立</b>，与配置无关。';
}
function groupMembers(dim,g,D){
  var co = coordsOf(g,D), out=[], i;
  if(dim==='tp'){ for(i=0;i<D.tp;i++) out.push(rankOf(i,co.c,co.d,co.p,D)); }
  else if(dim==='cp'){ for(i=0;i<D.cp;i++) out.push(rankOf(co.t,i,co.d,co.p,D)); }
  else if(dim==='dp'){ for(i=0;i<D.dp;i++) out.push(rankOf(co.t,co.c,i,co.p,D)); }
  else if(dim==='pp'){ for(i=0;i<D.pp;i++) out.push(rankOf(co.t,co.c,co.d,i,D)); }
  else if(dim==='ep'){ out = D.moe ? epMembers(g,D) : [g]; }

/* ═════════ 持有内容 / 显存（FR-3 / FR-6：函数里没有 DP） ═════════ */
function kvPerTp(D){ return Math.ceil(D.kv/D.tp); }
/* ═════════ 真数据层：复用 net-sharding 的 createModel（它是纯数据层，专为被复用而写） ═════════
   拿到的是真东西：openPangu 整网图的算子节点 + 一张手工标注的切分表（轴/原因/partial/原语）。
   拿不到的是字节——真图不带 shape。所以：
     · 算子**清单、切法、轴名、注解、通信原语** = 真数据
     · 算子**宽度** = 按类别的粗略权重（线性层 ≫ norm/逐元素），并在图上标明口径
     · 每卡显存仍走本页的配置口径（paramsPerCard/memParts），不与上面混淆
   任一脚本缺失就整体退回内置的 7 算子示意口径，页面照常可用（单文件打开的场景）。 */
var RD = {ok:false, key:'', model:null, ops:null};
function realModel(D){
  if(!window.OPENPANGU_GRAPH || !window.PtoNetShardingPattern) return null;
  /* 口径必须整套传过去：只传一半会拿到「本页 hidden=8192 而切分区间按它默认的 5120 算」
     这种对不上的读数——两处数字打架比没有数字更糟。 */
  var key = [D.tp,D.cp,D.pp,D.ep,D.dp,D.layers,D.heads,D.experts,D.seq,D.hidden,D.ffn,D.vocab].join('/');
  if(RD.ok && RD.key === key) return RD.model;
  try{
    RD.model = window.PtoNetShardingPattern.createModel({
      tp:D.tp, cp:D.cp, pp:D.pp, ep:D.ep, dp:D.dp,
      layers:D.layers, heads:D.heads, experts:D.experts, seqLen:D.seq,
      hidden:D.hidden, ffnHidden:D.ffn, vocab:D.vocab });
    RD.key = key; RD.ok = true; RD.ops = null;
    return RD.model;
  }catch(e){ RD.ok = false; return null; }
}
/* 类别 → 画多宽（真图没 shape，这是粗略权重不是字节；图上会写明） */
var OPW = {'opv:linear':1, 'opv:moe':1.5, 'opv:embedding':1.2, 'opv:head':1.2, 'opv:mlp':1.1,
           'opv:attention':.9, 'opv:gate':.45, 'opv:norm':.4, 'opv:act':.4, 'opv:comm':.5};
function realOps(D, g){
  var m = realModel(D); if(!m) return null;

    if(n.kind !== 'op') return;                       /* 只取算子；tensor/module 不是内容块 */
    var sh = null;

      id:n.id, label:n.label, cls:n.colorKey || 'opv:linear',
      cut:(by[0] && by[0].dim) || 'none',             /* 真标注：这一刀沿哪根张量轴 */
      axis:(by[0] && by[0].axis) || '',
      axisName:(part && part.axisName) || '',
      range:(part && part.range) || null, total:(part && part.total) || null,
      partial:!!(sh && sh.partial), note:(sh && sh.spec && sh.spec.note) || '',

      group:(sh && sh.spec && sh.spec.group) || '',

}
function opBytes(D){ /* 单层各算子的每卡权重字节（bf16），供 V3 卡内解剖 & 读出 */
  var hd = D.headDim, o = [];
  o.push({id:'attn.q',  cut:'tp', how:'列切 ×'+D.tp, b:2*D.hidden*(D.heads/D.tp)*hd, shape:'['+fmt(D.hidden)+', '+(D.heads/D.tp)+'·'+hd+']'});
  o.push({id:'attn.kv', cut:'tp', how:'头切 ×'+D.tp+(D.kv%D.tp?'（复制）':''), b:2*D.hidden*2*kvPerTp(D)*hd, shape:'['+fmt(D.hidden)+', 2·'+kvPerTp(D)+'·'+hd+']'});
  o.push({id:'attn.core', cut:'none', how:'不切权重（无参）', b:0, shape:'flash-attn（激活算子）'});
  o.push({id:'attn.out', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.heads/D.tp)*hd*D.hidden, shape:'['+(D.heads/D.tp)+'·'+hd+', '+fmt(D.hidden)+']'});

    o.push({id:'experts', cut:'ep', how:'桶切 ×'+D.ep+'·ETP'+D.etp, b:2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp), shape:(D.experts/D.ep)+'个 × ['+fmt(D.hidden)+', '+fmt(Math.floor(D.ffn/D.etp))+']×3'});
  }else{
    o.push({id:'mlp.gate/up', cut:'tp', how:'列切 ×'+D.tp, b:2*2*D.hidden*(D.ffn/D.tp), shape:'['+fmt(D.hidden)+', 2·'+fmt(Math.floor(D.ffn/D.tp))+']'});
    o.push({id:'mlp.down', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.ffn/D.tp)*D.hidden, shape:'['+fmt(Math.floor(D.ffn/D.tp))+', '+fmt(D.hidden)+']'});

function paramsPerCard(D, ppRank){

  var p = perLayer * D.layersPerStage;
  if(ppRank===0) p += Math.ceil(D.vocab/D.tp)*D.hidden;
  if(ppRank===D.pp-1) p += D.hidden*Math.ceil(D.vocab/D.tp);
  return p;
}
var ACT_COEF = 4;
function memParts(D, ppRank){
  var P = paramsPerCard(D, ppRank);
  var inflight = Math.max(1, Math.min(D.pp, D.ga) - ppRank);
  var act = D.mbs*(D.seq/D.cp)*D.hidden*D.layersPerStage*ACT_COEF*inflight;
  return [
    {k:'w', label:'权重 (bf16)', bytes:2*P, color:'var(--pt-fg)'},
    {k:'g', label:'梯度 (bf16)', bytes:2*P, color:'var(--pt-fg2)'},
    {k:'opt', label:'优化器态 (fp32×3)', bytes:12*P, color:'var(--pt-fg3)'},
    {k:'act', label:'激活·在途'+inflight+'μb', bytes:act, color:'var(--pt-dp)'},
    {k:'rsv', label:'碎片/预留', bytes:1.5*Math.pow(2,30), color:'var(--pt-bd)'}

/* 本刀对「每卡容量」的贡献：把这一维设回 1，看同一张卡会装多少。
   DP 会算出一模一样的数——因为 paramsPerCard/memParts 里没有任何一项含 dp，
   这就是 A3「加 DP 不买余量」的现场证明，而不是一句口号。 */

  var D2 = {}, k;
  for(k in D) D2[k] = D[k];

  else if(dim==='pp'){ D2.pp = 1; D2.layersPerStage = D.layers; ppRank = 0; }
  else if(dim==='ep') D2.ep = 1;
  else if(dim==='cp') D2.cp = 1;

}
function holdRows(g,D){
  var co = coordsOf(g,D), l0 = co.p*D.layersPerStage, l1 = (co.p+1)*D.layersPerStage-1, rows=[];
  rows.push(['五元组区间','<small>'+esc(quintRow(g,D))+'</small>（§03·可逆）']);
  rows.push(['持有占比','<small>ℓ '+D.layersPerStage+'/'+D.layers+' · h '+fmt(Math.floor(D.hidden/D.tp))+'/'+fmt(D.hidden)
    +(D.moe?' · e '+(D.experts/D.ep)+'/'+D.experts:'')+' · b '+(D.mbs*D.ga)+'/'+fmt(D.gbs)
    +' · s '+(D.cp>1?fmt(D.seq/D.cp)+'/'+fmt(D.seq):'全部')+'</small>——卡=各维区间的<b>交集</b>，不是小整网']);
  rows.push(['层段','L'+l0+'–L'+l1+'（'+D.layersPerStage+' 层 / stage '+co.p+'）']);
  opBytes(D).forEach(function(o){ if(o.b || o.id==='attn.core') rows.push([o.id, '<code>'+esc(o.shape)+'</code>']); });
  if(D.moe){
    var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep, e0 = me.ep*kE;
    rows.push(['专家桶','E'+e0+'–E'+(e0+kE-1)+'（ep_rank '+me.ep+'）']);
  }
  if(co.p===0) rows.push(['embedding','<code>['+fmt(Math.ceil(D.vocab/D.tp))+', '+fmt(D.hidden)+']</code>（仅 stage 0）']);
  if(co.p===D.pp-1) rows.push(['lm_head','<code>['+fmt(D.hidden)+', '+fmt(Math.ceil(D.vocab/D.tp))+']</code>（仅末 stage）']);

  if(D.cp>1) a += '<br><small>CP 双段：#'+co.c+' 与 #'+(2*D.cp-1-co.c)+'（V5）</small>';

/* ═════════ 1F1B 合成调度（FR-7） ═════════ */
function schedule(D){
  var PP=D.pp, GA=Math.min(D.ga,8), F=1, B=2, truncated=D.ga>GA;
  var order=[],s,m;
  for(s=0;s<PP;s++){
    var w=Math.min(GA,PP-1-s), ops=[];
    for(m=0;m<w;m++) ops.push({t:'F',m:m});
    var fi=w, bi=0;
    while(fi<GA || bi<GA){ if(fi<GA) ops.push({t:'F',m:fi++}); if(bi<GA) ops.push({t:'B',m:bi++}); }
    order.push(ops);
  }
  var fEnd=[],bEnd=[],blocks=[],clock=[];
  for(s=0;s<PP;s++){ fEnd.push({}); bEnd.push({}); clock.push(0); }
  var ptr=order.map(function(){return 0;}), guard=PP*GA*4+8, prog=true;
  while(prog && guard-->0){
    prog=false;
    for(s=0;s<PP;s++){
      while(ptr[s]<order[s].length){
        var op=order[s][ptr[s]], dep=0, durn=op.t==='F'?F:B;
        if(op.t==='F'){ if(s>0){ if(fEnd[s-1][op.m]===undefined) break; dep=fEnd[s-1][op.m]; } }
        else{
          if(fEnd[s][op.m]===undefined) break;
          dep=fEnd[s][op.m];
          if(s<PP-1){ if(bEnd[s+1][op.m]===undefined) break; dep=Math.max(dep,bEnd[s+1][op.m]); }
        }
        var t0=Math.max(clock[s],dep), t1=t0+durn;
        blocks.push({s:s,m:op.m,type:op.t,t0:t0,t1:t1,recv:(op.t==='F'&&s>0)||(op.t==='B'&&s<PP-1)});
        clock[s]=t1;
        if(op.t==='F') fEnd[s][op.m]=t1; else bEnd[s][op.m]=t1;
        ptr[s]++; prog=true;
      }
    }
  }
  var T=0;
  for(s=0;s<PP;s++){ blocks.push({s:s,type:'AR',t0:clock[s],t1:clock[s]+1.4}); T=Math.max(T,clock[s]+1.4); }
  return {blocks:blocks,T:T,GA:GA,truncated:truncated};
}

/* ═════════ 线型语义（§8）：由原语决定，与维度无关 ═════════ */
function edgeSVG(pts, prim, color, opts){
  opts = opts || {};

  if(n<2) return '<g></g>';
  function line(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  if(prim==='p2p'){
    for(i=0;i<n-1;i++) out += line(pts[i],pts[i+1],'stroke:'+color+';stroke-width:'+w+';marker-end:url(#arr'+mid+')');
    if(opts.ring!==false && n>2) out += line(pts[n-1],pts[0],'stroke:'+color+';stroke-width:'+w+';stroke-opacity:.5;marker-end:url(#arr'+mid+')');
  }else if(prim==='allreduce'){
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+(w+0.6)+';stroke-linejoin:round"/>';
  }else if(prim==='allgather'||prim==='reducescatter'){
    var dash = prim==='allgather'?'7 4':'2 5';
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+w+';stroke-dasharray:'+dash+';stroke-linejoin:round"/>';
    pts.forEach(function(p){
      out += prim==='allgather'
        ? '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" style="fill:var(--pt-s1);stroke:'+color+';stroke-width:1.4"/>'
        : '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" transform="rotate(45 '+p[0]+' '+p[1]+')" style="fill:'+color+'"/>';
    });
  }else if(prim==='alltoall'){
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var lw = 0.7 + ((i*7+j*13)%3)*0.55;

/* ═════════ 单维切分（模板 = 参照系最后一张总图）═════════
   粒度做竖轴：输入 → 整网 → 层 → 算子 → kernel；rank 柱（虚线容器）贯穿全高。
   块的横跨范围 = 共有关系；kernel 永不跨柱；通信画在对应粒度层的柱间。
   五个维共用同一模板——只有「归属边界线的位置」与「片的着色」在变（§02/§03/§07/§15）。 */
var GY = {ker:0, op:3.4, lay:6.8, net:10.2, inp:14.4};   /* 输入与粒度链之间留缝：它是另一个对象，不在包含链里 */
function quintRow(g, D){ /* 索引五元组：这张卡的 rank 元组 ⇢ 五根轴上的区间（§03，双链可逆 §07） */
  var co = coordsOf(g, D), l0 = co.p*D.layersPerStage;
  var hK = Math.floor(D.hidden/D.tp);
  var parts = ['ℓ∈[L'+l0+',L'+((co.p+1)*D.layersPerStage-1)+']', 'h∈['+fmt(co.t*hK)+','+fmt((co.t+1)*hK)+')'];
  if(D.moe){ var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep; parts.push('e∈[E'+(me.ep*kE)+',E'+((me.ep+1)*kE-1)+']'); }
  else parts.push('e=—');
  parts.push('b=副本'+co.d+'的 '+(D.mbs*D.ga)+' 样本', 's=段'+co.c+'∪段'+(2*D.cp-1-co.c));
  return parts.join(' · ');
}
function S0(){ return (sel!==null && sel<9999999) ? sel : 0; }
function renderDim(D){
  var dim = ui.cutDim;
  var size = {tp:D.tp, pp:D.pp, cp:D.cp, dp:D.dp, ep:D.ep}[dim];
  var col = VC[dim];

  /* 该维没切开：给说明与一键预置，不硬画（DP-5） */
  if(size <= 1 || (dim==='ep' && !D.moe)){
    var fix = dim==='cp' ? {id:'longcp', label:'载入「长序列 CP」预置'} : {id:'default128', label:'载入默认 128 卡（含 EP8）'};
    $('stage').innerHTML = '<div class="pt-blocked"><div><b style="color:'+col+'">'+DIMN[dim]+' = '+size+'</b><br>'
      + '<span style="font-size:12.5px">当前配置里这一维没有发生切分——没有片、没有组内通信,也就没有可画的关系(宁缺毋误)。</span><br>'
      + '<button class="pb" data-act="preset" data-id="'+fix.id+'">'+fix.label+'</button></div></div>';
    renderDimBar(D, dim);
    $('stageNote').hidden = true; $('detach').hidden = true;
    return;
  }

  /* ═══ 布局：与刀序·切分链同一套平面语法（等距投影撑不住 16+ 份，会剪成一条斜带） ═══
     · 内容总宽 MW 恒定 ⇒ 切成几份就每份 MW/size：切得越多每份越小（面积守恒）
     · 卡行在最下，一格一份，**竖直对齐**就是映射——不用画落线，对齐本身在说话
     · 一格不是一张卡：ghost 退叠 + 标 world/size 的真实张数，全量在图上可数
     · 份数超 LIM 时余下画成按比例的压缩带（宽度=tail·slot），不是"+N 柱相同"那种省略 */
  var X0 = 172, MW = 652, RL = X0+MW+14;          /* 左标尺 / 内容带 / 右判词 */
  var R = {inp:46, net:126, lay:192, op:272, ker:348, card:398};
  var HR = {inp:30, net:30, lay:30, op:34, ker:20, card:60};
  var H = 512;
  /* 全量：不设上限——份数多到画不下时降级的是**标注**，不是份数本身。
     压缩带因此不再出现（tail 恒 0），代码留着是为了万一以后又要给上限。 */
  var N = size, tail = 0;
  var slot = MW / size, gap = Math.min(2, slot*.09);
  var groupsPer = Math.round(D.world/size);
  var kE = D.moe ? D.experts/D.ep : 0;
  var groups = Math.round(D.world/size);
  var parts = [], inter = [], colBack = [];        /* colBack：容器柱（垫底）· inter：吃事件的透明命中层 */
  function rect(x,y,w,h,fill,stroke,sw,extra){
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(.6,w).toFixed(1)+'" height="'+h.toFixed(1)

  }
  /* ── 立体：斜投影（cabinet），深度只产生一个固定偏移向量 (D,-E)。
     关键是 **X 不受深度影响**——等距投影里 screenX=(x−z) 会把 16 份柱列剪成一条斜带，
     斜投影不会：份还是并排的，面积守恒照旧，同时块有了体积（内容=实心体，§15）。 ── */
  var D3 = 11, E3 = 6.5;
  function slab(x,y,w,h,fill,stroke,sw,extra){
    var st = stroke||'var(--pt-bds)', sww = (sw===undefined?.8:sw), ex = extra||'';
    var side = (x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+w+D3)+','+(y+h-E3)+' '+(x+w)+','+(y+h);
    var top  = x+','+y+' '+(x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+D3)+','+(y-E3);
    return '<polygon points="'+side+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+side+'" style="fill:rgba(0,0,0,.16);stroke:none" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:rgba(255,255,255,.34);stroke:none" '+ex+'/>'
      + rect(x, y, w, h, fill, st, sww, ex);
  }
  /* 线框盒（容器/父块外框）：只有棱，没有面——容器无厚度、不抢内容的视觉重量 */
  function wire3(x,y,w,h,stroke,sw,extra){

      + '<line x1="'+(x+w+D3)+'" y1="'+(y-E3)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>'
      + '<line x1="'+(x+w)+'" y1="'+(y+h)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>';
  }
  function sx(i){ return X0 + i*slot; }                       /* 第 i 份的左边 */
  function scx(i){ return X0 + i*slot + slot/2; }             /* 第 i 份的中心 */
  var wide = slot > 30;                                       /* 够宽才逐格标注 */
  var cardTier = slot > 68 ? 2 : slot > 34 ? 1 : 0;           /* 卡格标注档位：全 / 序号+容量 / 只序号 */
  /* 右侧判词 */
  function say(y, main, sub){
    parts.push(txt(RL, y, main, 9, col, 'start', 'font-weight="700"'));
    if(sub) parts.push(txt(RL, y+11, sub, 7.8, 'var(--pt-fg3)', 'start'));
  }
  /* 共有：一整块横跨全宽 —— 谁都没切它 */
  function spanLane(y, h, label, sub, tint){
    parts.push(slab(X0, y, MW, h, tint||mix('var(--pt-fg2)',16), 'var(--pt-bds)', .8));
    say(y+h/2-2, label, sub);
  }
  /* 真切：外框跨满（合起来=那一个）+ size 份紧贴（每份 1/size） */
  function cutLane(y, h, tintOf, labelOf){
    parts.push(wire3(X0, y, MW, h, col, 1.1));
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y+1.5, slot-gap, h-3, tintOf(j), 'transparent', 0, 'pointer-events="none"'));
      var l = labelOf ? labelOf(j) : '';
      if(l && wide) parts.push(txt(scx(j), y+h/2+3, l, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));
    }
    if(tail>0) tailBand(y, h, tintOf(N-1));
  }
  /* 压缩带：宽度就是 tail·slot（真实占比），不省面积、只省标注 */
  function tailBand(y, h, tint){

    if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
  }
  /* 复印：各自成框、等大 —— 不是变小（DP 在模型侧的动作） */
  function copyLane(y, h, tint, label){
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y, slot-gap, h, tint, 'var(--pt-bds)', .8, 'pointer-events="none"'));
      if(wide && j===0 && label) parts.push(txt(scx(j), y+h/2+3, label, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));

    if(tail>0){
      var x0 = sx(N), w = X0+MW-x0;
      parts.push(slab(x0+gap/2, y, w-gap, h, tint, 'var(--pt-bds)', .6, 'opacity=".5" pointer-events="none"'));
      if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));

  }

  /* 每份的代表卡（其余维取 0；EP 走折叠平面反解） */
  var colRanks = [];
  for(var i0=0;i0<N;i0++){
    if(dim==='tp') colRanks.push(rankOf(i0,0,0,0,D));
    else if(dim==='cp') colRanks.push(rankOf(0,i0,0,0,D));
    else if(dim==='dp') colRanks.push(rankOf(0,0,i0,0,D));
    else if(dim==='pp') colRanks.push(rankOf(0,0,0,i0,D));
  }
  if(dim==='ep') colRanks = epMembers(rankOf(0,0,0,0,D), D).slice(0,N);

  /* ── 输入②（激活体的入口）：另一个对象，虚线圈出、不在包含链上 ── */
  if(dim==='cp'){
    /* CP 的动词=切一条序列：2·CP 段 + 首尾配对弧（因果均衡） */
    var segN = 2*size, segW = MW/segN;
    parts.push(wire3(X0, R.inp, MW, HR.inp, col, 1.1));
    for(var sg=0;sg<segN;sg++){
      var ownerC = sg<size ? sg : 2*size-1-sg;
      parts.push(slab(X0+sg*segW+.6, R.inp+1.5, segW-1.2, HR.inp-3, mix(col, 14+Math.round(ownerC/(size-1||1)*40)), 'transparent', 0, 'pointer-events="none"'));
      if(segW>22) parts.push(txt(X0+sg*segW+segW/2, R.inp+HR.inp/2+3, '段'+sg, 7.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }
    for(var pc=0;pc<N;pc++){
      var aX = X0+pc*segW+segW/2, bX = X0+(2*size-1-pc)*segW+segW/2, hArc = 10+pc*5;
      parts.push('<path d="M'+aX+' '+(R.inp-2)+' C '+aX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2)+'" style="fill:none;stroke:'+mix(col,70)+';stroke-width:1.1"/>');
    }
    say(R.inp+HR.inp/2-2, '序列 → 2·CP='+segN+' 段；c 拿 段c ∪ 段'+(2*size-1)+'−c',
        '每段 '+fmt(D.seq/segN)+' token · 合起来=1 条');
  }
  else if(dim==='dp'){
    cutLane(R.inp, HR.inp, function(j){ return mix(col, 18+Math.round(j/(N-1||1)*34)); }, function(j){ return 'b份'+j; });
    say(R.inp+HR.inp/2-2, '全局批真切 ×DP='+size+'（每份 '+(D.mbs*D.ga)+' 样本）',
        '外框=GBS '+fmt(D.gbs)+' · 每份 1/'+size);
  }
  else{
    var inpCut = [];
    if(D.dp>1) inpCut.push('b 已被 DP 切（本组见 dp0）');
    if(D.cp>1) inpCut.push('s 已被 CP 切（cp0）');
    spanLane(R.inp, HR.inp, '输入 — 本维不切输入',
      inpCut.length?inpCut.join(' · '):(dim==='tp'?'TP 切权重体的 h 轴':dim==='pp'?'PP 切层序 ℓ 轴':'EP 重分组专家 e 轴'));
  }
  parts.push(rect(X0-6, R.inp-6, MW+12, HR.inp+12, 'none', 'var(--pt-fg3)', .8, 'stroke-dasharray="5 4" pointer-events="none"'));

  /* ── 整网 ── */
  if(dim==='dp'){

  }
  else if(dim==='dp'){

  /* ── 算子（真算子序列，宽∝每卡字节；被本维切的画成 size 片） ── */
  var opPos = {};
  var co0 = (function(){ var c = coordsOf(Math.min(S0(), D.world-1), D);
    return {tp:c.t, cp:c.c, dp:c.d, pp:c.p, ep:(D.moe?epOf(c.t,c.c,c.d,D).ep:0)}[dim] || 0; })();
  function opLane(cutKind){
    /* 优先用真整网的算子（35 个真节点 + 手工标注的切法/轴/原因），拿不到才退回内置示意口径。

    var rops = realOps(D, (sel!==null && sel<D.world) ? sel : 0), useReal = !!rops, ops, sh;
    if(useReal){

      sh = ops.map(function(o){ return o.w; });
    }else{
      ops = opBytes(D).filter(function(o){ return o.b>0 || o.id==='attn.core'; });
      var totB = ops.reduce(function(a,o){ return a+o.b; }, 0);
      sh = ops.map(function(o){ return clamp(o.b, totB*.07, totB*.30); });
    }
    opLane.real = useReal; opLane.commOps = useReal ? rops.filter(function(o){ return o.comm; }) : [];
    var shT = sh.reduce(function(a,x){ return a+x; }, 0);
    var og = 2, usable = MW - og*(ops.length-1), x = X0;
    ops.forEach(function(o, oi){
      var w = usable*sh[oi]/shT;
      opPos[o.id] = {x:x, w:w};
      var isCut = cutKind && (o.cut===cutKind || (cutKind==='tp' && o.cut==='sp'));
      var pieces = (useReal && o.total) ? o.total : size;      /* 真标注带 total：片数用真的 */
      if(!useReal && o.b===0) parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(useReal && !isCut && o.cut==='none') parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(isCut){
        /* 片数用真标注的 total（如 q_b_proj 沿 head 切 32 份，本卡持 16–31），
           没有标注时退回本刀的份数 size。片贴片=面积守恒，跟别处一个纪律。 */
        var np = Math.max(1, Math.min(pieces, 64)), pw = w/np;
        var hot = (useReal && o.range && o.total) ? Math.floor(o.range[0]/(o.total/np)) : co0;
        parts.push(wire3(x, R.op, w, HR.op, col, 1, 'pointer-events="none"'));
        for(var q=0;q<np;q++)
          parts.push(slab(x+q*pw+.4, R.op+1.5, Math.max(.6,pw-.8), HR.op-3,
            mix(col, q===hot ? 62 : 30), 'transparent', 0, 'pointer-events="none"'));
      }
      else parts.push(slab(x, R.op+3, w, HR.op-6, mix('var(--pt-fg2)',16), 'var(--pt-bds)', .6, 'pointer-events="none"'));
      var lbl = useReal ? (o.label||o.id) : o.id;
      if(w>26) parts.push(txt(x+w/2, R.op+HR.op+9+(oi%2)*9, lbl.length>16?lbl.slice(0,15)+'…':lbl, 7, isCut?col:'var(--pt-fg3)', 'middle', (isCut?'font-weight="700" ':'')+'pointer-events="none"'));
      if(w>26 && useReal && isCut && o.axisName)
        parts.push(txt(x+w/2, R.op+HR.op+18+(oi%2)*9, '沿'+o.axisName+(o.partial?'·partial':''), 6.4, col, 'middle', 'pointer-events="none"'));
      x += w + og;
    });
  }
  if(dim==='tp'){
    opLane('tp');
    say(R.op+HR.op/2-2, '算子 — 锯开 ×TP='+size+'：每片 1/'+size,
        'q/kv/out/mlp 被切 · 每格 '+fmtGB(2*paramsPerCard(D,0))+' GB（片非整层）');
  }
  else if(dim==='ep'){
    opLane('ep');
    say(R.op+HR.op/2-2, '算子 — experts 重分组 ×EP='+size+'（每桶 '+kE+'）',
        'EP 是视图不是新轴（勘误 K）');
    var ex = opPos['experts'], rt = opPos['router'];
    if(ex){   /* 路由：token 动态挑 top-k 个桶——运行时的，不是静态切开 */
      var tk0 = rt ? rt.x+rt.w/2 : ex.x-14, ty0 = R.op-24;
      parts.push('<circle cx="'+tk0+'" cy="'+ty0+'" r="3.2" style="fill:'+col+'" pointer-events="none"/>');
      parts.push(txt(tk0, ty0-7, '一个 token', 7.6, col, 'middle', 'font-weight="700" pointer-events="none"'));
      var picks = [1, Math.min(N-1, 5)];
      for(var bi=0;bi<N;bi++){
        var tgx = ex.x+(bi+.5)*(ex.w/size), hit = picks.indexOf(bi)>=0;
        parts.push('<line x1="'+tk0+'" y1="'+(ty0+4)+'" x2="'+tgx+'" y2="'+R.op+'" style="stroke:'+col+';stroke-width:'+(hit?1.6:.55)+';stroke-dasharray:'+(hit?'none':'2 4')+';opacity:'+(hit?.95:.28)+'" pointer-events="none"/>');
      }
      /* 说明放右栏第三行：这一带的 y 正好是 tp/ep 的归属边界线，写在图里会压线 */
      parts.push(txt(RL, R.op+HR.op/2+20, 'top-'+(D.topk||2)+' 动态路由：每 token 挑自己的桶', 7.6, 'var(--pt-fg2)', 'start'));
      parts.push(txt(RL, R.op+HR.op/2+31, '路由是运行时的 · 切分是静态的', 7.6, 'var(--pt-fg3)', 'start'));
    }
  }
  else if(dim==='pp'){
    cutLane(R.op, HR.op, function(j){ return mix(col, 20+Math.round(j/(N-1||1)*20)); }, null);
    say(R.op+HR.op/2-2, '算子 — 随层归属（段里有哪些层）', '面积守恒同上一行');
  }
  else if(dim==='dp'){
    copyLane(R.op, HR.op, mix('var(--pt-fg2)',16), null);
    say(R.op+HR.op/2-2, '算子 — 同一份，逐字节相同', '加 DP 不买余量（A3）');
  }
  else spanLane(R.op, HR.op, '算子 — 权重完整（CP 只切激活的 s 轴）');

  /* ── kernel：永不跨格 ── */
  for(var q2=0;q2<N;q2++){
    var kw = (slot-gap)/3.4;
    for(var kr=0;kr<3;kr++)
      parts.push(slab(sx(q2)+gap/2+kr*(kw+1.5), R.ker, kw, HR.ker, mix('var(--pt-fg2)', 34-kr*7), 'transparent', 0, 'pointer-events="none"'));
  }
  if(tail>0) tailBand(R.ker, HR.ker, mix('var(--pt-fg2)',28));
  say(R.ker+HR.ker/2-2, 'kernel — 永不跨柱（柱壁就是它的边界）', '本刀不决定它 · 全部刀切完之后的事，细看去卡内解剖');

  /* ── 卡（容器）：一柱一份，虚线柱贯穿全高（rank 是柱上的门牌，容器是卡本身 §15）。
     柱脚放门牌与容量计；整柱可点。竖直对齐 = 映射：柱里那一份就是它持有的。 ── */
  parts.push(txt(X0-10, R.card+16, '卡（容器）', 10.5, 'var(--pt-fg)', 'end', 'font-weight="800"'));
  parts.push(txt(X0-10, R.card+29, '容量 = 显存', 7.8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(X0-10, R.card+40, '柱里那一份', 7.4, col, 'end'));
  parts.push(txt(X0-10, R.card+50, '就是它持有的', 7.4, col, 'end'));
  var CT = R.inp-13, CB = R.card+HR.card;             /* 柱顶（含输入行）/ 柱底 */
  for(var i=0;i<N;i++){
    var isSel = sel===colRanks[i], cx0 = sx(i)+gap/2, cw = slot-gap;
    var stI = coordsOf(colRanks[i], D).p;
    var memI = memParts(D, stI).reduce(function(a,x){ return a+x.bytes; }, 0);
    var frac = Math.min(1, memI/(D.hbm*Math.pow(2,30))), over = frac > .9;
    for(var gh=Math.min(groupsPer-1,2); gh>=1; gh--){  /* 同构卡退叠（真实张数由文字兜底） */
      var go = gh*3;
      colBack.push(rect(cx0+go, CT-go, cw, CB-CT, 'var(--pt-bg)', 'var(--pt-bd)', .6, 'stroke-dasharray="2 3" opacity="'+(.5-gh*.13).toFixed(2)+'" pointer-events="none"'));
    }
    /* 柱身：极淡体积感 + 虚线壁（容器边界），选中转实线 */
    colBack.push(rect(cx0, CT, cw, CB-CT, isSel?mix('var(--pt-fg)',5):mix('var(--pt-fg)',2), 'transparent', 0, 'pointer-events="none"')
      + wire3(cx0, CT, cw, CB-CT, isSel?'var(--pt-fg)':'var(--pt-bds)', isSel?1.6:1,
              isSel?'pointer-events="none"':'stroke-dasharray="7 3" pointer-events="none"'));
    /* 柱脚：门牌区（与柱身同宽，底色略深，读作"这根柱的脚") */
    colBack.push(rect(cx0, R.card, cw, HR.card, isSel?mix('var(--pt-fg)',8):mix('var(--pt-fg)',4), 'transparent', 0, 'pointer-events="none"'));
    inter.push('<g class="dimcol" data-g="'+colRanks[i]+'" style="cursor:pointer">'
      + rect(cx0, CT, cw, CB-CT, 'transparent', 'transparent', 0) + '</g>');
    /* 容量计：真实占用/HBM——容器约束画成条，不只是数字 */
    parts.push(rect(cx0+3, R.card+HR.card-11, cw-6, 6, mix('var(--pt-fg2)',10), 'transparent', 0, 'pointer-events="none"'));
    parts.push(rect(cx0+3, R.card+HR.card-11, (cw-6)*frac, 6, over?'var(--pt-danger)':mix(col,60), 'transparent', 0, 'pointer-events="none"'));
    if(cardTier===2){
      parts.push(txt(scx(i), R.card+14, dim+'_rank '+i, 8.4, col, 'middle', 'font-weight="700" pointer-events="none"'));
      parts.push(txt(scx(i), R.card+25, 'g='+colRanks[i], 7.4, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      if(groupsPer>1) parts.push(txt(scx(i), R.card+35, '×'+fmt(groupsPer)+' 张同构', 7, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      parts.push(txt(scx(i), R.card+HR.card-14, fmtGB(memI)+'/'+D.hbm+' GB', 7, over?'var(--pt-danger)':'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }else if(cardTier===1){
      parts.push(txt(scx(i), R.card+15, dim[0]+i, 8.6, col, 'middle', 'font-weight="800" pointer-events="none"'));
      parts.push(txt(scx(i), R.card+27, 'g='+colRanks[i], 6.8, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      parts.push(txt(scx(i), R.card+HR.card-14, fmtGB(memI), 6.8, over?'var(--pt-danger)':'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }else{
      parts.push(txt(scx(i), R.card+14, String(i), 7, col, 'middle', 'font-weight="700" pointer-events="none"'));
    }
  }
  if(tail>0){
    var tx0 = sx(N)+gap/2, tw = X0+MW-tx0-gap;
    parts.push(rect(tx0, R.card, tw, HR.card, mix('var(--pt-fg)',3), 'var(--pt-bds)', .8, 'stroke-dasharray="4 3" pointer-events="none"'));
    if(tw>50){
      parts.push(txt(tx0+tw/2, R.card+22, '+'+tail+' 份 · '+fmt(tail*groupsPer)+' 张卡', 8, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
      parts.push(txt(tx0+tw/2, R.card+34, '同构，宽度按比例', 7.2, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
    }
  }
  say(R.card+14, '卡 = '+size+' 柱 × '+fmt(groupsPer)+' 张 = 全量 '+fmt(D.world),
      '柱宽=那一份的宽 · 点柱读五元组区间'
      + (cardTier===0?'（柱窄，只标序号）':cardTier===1?'（柱中，标 '+dim[0]+'i·g·占用）':''));
  /* 本刀对容量的贡献（反事实：这一维设回 1）——容量数字必须归因，否则会被算到本刀头上 */
  var mNow = memParts(D, 0).reduce(function(a,x){ return a+x.bytes; }, 0);
  var mOff = memWithoutKnife(D, dim, 0);
  var saved = mOff - mNow;
  parts.push(txt(RL, R.card+38, '本刀对容量的贡献', 8.6, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  if(saved > Math.pow(2,28)){
    parts.push(txt(RL, R.card+50, '若 '+DIMN[dim]+'=1：'+fmtGB(mOff)+' GB → 现在 '+fmtGB(mNow)+' GB', 7.8, col, 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+61, '本刀省下 '+fmtGB(saved)+' GB（÷'+size+'）· 其余由别的刀决定', 7.6, 'var(--pt-fg3)', 'start'));
  }else{
    parts.push(txt(RL, R.card+50, '若 '+DIMN[dim]+'=1：'+fmtGB(mOff)+' GB → 现在 '+fmtGB(mNow)+' GB', 7.8, 'var(--pt-danger)', 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+61, '一点没省——加 '+DIMN[dim]+' 不买余量（A3）', 7.6, 'var(--pt-danger)', 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+72, '柱上这 '+fmtGB(mNow)+' GB 全是别的刀切出来的', 7.4, 'var(--pt-fg3)', 'start'));
  }

  /* ── 归属边界（§02）：此线以下各格内容开始不同 ── */
  var bY = {tp:(R.lay+HR.lay+R.op)/2, ep:(R.lay+HR.lay+R.op)/2, pp:(R.net+HR.net+R.lay)/2,
            cp:(R.inp+HR.inp+R.net)/2+3, dp:(R.inp+HR.inp+R.net)/2+3}[dim];
  parts.push('<line x1="'+(X0-30)+'" y1="'+bY+'" x2="'+(X0+MW+6)+'" y2="'+bY+'" style="stroke:'+col+';stroke-width:2;stroke-dasharray:9 5" pointer-events="none"/>');
  parts.push(txt(RL, bY-4, '归属边界（§02）', 9, col, 'start', 'font-weight="800"'));
  parts.push(txt(RL, bY+7, (dim==='cp'||dim==='dp')?'边界在输入——模型侧'+(dim==='dp'?'整套复制':'完整共有'):'此线以下，各格内容不同', 7.8, 'var(--pt-fg2)', 'start'));

  /* ── 通信（L5）：画在它发生的那一粒度层，格与格之间 ── */
  if(layerOn('L5')){
    var prim = dim==='cp' ? (['p2p','alltoall','allgather'].indexOf(ui.commPrim)>=0 ? ui.commPrim : 'p2p')
             : {tp:'allreduce', pp:'p2p', dp:'allreduce', ep:'alltoall'}[dim];
    var cy = {tp:R.op+HR.op+26, ep:R.op+HR.op+26, pp:R.lay+HR.lay+16, cp:R.inp+HR.inp+16, dp:R.net+HR.net+16}[dim];
    var pts = []; for(var a=0;a<N;a++) pts.push([scx(a), cy]);
    parts.push('<g opacity=".95" pointer-events="none">'+edgeSVG(pts, prim, col, {mid:dim, ring:dim==='cp'&&prim==='p2p'})+'</g>');
    var actB = D.mbs*(D.seq/D.cp)*D.hidden*2;
    function mb(b){ return b>=Math.pow(2,30) ? fmtGB(b)+' GB' : Math.round(b/Math.pow(2,20))+' MB'; }
    var commTxt = {tp:'TP AllReduce · 每层两下 · 每次≈'+mb(actB),
                   pp:'PP P2P · 有方向 · 每 μbatch ≈'+mb(actB),
                   dp:'DP 梯度 AllReduce · 步末一次 · 每卡≈'+mb(2*paramsPerCard(D,0)),
                   ep:'EP All-to-All · top-'+(D.topk||'—')+' 路由 · 各边载荷不等',
                   cp:{p2p:'CP Ring（P2P 逐跳传 KV 块）', alltoall:'CP Ulysses（All-to-All 换轴）', allgather:'CP 朴素（AllGather 收全序列）'}[prim]}[dim];
    var SCOPE = {tp:'作用域：层内（算子内部）· 每层 2 次，不跨层',
                 ep:'作用域：层内（MoE 层）· 每层 2 次 dispatch+combine，不跨层；路由逐层重算',
                 cp:'作用域：层内（attention 内部）· 每层一轮，不跨层',
                 pp:'作用域：跨层（层的边界）· stage 之间，每 μbatch 一次',
                 dp:'作用域：跨 step（整网之外）· 步末一次，层内不发生'}[dim];
    parts.push(txt(RL, cy-3, commTxt, 8.6, col, 'start', 'font-weight="700"'));
    parts.push(txt(RL, cy+8, SCOPE, 7.6, 'var(--pt-fg2)', 'start'));
  }

  /* ── 左侧粒度标尺：整网⊃层⊃算子⊃kernel 是同一份内容逐级放大；输入是另一个对象 ── */
  var spanN = '组内共有';
  var layShared = D.pp>1 ? '本组=stage0 段' : spanN;
  var ruler = {
    tp: [['输入 ②',spanN],['整网',spanN],['层',layShared],['算子',spanN+'·片各归各格'],['kernel','不跨柱']],
    pp: [['输入 ②',spanN],['整网',spanN+'·逻辑一张'],['层','各格一段·有序'],['算子','随层归属'],['kernel','不跨柱']],
    cp: [['输入 ②','s 轴切开'],['整网',spanN],['层',layShared],['算子',spanN+'·权重完整'],['kernel','不跨柱']],
    dp: [['输入 ②','b 轴切开'],['整网','复印·等大'],['层','复印·等大'],['算子','复印·等大'],['kernel','不跨柱']],
    ep: [['输入 ②',spanN],['整网',spanN],['层',layShared],['算子','桶各归各格'],['kernel','不跨柱']]
  }[dim];
  [['inp',R.inp,HR.inp],['net',R.net,HR.net],['lay',R.lay,HR.lay],['op',R.op,HR.op],['ker',R.ker,HR.ker]].forEach(function(rw, li){
    parts.push(txt(X0-10, rw[1]+13, ruler[li][0], 10.5, 'var(--pt-fg)', 'end', 'font-weight="700"'));
    parts.push(txt(X0-10, rw[1]+24, li===0 ? '激活体②的入口·'+ruler[0][1] : ruler[li][1], 7.8, 'var(--pt-fg3)', 'end'));
    if(li===0) parts.push(txt(X0-10, rw[1]+34, '≠ 激活体本身（中间结果 ×几千倍）', 7, 'var(--pt-fg3)', 'end'));
  });
  /* ⊃ 放大：模型四级之间；输入与整网之间是「断」 */
  [[R.net,HR.net,R.lay],[R.lay,HR.lay,R.op],[R.op,HR.op,R.ker]].forEach(function(pr){
    var y1 = pr[0]+pr[1]+2, y2 = pr[2]-2, xm = X0-118;
    parts.push('<line x1="'+xm+'" y1="'+y1+'" x2="'+xm+'" y2="'+y2+'" style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:2 3" pointer-events="none"/>');
    parts.push(txt(xm-4, (y1+y2)/2+3, '⊃ 放大', 7.6, 'var(--pt-fg3)', 'end'));
  });
  parts.push(txt(X0-122, (R.inp+HR.inp+R.net)/2+3, '⊥ 不在链上', 7.6, 'var(--pt-fg3)', 'end'));
  parts.push('<line x1="'+(X0-150)+'" y1="'+(R.net+2)+'" x2="'+(X0-150)+'" y2="'+(R.ker+HR.ker)+'" style="stroke:var(--pt-fg3);stroke-width:1.2;marker-end:url(#arrx)" pointer-events="none"/>');
  parts.push('<g transform="rotate(-90 '+(X0-156)+' '+((R.net+R.ker)/2)+')">'+txt(X0-156, (R.net+R.ker)/2, '粒度（坐标轴 §15）', 8.4, 'var(--pt-fg2)', 'middle', 'font-weight="700"')+'</g>');

  /* ── 全量对账 + 尺寸纪律（页脚一行，与切分链同一句纪律） ── */
  parts.push(txt(X0+MW, H-32, '全量 '+fmt(D.world)+' 卡 = '+size+' 份（'+DIMN[dim]+'）× 每份 '+fmt(groupsPer)+' 张同构卡'
    + (tail>0 ? ' · 逐柱画了前 '+N+' 份，余 '+tail+' 份在压缩带里（宽度按比例，未省面积）' : ' · '+size+' 份全部逐柱画出'), 8.8, 'var(--pt-fg2)', 'end', 'font-weight="600"'));
  parts.push(txt(X0+MW, H-18, '尺寸纪律：真切=面积守恒（份合起来=父块） · 复印=等大成叠（各自成框 + ≡） · 竖直对齐=映射（一份 → 它所在那根柱）', 8.4, 'var(--pt-fg)', 'end', 'font-weight="700"'));

  $('stage').innerHTML = '<svg viewBox="0 0 1080 '+H+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + '<g pointer-events="none">'+colBack.join('')+'</g>'
    + inter.join('')
    + '<g pointer-events="none">'+parts.join('')+'</g></svg>';

  renderDimBar(D, dim);
  /* 索引五元组条（§03）：本维认领哪根轴；rank元组 ⇄ 区间双链可逆（§07） */
  var AXQ = {tp:'h', pp:'ℓ', cp:'s', dp:'b', ep:'e'};
  var ivl = {tp:'tp_rank t ⇢ h∈[t·'+fmt(Math.floor(D.hidden/size))+', (t+1)·'+fmt(Math.floor(D.hidden/size))+')',
             pp:'pp_rank p ⇢ ℓ∈[p·'+D.layersPerStage+', (p+1)·'+D.layersPerStage+')',
             cp:'cp_rank c ⇢ s = 段c ∪ 段'+(2*size-1)+'−c（各 '+fmt(D.seq/(2*size))+' token）',
             dp:'dp_rank d ⇢ b = 第 d 份 '+(D.mbs*D.ga)+' 样本',
             ep:'ep_rank e ⇢ e∈[e·'+kE+', (e+1)·'+kE+')'}[dim];
  var slots = [['ℓ','层号','pp'],['h','隐藏/头','tp'],['e','专家号','ep'],['b','样本号','dp'],['s','序列位','cp']];
  $('stageNote').hidden = false;
  $('stageNote').innerHTML = '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">'
    + '<span class="pt-cap">索引五元组 §03</span>'
    + slots.map(function(sl){
        var hot = AXQ[dim]===sl[0];

        var pw = lbT.length*4.2+6, ph = 11;
        body.push('<rect x="'+(cc9[0]-pw/2)+'" y="'+(cc9[1]-ph/2+1)+'" width="'+pw+'" height="'+ph+'" rx="'+ph/2+'" '
          +'style="fill:'+(mineB?cc:'var(--pt-bg)')+';stroke:'+cc+';stroke-width:'+(mineB?1.4:.6)+'"/>');
        body.push(txt(cc9[0], cc9[1]+3.5, lbT, 6.8, mineB?'#fff':'var(--pt-fg3)', 'middle', 'font-weight="700"'));

        'data-act="chainpick" data-k="'+key+'" data-i="'+b9+'"')+'</g>');

  }
  if(cutTP && D.tp>1 && !ui.cardMode) railBand(tpBandV, D.tp, co.t, VC.tp, 'hxTP', function(b9){ return 'TP'+b9; }, 't');
  if(cutEP && D.moe && D.ep>1 && !ui.cardMode){

      function(b9){ return 'EP'+b9; }, 'e');
  }
  /* DP 选择器已改为每份复印件底部的独立标签，不再用共享 railBand */
  /* ── 前板加标签：真图那一层的关键算子，和 3d-deck 上写的是同一行 ── */
  var lab = [];
  if(IXg && sh && (s >= 72 || zoomIn)){
    /* 只挑五条：一层里 35 个算子全标出来就是糊墙，五条足够认出「这是真图那一层」 */
    var pick = ['input_layernorm','q_a_proj','attention_core','dense_gate_up','block_post_norm'];

    pick.forEach(function(id){

      var pc = P((n.x - root.x)/GW, (n.y - root.y)/GW, wf, off0);
      var tag = (part && part.total>0) ? ' · '+(part.dimName||'')+part.range[0]+'/'+part.total : '';

        'paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.4" font-weight="700"'));

  /* batchSlab 已移除——输入标注一并去掉 */
  var CID = 'scClip';
  var HX = '<pattern id="hxTP" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<rect width="3.4" height="3.4" style="fill:'+mix(VC.tp,7)+'"/><line x1="0" y1="0" x2="0" y2="3.4" style="stroke:'+VC.tp+';stroke-width:1"/></pattern>'
    + '<pattern id="hxEP" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">'
    + '<rect width="3.4" height="3.4" style="fill:'+mix(VC.ep,7)+'"/><line x1="0" y1="0" x2="0" y2="3.4" style="stroke:'+VC.ep+';stroke-width:1"/></pattern>'
    + '<pattern id="hxDP" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">'
    + '<rect width="3.4" height="3.4" style="fill:'+mix(VC.dp,7)+'"/><line x1="0" y1="0" x2="3.4" y2="0" style="stroke:'+VC.dp+';stroke-width:1"/></pattern>'
;
  var wrapped = '<defs>'+HX+'<clipPath id="'+CID+'"><rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'"/></clipPath></defs>'
    + '<g clip-path="url(#'+CID+')">' + body.join('') + lab.join('') + '</g>';
  return {body: wrapped, hit: '<g clip-path="url(#'+CID+')">'+hit.join('')+'</g>', nodes: nodes, sawn: sawn, whole: whole,
          step: 0, steps: [], zoom: zoomIn, cut: {dp:cutDP, pp:cutPP, cp:cutCP, tp:cutTP, ep:cutEP},
          note: IXg ? '' : '（真图脚本未加载：单文件打开时退回素板）'};
}

/* ═════════ 视图七 · 一个 step 的五幕：跟住一张卡走完全程 ═════════
   前面几张图都是**静态的关系**。这张图补的是时间上的先后，以及一条最容易被跳过的分界：
   哪些事**只做一次**（开机 / 报到 / 备料），哪些事**每个 micro-batch 都重来**（进料 / 开算 / 接力）。
   把它讲成一个能复述的故事：跟住一张卡，从 128 个一模一样的进程，走到步末那一次梯度 AllReduce。
   第 4 幕是两条链唯一的交点——算子（逻辑侧末级）与 kernel 队列（物理侧末级）在 kernel 处碰头。 */
var ACTS = [
  {t:'开机',       s:'一模一样的进程',     once:true},
  {t:'报到',       s:'一维编号 → 四位门牌', once:true},
  {t:'备料',       s:'只建自己那一份',      once:true},
  {t:'进料',       s:'token 每步换一批',    once:false},
  {t:'开算',       s:'算子落成 kernel',     once:false},
  {t:'接力与收束', s:'流水线 + 步末 AllReduce', once:false}
];
function renderStory(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t,co.c,co.d,D) : null;
  var A = clamp(ui.act|0, 0, ACTS.length-1), act = ACTS[A];
  var H = 636, parts = [], hits = [];
  var lps = D.layersPerStage, l0 = co.p*lps, l1 = (co.p+1)*lps-1;
  var hK = Math.floor(D.hidden/D.tp), plane = D.tp*D.cp*D.dp;
  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function rc(x,y,w,h,fill,stroke,sw,extra){
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(.4,w).toFixed(1)+'" height="'+Math.max(.4,h).toFixed(1)
      +'" style="fill:'+fill+';stroke:'+(stroke||'none')+';stroke-width:'+(sw===undefined?0:sw)+'" '+(extra||'')+'/>';
  }
  /* 有厚度的块（斜投影：深度恒为 (dx,−dy)，X 不受深度影响） */
  function slab(x,y,w,h,fill,dx,dy,extra){
    if(w<=.3) return '';
    var s2 = '';
    if(dx>0){
      s2 += '<polygon points="'+x.toFixed(1)+','+y.toFixed(1)+' '+(x+w).toFixed(1)+','+y.toFixed(1)+' '
        +(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '+(x+dx).toFixed(1)+','+(y-dy).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 70%, #fff 30%)" pointer-events="none"/>';
      s2 += '<polygon points="'+(x+w).toFixed(1)+','+y.toFixed(1)+' '+(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '
        +(x+w+dx).toFixed(1)+','+(y+h-dy).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 72%, #000 28%)" pointer-events="none"/>';
    }
    return s2 + rc(x,y,w,h,fill,'',0,extra);
  }
  /* 卡阵：行 = stage（PP），列 = stage 内平面（tp·cp·dp）——三个组在这个排布上各有各的形状 */
  function lattice(LX, LY, LW, LH, o){
    o = o || {};
    var cols = Math.max(1, plane), rows = Math.max(1, D.pp);
    var cw = LW/cols, ch = LH/rows, s2 = '', hit = '';
    var dep = cw > 9 ? Math.min(5, cw*.22) : 0;
    for(var r=0; r<rows; r++) for(var c2=0; c2<cols; c2++){
      var gg = r*cols + c2;
      if(gg >= D.world) continue;
      var x = LX + c2*cw, y = LY + r*ch, hot = gg===g;
      var f = o.tint ? o.tint(gg, hot) : (hot ? 'var(--pt-fg)' : mix('var(--pt-fg)', 13));
      s2 += slab(x, y+dep, Math.max(.5,cw-Math.max(.35,cw*.09)), Math.max(.5,ch-Math.max(.35,ch*.14)), f, dep, dep*.6, 'pointer-events="none"');
    }
    /* 命中层单独铺一遍透明格。格子细到 2px 以下就不铺了——那时候点谁都是碰运气；
       但**格子照画**（份数是真的），只是把「这里点不动」如实说出来，不装成能点。 */
    if(cw < 2) s2 += txt(LX, LY-8, '格子已细到 '+cw.toFixed(1)+'px：'+fmt(D.world)+' 张全画出来了，但点选请用顶栏的「选中卡」输入框',
                         7.4, 'var(--pt-fg3)', 'start');
    if(cw >= 2) for(var r2=0; r2<rows; r2++) for(var c3=0; c3<cols; c3++){
      var g2 = r2*cols + c3;
      if(g2 >= D.world) continue;
      hit += '<g class="cgrow"><rect x="'+(LX+c3*cw).toFixed(1)+'" y="'+(LY+r2*ch).toFixed(1)+'" width="'+cw.toFixed(1)
        +'" height="'+ch.toFixed(1)+'" style="fill:transparent;cursor:pointer" data-act="pickg" data-g="'+g2+'"></rect></g>';
    }
    /* 行标要看幕：开机那一幕门牌号还没算出来，标 stageN 就是提前泄题——

    for(var r3=0; r3<rows; r3++){
      var lo3 = r3*cols, hi3 = Math.min(D.world, (r3+1)*cols) - 1;
      s2 += o.plain
        ? txt(LX-7, LY+r3*ch+ch/2+3, lo3+'–'+hi3, 7.2, 'var(--pt-fg3)', 'end')
        : txt(LX-7, LY+r3*ch+ch/2+3, 'stage'+r3, 7.4, r3===co.p?VC.pp:'var(--pt-fg3)', 'end', r3===co.p?'font-weight="800"':'');
    }
    return {body:s2, hit:hit, cw:cw, ch:ch, cols:cols,
            at:function(gg){ return [LX + (gg%cols)*cw + cw/2, LY + Math.floor(gg/cols)*ch + ch/2]; }};
  }
  function ring(p, col, rr){
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+rr+'" style="fill:none;stroke:'+col+';stroke-width:1.6"/>';
  }

  /* ── 幕头：每一幕都要回答「这一步做几次」 ── */
  parts.push(txt(28, 26, '第 '+A+' 幕 · '+act.t+' —— '+act.s, 13, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  var bw = act.once ? 96 : 128;
  parts.push(rc(28, 34, bw, 15, act.once?mix(VC.pp,16):mix(VC.dp,16), act.once?VC.pp:VC.dp, 1, 'rx="7"'));
  parts.push(txt(28+bw/2, 44.5, act.once?'只做一次':'每个 micro-batch 重来', 8, act.once?VC.pp:VC.dp, 'middle', 'font-weight="800"'));
  parts.push(txt(866, 26, '跟住 global_rank = '+g, 11, 'var(--pt-fg)', 'end', 'font-weight="800"'));
  parts.push(txt(866, 40, (A===0 ? '门牌号还没算出来 —— 第 1 幕才有　' : '(pp'+co.p+' · dp'+co.d+' · cp'+co.c+' · tp'+co.t+(me?' · ep'+me.ep:'')+')　')
    + fmt(D.world)+' 卡 = TP'+D.tp+'·CP'+D.cp+'·PP'+D.pp+'·DP'+D.dp, 8, 'var(--pt-fg3)', 'end'));
  var narr = [];

  if(A===0){

    var L0 = lattice(110, 196, 750, 152, {plain:true, tint:function(gg,hot){ return hot ? 'var(--pt-fg)' : mix('var(--pt-fg)', 16); }});
    parts.push(txt(485, 96, '启动器拉起 '+fmt(D.world)+' 个进程，各绑一张卡 —— 代码完全相同', 11, 'var(--pt-fg)', 'middle', 'font-weight="700"'));
    parts.push(txt(485, 112, '此刻它们一模一样：同一份代码、同一份权重定义、同一份配置。全图同色不是偷懒，是这一幕的事实。', 8.4, 'var(--pt-fg2)'));
    parts.push('<g pointer-events="none">'+L0.body+'</g>');
    hits.push(L0.hit);
    parts.push(ring(L0.at(g), VC.dp, Math.max(6, L0.cw*.7)));
    parts.push(txt(L0.at(g)[0], L0.at(g)[1]-Math.max(20,L0.ch*.72), 'global_rank '+g, 8.6, VC.dp, 'middle', 'font-weight="800"'));
    parts.push(txt(485, 400, '唯一的差别 = 一个数字 global_rank（0…'+(D.world-1)+'）', 10.5, VC.dp, 'middle', 'font-weight="800"'));
    parts.push(txt(485, 416, '谁也还不知道自己该干什么 —— 门牌号要到下一幕才算出来', 8.4, 'var(--pt-fg3)'));
    narr = ['行只按编号分段（0–'+(plane-1)+' / '+plane+'–…），不是 stage —— 此刻还没有 stage 这回事，门牌号要到第 1 幕才算出来；这个排法眼下只是「为了摆得下」。',
            '这一幕是整个训练里唯一「所有卡完全对称」的时刻：同一份代码、同一份权重定义、同一份配置，差别只有一个数字。'];
  }

  if(A===1){
    /* ── 第 1 幕 · 报到：一维编号 → 四位门牌 ──

       一旦画成点阵，三个并行组就不用再靠「相邻 / 同列 / 等间隔」去解码了：
       它们是**穿过这张卡的三根正交棱** —— TP 沿 x、PP 沿 y、DP 沿 z，一眼可辨。 */
    var PX = 28, PY = 82;
    parts.push(txt(PX, PY, '配置到位：order = tp-cp-ep-dp-pp', 10.5, 'var(--pt-fg)', 'start', 'font-weight="800"'));
    parts.push(txt(PX, PY+15, '每个进程各自算了一遍同样的除法 —— 没有人告诉它这些', 8.2, 'var(--pt-fg2)', 'start'));
    parts.push(rc(PX, PY+24, 300, 62, mix('var(--pt-fg)',4), 'var(--pt-bd)', 1, 'rx="5"'));
    parts.push(txt(PX+10, PY+41, 'g = ((pp·DP + dp)·CP + cp)·TP + tp', 9.2, 'var(--pt-fg2)', 'start'));
    parts.push(txt(PX+10, PY+56, fmt(g)+' = (('+co.p+'·'+D.dp+' + '+co.d+')·'+D.cp+' + '+co.c+')·'+D.tp+' + '+co.t,
      10, 'var(--pt-fg)', 'start', 'font-weight="800"'));
    parts.push(txt(PX+10, PY+74, '逆解：tp=g%TP · cp=⌊g/TP⌋%CP · dp=⌊g/TP·CP⌋%DP · pp=⌊g/TP·CP·DP⌋（可逆 §07）', 7.2, 'var(--pt-fg3)', 'start'));
    parts.push(txt(PX, PY+100, '四个数不是四个标签，是一组坐标 ——', 9.4, 'var(--pt-fg)', 'start', 'font-weight="800"'));
    parts.push(txt(PX, PY+112, '所以右边该是魔方，不是平铺的格子。', 9.4, 'var(--pt-fg)', 'start', 'font-weight="800"'));
    var GATE = [['pp', co.p, VC.pp, '第 '+co.p+' 号 stage', 'y 轴 ↑'], ['dp', co.d, VC.dp, '第 '+co.d+' 个副本', 'z 轴 ↙'],
                ['tp', co.t, VC.tp, '权重矩阵第 '+co.t+' 条', 'x 轴 ↘'],
                ['cp', co.c, VC.cp, '序列第 '+co.c+' 段', D.cp>1?'第 4 根轴（分面）':'本配置 CP=1']];
    GATE.forEach(function(q, qi){
      var y2 = PY+124 + qi*30;

      parts.push(txt(PX+124, y2+11, esc(q[3]), 8.2, 'var(--pt-fg2)', 'start'));
      parts.push(txt(PX+124, y2+21, esc(q[4]), 7.2, 'var(--pt-fg3)', 'start'));
    });
    /* 组成员：不是记下来的，是同一份公式算出来的 */
    var GRP = [{d:'tp', n:'TP 组', ax:'x', m:groupMembers('tp',g,D), why:'层内两处 AllReduce 的伙伴'},
               {d:'pp', n:'PP 链', ax:'y', m:groupMembers('pp',g,D), why:'流水线的前后站（Send/Recv）'},
               {d:'dp', n:'DP 组', ax:'z', m:groupMembers('dp',g,D), why:'步末梯度 AllReduce 的伙伴'}];
    if(D.cp>1) GRP.push({d:'cp', n:'CP 组', ax:'第4轴', m:groupMembers('cp',g,D), why:'attention 内部换 KV（跨面，本图画不出）'});

    /* ── 魔方：x=tp（→↘）· y=pp（↑）· z=dp（↙）；CP 是第四根轴，只画本卡所在那一面 ── */
    var RX0 = 402, RY0 = 146, RW1 = 452, RH1 = 286;
    var nx = D.tp, ny = D.pp, nz = D.dp;
    var sc1 = Math.min(RW1/Math.max(.001,(nx+nz)*C), RH1/Math.max(.001,((nx+nz)*S + ny)));
    var TXc = RX0 + nz*C*sc1 + 10, TYc = RY0 + ny*sc1 + 10;
    function P3(x,y,z){ var p = proj(x,y,z,sc1); return [TXc+p[0], TYc+p[1]]; }

    var cubes = [];                                    /* 先收集，最后按画家顺序排 */
    function push3(x,y,z,fill,stroke,sw,attrs){

    var i5;
    for(i5=0;i5<=ny;i5++){ parts.push(edge([0,i5,nz],[nx,i5,nz],gst)); parts.push(edge([nx,i5,0],[nx,i5,nz],gst)); }
    for(i5=0;i5<=nx;i5++){ parts.push(edge([i5,ny,0],[i5,ny,nz],gst)); parts.push(edge([i5,0,nz],[i5,ny,nz],gst)); }
    for(i5=0;i5<=nz;i5++){ parts.push(edge([0,ny,i5],[nx,ny,i5],gst)); parts.push(edge([nx,0,i5],[nx,ny,i5],gst)); }

    /* 三根正交棱 = 三个并行组。这一句是本幕的全部主张 */
    GRP.forEach(function(q){

    parts.push(txt(RX0+RW1/2, 136, '卡空间 = tp × pp × dp 的三维点阵（'+D.tp+'×'+D.pp+'×'+D.dp+' = '+fmt(D.tp*D.pp*D.dp)+' 格）'
      + (D.cp>1 ? '　× CP='+D.cp+' 面' : ''), 9.4, 'var(--pt-fg2)', 'middle', 'font-weight="700"'));
    if(D.cp>1) parts.push(txt(RX0+RW1/2, 444, 'CP 是第 4 根轴，三维画不下 —— 本图只画 cp='+co.c+' 这一面（另有 '+(D.cp-1)+' 面同构）', 7.6, VC.cp, 'middle', 'font-weight="700"'));

    GRP.forEach(function(q, qi){
