    if(co.p>0) FLOW.push({c:VC.pp, t:'P2P 收 '+rankOf(co.t,co.c,co.d,co.p-1,D)+' 号的', s:'每个 μbatch 一次 · 跨层', n:D.ga});
    FLOW.push({c:VC.tp, t:'层内 AllReduce × 2/层', s:'每个 μbatch、每层两次 · 层内', n:D.ga*lps*2});
    FLOW.push({c:VC.dp, t:'梯度 AllReduce', s:'整个 step 只有一次 · 跨 step', n:1, big:true});
    FLOW.forEach(function(q, qi){
      var y7 = EY + qi*30;
      parts.push(ln([28, y7+8], [56, y7+8], 'stroke:'+q.c+';stroke-width:'+(q.big?2.4:1.5)+';stroke-dasharray:5 3'));
      parts.push(txt(64, y7+11, esc(q.t), q.big?10:9, q.c, 'start', 'font-weight="800"'));
      parts.push(txt(280, y7+11, esc(q.s), 8, 'var(--pt-fg2)', 'start'));
      parts.push(txt(620, y7+11, '本 step 共 '+fmt(q.n)+' 次'+(q.big?'':'（前向；反向同样一遍）'), 8.4, q.big?q.c:'var(--pt-fg3)', 'start', q.big?'font-weight="800"':''));
    });
    var LY9 = EY + FLOW.length*30 + 14;
    parts.push(rc(28, LY9, 818, 44, mix(VC.dp,6), VC.dp, 1.2, 'rx="5"'));
    parts.push(txt(42, LY9+18, D.ga+' 批的前向与反向都走完之后，它才和 DP 组的其他 '+(D.dp-1)+' 张卡做这个 step 唯一的一次梯度 AllReduce', 9.6, VC.dp, 'start', 'font-weight="800"'));
    parts.push(txt(42, LY9+34, '参数更新 → 回到第 3 幕重来。第 0/1/2 幕不再执行 —— 这就是「只做一次」与「每 micro-batch」的分界。', 8.4, 'var(--pt-fg2)', 'start'));
    narr = ['AllReduce 把 '+D.dp+' 份梯度平均回来，使 '+D.dp+' 份复印件下一步仍逐字节相同 —— 复印必须靠这一次同步来维持。',
            '一个 step = 1 次第 3–5 幕的循环 × '+D.ga+' 个 μbatch + 1 次 AllReduce + 1 次参数更新。'];
  }

  narr.forEach(function(t2, i2){
    parts.push(txt(28, H-34+i2*15, t2, 8.6, i2===0?'var(--pt-fg)':'var(--pt-fg2)', 'start', i2===0?'font-weight="700"':''));
  });

  /* 状态条（幕轨）是绝对定位的浮层，压在舞台左上角——整幅下移一行，别让幕头钻到它底下 */
  $('stage').innerHTML = '<svg viewBox="0 0 1080 '+(H+30)+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + '<g transform="translate(0,30)"><g pointer-events="none">'+parts.join('')+'</g>' + hits.join('') + '</g></svg>';
  $('stagebar').innerHTML = '<span class="pt-cap">一个 step</span>'
    + ACTS.map(function(q, qi){
        return '<button class="pb'+(qi===A?' is-on':'')+'" data-act="storyact" data-i="'+qi+'" title="'+esc(q.s)+'">'
          + qi+' '+esc(q.t)+'</button>';
      }).join('')
    + '<span class="pt-chip" style="border-color:'+(act.once?VC.pp:VC.dp)+';color:'+(act.once?VC.pp:VC.dp)+'">'
    + (act.once?'只做一次':'每 μbatch 重来')+'</span>';
  $('stageNote').hidden = true;
  $('detach').hidden = true;
}

/* ═════════ 真整网渲染器：画的就是那张真图本身 ═════════
   OPENPANGU_GRAPH 自带一套预排好的布局（3d-deck / model-graphviz 用的就是这一套）：
   **节点是中心坐标 + 宽高，cluster 是左上角 + 宽高**。这里直接用它，不另编一套坐标——
   所以「整网」不再是示意成一条色带，而是真图的真节点、真层级、真连边。
   每个节点的切法取 shardOfNode(id, rank) 的真结果（轴名 / 区间 / partial / 原语）；
   通信节点按参照系画成**动作**（横线 + 原语记号）而不是体：它不持有字节、不被切。
   一层 = decoder-stack 这个 repeat 簇；整网 = 它重复 D.layers 次 + 首尾的 embedding/head。 */
/* 切分表里除了五把刀还会出现 sp —— 序列并行。它**不是**第 6 根 rank 轴：
   SP 复用 TP 组（Megatron 口径），只是把 norm / 逐元素这类算子沿 seq 也切开，
   于是 TP 区与 SP 区之间要用 AllGather / Reduce-Scatter 来回换布局。
   所以它借 TP 的颜色，但标签如实写 SP，不把它冒充成 TP。 */
function dimColor(d){ return d==='sp' ? VC.tp : (VC[d] || 'var(--pt-fg2)'); }
var GIX = null;
function graphIndex(){
  if(GIX) return GIX;
  var G = window.OPENPANGU_GRAPH; if(!G) return null;
  var clu = {};
  G.clusters.forEach(function(c){ clu[c.id] = c; });
  GIX = {G:G, clu:clu};
  return GIX;
}
function inClu(parent, root, clu){        /* 节点是否落在某个簇的子树里（簇会嵌套） */
  var p = parent, guard = 8;
  while(p && guard-- > 0){ if(p === root) return true; p = clu[p] ? clu[p].parentCluster : null; }
  return false;
}
/* 真图节点 → 本卡的真切分标注（缓存一份，避免每帧重算 55 个节点） */
var SHD = {key:'', map:null};
function shardMap(D, g){
  var m = realModel(D); if(!m) return null;
  var key = RD.key + '/' + g;
  if(SHD.key === key) return SHD.map;
  var out = {};
  window.OPENPANGU_GRAPH.nodes.forEach(function(n){
    try{ out[n.id] = m.shardOfNode(n.id, g); }catch(e){ out[n.id] = null; }
  });
  SHD.key = key; SHD.map = out;
  return out;
}
/* o = {x,y,w,h, clip:'decoder-stack', g, D, label:true, ghostClu:['moe-block'], tag3d:true} */
function graphSVG(o){
  var IX = graphIndex(); if(!IX) return '';
  var G = IX.G, clu = IX.clu, D = o.D;
  var root = o.clip ? clu[o.clip] : null;
  var bx = root ? root.x : 0, by = root ? root.y : 0;
  var bw = root ? root.width : G.width, bh = root ? root.height : G.height;
  var sc = Math.min(o.w/bw, o.h/bh);
  var ox = o.x + (o.w - bw*sc)/2, oy = o.y + (o.h - bh*sc)/2;
  function TX(x){ return ox + (x-bx)*sc; }
  function TY(y){ return oy + (y-by)*sc; }
  var sh = shardMap(D, o.g) || {};
  var ghost = o.ghostClu || [];
  var pos = {}, out = [], acts = [], txts = [];
  var E3x = o.tag3d ? Math.max(2.2, 5*sc*8) : 0, E3y = o.tag3d ? E3x*0.62 : 0;

  /* 簇：结构线（无厚度），只画在 clip 子树里的 */
  G.clusters.forEach(function(c){
    if(o.clip && c.id !== o.clip && !inClu(c.parentCluster, o.clip, clu)) return;
    if(o.clip && c.id === o.clip) return;                 /* 外框由调用方画 */
    var gh = ghost.indexOf(c.id) >= 0;
    out.push('<rect x="'+TX(c.x).toFixed(1)+'" y="'+TY(c.y).toFixed(1)+'" width="'+(c.width*sc).toFixed(1)
      +'" height="'+(c.height*sc).toFixed(1)+'" rx="3" style="fill:none;stroke:var(--pt-bd);stroke-width:.8'
      +(gh?';stroke-dasharray:3 2':'')+'"/>');
    if(o.label && c.height*sc > 22)
      txts.push(txt(TX(c.x)+3, TY(c.y)+7.5, esc(c.label)+(gh?' · 本配置不实例化':''), 5.6,
                    gh?'var(--pt-fg3)':'var(--pt-fg2)', 'start', 'font-weight="700"'));
  });
  /* 连边：先画，压在节点下面（边是关系，不抢戏） */
  G.nodes.forEach(function(n){ pos[n.id] = n; });
  G.edges.forEach(function(e){
    var a = pos[e.source], b = pos[e.target];
    if(!a || !b) return;
    if(o.clip && !(inClu(a.parent, o.clip, clu) && inClu(b.parent, o.clip, clu))) return;
    out.push('<line x1="'+TX(a.x).toFixed(1)+'" y1="'+TY(a.y).toFixed(1)+'" x2="'+TX(b.x).toFixed(1)
      +'" y2="'+TY(b.y).toFixed(1)+'" style="stroke:var(--pt-bd);stroke-width:.5;stroke-opacity:.75'
      +(e.dashed?';stroke-dasharray:2 2':'')+'"/>');
  });
  /* 节点 */
  G.nodes.forEach(function(n){
    if(o.clip && !inClu(n.parent, o.clip, clu)) return;
    var x = TX(n.x - n.width/2), y = TY(n.y - n.height/2), w = n.width*sc, h = n.height*sc;
    var gh = ghost.some(function(c){ return n.parent===c || inClu(n.parent, c, clu); });
    var s1 = sh[n.id], by0 = (s1 && s1.spec && s1.spec.by && s1.spec.by[0]) || null;
    var dim = by0 ? by0.dim : null, part = (s1 && s1.parts && s1.parts[0]) || null;
    var col = dim ? dimColor(dim) : 'var(--pt-fg2)';
    if(n.colorKey === 'opv:comm'){
      /* 通信 = 动作：一条横线，不是体（§08：不持有字节、不被切，只占链路与时间） */
      acts.push('<line x1="'+x.toFixed(1)+'" y1="'+(y+h/2).toFixed(1)+'" x2="'+(x+w).toFixed(1)+'" y2="'+(y+h/2).toFixed(1)
        +'" style="stroke:'+(gh?'var(--pt-fg3)':VC.tp)+';stroke-width:1.3;stroke-dasharray:5 3;stroke-opacity:'+(gh?.35:.95)+'"/>');
      if(o.label && w > 34) txts.push(txt(x+w/2, y+h/2-2.5, esc(n.label), 5.4, gh?'var(--pt-fg3)':VC.tp, 'middle', 'font-weight="700"'));
      return;
    }
    if(n.kind !== 'op'){
      /* module = 分组标题（虚线）· tensor = 张量（浅框）：都不是「这张卡持有的算子」 */
      out.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
        +'" rx="2" style="fill:none;stroke:var(--pt-fg3);stroke-width:.6;stroke-dasharray:'+(n.kind==='module'?'3 2':'1 2')+';stroke-opacity:.7"/>');
      if(o.label && w > 30 && h > 5) txts.push(txt(x+w/2, y+h/2+2, esc(n.label), 5.2, 'var(--pt-fg3)'));
      return;
    }
    /* 算子 = 内容：有体积。切到了就用刀色，没切到是复制的 */
    var op = gh ? .18 : 1;
    if(E3x > 0){
      out.push('<polygon points="'+x.toFixed(1)+','+y.toFixed(1)+' '+(x+w).toFixed(1)+','+y.toFixed(1)+' '
        +(x+w+E3x).toFixed(1)+','+(y-E3y).toFixed(1)+' '+(x+E3x).toFixed(1)+','+(y-E3y).toFixed(1)
        +'" style="fill:'+mix(col,26)+';fill-opacity:'+op+';stroke:none"/>');
      out.push('<polygon points="'+(x+w).toFixed(1)+','+y.toFixed(1)+' '+(x+w+E3x).toFixed(1)+','+(y-E3y).toFixed(1)+' '
        +(x+w+E3x).toFixed(1)+','+(y+h-E3y).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h).toFixed(1)
        +'" style="fill:'+mix('var(--pt-fg)',26)+';fill-opacity:'+op+';stroke:none"/>');
    }
    var didCut = false;
    if(!gh && o.cuts && dim){
      var cutCfg = null, hxRef = '';
      if((dim==='tp'||dim==='sp') && o.cuts.tp){ cutCfg = o.cuts.tp; hxRef = o.cuts.hxTP||'hxTP'; }
      else if(dim==='ep' && o.cuts.ep){ cutCfg = o.cuts.ep; hxRef = o.cuts.hxEP||'hxEP'; }
      if(cutCfg && cutCfg.count > 1 && w/cutCfg.count >= 1.5){
        var kerf = w*0.15/cutCfg.count;
        for(var si=0; si<cutCfg.count; si++){
          var sx = x + w*si/cutCfg.count, sw = w/cutCfg.count - kerf;
          var isMine = si===cutCfg.mine;
          out.push('<rect x="'+sx.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+sw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1" '
            +'style="fill:'+(isMine?mix(col,55):'url(#'+hxRef+')')+';fill-opacity:'+op
            +';stroke:'+col+';stroke-width:'+(isMine?.8:.3)+';stroke-opacity:'+op+'"/>');
        }
        didCut = true;
      }
    }
    if(!didCut)
    out.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
      +'" rx="1.5" style="fill:'+mix(col, dim?46:16)+';fill-opacity:'+op+';stroke:'+(dim?col:'var(--pt-bds)')
      +';stroke-width:'+(dim?.9:.5)+';stroke-opacity:'+op+'"/>');
    if(o.label && w > 26 && h > 5){
      /* 真标签 + 真区间：和 3d-deck 上写的那一行是同一份数据。
         维名用切分表自己的 dimName（它会给出 SP 这种本页 DIMN 里没有的），
         total=0 的退化情形（如 experts=0 的专家桶）不硬标一个假区间。 */
      var tag = (part && part.total > 0)
        ? ' · '+(part.dimName || String(dim).toUpperCase())+part.range[0]+'/'+part.total+(s1 && s1.partial ? '↯' : '')
        : '';
      txts.push(txt(x+w/2, y+h/2+2, esc(n.label)+esc(tag), 5.4, gh?'var(--pt-fg3)':'var(--pt-fg)', 'middle',
                    (dim?'font-weight="700" ':'')+'pointer-events="none"'));
    }
  });
  return out.join('') + acts.join('') + txts.join('');
}

/* ═════════ 视图六 · 映射（两个视角）═════════
   C「映射」这一段要答两个不同的问题，所以是两个视角，不是两张图：
     · 视角① 双链映射 —— 哪一级映到哪一级（结构）
     · 视角② 交集腔   —— 这张卡装了哪一块（载荷）
   默认给①：先知道刀落在哪一级，再看那一级交出来的腔是什么。 */
function renderSolid(D){
  if(ui.persp === 'cav') return renderSolidCav(D);
  return renderSolidMap(D);
}
/* ═════════ 视角① 双链映射（FIG 09 的三维化）═════════
   两条链都是包含链，各 5 级，但两条链的级与级并不对齐——所以连线是斜的，斜不是画风，是事实。
   全图真正的主张只有一句：四个并行维度全部收在「卡」这一级。
   往上两级（机 / 集群）只决定拓扑与带宽——它们不持有内容，所以画成空线框；
   往下两级（计算单元 / 片上 buffer）与并行完全无关——算子融合与 tiling 不跨卡、不通信。
   「卡」这一级不是一只盒子，是一整个卡阵平面（机内 8 卡 × 若干台机），四条梁全落在这个平面上；
   顺带就能核对两条常被念错的约束：TP 分片必须机内（组要落在同一行）· PP 划分可跨机（链本来就跨行）。
   机制框是扁的：机制是动作，不是容器——参照系里只有卡与流两个容器画成体。 */
function renderSolidMap(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var H = 700, parts = [], hits = [];
  var L4 = layerOn('L4');
  var PER = 8, MACH = Math.ceil(D.world/PER);      /* 机 = 8 卡：FIG09 的拓扑假设，不由并行配置推出 */
  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function poly(pts, st, extra){ return '<polygon points="'+ptsStr(pts)+'" style="'+st+'" '+(extra||'')+'/>'; }
  /* 水平板：容器才有体积（斜投影，深度恒为 (dx,−dy)） */
  function plate(px,py,w,dx,dy,th,o){
    o = o || {};
    var st = 'stroke:'+(o.stroke||'var(--pt-bds)')+';stroke-width:'+(o.sw||1)+(o.dash?';stroke-dasharray:'+o.dash:'');
    var pc = o.pct || 0, base = o.base || 'var(--pt-fg)';
    function F(k){ return pc ? mix(base, Math.min(70, pc*k)) : 'none'; }
    return poly([[px,py],[px+w,py],[px+w+dx,py-dy],[px+dx,py-dy]], 'fill:'+F(1)+';'+st)
         + poly([[px,py],[px+w,py],[px+w,py+th],[px,py+th]], 'fill:'+F(2.1)+';'+st)
         + poly([[px+w,py],[px+w+dx,py-dy],[px+w+dx,py-dy+th],[px+w,py+th]], 'fill:'+F(3)+';'+st);
  }
  function cell(px,py,w,dx,dy,a0,a1,b0,b1){       /* 板上 (a 沿宽, b 沿深) 的一格 */
    function P(a,b){ return [px + a*w + b*dx, py - b*dy]; }
    return [P(a0,b0), P(a1,b0), P(a1,b1), P(a0,b1)];
  }
  var LX = 36, LW = 112, LDX = 32, LDY = 18, LTH = 6;
  var MX0 = 224, MW0 = 244, MH0 = 30;
  var PX0 = 540, PW0 = 118, PDX = 34, PDY = 19, PTH = 6;
  var CDX = 104, CDY = 64, CW0 = 168, CTH = 9;      /* 卡阵平面：它是主角，给足深度 */
  var LOG = [
    {k:'net', y:132, t:'整网',      s:D.layers+' 层的图'},
    {k:'lay', y:220, t:'层 ℓ',      s:'层子图 · PP 切成 '+D.pp+' 段'},
    {k:'exp', y:308, t:'expert e',  s:D.moe?('仅 MoE 层存在 · '+D.experts+' 个'):'仅 MoE 层存在（本配置无）'},
    {k:'op',  y:396, t:'算子',      s:'MatMul · Softmax'},
    {k:'ten', y:484, t:'张量',      s:'权重 · 激活值'}
  ];
  var PHY = [
    {k:'clu',  y:118, t:'集群',        s:'world_size '+fmt(D.world)+' 张卡'},
    {k:'mac',  y:202, t:'机',          s:PER+' 卡 · 机内高带宽 · 共 '+fmt(MACH)+' 台'},
    {k:'card', y:352, t:'卡',          s:'显存 + 计算单元 + 流', big:true},
    {k:'unit', y:474, t:'计算单元',    s:'矩阵 + 向量单元'},
    {k:'buf',  y:552, t:'片上 buffer', s:'各级缓存'}
  ];
  var LY = {}, PY = {};
  LOG.forEach(function(q){ LY[q.k] = q.y; });
  PHY.forEach(function(q){ PY[q.k] = q.y; });
  var MAPS = [
    {from:'net', to:'clu',  dim:null, t:'world_size = TP × CP × PP × DP', s:'是计数恒等式，不是一把刀'},
    {from:'lay', to:'card', dim:'pp', t:'PP 划分', s:'按层号 ℓ 分给不同 stage · 可跨机'},
    {from:'exp', to:'card', dim:'ep', t:'EP 划分', s:'按 expert 号 e 分开放 · 借用已有的卡'},
    {from:'op',  to:'card', dim:'tp', t:'TP 分片', s:'沿 h 拆权重矩阵 · 必须机内'},
    {from:'ten', to:'card', dim:'dp', t:'DP 切 b / CP 切 s', s:'权重全份复制，只切输入'},
    {from:'op',  to:'unit', dim:null, t:'算子选择 + 算子融合 → 落成 kernel', s:'与并行无关'},
    {from:'ten', to:'buf',  dim:null, t:'tiling', s:'不跨卡、不通信'}
  ];
  parts.push(txt(452, 58, '两条包含链，级与级并不对齐 —— 所以连线是斜的，斜不是画风', 12.5, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(452, 74, '四条并行映射的源头在逻辑侧的四个不同层级，落点全是「卡」', 9.2, 'var(--pt-fg2)'));
  parts.push(txt(LX+LW/2+LDX/2, 100, '逻辑侧', 10.5, 'var(--pt-fg2)', 'middle', 'font-weight="800"'));
  parts.push(txt(MX0+MW0/2, 100, '映射机制（是动作，不画成体）', 10.5, 'var(--pt-fg2)', 'middle', 'font-weight="800"'));
  parts.push(txt(PX0+PW0/2+PDX/2, 88, '物理侧', 10.5, 'var(--pt-fg2)', 'middle', 'font-weight="800"'));
  LOG.forEach(function(q){
    var off = q.k==='exp' && !D.moe;
    parts.push(plate(LX, q.y, LW, LDX, LDY, LTH, {pct: off?0:7, stroke: off?'var(--pt-bd)':'var(--pt-bds)', sw:1, dash: off?'3 2':''}));
    parts.push(txt(LX+8, q.y-LDY/2, esc(q.t), 9.6, off?'var(--pt-fg3)':'var(--pt-fg)', 'start', 'font-weight="800"'));
    parts.push(txt(LX+8, q.y-LDY/2+11, esc(q.s), 6.9, 'var(--pt-fg3)', 'start'));
  });
  PHY.forEach(function(q){
    if(q.big) return;

    parts.push(txt(PX0+8, q.y-PDY/2, esc(q.t), 9.6, 'var(--pt-fg2)', 'start', 'font-weight="800"'));

  /* ── 卡阵平面：机内 8 卡 × MACH 台机，全量画出 ── */
  var cy = PY.card;
  var tpM = groupMembers('tp', g, D), ppM = groupMembers('pp', g, D);
  var tpMach = {}, ppMach = {};
  tpM.forEach(function(x){ tpMach[Math.floor(x/PER)] = 1; });
  ppM.forEach(function(x){ ppMach[Math.floor(x/PER)] = 1; });
  var tpIn = Object.keys(tpMach).length === 1;
  parts.push(plate(PX0, cy, CW0, CDX, CDY, CTH, {pct:5, stroke:'var(--pt-fg)', sw:1.6}));
  var cw1 = 1/PER, cb1 = 1/MACH;
  var tiny = (CW0/PER < 2.2) || (CDY/MACH < 1.4);
  for(var mi=0; mi<MACH; mi++) for(var si=0; si<PER; si++){
    var gg = mi*PER + si;
    if(gg >= D.world) continue;
    var q4 = cell(PX0, cy, CW0, CDX, CDY, si*cw1, (si+1)*cw1, mi*cb1, (mi+1)*cb1);
    var f4 = gg===g ? 'var(--pt-fg)' : tpM.indexOf(gg)>=0 ? mix(VC.tp,55)
           : ppM.indexOf(gg)>=0 ? mix(VC.pp,48) : mix('var(--pt-fg)',9);
    parts.push(poly(q4, 'fill:'+f4+';stroke:'+(tiny?'none':'var(--pt-bg)')+';stroke-width:.3'));
    if(!tiny) hits.push('<g class="cgrow">'+poly(q4, 'fill:transparent;cursor:pointer', 'data-act="pickg" data-g="'+gg+'"')+'</g>');
  }
  if(!tiny) for(var mj=1; mj<MACH; mj++){
    var e4 = cell(PX0, cy, CW0, CDX, CDY, 0, 1, mj*cb1, mj*cb1);
    parts.push(ln(e4[0], e4[1], 'stroke:var(--pt-fg3);stroke-width:.5;stroke-opacity:.65'));
  }
  parts.push(txt(PX0-8, cy+2, '卡', 11, 'var(--pt-fg)', 'end', 'font-weight="800"'));
  parts.push(txt(PX0-8, cy+14, '显存+计算单元+流', 6.6, 'var(--pt-fg3)', 'end'));
  parts.push(txt(PX0+CW0+CDX+8, cy-CDY+2, fmt(MACH)+' 台机 × '+PER+' 卡', 7.4, 'var(--pt-fg3)', 'start'));
  parts.push(txt(PX0+CW0+CDX+8, cy-CDY+12, '= '+fmt(D.world)+' 张（全画）', 7.4, 'var(--pt-fg3)', 'start'));
  if(tiny) parts.push(txt(PX0, cy+CTH+16, fmt(D.world)+' 张全画出来了，但格子已细到点不动 —— 点选请用顶栏的「选中卡」输入框', 7, 'var(--pt-fg3)', 'start'));
  /* ── 七条映射：四条并行的全部收在「卡」那一点 ── */
  var CARD_IN = [PX0, cy];
  MAPS.forEach(function(q, qi){
    var my = 118 + qi*62, dead = (q.from==='exp' && !D.moe);
    var col = q.dim ? VC[q.dim] : 'var(--pt-fg3)';
    var d2 = q.to==='card' ? CARD_IN : [PX0, PY[q.to]];
    var sw = q.dim ? 1.6 : .9;
    parts.push('<g opacity="'+(dead?.3:1)+'">'
      + ln([LX+LW, LY[q.from]], [MX0, my], 'stroke:'+col+';stroke-width:'+sw+';stroke-opacity:.8')
      + ln([MX0+MW0, my], d2, 'stroke:'+col+';stroke-width:'+sw+';stroke-opacity:.85;marker-end:url(#'+(q.dim?'arr'+q.dim:'arrx')+')')
      + '<rect x="'+MX0+'" y="'+(my-MH0/2)+'" width="'+MW0+'" height="'+MH0+'" rx="4" style="fill:var(--pt-s1);stroke:'+col+';stroke-width:'+(q.dim?1.6:1)+'"/>'
      + txt(MX0+10, my-1, esc(q.t), 9, q.dim?col:'var(--pt-fg2)', 'start', 'font-weight="800"')
      + txt(MX0+10, my+10, esc(q.s)+(dead?'（本配置无）':''), 6.9, 'var(--pt-fg3)', 'start')+'</g>');
  });
  /* ── 三句主张 ── */
  var AX = 706;
  parts.push('<rect x="'+PX0+'" y="'+(cy+CTH+8)+'" width="214" height="48" rx="5" style="fill:'+mix('var(--pt-fg)',5)+';stroke:var(--pt-fg);stroke-width:1.4"/>');
  parts.push(txt(PX0+10, cy+CTH+25, '四个并行维度全部收在', 10.2, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(PX0+10, cy+CTH+38, '「卡」这一级　PP · EP · TP · DP/CP', 9, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(AX, PY.clu-4, '上面两级只决定拓扑与带宽', 8, 'var(--pt-fg2)', 'start', 'font-weight="700"'));
  parts.push(txt(AX, PY.clu+7, '不持有内容 → 画成空线框', 6.8, 'var(--pt-fg3)', 'start'));
  parts.push(txt(AX, PY.unit+4, '下面两级与并行完全无关', 8, 'var(--pt-fg2)', 'start', 'font-weight="700"'));
  parts.push(txt(AX, PY.unit+15, '融合与 tiling 不跨卡、不通信', 6.8, 'var(--pt-fg3)', 'start'));
  /* ── 两条常被念错的约束，在卡阵上直接验 ── */
  var VY = 572;
  parts.push(txt(36, VY, '把「卡」画成整个平面，这两条就验得了：', 9, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(ln([36, VY+13], [48, VY+13], 'stroke:'+VC.tp+';stroke-width:3.4'));
  parts.push(txt(54, VY+16, 'TP 分片必须机内：本卡 TP 组 '+tpM.length+' 张 → '
    + (tpIn ? '同 1 台机 ✓' : '跨 '+Object.keys(tpMach).length+' 台机 ✗ 违反约束'), 8.4, tpIn?VC.tp:'var(--pt-danger)', 'start', 'font-weight="700"'));
  parts.push(ln([36, VY+28], [48, VY+28], 'stroke:'+VC.pp+';stroke-width:3.4'));
  parts.push(txt(54, VY+31, 'PP 划分可跨机：本卡 PP 链 '+ppM.length+' 张 → 跨 '+Object.keys(ppMach).length+' 台机'
    + (Object.keys(ppMach).length>1 ? '（本来就该跨）' : '（恰好同机）'), 8.4, VC.pp, 'start', 'font-weight="700"'));
  parts.push(txt(54, VY+43, '机 = '+PER+' 卡是拓扑假设（FIG 09 口径），不由并行配置推出 —— 换机器规格，这两条结论会变。', 7.2, 'var(--pt-fg3)', 'start'));
  parts.push(txt(36, H-30, '读法：连线的斜度就是「逻辑侧第 N 级 ≠ 物理侧第 N 级」。容器（板）有体积，机制（框）是扁的——参照系里只有卡与流两个容器。', 8.4, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(36, H-16, '这一段的另一个问题「这张卡到底装了哪一块」，由第二视角『交集腔』回答：四条梁交出来的那个小长方体就是它。', 8, 'var(--pt-fg2)', 'start'));

  $('stage').innerHTML = '<svg viewBox="0 0 1080 '+H+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + '<g pointer-events="none">'+parts.join('')+'</g>' + hits.join('') + '</svg>';
  $('stagebar').innerHTML = '<span class="pt-cap">映射</span>'
    + '<button class="pb is-on" data-act="persp" data-p="map">双链映射</button>'
    + '<button class="pb" data-act="persp" data-p="cav">交集腔</button>'
    + '<span class="pt-chip">四个并行维度全部收在「卡」这一级</span>'
    + '<span class="pt-chip" style="border-color:'+(tpIn?VC.tp:'var(--pt-danger)')+';color:'+(tpIn?VC.tp:'var(--pt-danger)')+'">TP '+(tpIn?'机内 ✓':'跨机 ✗')+'</span>';
  $('stageNote').hidden = true;
  $('detach').hidden = true;
}

/* ═════════ 视图六 · 交集腔：卡为什么是「这一块」 ═════════
   前五视图各答一问：单维答「一把刀怎么切」、刀序答「几把刀什么次序」、解剖答「卡里有什么」。
   这一张答最后一问——**为什么恰好是这一块**，而这一问只能靠三维说清楚。
   两个对象各有自己的索引空间，轴数不同（§03 五元组：恰好一根轴对一把刀）：
     · 权重体① = ℓ × h × e     三轴 ← PP 切 ℓ、TP 切 h、EP 切 e
     · 激活体② = ℓ × h × b × s 四轴 ← 多出 DP 切的 b、CP 切的 s
   每把刀是**一整片板**（切穿整只盒子，不是切一小块）；三片板相交剁出一个小长方体，
   那就是这张卡持有的全部——体积 ∶ 全盒 = 持有占比。卡不是缩小的整网，是**区间的交集**。
   两条不对称在轴数上直接看得见，不用一句口号：
     · DP 在①上**没有轴** → 它只能把整只盒子复印一叠，格子数与格子大小全不变
       ⇒ 换副本时腔纹丝不动、体积一点不少 = A3「加 DP 不买余量」的几何证明
       （数值证明在单维切分的反事实里：若 DP=1，同一张卡还是这么多字节。两处互相印证。）
     · EP 在②上没有轴 → 路由是动作（把 token 送去别的卡），不是静态切分。 */
function renderSolidCav(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var H = 700, parts = [], hits = [];
  var L1 = layerOn('L1'), L2 = layerOn('L2'), L3 = layerOn('L3'), L4 = layerOn('L4');
  var hK = Math.floor(D.hidden/D.tp), kE = D.moe ? D.experts/D.ep : 0, lps = D.layersPerStage;
  /* 激活体是**第二视角**：主角是权重体（六把刀里有四把落在它上面，A3 也在它上面）。
     默认只画①，②收起来——顶栏一键展开。展开时①仍在左、②小一号在右，主次分明。 */
  var SEC = !!ui.act2;
  var TY = 322, TX1 = SEC ? 372 : 500, TX2 = 700, BW = 142, BH = 132;
  var BD1 = D.moe ? 104 : 40, BD2 = 104;
  /* 读数放**左栏**：右上角是常驻的读出卡（.pt-detail，304px），右栏会被它盖住——
     版面必须按真实的浮层排，不能画完了让读者自己去关卡片。 */
  var RX = 24, RW = 190;

  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function p3(x,y,z){ return proj(x,y,z,1); }
  function hexPts(w,h,d){ /* 盒子的屏幕轮廓（等轴测下恒是这个六边形）——复印件只画剪影 */
    return [p3(0,h,0), p3(w,h,0), p3(w,0,0), p3(w,0,d), p3(0,0,d), p3(0,h,d)];
  }

  /* ── 一只索引空间盒 ──────────────────────────────────────────
     外框（结构线）+ 三组刀面（每把刀在三个可见面上留下的线）+ 三片板 + 交集腔 + 三根可点的轴尺。
     ax/ay/az = {n 份数, dim 哪把刀, i 本卡拿第几份, name 轴名, k chainpick 键, lab(i) 刻度文字}
     x 轴走屏幕右下、z 轴走左下、y 轴朝上——三根轴各由一把刀认领，认领关系写在轴尺上。 */
  function solidBox(o){
    var W = o.w, HH = o.h, DD = o.d, ax = o.ax, ay = o.ay, az = o.az;
    var dx = W/ax.n, dy = HH/ay.n, dz = DD/az.n;
    var x0 = ax.i*dx, y0 = ay.i*dy, z0 = az.i*dz;
    var body = '', hit = '', i;
    /* 份数大到画不下时降的是线宽与标注，不是份数——细密纹理本身就是「真切了这么多刀」 */
    function gridStyle(step, col){
      var sw = step>4?.9:step>2?.6:.4, op = step>4?.58:step>2?.42:.26;
      return 'stroke:'+col+';stroke-width:'+sw+';stroke-opacity:'+op;
    }
    if(L1){
      body += boxSVG(0,0,0,W,HH,DD,1,{wire:true, stroke:'var(--pt-bd)', sw:1, dash:'3 3'});
      var st = gridStyle(dy, VC[ay.dim]);
      for(i=1;i<ay.n;i++) body += ln(p3(0,i*dy,DD), p3(W,i*dy,DD), st) + ln(p3(W,i*dy,0), p3(W,i*dy,DD), st);
      st = gridStyle(dx*C, VC[ax.dim]);
      for(i=1;i<ax.n;i++) body += ln(p3(i*dx,HH,0), p3(i*dx,HH,DD), st) + ln(p3(i*dx,0,DD), p3(i*dx,HH,DD), st);
      st = gridStyle(dz*C, VC[az.dim]);
      for(i=1;i<az.n;i++) body += ln(p3(0,HH,i*dz), p3(W,HH,i*dz), st) + ln(p3(W,0,i*dz), p3(W,HH,i*dz), st);
    }
    /* 三片板：每把刀留下的区间**铺满另外两根轴**——刀是板不是块，这是「一整片切穿」的形 */
    if(L2){
      function slab(x,y,z,w,h,d,dim,n){
        /* n=1 = 这把刀没切开：板就是整只盒子，照常上色会把盒子刷成一片纯色，压淡且不描棱 */
        if(n===1) return '<g opacity=".07">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>';
        return '<g opacity=".26">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>'
             + boxSVG(x,y,z,w,h,d,1,{wire:true, stroke:VC[dim], sw:.7});
      }
      body += slab(0,0,z0,W,HH,Math.max(dz,.8), az.dim, az.n);
      body += slab(x0,0,0,Math.max(dx,.8),HH,DD, ax.dim, ax.n);
      body += slab(0,y0,0,W,Math.max(dy,.8),DD, ay.dim, ay.n);
      body += boxSVG(x0,y0,z0,dx,dy,dz,1,{fill:'var(--pt-fg)', stroke:'var(--pt-fg)', sw:1});
    }
    /* 腔的棱始终画：薄到 1px 也得能定位（dz 小 = 这张卡真的只占这么一薄片，不放大骗人）。
       data-cav 是给页外核对用的把手：换 DP 副本时 data-cav="w" 的坐标必须逐字不变（A3）。 */
    body += boxSVG(x0,y0,z0,Math.max(dx,.7),Math.max(dy,.7),Math.max(dz,.7),1,
                   {wire:true, stroke:o.cav||'var(--pt-fg)', sw:1.7,
                    attrs:' data-cav="'+(o.cavId||'')+'" data-cav-size="'+dx.toFixed(3)+','+dy.toFixed(3)+','+dz.toFixed(3)+'"'});
    /* ETP：在 e 腔**内部**再沿专家自己的 ffn 维切一刀（不是外面那根 h 轴，同属「算子内部」那一类） */
    if(o.etp>1) for(i=1;i<o.etp;i++){
      var ex = x0 + dx*i/o.etp;
      body += ln(p3(ex,y0+dy,z0), p3(ex,y0+dy,z0+dz), 'stroke:'+VC.ep+';stroke-width:.8;stroke-dasharray:2 2;stroke-opacity:.8');
    }

    /* 轴尺：刀在这根轴上留下的刻度。点一格换卡（复用 chainpick 的可逆坐标算术 §07）。
       画得下写全名，写不下降成序号，再写不下只标端点与选中——降的是标注，份数一个不少。 */
    function ruler(a, A, B, out, pad, anchor){
      var pa = p3(A[0],A[1],A[2]), pb = p3(B[0],B[1],B[2]);
      var vx = (pb[0]-pa[0])/a.n, vy = (pb[1]-pa[1])/a.n;
      var step = Math.sqrt(vx*vx+vy*vy), col = VC[a.dim];
      var tier = step > 34 ? 2 : step > 13 ? 1 : 0;
      var hw = Math.max(7, Math.min(24, step*.92));
      body += ln([pa[0]+out[0]*pad, pa[1]+out[1]*pad], [pb[0]+out[0]*pad, pb[1]+out[1]*pad], 'stroke:'+col+';stroke-width:1;stroke-opacity:.65');
      for(var j=0;j<a.n;j++){
        var hot = j===a.i;
        var mx = pa[0]+vx*(j+.5)+out[0]*pad, my = pa[1]+vy*(j+.5)+out[1]*pad;
        body += ln([pa[0]+vx*j+out[0]*pad, pa[1]+vy*j+out[1]*pad], [pa[0]+vx*j+out[0]*(pad+4), pa[1]+vy*j+out[1]*(pad+4)],
                   'stroke:'+col+';stroke-width:'+(hot?1.6:.7)+';stroke-opacity:'+(hot?1:.5));
        if(L4 && (tier===2 || tier===1 || hot || j===0 || j===a.n-1))
          body += txt(mx+out[0]*11, my+out[1]*11+3, esc(tier===2 ? a.lab(j) : String(j)), hot?8.6:7.3,
                      hot?col:'var(--pt-fg3)', anchor||'middle', hot?'font-weight="800"':'');
        if(a.k) hit += '<g class="cgrow"><rect x="'+(mx+out[0]*10-hw/2).toFixed(1)+'" y="'+(my+out[1]*10-7).toFixed(1)+'" width="'+hw.toFixed(1)+'" height="14" style="fill:transparent;cursor:pointer" data-act="chainpick" data-k="'+a.k+'" data-i="'+j+'"></rect></g>';
      }
      /* 轴名 = 「哪根轴 ← 哪把刀切了几份」，认领关系不靠记忆。
         挂在尺的**中点**：x 尺与 z 尺共用同一个下角，挂端点会叠成一行。 */
      var e2 = [(pa[0]+pb[0])/2+out[0]*(pad+27), (pa[1]+pb[1])/2+out[1]*(pad+27)];
      body += txt(e2[0], e2[1], esc(a.name)+' <tspan style="fill:'+col+'" font-weight="800">← '+DIMN[a.dim]+'×'+a.n+'</tspan>', 8.2, 'var(--pt-fg2)', anchor||'middle', 'font-weight="700"');
      return step;
    }
    ruler(ax, [0,0,DD], [W,0,DD], [-.5, C], 12);          /* x 尺：左下棱 */
    ruler(az, [W,0,0], [W,0,DD], [.5, C], 12);            /* z 尺：右下棱 */
    /* noY：ℓ 尺两只盒子共用一把 PP 刀，画两遍就成了「两把刀」的错觉，也挤掉两盒之间的间距 */
    if(!o.noY) ruler(ay, [0,0,DD], [0,HH,DD], [-1, 0], 14, 'end');
    return {body:body, hit:hit, dx:dx, dy:dy, dz:dz, x0:x0, y0:y0, z0:z0,
            cc:p3(x0+dx/2, y0+dy/2, z0+dz/2)};
  }

  /* ═══ 抬头 ═══ */
  parts.push(txt(600, 28, '一张卡 = 各轴区间的交集，不是缩小的整网', 13, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(600, 44, '每把刀是一整片板，切穿整只盒子；三片板相交剁出一个小长方体 —— 体积 ∶ 全盒 = 这张卡的持有占比', 9, 'var(--pt-fg2)'));

  /* ═══ 盒① 权重体：ℓ × h × e ═══ */
  var b1 = solidBox({w:BW, h:BH, d:BD1, etp:D.etp, cavId:'w',
    ax:{n:D.tp, dim:'tp', i:co.t, name:'h 隐藏维', k:'t', lab:function(i){ return '片'+i; }},
    ay:{n:D.pp, dim:'pp', i:co.p, name:'ℓ 层号',  k:'p', lab:function(i){ return 'L'+(i*lps)+'–L'+((i+1)*lps-1); }},
    az:{n:D.moe?D.ep:1, dim:'ep', i:me?me.ep:0, name:D.moe?'e 专家号':'e 轴不存在', k:D.moe?'e':'',
        lab:function(i){ return D.moe ? 'E'+(i*kE)+'–E'+((i+1)*kE-1) : '（稠密·无 e 轴）'; }}});
  /* DP 在这只盒子上没有轴：它只能整只复印。复印件与原盒**等大**（尺寸纪律：复印=等大成叠），
     格子数与格子大小一个不变——所以那一腔的体积与 DP 无关。 */
  var K1 = D.dp, oX = K1>1 ? Math.min(9, 46/(K1-1)) : 0, oY = K1>1 ? Math.min(6, 36/(K1-1)) : 0;
  for(var k1=K1-1; k1>=1; k1--){
    parts.push('<g transform="translate('+(TX1+k1*oX).toFixed(1)+','+(TY-k1*oY).toFixed(1)+')" opacity="'+(0.26+0.5*(1-k1/K1)).toFixed(2)+'">'
      + '<polygon points="'+ptsStr(hexPts(BW,BH,BD1))+'" style="fill:var(--pt-bg);stroke:'+VC.dp+';stroke-width:.7"/></g>');
  }
  parts.push('<g transform="translate('+TX1+','+TY+')">'+b1.body+'</g>');
  hits.push('<g transform="translate('+TX1+','+TY+')">'+b1.hit+'</g>');
  parts.push(txt(TX1-4, 92, '① 权重体 · 索引空间 '+(D.moe?'ℓ × h × e（三轴）':'ℓ × h（两轴，无 MoE）'), 11, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(TX1-4, 105, '被剁成 '+D.pp+'×'+D.tp+(D.moe?'×'+D.ep:'')+' = '+fmt(D.pp*D.tp*(D.moe?D.ep:1))+' 个腔，这张卡持有其中 1 个', 8.2, 'var(--pt-fg2)'));
  /* DP 副本尺：收起②之后它就没地方了，可它恰恰是 A3 的操作台——挪到①底下，
     位置反而更对：「换副本 → 看①的腔」本来就该在同一只盒子旁边完成。 */
  if(!SEC && D.dp>1){
    var DRY = TY + (BW+BD1)*S + 62, DRW = Math.min(320, Math.max(120, D.dp*16));
    var DRX = TX1 + (BW-BD1)*C/2 - DRW/2, dstep = DRW/D.dp;
    parts.push(txt(DRX+DRW/2, DRY-10, '换 DP 副本 —— A3 的操作台：腔的三条边长一个数都不会变', 8, VC.dp, 'middle', 'font-weight="700"'));
    parts.push(ln([DRX, DRY], [DRX+DRW, DRY], 'stroke:'+VC.dp+';stroke-width:1;stroke-opacity:.65'));
    for(var dq=0; dq<D.dp; dq++){
      var hotq = dq===co.d, mx2 = DRX+dstep*(dq+.5);
      parts.push(ln([DRX+dstep*dq, DRY], [DRX+dstep*dq, DRY+4], 'stroke:'+VC.dp+';stroke-width:'+(hotq?1.6:.7)+';stroke-opacity:'+(hotq?1:.5)));
      if(L4 && (dstep>22 || hotq || dq===0 || dq===D.dp-1))
        parts.push(txt(mx2, DRY+15, dstep>22?('副本'+dq):String(dq), hotq?8.6:7.3, hotq?VC.dp:'var(--pt-fg3)', 'middle', hotq?'font-weight="800"':''));
      hits.push('<g class="cgrow"><rect x="'+(mx2-Math.max(6,Math.min(22,dstep*.92))/2).toFixed(1)+'" y="'+(DRY+2).toFixed(1)
        +'" width="'+Math.max(6,Math.min(22,dstep*.92)).toFixed(1)+'" height="16" style="fill:transparent;cursor:pointer" data-act="chainpick" data-k="d" data-i="'+dq+'"></rect></g>');
    }
  }
  if(K1>1){
    parts.push(txt(TX1+BW*C+10, 128, '×'+D.dp+' 复印（DP）', 8.4, VC.dp, 'start', 'font-weight="800"'));
    parts.push(txt(TX1+BW*C+10, 139, '≡ 逐字节相同 · 等大', 7.2, VC.dp, 'start'));
    parts.push(txt(TX1+BW*C+10, 149, 'DP 在①上没有轴', 7.2, 'var(--pt-fg3)', 'start'));
  }

  /* 专家权重的 h 由 **ETP** 切，不由 TP 切：ETP=1 时它在 h 上压根没切开，
     所以①的腔对专家那一块其实更宽——虚线框标出来，字节占比高过体积占比的主因就看得见。 */
  if(D.moe && D.etp < D.tp){
    var ew = BW/D.etp, ex0 = (me.etp % D.etp)*ew;
    parts.push('<g transform="translate('+TX1+','+TY+')">'
      + boxSVG(ex0, b1.y0, b1.z0, ew, b1.dy, b1.dz, 1, {wire:true, stroke:VC.ep, sw:1.2, dash:'4 3'})+'</g>');
    var ec = proj(ex0+ew, b1.y0, b1.z0+b1.dz, 1);
    parts.push(txt(TX1+ec[0]+6, TY+ec[1]+11, '专家腔：h 由 ETP='+D.etp+' 切，比 TP 那一格宽', 7, VC.ep, 'start', 'font-weight="700"'));
  }

  /* ═══ 盒② 激活体（第二视角，默认收起）：ℓ × s × b（h 是第 4 根轴，三维画不下，写在旁边） ═══ */
  var b2 = SEC && solidBox({w:BW*.86, h:BH*.86, d:BD2*.86, cav:VC.dp, noY:true, cavId:'a',
    ax:{n:D.cp, dim:'cp', i:co.c, name:'s 序列位', k:D.cp>1?'c':'',
        lab:function(i){ return D.cp>1 ? '段'+i+'∪'+(2*D.cp-1-i) : '全部 s'; }},
    ay:{n:D.pp, dim:'pp', i:co.p, name:'ℓ 层号',  k:'', lab:function(i){ return 'L'+(i*lps); }},
    az:{n:D.dp, dim:'dp', i:co.d, name:'b 样本号', k:'d', lab:function(i){ return '副本'+i; }}});
  if(SEC){
    parts.push('<g transform="translate('+TX2+','+TY+')">'+b2.body+'</g>');
    hits.push('<g transform="translate('+TX2+','+TY+')">'+b2.hit+'</g>');
    parts.push(txt(TX2-4, 92, '② 激活体（第二视角）· 索引空间 ℓ × h × b × s（四轴）', 10.5, 'var(--pt-fg2)', 'middle', 'font-weight="800"'));
    parts.push(txt(TX2-4, 105, '同一把 DP 刀在这里是轴：整盒被真切成 '+D.dp+' 份（面积守恒），不是复印', 8.2, VC.dp));
    parts.push(txt(TX2-4, 117, 'h 是它的第 4 根轴（TP 也切它）· ℓ 与①同一把 PP 刀，尺不重复画', 7.4, 'var(--pt-fg3)'));
  }else{
    parts.push(txt(TX2+10, 300, '② 激活体是第二视角，默认收起', 9.6, 'var(--pt-fg3)', 'middle', 'font-weight="700"'));
    parts.push(txt(TX2+10, 314, '顶栏「展开激活体」可以打开：它多出 b（DP 切）与 s（CP 切）两根轴', 7.6, 'var(--pt-fg3)'));
  }

  /* ═══ 两只盒子共用的刀：ℓ 的刀面是同一片，横穿两只盒子（连线取两盒同一层高的前棱） ═══ */
  var yl = (co.p+.5)*BH/D.pp;                       /* 本卡那一层段的局部高度 */
  var yA = TY + BW*S - yl, yB = TY + BD2*S - yl;    /* ①的右前棱 / ②的左前棱，同一层段 */
  var gx0 = TX1+BW*C+8, gx1 = TX2-BD2*C-8;
  if(SEC){
    parts.push(ln([gx0, yA], [gx1, yB], 'stroke:'+VC.pp+';stroke-width:1;stroke-dasharray:5 4;stroke-opacity:.7'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 - 8, 'PP·TP 的刀面', 7.4, VC.pp, 'middle', 'font-weight="700"'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 + 4, '横穿两只盒子', 7.4, VC.pp, 'middle', 'font-weight="700"'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 + 15, 'ℓ、h 共有', 6.8, 'var(--pt-fg3)'));
  }

  /* ═══ 左栏读数：腔的坐标 —— 引线从腔拉过来，左右联动看得见 ═══ */
  var RY = 96;
  function row(y, k, v, col){
    parts.push(txt(RX, y, esc(k), 7.8, 'var(--pt-fg3)', 'start'));
    parts.push(txt(RX+RW, y, v, 8.4, col||'var(--pt-fg)', 'end', 'font-weight="700"'));
  }
  function hr(y){ parts.push(ln([RX, y], [RX+RW, y], 'stroke:var(--pt-bds);stroke-width:.7')); }
  function head(y, t, col){ parts.push(txt(RX, y, esc(t), 9.2, col||'var(--pt-fg)', 'start', 'font-weight="800"')); }
  parts.push(txt(RX, RY, '读数 · 这张卡 g='+g, 10.5, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(RX, RY+12, '(tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(me?' ep'+me.ep:'')+')　地址只标不画', 7.4, 'var(--pt-fg3)', 'start'));
  head(RY+32, '① 权重体腔'); hr(RY+36);
  row(RY+49, 'ℓ ← PP', 'L'+(co.p*lps)+'–L'+((co.p+1)*lps-1), VC.pp);
  row(RY+62, 'h ← TP', '['+fmt(co.t*hK)+', '+fmt((co.t+1)*hK)+')', VC.tp);
  row(RY+75, 'e ← EP', D.moe ? 'E'+(me.ep*kE)+'–E'+((me.ep+1)*kE-1) : '—（无 MoE）', D.moe?VC.ep:'var(--pt-fg3)');
  var vol = D.pp*D.tp*(D.moe?D.ep:1);
  /* 体积占比 = 索引空间里的份额；字节占比 = 真账（复制项不被任何刀切，所以略高）——两个数都给，差额说清 */
  var pcTot = (function(){ var D2={},k2; for(k2 in D) D2[k2]=D[k2]; D2.tp=1; D2.ep=1; D2.etp=1;
    var t=0,pi; for(pi=0;pi<D.pp;pi++) t += paramsPerCard(D2, pi); return t; })();
  var pcMine = paramsPerCard(D, co.p), bytePc = pcTot>0 ? pcMine/pcTot*100 : 0;
  row(RY+91, '体积占比', '1/'+fmt(vol)+' = '+(100/vol).toFixed(2)+'%');
  row(RY+104, '字节占比', bytePc.toFixed(2)+'%', 'var(--pt-fg2)');
  /* 两个数不等，原因要说准：本配置里主因是**专家权重的 h 由 ETP 切、不由 TP 切**，
     ETP=1 时它在 h 上根本没切开 —— 盒子上那只虚线框就是它。复制项只是次因。 */
  var etpGap = D.moe && D.etp < D.tp;
  parts.push(txt(RX, RY+116, etpGap ? '差额主因：专家权重只被 EP 切，h 方向没切——那要 ETP'
                                    : ('差额 = 复制项（norm'+(D.moe?' / router':'')+' / KV 头）：谁也不切它们，'), 6.8, 'var(--pt-fg3)', 'start'));
  parts.push(txt(RX, RY+125, etpGap ? '（本配置 ETP='+D.etp+'）。盒上虚线框就是这块。'
                                    : '每卡各存一份，所以字节比体积多出来一点。', 6.8, 'var(--pt-fg3)', 'start'));
  head(RY+145, '② 激活体腔'+(SEC?'':'（第二视角·已收起）'), VC.dp); hr(RY+149);
  row(RY+162, 'b ← DP', '副本'+co.d+' 的 '+fmt(D.mbs*D.ga)+' 样本', VC.dp);
  row(RY+175, 's ← CP', D.cp>1 ? '段'+co.c+' ∪ 段'+(2*D.cp-1-co.c) : '全部 '+fmt(D.seq)+' token', D.cp>1?VC.cp:'var(--pt-fg3)');
  row(RY+188, 'ℓ、h', '与①同一区间', 'var(--pt-fg2)');
  /* A3 要说准，不能图省事说「腔纹丝不动」：
     不变的是**腔的三条边长**（ℓ 层数 / h 宽 / e 桶大小里都没有 d）⇒ 体积不变 ⇒ 显存不省。
     **位置**则未必不动：EP 折叠是 q=(d·CP+c)·TP+t，d 被卷了进去，换副本可能换专家桶。
     判据是一个整除：TP·CP % (EP·ETP) == 0 ⇒ 换 d 时 ep 不变，腔连位置都不动；否则平移一格。
     换的是「哪一桶」，不是「几个专家」——边长不变，A3 照旧成立。 */
  var memNow = memParts(D, co.p).reduce(function(a,x){ return a+x.bytes; },0);
  var memNoDp = memWithoutKnife(D, 'dp', co.p);
  var eFixed = !D.moe || (D.tp*D.cp) % (D.ep*D.etp) === 0;
  parts.push('<rect x="'+(RX-6)+'" y="'+(RY+204)+'" width="'+(RW+14)+'" height="112" rx="4" style="fill:'+mix(VC.dp,7)+';stroke:'+VC.dp+';stroke-width:1"/>');
  head(RY+220, 'A3 的几何证明', VC.dp);
  parts.push(txt(RX, RY+233, '腔的三条边长：ℓ '+lps+' 层 · h '+fmt(hK)+(D.moe?' · e '+kE+' 专家':''), 7.4, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(RX, RY+243, '这三个数里没有 d —— 换任意 DP 副本逐字不变', 7.2, 'var(--pt-fg2)', 'start'));
  parts.push(txt(RX, RY+252, '⇒ 体积不变 ⇒ 显存一点不省。', 7.2, 'var(--pt-fg2)', 'start'));
  parts.push(txt(RX, RY+266, '若 DP=1：'+fmtGB(memNoDp)+' GB → 现在 '+fmtGB(memNow)+' GB', 8.2, VC.dp, 'start', 'font-weight="800"'));
  parts.push(txt(RX, RY+277, D.dp>1 ? '一点没省 —— 加 DP 不买余量。' : '（本配置 DP=1，反事实即现状）', 7.2, 'var(--pt-fg2)', 'start'));
  parts.push(txt(RX, RY+290, eFixed ? '位置也不动：TP·CP='+(D.tp*D.cp)+' 是 EP·ETP='+(D.moe?D.ep*D.etp:1)+' 的整数倍。'
                                    : '位置会平移：EP 折叠 q=(d·CP+c)·TP+t 把 d 卷了进去，', 7, 'var(--pt-fg3)', 'start'));
  parts.push(txt(RX, RY+299, eFixed ? '省显存要动①的三根轴，不是复印的份数。'
                                    : 'TP·CP='+(D.tp*D.cp)+' 不整除 EP·ETP='+(D.ep*D.etp)+' → 换副本换专家桶。', 7, 'var(--pt-fg3)', 'start'));
  parts.push(txt(RX, RY+308, eFixed ? '数值证明在「单维切分·DP」，两处互相印证。'
                                    : '换的是哪一桶，不是几个专家：边长不变，A3 照旧。', 7, 'var(--pt-fg3)', 'start'));
  /* 引线：腔 → 左栏对应段（左右联动的可视化，不靠读者自己找） */
  parts.push(ln([TX1+b1.cc[0], TY+b1.cc[1]], [RX+RW+8, RY+49], 'stroke:var(--pt-fg3);stroke-width:.8;stroke-dasharray:3 3;stroke-opacity:.7'));
  if(SEC) parts.push(ln([TX2+b2.cc[0], TY+b2.cc[1]], [RX+RW+8, RY+162], 'stroke:'+VC.dp+';stroke-width:.8;stroke-dasharray:3 3;stroke-opacity:.5'));

  /* ═══ 一轴一刀（§03）：哪个对象有这根轴，就由哪把刀在那个对象上动手 ═══
     这张表本来该放 .pt-note 浮层，但那层压在舞台左下角、会盖住容器条——画进 SVG 里，版面自己说了算。 */
  var TBX = 246, TBY = 500, TBW = 578;
  var CLAIM = [
    {a:'ℓ 层号',   d:'pp', w:1, c:1, why:'两个对象共有 —— 一刀切两处'},
    {a:'h 隐藏维', d:'tp', w:1, c:1, why:'两个对象共有 —— 一刀切两处'},
    {a:'e 专家号', d:'ep', w:1, c:0, why:'②上没有轴：路由是动作，不是静态切分'},
    {a:'b 样本号', d:'dp', w:0, c:1, why:'①上没有轴：只能复印 ⇒ A3 加 DP 不买余量'},
    {a:'s 序列位', d:'cp', w:0, c:1, why:'①上没有轴：权重根本没有 s 这根轴'}
  ];
  parts.push(txt(TBX, TBY-6, '一轴一刀（§03 索引五元组）：五根轴恰好被五把刀一一认领', 9.2, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(TBX+168, TBY+8, '① 权重体', 7.2, 'var(--pt-fg3)'));
  parts.push(txt(TBX+214, TBY+8, '② 激活体', 7.2, 'var(--pt-fg3)'));
  CLAIM.forEach(function(r, ri){
    var y5 = TBY + 20 + ri*15;
    parts.push('<rect x="'+TBX+'" y="'+(y5-10)+'" width="'+TBW+'" height="14" style="fill:'+(ri%2?mix('var(--pt-fg)',3):'transparent')+'"/>');
    parts.push(txt(TBX+4, y5, esc(r.a), 8.2, VC[r.d], 'start', 'font-weight="700"'));
    parts.push(txt(TBX+80, y5, '← '+DIMN[r.d], 8, VC[r.d], 'start', 'font-weight="800"'));
    parts.push(txt(TBX+168, y5, r.w?'✓':'✗', 9, r.w?VC[r.d]:'var(--pt-fg3)', 'middle', 'font-weight="800"'));
    parts.push(txt(TBX+214, y5, r.c?'✓':'✗', 9, r.c?VC[r.d]:'var(--pt-fg3)', 'middle', 'font-weight="800"'));
    parts.push(txt(TBX+240, y5, esc(r.why), 7.6, 'var(--pt-fg2)', 'start'));
  });
  parts.push(txt(TBX, TBY+112, 'ETP 是第六把刀，却不认领新轴 —— 它在 e 腔内部沿专家自己的 ffn 维再切一次（本配置 ETP='+D.etp+'）。这就是「6 把刀 ≠ 6 根轴」的来源。', 7.6, 'var(--pt-fg2)', 'start'));

  /* ═══ 容器（L3）：两个腔加起来才是这张卡装的东西 ═══ */
  if(L3){
    var CBX = 246, CBW = 470, CBY = 630;
    parts.push(txt(CBX, CBY-8, '容器只有两个（卡=显存 / 流=时间）—— 上面两个腔加起来，才是这张卡显存里装的东西：', 8.4, 'var(--pt-fg)', 'start', 'font-weight="700"'));
    parts.push(txt(CBX, CBY+2, '①腔 ⇒ 权重 + 梯度 + 优化器态　②腔 ⇒ 激活·在途 μbatch', 7.4, 'var(--pt-fg3)', 'start'));
    var segs = memParts(D, co.p), tot = segs.reduce(function(a,x){ return a+x.bytes; },0);
    var cap = D.hbm*Math.pow(2,30), sc = CBW/Math.max(cap, tot), ax2 = CBX;
    parts.push('<rect x="'+CBX+'" y="'+(CBY+8)+'" width="'+(cap*sc).toFixed(1)+'" height="22" style="fill:none;stroke:var(--pt-fg2);stroke-width:1.2;stroke-dasharray:3 3"/>');
    segs.forEach(function(sg){
      var w4 = sg.bytes*sc;
      parts.push('<rect x="'+ax2.toFixed(1)+'" y="'+(CBY+8)+'" width="'+Math.max(.5,w4).toFixed(1)+'" height="22" style="fill:'+sg.color+';fill-opacity:.55;stroke:var(--pt-bg);stroke-width:.6"/>');
      if(w4 > 56) parts.push(txt(ax2+w4/2, CBY+22, esc(sg.label), 6.8, 'var(--pt-fg)', 'middle'));
      ax2 += w4;
    });
    parts.push(txt(CBX+CBW+10, CBY+24, fmtGB(tot)+' / '+D.hbm+' GB', 9.5, tot>cap?'var(--pt-danger)':'var(--pt-fg)', 'start', 'font-weight="800"'));
  }
  parts.push(txt(RX, H-28, '尺寸纪律：真切=面积守恒（份合起来=父块） · 复印=等大成叠（②真切 / ①复印，同一把 DP 刀两种作用） · 放大=尺寸不守恒（⊕，本图不放大）', 8.2, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(RX, H-14, '点任意轴尺的一格换卡：换 ℓ / h / e 三根轴，①的腔会移动；换 b（DP）只在②里移动，①纹丝不动 —— 这就是六把刀落到两个对象上的全部差别。', 8, 'var(--pt-fg2)', 'start'));

  $('stage').innerHTML = '<svg viewBox="0 0 1080 '+H+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + '<g pointer-events="none">'+parts.join('')+'</g>' + hits.join('') + '</svg>';
  $('stagebar').innerHTML = '<span class="pt-cap">映射</span>'
    + '<button class="pb" data-act="persp" data-p="map">双链映射</button>'
    + '<button class="pb is-on" data-act="persp" data-p="cav">交集腔</button>'
    + '<span class="pt-chip" title="①权重体 '+(D.moe?'3':'2')+' 轴（ℓ·h'+(D.moe?'·e':'')+'）· ②激活体 4 轴（ℓ·h·b·s）">点轴尺换卡</span>'
    + '<span class="pt-chip" style="border-color:'+VC.dp+';color:'+VC.dp+'">DP 在①上没有轴 → A3</span>'
    + '<button class="pb'+(ui.act2?' is-on':'')+'" data-act="act2" title="激活体是第二视角：它多出 b（DP 切）与 s（CP 切）两根轴；主图讲的是权重体。">'
    + (ui.act2?'收起激活体':'展开激活体（第二视角）')+'</button>'
    + '<button class="pb" data-act="view" data-v="anatomy">腔里装了什么 ↗</button>';
  /* 一轴一刀的表已经画进 SVG 了（见 TBX/TBY）——.pt-note 浮层压在舞台左下角会盖住容器条，
     同一句话不放两遍，浮层这里就空着。 */
  $('stageNote').hidden = true;

      + (ui.yaw!==0?'<button class="pb" data-act="yawreset">复位等轴测</button>':'')
      + '<span class="pt-sep"></span><button class="pb'+(anim.on?' is-on':'')+'" data-act="anim">'+(anim.on?'■ 停止':'▶ 播放一个训练步')+'</button>';
  $('stagebar').innerHTML = sb;
  fixFacetButtons(facet);

  /* 折叠提示 */
  var LYf = LY.folded;
  if(LYf || (ui.unfold && D.dp*D.tp*D.pp>1600)){
    $('stageNote').hidden = false;
    $('stageNote').innerHTML = LYf
      ? (D.tp*D.dp*D.pp>1000
          ? '这套配置 '+fmt(D.tp*D.dp*D.pp)+' 个实例，默认不全量渲染（要几秒）——先画前 '+DPn+' 个 DP 副本。DP 是对称维，看一组等于看全部（DP-3）。<button class="pb" data-act="unfold">仍要全部画出</button>'
          : 'DP='+D.dp+' 为对称维，只画前 '+DPn+' 个副本——看一个组等于看全部（DP-3/DP-5）。<button class="pb" data-act="unfold">全部画出</button>')
      : fmt(D.tp*DPn*D.pp)+' 张卡全量渲染中。<button class="pb" data-act="refold">恢复折叠</button>';
  }else{ $('stageNote').hidden = true; }

  /* 抽离图（R2；CP 组唯一入口） */
  if(commActive && (ui.detach || ui.commDim==='cp')){

    $('detach').innerHTML = detachHTML(D, refG);
  }else{ $('detach').hidden = true; }
}
function fixFacetButtons(facet){ /* 简化 is-on 写法（字符串拼接里难做干净） */
  var btns = document.querySelectorAll('[data-act="facet"]');

}
function detachHTML(D, refG){
  var dim = ui.commDim, col = VC[dim], mem = groupMembers(dim, refG, D);
  var n = mem.length;
  if(n===1) return '<b style="font-size:12px">抽离 · '+DIMN[dim]+' 组</b><div style="font-size:11.5px;color:var(--pt-fg2);margin-top:4px">'+DIMN[dim]+'=1：组内只有一张卡（rank '+mem[0]+'），无通信发生。</div>';
  var w = Math.max(340, Math.min(560, n*64)), h = 170, pts=[], i;
  if(ui.commPrim!=='p2p'){
    var cx=w/2, cy=h/2-8, R=Math.min(h/2-30, 56);
    for(i=0;i<n;i++){ var a=-Math.PI/2+i*2*Math.PI/n; pts.push([cx+R*Math.cos(a)*1.9, cy+R*Math.sin(a)]); }
  }else{
    for(i=0;i<n;i++) pts.push([40+i*(w-80)/Math.max(1,n-1), h/2-8]);
  }
  var nodes = pts.map(function(p2,i3){
    return '<rect x="'+(p2[0]-13)+'" y="'+(p2[1]-10)+'" width="26" height="20" rx="3" style="fill:var(--pt-s2);stroke:var(--pt-bds)"/>'
      + txt(p2[0], p2[1]+4, mem[i3], 10, 'var(--pt-fg)', 'middle', 'font-weight="700"')
      + txt(p2[0], p2[1]+23, dim+'_rank '+i3, 8.5, col);
  }).join('');
  var edges = edgeSVG(pts.map(function(p2){ return [p2[0], p2[1]-13]; }), ui.commPrim, col, {mid:dim, ring:true});
  return '<b style="font-size:12px">抽离模式 · 只看连线（R2）</b> '
    + '<span class="mono" style="font-size:10.5px;color:var(--pt-fg2)">'+DIMN[dim]+' 组 × '+PRIMS.filter(function(x){return x.id===ui.commPrim;})[0].name+' · '+n+' 张卡'+(sel===null?'（示意 0 号组）':'')+(dim==='cp'?' · CP 组跨分面，只在此呈现':'')+'</span>'
    + '<svg viewBox="0 0 '+w+' '+h+'">'+defsSVG()+edges+nodes+'</svg>';
}

/* ═════════ FR-10 动画 ═════════ */
function buildPhases(D){
  var ph=[], MB=Math.min(D.ga,2), m, s2, s3;
  for(m=1;m<=MB;m++) for(s2=0;s2<D.pp;s2++){
    ph.push({k:'tp',s:s2,m:m,dir:'前向'});
    if(D.moe) ph.push({k:'a2a',s:s2,m:m,dir:'前向'});
    if(s2<D.pp-1) ph.push({k:'p2p',s:s2,to:s2+1,m:m,dir:'前向'});
  }
  for(m=1;m<=MB;m++) for(s3=D.pp-1;s3>=0;s3--){
    ph.push({k:'tp',s:s3,m:m,dir:'反向'});
    if(s3>0) ph.push({k:'p2p',s:s3,to:s3-1,m:m,dir:'反向'});
  }
  ph.push({k:'dp'});
  return ph;
}
function animTick(D){
  var lay = document.getElementById('animLayer');
  if(!lay){ stopAnim(); return; }
  if(anim.i >= anim.phases.length){ stopAnim(); render(); return; }
  var p = anim.phases[anim.i++], LY = v1Layout(D);
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, ui.cpFacet, 0, 0, D);
  var co = coordsOf(refG, D); if(co.d >= LY.dpShown) co.d = 0;
  var html='', capEl = $('animCap');
  function anchors(list){ return list.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t, Math.min(c2.d,LY.dpShown-1), c2.p, D, LY); }); }
  if(p.k==='tp'){
    var mem=[]; for(var t=0;t<D.tp;t++) mem.push(rankOf(t, ui.cpFacet, co.d, p.s, D));
    html = '<g class="pulse2">'+edgeSVG(anchors(mem),'allreduce',VC.tp,{mid:'tp'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · stage '+p.s+' · <b>TP AllReduce</b>（每层两下，按 stage 折叠示意）';
  }else if(p.k==='p2p'){
    var a = cardAnchor(co.t,co.d,p.s,D,LY), b = cardAnchor(co.t,co.d,p.to,D,LY);
    html = '<g class="pulse1"><line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" style="stroke:'+VC.pp+';stroke-width:3;marker-end:url(#arrpp)"/></g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · <b>PP P2P</b> stage '+p.s+'→'+p.to;
  }else if(p.k==='a2a'){
    var memE = D.moe ? epMembers(rankOf(co.t,ui.cpFacet,co.d,p.s,D),D).filter(function(r){ var c3=coordsOf(r,D); return c3.c===ui.cpFacet && c3.d<LY.dpShown; }) : [];
    html = '<g class="pulse1">'+edgeSVG(anchors(memE),'alltoall',VC.ep,{mid:'ep'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · stage '+p.s+' · <b>MoE All-to-All</b> 成片爆发';
  }else if(p.k==='dp'){
    var memD=[]; for(var d2=0; d2<Math.min(D.dp,LY.dpShown); d2++) memD.push(rankOf(co.t,ui.cpFacet,d2,co.p,D));
    html = '<g class="pulse2">'+edgeSVG(anchors(memD),'allreduce',VC.dp,{mid:'dp'})+'</g>';
    capEl.innerHTML = '<b>DP 梯度 AllReduce</b>——整步静默，末尾闪一次';
  }
  lay.innerHTML = html;
}
function startAnim(D){
  anim.on = true; anim.phases = buildPhases(D); anim.i = 0;
  $('animCap').style.display = 'block';
  anim.timer = setInterval(function(){ animTick(derive(cfg)); }, 620);
}
function stopAnim(){
  anim.on = false;
  if(anim.timer){ clearInterval(anim.timer); anim.timer = null; }
  var c = $('animCap'); if(c) c.style.display = 'none';
  var l = document.getElementById('animLayer'); if(l) l.innerHTML = '';
}

/* ═════════ V2 时间·流（FR-7/8）：流=容器，容量是时间 ═════════ */
function renderV2(D){
  var sch = schedule(D), T = sch.T, PP = D.pp;
  var W=920, LBL=128, rowH=40, px=(W-LBL-20)/T, H=PP*rowH+56;
  var selCo = (sel!==null && sel<D.world) ? coordsOf(sel,D) : null;
  var rows='', blocks='', ticks='';
  for(var s2=0;s2<PP;s2++){
    var y = 22+s2*rowH, hot = selCo && selCo.p===s2;
    if(layerOn('L3')) rows += '<rect x="'+LBL+'" y="'+(y-2)+'" width="'+(W-LBL-16)+'" height="'+(rowH-10)+'" class="lane" style="'+(hot?'stroke:var(--pt-dp);stroke-width:1.4;fill:'+mix(VC.dp,7):'')+'"/>';
    if(layerOn('L4')) rows += txt(LBL-8, y+rowH/2-4, 'stage '+s2+(hot?' ◀ r'+sel:''), 10.5, hot?VC.dp:'var(--pt-fg3)', 'end', hot?'font-weight="700"':'');
  }
  sch.blocks.forEach(function(b){
    var y=22+b.s*rowH, x=LBL+b.t0*px, w2=(b.t1-b.t0)*px-1.2;
    if(b.type==='AR'){
      blocks += '<g data-act="zoomar" style="cursor:pointer"><rect x="'+x+'" y="'+(y+1)+'" width="'+w2+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.dp,26)+';stroke:'+VC.dp+';stroke-width:1.1"/>'
        + (w2>36?txt(x+w2/2, y+rowH/2-4, 'AllReduce', 8.5, VC.dp):'')+'</g>';
    }else{
      var fw = b.type==='F';
      blocks += '<rect x="'+x+'" y="'+(y+1)+'" width="'+Math.max(1,w2)+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.pp, fw?22:46)+';stroke:'+VC.pp+';stroke-width:.7"/>'
        + (w2>15?txt(x+w2/2, y+rowH/2-4, (fw?'F':'B')+b.m, 8.2, 'var(--pt-fg2)'):'');
      if(layerOn('L5') && b.recv) ticks += '<path d="M'+x+' '+(y-3)+' l4 -5 l-8 0 z" style="fill:'+VC.pp+'"/>';
    }
  });
  var axis = '<line x1="'+LBL+'" y1="'+(22+PP*rowH+2)+'" x2="'+(W-14)+'" y2="'+(22+PP*rowH+2)+'" style="stroke:var(--pt-fg);stroke-width:1"/>'
    + txt(W-14, 22+PP*rowH+15, '时间 →  F=1 B=2 · 1F1B 合成'+(sch.truncated?' · 只画前 '+sch.GA+' 个 μbatch':''), 9, 'var(--pt-fg3)', 'end');
  var zoom = ui.zoomAR ? arZoomSVG(D) : '';
  $('stage').innerHTML = '<svg viewBox="0 0 '+W+' '+(H+(ui.zoomAR?236:0))+'" preserveAspectRatio="xMidYMid meet">'
    + rows+blocks+ticks+axis + (zoom?'<g transform="translate(0 '+(H+8)+')">'+zoom+'</g>':'') + '</svg>';
  $('stagebar').innerHTML =
    '<button class="pb'+(ui.skew?' is-on':'')+'" data-act="skew">注入偏斜（某副本慢）</button>'
    + '<button class="pb'+(ui.zoomAR?' is-on':'')+'" data-act="zoomar">放大末尾 AllReduce</button>'
    + '<span class="pt-chip">流 = 时间容器：装 kernel，装满不会崩，只是变慢（§08）</span>';
  $('stageNote').hidden = true; $('detach').hidden = true;
}
function arZoomSVG(D){
  var n = Math.min(D.dp,6), base=1.0, xfer=0.9, culprit = ui.skew ? Math.min(2,n-1) : -1;
  var entries=[], i;
  for(i=0;i<n;i++) entries.push(base + ((i*37)%7)/40 + (i===culprit?.85:0));
  var exit = Math.max.apply(0,entries)+xfer;
  var W=920, LBL=128, rowH=27, px=(W-LBL-30)/(exit+.4);
  var spans = entries.map(function(e){ return exit-e; });
  var shortest = spans.indexOf(Math.min.apply(0,spans));
  var out = txt(LBL, 12, '放大：stage '+((sel!==null&&sel<D.world)?coordsOf(sel,D).p:0)+' 的 DP 组梯度 AllReduce ——虚线=进入 · 实线=共同退出 · 条长=在集合里耗的时间'+(D.dp>n?' · 前 '+n+' 个副本':''), 9.5, 'var(--pt-fg2)', 'start');
  for(var r=0;r<n;r++){
    var y=22+r*rowH, x0=LBL+entries[r]*px, x1=LBL+exit*px, isCul = r===shortest && ui.skew;
    out += txt(LBL-8, y+13, 'dp_rank '+r, 10, 'var(--pt-fg2)', 'end')
      + '<line x1="'+LBL+'" y1="'+(y+9)+'" x2="'+(W-20)+'" y2="'+(y+9)+'" style="stroke:var(--pt-bd)"/>'
      + '<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="18" style="fill:'+(isCul?mix('var(--pt-danger)',14):mix(VC.dp,22))+';stroke:'+(isCul?'var(--pt-danger)':VC.dp)+';stroke-width:'+(isCul?1.6:1)+'"/>'
      + '<line x1="'+x0+'" y1="'+(y-3)+'" x2="'+x0+'" y2="'+(y+21)+'" style="stroke:var(--pt-fg);stroke-width:1.3;stroke-dasharray:2 2"/>'
      + (isCul?txt(x0+4, y+13, '最后进入 · 段最短 = 嫌疑人', 9, 'var(--pt-danger)', 'start', 'font-weight="700"'):'');
  }
  out += '<line x1="'+(LBL+exit*px)+'" y1="14" x2="'+(LBL+exit*px)+'" y2="'+(22+n*rowH)+'" style="stroke:var(--pt-fg);stroke-width:1.1"/>'
      + txt(LBL+exit*px, 10, '共同退出', 8.5, 'var(--pt-fg)');
  return out;
}

/* ═════════ V3 卡内解剖：容器打开 —— 层 → 算子 → kernel → 流 ═════════ */
function renderV3(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g,D), Lps = D.layersPerStage, l0 = co.p*Lps;
  var ops = opBytes(D);
  var s = 46;
  var maxOpB = Math.max.apply(0, ops.map(function(o){return Math.max(o.b,1);}));
  var CW = 4.6, CH = 2.6, CD = Math.max(2.2, Math.min(6, Lps*.42));
  var picked = clamp(ui.selLayerOff, 0, Lps-1);
  var CIRC = '①②③④⑤⑥⑦⑧⑨⑩';   /* 算子编号：算子↔kernel 用同号对应（N:M） */
  var opIdx = {}, opFront = {};
  var parts = [];
  /* 包围盒：边生成边登记（文字给出估算宽度），最后据此定 viewBox */
  var bx=[], by=[];
  function reg(p, wL, wR, hU, hD){ bx.push(p[0]-(wL||0), p[0]+(wR||0)); by.push(p[1]-(hU||0), p[1]+(hD||0)); }
  function regBox(x,y,z,w,h,d){
    [[x,y,z],[x+w,y,z],[x,y,z+d],[x+w,y,z+d],[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d]]
      .forEach(function(c){ reg(proj(c[0],c[1],c[2],s)); });
  }

  /* ① 卡容器（线框=容量边界）+ 门牌（地址=文字，§15） */
  parts.push(boxSVG(0, 0, 0, CW, CH, CD, s, {wire:true, stroke:'var(--pt-fg)', sw:1.4}));
  regBox(0,0,0,CW,CH,CD);
  var door = proj(0, CH, CD, s);   /* 容器左上角外侧 */
  parts.push(txt(door[0]-6, door[1]-26, '卡 = 容器（容量 = 显存 '+D.hbm+'GB）', 11, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(door[0]-6, door[1]-12, '门牌: global_rank '+g+' · tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(D.moe?(function(){var me=epOf(co.t,co.c,co.d,D);return ' ep'+me.ep;})():'')+'（地址只标不画）', 9.5, 'var(--pt-fg2)', 'start'));
  reg([door[0]-6, door[1]-26], 0, 320, 14, 0);

  /* ② 层 slabs（这段的 Lps 层；点选） */
  for(var li=0; li<Lps; li++){
    var lz = .25 + li*(CD-.5)/Lps, lh = .42, isPick = li===picked;
    parts.push('<g class="l3pick" data-li="'+li+'" style="cursor:pointer">'
      + boxSVG(.3, .2, lz, CW-.6, lh, Math.max(.16,(CD-.7)/Lps*.72), s,
        {stroke: isPick?VC.pp:'var(--pt-bds)', sw:isPick?1.8:.8, topFill:isPick?mix(VC.pp,26):''})
      + '</g>');
    /* 端点 + 选中层标全局层号：只标选中那层会让人以为 L 是卡内序号，逐层都标又会糊成一团 */
    var lc = proj(CW-.3, .2+lh, lz, s);
    if(isPick){
      parts.push(txt(lc[0]+8, lc[1]-2, 'L'+(l0+li), 10, VC.pp, 'start', 'font-weight="800"'));
      reg([lc[0]+8, lc[1]-2], 0, 34, 8, 4);
    }else if(li===0 || li===Lps-1){
      parts.push(txt(lc[0]+7, lc[1]-1, 'L'+(l0+li), 7.2, 'var(--pt-fg3)', 'start'));
      reg([lc[0]+7, lc[1]-1], 0, 26, 6, 3);
    }
  }
  var capL = proj(CW, 0, CD, s);   /* 容器最低点下方，谁也不压 */
  parts.push(txt(capL[0], capL[1]+20, '层段 L'+l0+'–L'+(l0+Lps-1)+'（'+Lps+' 层 · 点任一层抽出）', 9.5, 'var(--pt-fg3)', 'middle'));
  parts.push(txt(capL[0], capL[1]+32, 'L = 整网的全局层号（ℓ 轴 · 整网共 '+D.layers+' 层 L0–L'+(D.layers-1)+'）——不是卡内序号；PP 刀把它切成 '+D.pp+' 段，这张卡只装 stage'+co.p+' 这一段', 8.2, 'var(--pt-fg2)', 'middle'));
  parts.push(txt(capL[0], capL[1]+44, '当前抽出：L'+(l0+picked)+' = 整网第 '+(l0+picked)+' 层 · 段内第 '+(picked+1)+'/'+Lps, 8.6, VC.pp, 'middle', 'font-weight="700"'));
  reg([capL[0], capL[1]+44], 300, 300, 0, 10);

  /* ③ 抽出的层 → 算子块（体积∝字节；切法着色） */
  var opW = 1.05, gap = .38, opsDrawn = ops.filter(function(o){ return o.b>0 || o.id==='attn.core'; });
  var bandW = opsDrawn.length*(opW+gap);
  var ox = CW + 2.4, oy = 0, hookPts = {};   /* 算子带放容器右前方，同一地面 */
  opsDrawn.forEach(function(o, oi){
    var hgt = o.b>0 ? .3 + 1.35*(o.b/maxOpB) : .26;
    var x0 = ox + oi*(opW+gap);
    var col = o.cut==='tp' ? VC.tp : o.cut==='ep' ? VC.ep : 'var(--pt-fg3)';
    if(o.b>0) parts.push(boxSVG(x0, oy, 0, opW, hgt, .9, s, {fill:mix(col,70), stroke:col, sw:1, attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    else parts.push(boxSVG(x0, oy, 0, opW, .26, .9, s, {wire:true, stroke:col, sw:1, dash:'3 3', attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    regBox(x0, oy, 0, opW, Math.max(hgt,.9), .9);
    var tc = proj(x0+opW/2, oy, .9, s);   /* 标注放块的前下方，斜排避让 */
    var ty = tc[1] + 14 + (oi%2)*18;
    opIdx[o.id] = CIRC.charAt(oi); opFront[o.id] = tc;
    parts.push(txt(tc[0], ty, opIdx[o.id]+' '+o.id, 8.8, 'var(--pt-fg)', 'middle', 'font-weight="600"'));
    parts.push(txt(tc[0], ty+10, o.how, 7.6, col));
    reg([tc[0], ty+10], 40, 40, 0, 8);
    hookPts[o.id] = proj(x0+opW/2, oy+hgt, .45, s);
  });
  /* 层→算子 展开引线（结构：无厚度虚线） */
  var pickedZ = .25 + picked*(CD-.5)/Lps;
  var pa = proj(CW-.3, .2+.21, pickedZ, s), pb = proj(ox-.15, .5, .45, s);
  parts.push('<path d="M'+pa[0]+' '+pa[1]+' C '+(pa[0]+60)+' '+(pa[1]-30)+', '+(pb[0]-60)+' '+(pb[1]-30)+', '+pb[0]+' '+pb[1]+'" style="fill:none;stroke:'+VC.pp+';stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrpp)"/>');
  var bandTop = proj(ox+bandW/2, 2.2, 0, s);
  parts.push(txt(bandTop[0], bandTop[1], '抽出的 L'+(l0+picked)+' = 一排算子的「片」（结构无厚度 · 内容有体积 · 切法看颜色）', 9.5, 'var(--pt-fg2)', 'middle', 'font-weight="600"'));
  reg([bandTop[0], bandTop[1]], 230, 230, 10, 0);

  /* ④ 通信钩子（动作：发生在切口上） */
  if(layerOn('L5')){
    var hook = function(opId, dim, label, dx){
      if(!hookPts[opId]) return;
      var hp = hookPts[opId], gx = hp[0]+dx, gy = hp[1]-46;
      parts.push('<line x1="'+hp[0]+'" y1="'+(hp[1]-8)+'" x2="'+gx+'" y2="'+gy+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>');
      parts.push(txt(gx+3, gy-4, label, 8.6, VC[dim], 'start', 'font-weight="700"'));
      reg([gx+3, gy-4], 0, 120, 12, 0);
    };
    hook('attn.out', 'tp', 'TP AllReduce ①', 14);
    hook(D.moe?'experts':'mlp.down', D.moe?'ep':'tp', D.moe?'EP All-to-All':'TP AllReduce ②', 20);
    if(D.moe) hook('router', 'ep', '路由', 6);
    var edge = proj(CW, CH*.86, 0, s);
    parts.push('<line x1="'+edge[0]+'" y1="'+edge[1]+'" x2="'+(edge[0]+58)+'" y2="'+(edge[1]-20)+'" style="stroke:'+VC.pp+';stroke-width:1.8;marker-end:url(#arrpp)"/>');
    parts.push(txt(edge[0]+62, edge[1]-24, 'PP P2P → '+(co.p+1<D.pp?'stage '+(co.p+1):'（末段→loss）'), 8.8, VC.pp, 'start', 'font-weight="700"'));
    reg([edge[0]+62, edge[1]-24], 0, 130, 12, 0);
    var edge2 = proj(0, .25, 0, s);   /* 左前棱下部，远离门牌 */
    parts.push('<line x1="'+edge2[0]+'" y1="'+edge2[1]+'" x2="'+(edge2[0]-58)+'" y2="'+(edge2[1]+14)+'" style="stroke:'+VC.dp+';stroke-width:1.5;stroke-dasharray:6 3;marker-end:url(#arrdp)"/>');
    parts.push(txt(edge2[0]-62, edge2[1]+18, 'DP AllReduce（整步静默，步末一次）', 8.6, VC.dp, 'end'));
    reg([edge2[0]-62, edge2[1]+18], 210, 0, 6, 10);
  }

  /* ⑤ 流 = 时间容器：kernel 排队（算子→kernel N:M）——压到算子带正下方更深处 */
  var fw = Math.max(bandW+.6, 5.4), fh = .6, fx = ox - .2, fy = -3.9;
  parts.push(boxSVG(fx, fy, 0, fw, fh, .8, s, {wire:true, stroke:'var(--pt-fg)', sw:1.1}));
  regBox(fx, fy, 0, fw, fh, .8);
  /* kernel 用 src 声明它由哪些算子来——标签打同号，并逐条画对应引线 */
  var kdefs = D.moe
    ? [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:.7, src:['router'], c:VC.ep},
       {w:.8, from:'组批 1/2', src:['experts'], c:VC.ep}, {w:.8, from:'组批 2/2', src:['experts'], c:VC.ep}]
    : [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:1.1, src:['mlp.gate/up'], c:VC.tp},
       {w:.45, from:'分段 1/2', src:['mlp.down'], c:VC.tp}, {w:.45, from:'分段 2/2', src:['mlp.down'], c:VC.tp}];
  var kx = fx+.15, kLines = [];
  kdefs.forEach(function(k, ki){
    parts.push(boxSVG(kx, fy+.07, .12, k.w, fh-.18, .5, s, {fill:mix(k.c,52), stroke:k.c, sw:.8}));
    var badges = k.src.map(function(id){ return opIdx[id]||'·'; }).join('+');
    var kc = proj(kx+k.w/2, fy, .8, s);              /* 前下棱：标签落在轨道外侧 */
    var kty = kc[1] + 24 + (ki%2)*13;
    parts.push(txt(kc[0], kty, badges+(k.from?' '+k.from:''), 7.6, k.c, 'middle', 'font-weight="700"'));
    reg([kc[0], kty], 38, 38, 0, 8);
    var kTop = proj(kx+k.w/2, fy+fh, .3, s);
    k.src.forEach(function(id){ if(opFront[id]) kLines.push([opFront[id], kTop, k.c]); });
    kx += k.w + .12;
  });
  kLines.forEach(function(L){                        /* 算子 → kernel：同号 + 引线双保险 */
    parts.push('<path d="M'+L[0][0]+' '+(L[0][1]+34)+' C '+L[0][0]+' '+(L[0][1]+90)+', '+L[1][0]+' '+(L[1][1]-60)+', '+L[1][0]+' '+L[1][1]+'" style="fill:none;stroke:'+L[2]+';stroke-width:.8;stroke-dasharray:3 4;opacity:.6"/>');
  });
  var fl = proj(fx, fy+fh/2, .4, s);   /* 轨道左端外侧的空白区（容器正下方） */
  parts.push(txt(fl[0]-16, fl[1]-4, '流 = 另一个容器（容量 = 时间）', 10, 'var(--pt-fg)', 'end', 'font-weight="700"'));
  parts.push(txt(fl[0]-16, fl[1]+9, 'kernel 在此排队；装满不会崩，只是变慢（§08）', 8.6, 'var(--pt-fg2)', 'end'));
  reg([fl[0]-16, fl[1]+9], 300, 0, 14, 8);
  /* 流的全部说明都收到左列：右端会被读出卡浮层压住 */
  var nDown = D.moe ? 'experts' : 'mlp.down';
  parts.push(txt(fl[0]-16, fl[1]+26, '算子→kernel = N:M（融合 / 分段）', 8.8, 'var(--pt-fg2)', 'end', 'font-weight="600"'));
  parts.push(txt(fl[0]-16, fl[1]+38, '同号对应：'+(opIdx['attn.q']||'①')+'+'+(opIdx['attn.kv']||'②')+' → 一个 kernel（融合 N:1）', 8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(fl[0]-16, fl[1]+50, (opIdx[nDown]||'⑥')+' → 两个 kernel（分段 1:N）· 标签在轨道下方，与块同号', 8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(fl[0]-16, fl[1]+62, 'kernel 永远单卡持有——逻辑与物理唯一的交点', 8, 'var(--pt-fg3)', 'end'));
  reg([fl[0]-16, fl[1]+62], 340, 0, 12, 8);

  var pad = 22;
  var vb = [Math.min.apply(0,bx)-pad, Math.min.apply(0,by)-pad,
            (Math.max.apply(0,bx)-Math.min.apply(0,bx))+2*pad, (Math.max.apply(0,by)-Math.min.apply(0,by))+2*pad];
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()+parts.join('')+'</svg>';

  $('stagebar').innerHTML =
    '<button data-act="view" data-v="chain" class="pb" title="回到刀序链：看这张卡是被哪几刀切出来的">↖ 它的来历（刀序链）</button>'
    + '<span class="pt-cap">解剖对象</span><span class="pt-chip">rank <b>'+g+'</b>'+(sel===null?'（未选卡，示例 0）':'')+'</span>'
    + '<span class="pt-cap">抽哪一层</span>'
    + '<button class="pb mono" data-act="v3layer" data-d="-1">‹</button>'
    + '<span class="pt-chip">L'+(l0+picked)+'</span>'
    + '<button class="pb mono" data-act="v3layer" data-d="1">›</button>'
    + '<span class="pt-chip">整网 → 层 → 算子 → kernel：粒度链在容器里走完（FR-12）</span>';
  $('stageNote').hidden = true; $('detach').hidden = true;
}

    var l0d = co.p*D.layersPerStage, l1d = l0d + D.layersPerStage - 1;
    var expRow = '';
    if(D.moe && me){
      var kEd = D.experts/D.ep, e0d = me.ep*kEd;

    }
    el.innerHTML = '<h4>坐标读出 · FR-3 <button class="pt-x" data-act="clearsel" title="清除选中">✕</button></h4>'
      + '<div class="grank">'+g+'<small>global_rank</small></div>'

function revHTML(D){

function renderRevOut(D){

function render(){
  var D = derive(cfg);
  if(sel!==null && (!D.ok || sel>=D.world)) sel = null;
  if(!D.moe){ if(ui.axis==='ep') ui.axis='tp'; if(ui.commDim==='ep') ui.commDim='tp'; }
  renderBar(D);
  /* deck 只服务切分链的正视/侧视，别的视图一律先收起来，免得压住它们的 SVG */
  if(ui.view!=='chain' && $('deck')){ $('deck').hidden = true; $('rubik').hidden = true; $('stage').hidden = false; }
  var foot = document.querySelector('.pt-foot');
  if(ui.view==='chain'){ foot.style.display = 'none'; }
  else { foot.style.display = ''; renderFoot(D); }
  if(!D.ok){
    $('stage').innerHTML = '';
    $('stagebar').innerHTML = '';
    $('stageNote').hidden = true; $('detach').hidden = true;
    $('stage').innerHTML = '<div class="pt-blocked"><div><b>✕ 配置不合法，不渲染视图</b><br><span style="font-size:12px">'+D.errors.length+' 条整除约束未满足（DP-5 宁缺毋误）</span><br><button class="pb" data-act="drawer" data-d="cfg">打开配置修正</button></div></div>';
  }else{
    if(ui.view==='dim') renderDim(D);
    else if(ui.view==='chain') renderChain(D);
    else if(ui.view==='compose') renderV1(D);
    else if(ui.view==='anatomy') renderV3(D);
    else if(ui.view==='solid') renderSolid(D);
    else if(ui.view==='story') renderStory(D);
    else renderV2(D);
  }
  renderDetail(D);
  var dr = $('drawer');
  if(ui.drawer){ dr.hidden = false; dr.innerHTML = drawerHTML(D); }
  else dr.hidden = true;
  $('say').innerHTML = sayText(D);
  urlWrite();
}

/* ── 拖动转场景（只在刀序视图）──
   全量重绘挂在指针移动上会卡，所以用 rAF 合并：一帧最多重绘一次。
   拖动中不写 URL（不然 history 会被刷爆），松手才写一次。 */
var drag3 = null;
$('stage').addEventListener('pointerdown', function(ev){
  if(ui.view !== 'chain') return;
  /* 2D tab 下拖拽只平移：转台一动就离开了正交机位，正视立刻又变成斜的 3D。
     要转就先回 3D tab。 */
  /* 平移：中键、Ctrl（Mac 上 ⌘ 同样认）、Shift 都行；2D tab 下拖拽本来就只平移。
     Ctrl 是这类画布的通用手势，不该只有 Shift 一条路。 */
  var pan = ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.button === 1 || ui.viewTab !== '3d';
  /* 中键不挡会触发浏览器的自动滚动模式（那个四向箭头图标），Mac 上 Ctrl+按下
     等同右键、会弹出上下文菜单——两个都会把拖拽打断。 */
  if(ev.button === 1 || ev.ctrlKey) ev.preventDefault();
  var cs = 1;
  var svg = $('stage').querySelector('svg');
  if(svg){
    var ctm = svg.getScreenCTM();
    if(ctm) cs = 1/ctm.a;
  }
  drag3 = {x:ev.clientX, y:ev.clientY, yaw:ui.yaw3, pitch:ui.pitch3,
            panX:ui.panX3, panY:ui.panY3, pan:pan, cs:cs,
            moved:false, raf:0, cap:false, id:ev.pointerId};
});
$('stage').addEventListener('pointermove', function(ev){
  if(!drag3) return;
  var dx = ev.clientX - drag3.x, dy = ev.clientY - drag3.y;
  if(Math.abs(dx) + Math.abs(dy) > 3) drag3.moved = true;
  if(drag3.moved && !drag3.cap){
    drag3.cap = true;
    try{ $('stage').setPointerCapture(drag3.id); }catch(e){}
    $('stage').style.cursor = drag3.pan ? 'move' : 'grabbing';
  }
  if(!drag3.moved) return;
  if(drag3.pan){
    ui.panX3 = drag3.panX + dx*drag3.cs;
    ui.panY3 = drag3.panY + dy*drag3.cs;
  } else {
    ui.yaw3 = drag3.yaw + dx*0.008;
    ui.pitch3 = clamp(drag3.pitch + dy*0.006, -0.9, 1.57);
  }
  lowDetail = true;
  if(!drag3.raf) drag3.raf = requestAnimationFrame(function(){
    if(drag3) drag3.raf = 0;
    var D9 = derive(cfg); if(D9.ok && ui.view==='chain') renderChain(D9);
  });
});
var swallowClick = false;
function endDrag3(ev){
  if(!drag3) return;
  var moved = drag3.moved;
  lowDetail = false;
  if(drag3.raf) cancelAnimationFrame(drag3.raf);
  var cap = drag3.cap;
  drag3 = null;
  $('stage').style.cursor = '';
  if(cap) try{ $('stage').releasePointerCapture(ev.pointerId); }catch(e){}
  /* 拖过就不是点击：吞掉紧跟着的那一次 click，否则松手会顺手换掉选中卡 */
  swallowClick = moved;
  if(moved) render();
}
$('stage').addEventListener('click', function(ev){
  if(swallowClick){ swallowClick = false; ev.stopPropagation(); ev.preventDefault(); }
}, true);
$('stage').addEventListener('pointerup', endDrag3);
$('stage').addEventListener('pointercancel', endDrag3);
/* ── 滚轮缩放（向光标位置缩放）── */
var wheelRaf3 = 0;
$('stage').addEventListener('wheel', function(ev){
  if(ui.view !== 'chain') return;
  ev.preventDefault();
  var svg = $('stage').querySelector('svg');
  if(!svg) return;
  var factor = ev.deltaY > 0 ? 1/1.15 : 1.15;
  var next = clamp(ui.zoom3 * factor, 0.2, 20);
  var r = next / ui.zoom3;
  var ctm = svg.getScreenCTM();
  if(ctm){
    var inv = ctm.inverse();
    var sx = inv.a*ev.clientX + inv.c*ev.clientY + inv.e;
    var sy = inv.b*ev.clientX + inv.d*ev.clientY + inv.f;
    var vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    var bCX = 84 + (vb[2]-100)/2, bCY = 62 + 248;
    ui.panX3 = (1-r)*(sx - bCX) + r*ui.panX3;
    ui.panY3 = (1-r)*(sy - bCY) + r*ui.panY3;
  }
  ui.zoom3 = next;
  if(!wheelRaf3) wheelRaf3 = requestAnimationFrame(function(){
    wheelRaf3 = 0;
    var D9 = derive(cfg); if(D9.ok && ui.view==='chain') renderChain(D9);
  });
}, {passive:false});
/* ── 双击复位视角/缩放/平移 ── */
$('stage').addEventListener('dblclick', function(ev){
  if(ui.view !== 'chain') return;
  if(ev.target.closest('[data-act]') || ev.target.closest('.cardg')) return;
  ui.yaw3 = 0.42; ui.pitch3 = 0.30; ui.zoom3 = 1; ui.panX3 = 0; ui.panY3 = 0;
  render();
});
/* ── 触屏双指缩放+平移 ── */
var touch3 = null;
$('stage').addEventListener('touchstart', function(ev){
  if(ui.view !== 'chain' || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  touch3 = {mx:mx, my:my, dist:dist, zoom:ui.zoom3, panX:ui.panX3, panY:ui.panY3, cs:1};
  var svg = $('stage').querySelector('svg');
  if(svg){ var ctm = svg.getScreenCTM(); if(ctm) touch3.cs = 1/ctm.a; }
}, {passive:false});
$('stage').addEventListener('touchmove', function(ev){
  if(!touch3 || ev.touches.length < 2) return;
  ev.preventDefault();
  var t = ev.touches;
  var mx = (t[0].clientX+t[1].clientX)/2, my = (t[0].clientY+t[1].clientY)/2;
  var dist = Math.hypot(t[1].clientX-t[0].clientX, t[1].clientY-t[0].clientY);
  var r = dist / touch3.dist;
  ui.zoom3 = clamp(touch3.zoom * r, 0.2, 20);
  ui.panX3 = touch3.panX + (mx - touch3.mx)*touch3.cs;
  ui.panY3 = touch3.panY + (my - touch3.my)*touch3.cs;
  var D9 = derive(cfg); if(D9.ok && ui.view==='chain') renderChain(D9);
}, {passive:false});
$('stage').addEventListener('touchend', function(ev){
  if(touch3 && ev.touches.length < 2){ touch3 = null; render(); }
});
document.addEventListener('click', function(ev){
  var card = ev.target.closest('.cardg');
  if(card){ sel = +card.getAttribute('data-g'); render(); ptoNotifyHost(); return; }
  var dc = ev.target.closest('.dimcol');
  if(dc){ sel = (sel === +dc.getAttribute('data-g')) ? null : +dc.getAttribute('data-g'); render(); ptoNotifyHost(); return; }
  if(ev.target.closest('[data-act="leafopen"]')){ ui.view = 'anatomy'; ui.selLayerOff = 0; render(); return; }
  var lp = ev.target.closest('.l3pick');
  if(lp){ ui.selLayerOff = +lp.getAttribute('data-li'); render(); return; }
  var b = ev.target.closest('[data-act]');
  /* 点画布空白处取消选中。选中是一种「当前在看谁」的状态，得有办法退出来——
     不然一旦点中某张卡，读出面板就再也关不掉了（只剩面板上那颗 ✕）。
     只认舞台内的空白：点工具条、抽屉、面板都不算。 */
  if(!b && sel !== null && ev.target.closest('#stage,#deck')){
    sel = null; render(); ptoNotifyHost(); return;
  }
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(act==='preset'){
    var p = PRESETS.filter(function(x){return x.id===b.getAttribute('data-id');})[0];
    cfg = JSON.parse(JSON.stringify(p.cfg)); activePreset = p.id; sel = null;
    ui.cpFacet = 0; ui.unfold = true; ui.unfoldSet = false; stopAnim(); render();
  }
  else if(act==='fix'){
    var D0 = derive(cfg);
    var e = D0.errors.filter(function(x){return x.id===b.getAttribute('data-err');})[0];
    var f = e && e.fixes[+b.getAttribute('data-i')];
    if(f){ Object.keys(f.patch).forEach(function(k){ cfg[k]=f.patch[k]; }); activePreset=null; render(); }
  }
  else if(act==='view'){ ui.view = b.getAttribute('data-v'); stopAnim(); render(); }
  else if(act==='gov'){
    var gv = b.getAttribute('data-v');
    if(gv==='chainfront'){ ui.view='chain'; ui.yaw3=0.12; ui.pitch3=0.08; ui.viewTab='front'; }
    else{ ui.view=gv; }
    stopAnim(); render();
  }
  else if(act==='layer'){
    var L = b.getAttribute('data-l');
    if(!AVAIL[ui.view][L]) return;
    setLayer(L, !layerOn(L)); render();
  }
  else if(act==='cutdim'){ ui.cutDim = b.getAttribute('data-d'); render(); }
  else if(act==='turn'){ ui.yaw3 += (+b.getAttribute('data-y'))*0.35; ui.pitch3 = clamp(ui.pitch3 + (+b.getAttribute('data-p'))*0.18, -0.9, 1.57); render(); }
  else if(act==='turnreset'){ ui.yaw3 = 0.42; ui.pitch3 = 0.30; ui.zoom3 = 1; ui.panX3 = 0; ui.panY3 = 0; render(); }
  else if(act==='viewsnap'){
    var ty = parseFloat(b.getAttribute('data-yaw')), tp = parseFloat(b.getAttribute('data-pitch'));
    if(!isFinite(ty) || !isFinite(tp)) return;
    var sy = ui.yaw3, sp = ui.pitch3, t0 = performance.now(), dur = 420;
    function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
    (function tick(now){
      var t = Math.min(1, (now - t0) / dur), e = ease(t);
      ui.yaw3 = sy + (ty - sy) * e;
      ui.pitch3 = sp + (tp - sp) * e;
      var D9 = derive(cfg); if(D9.ok && ui.view==='chain') renderChain(D9);
      if(t < 1) requestAnimationFrame(tick);
      else render();
    })(t0);
  }
  else if(act==='spread'){ ui.spread = !ui.spread; render(); }
  else if(act==='cardmode'){ ui.cardMode = !ui.cardMode; if(!ui.cardMode) ui.netOff = false; render(); }
  else if(act==='netoff'){ ui.netOff = !ui.netOff; render(); }
  else if(act==='knifetoggle'){
    var kk2 = b.getAttribute('data-k');
    if(kk2==='dp') ui.kDP = !ui.kDP;
    else if(kk2==='pp') ui.kPP = !ui.kPP;
    else if(kk2==='tp') ui.kTP = !ui.kTP;
    else if(kk2==='ep') ui.kEP = !ui.kEP;
    render();
  }
  else if(act==='viewtab'){
    ui.viewTab = b.getAttribute('data-tab');
    var ty = parseFloat(b.getAttribute('data-yaw')), tp = parseFloat(b.getAttribute('data-pitch'));
    /* 直接落到目标机位——中间帧是既非此视图也非彼视图的斜角，补间等于每次切换都强插一段 3D */
    if(isFinite(ty) && isFinite(tp)){ ui.yaw3 = ty; ui.pitch3 = tp; }
    render();
  }
  else if(act==='knife'){ stopAnim(); ui.knife = +b.getAttribute('data-i'); render(); }
  else if(act==='stagestep'){
    var Ds = derive(cfg); if(!Ds.ok) return;
    var d0 = +b.getAttribute('data-d'); if(!d0) return;
    var c0s = coordsOf((sel!==null&&sel<Ds.world)?sel:0, Ds);
    sel = rankOf(c0s.t, c0s.c, c0s.d, (c0s.p + d0 + Ds.pp) % Ds.pp, Ds);
    render(); ptoNotifyHost();
  }
  else if(act==='knifeplay'){
    var Dk = derive(cfg); if(!Dk.ok) return;
    if(anim.on){ stopAnim(); render(); return; }
    /* 从整网起手，一刀一刀往下切；切完停在最后一刀（不循环——刀序是有终点的） */
    var nS = knifeSteps(Dk).length;
    ui.knife = 0; anim.on = true; render();
    anim.timer = setInterval(function(){
      ui.knife += 1;
      if(ui.knife >= nS){ ui.knife = nS-1; stopAnim(); render(); return; }
      render();
    }, 1400);
  }
  else if(act==='storyact'){ ui.act = +b.getAttribute('data-i'); render(); }
  else if(act==='act2'){ ui.act2 = !ui.act2; render(); }
  else if(act==='persp'){ ui.persp = b.getAttribute('data-p'); render(); }
  else if(act==='pickg'){ sel = +b.getAttribute('data-g'); render(); ptoNotifyHost(); }
  else if(act==='chainpick'){
    var Dq = derive(cfg); if(!Dq.ok) return;
    var g0 = (sel!==null&&sel<Dq.world)?sel:0, c0 = coordsOf(g0,Dq);
    var kk = b.getAttribute('data-k'), iv = +b.getAttribute('data-i');
    if(kk==='card') sel = iv;            /* 卡维度：整只卡壳就是一个可点的 rank */
    else if(kk==='d') sel = rankOf(c0.t,c0.c,iv,c0.p,Dq);
    else if(kk==='p') sel = rankOf(c0.t,c0.c,c0.d,iv,Dq);
    else if(kk==='t') sel = rankOf(iv,c0.c,c0.d,c0.p,Dq);
    else if(kk==='e' && Dq.moe){
      var m0 = epOf(c0.t,c0.c,c0.d,Dq);
      var q0 = (m0.mdp*Dq.ep+iv)*Dq.etp+m0.etp;
      sel = rankOf(q0%Dq.tp, Math.floor(q0/Dq.tp)%Dq.cp, Math.floor(q0/(Dq.tp*Dq.cp))%Dq.dp, c0.p, Dq);
    }
    else if(kk==='c' && Dq.cp>1){
      var ownerC2 = iv<Dq.cp ? iv : 2*Dq.cp-1-iv;
      sel = rankOf(c0.t, ownerC2, c0.d, c0.p, Dq);
    }
    render(); ptoNotifyHost();
  }
  else if(act==='axis'){ var a = b.getAttribute('data-a'); ui.axis = (ui.axis===a) ? '' : a; render(); }
  else if(act==='facet'){ ui.cpFacet = +b.getAttribute('data-i'); render(); }
  else if(act==='yaw'){ ui.yaw = (ui.yaw + (+b.getAttribute('data-d')) + 4) & 3; render(); }
  else if(act==='yawreset'){ ui.yaw = 0; render(); }
  else if(act==='unfold'){ ui.unfold = true; ui.unfoldSet = true; render(); }
  else if(act==='refold'){ ui.unfold = false; ui.unfoldSet = true; render(); }
  else if(act==='commdim'){ ui.commDim = b.getAttribute('data-d'); setLayer('L5', true); render(); }
  else if(act==='commprim'){ ui.commPrim = b.getAttribute('data-p'); setLayer('L5', true); render(); }
  else if(act==='detach'){ ui.detach = !ui.detach; if(ui.detach) setLayer('L5', true); render(); }
  else if(act==='anim'){
    if(anim.on){ stopAnim(); render(); }
    else{ var D2 = derive(cfg); if(D2.ok && ui.view==='compose'){ render(); startAnim(D2); } }
  }
  else if(act==='skew'){ ui.skew = !ui.skew; render(); }
  else if(act==='zoomar'){ ui.zoomAR = !ui.zoomAR; render(); }
  else if(act==='v3layer'){ ui.selLayerOff = clamp(ui.selLayerOff + (+b.getAttribute('data-d')), 0, derive(cfg).layersPerStage-1); render(); }
  else if(act==='clearsel'){ sel = null; render(); }
  else if(act==='pick'){
    sel = +b.getAttribute('data-g');
    var Dp = derive(cfg);
    if(Dp.ok && sel<Dp.world) ui.cpFacet = coordsOf(sel,Dp).c;
    render();
  }
  else if(act==='drawer'){ var d = b.getAttribute('data-d'); ui.drawer = (ui.drawer===d)?'':d; render(); }
  else if(act==='theme'){
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
    render();
  }
});
/* 悬停 tooltip */
var tip = document.getElementById('tip');
document.addEventListener('mousemove', function(ev){
  var g = ev.target.closest ? ev.target.closest('.cardg, .opblk') : null;
  if(g && g.classList.contains('cardg')){
    var D = derive(cfg), r = +g.getAttribute('data-g');
    if(D.ok && r<D.world){
      var co = coordsOf(r,D), me = D.moe?epOf(co.t,co.c,co.d,D):null;
      tip.innerHTML = '<b>global_rank '+r+'</b><br>tp '+co.t+' · cp '+co.c+' · dp '+co.d+' · pp '+co.p+(me?'<br>ep '+me.ep+' · etp '+me.etp:'')+'<br><span style="opacity:.6">点击选中（跨视图保持）</span>';
      tip.style.display='block';
      tip.style.left = Math.min(window.innerWidth-280, ev.clientX+13)+'px';
      tip.style.top = (ev.clientY+13)+'px';
      return;
    }
  }
  if(g && g.classList.contains('opblk')){
    var D3 = derive(cfg), o = opBytes(D3).filter(function(x){return x.id===g.getAttribute('data-op');})[0];
    if(o){
      tip.innerHTML = '<b>'+esc(o.id)+'</b><br>'+esc(o.how)+'<br>'+esc(o.shape)+(o.b?'<br>'+fmtGB(o.b)+' GB / 卡':'');
      tip.style.display='block';
      tip.style.left = Math.min(window.innerWidth-280, ev.clientX+13)+'px';
      tip.style.top = (ev.clientY+13)+'px';
      return;
    }
  }
  tip.style.display='none';
});
/* 宿主 postMessage 主题联动（与逻辑魔方同约定） */
window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if(!d) return;
  if((d.type==='theme'||d.type==='pto:theme') && (d.value==='dark'||d.value==='light')){
    document.documentElement.setAttribute('data-theme', d.value); render(); return;
  }
  /* 宿主（驾驶舱）驱动：不重载 iframe 也能换视图 / 选中卡 / 换预置。
     只认白名单字段，非法值忽略——宿主传错不该让这一格白屏。 */
  if(d.type==='pto:state'){
    if(VIEWS.some(function(x){ return x.id===d.view; })) ui.view = d.view;
    if(COMM_DIMS.indexOf(d.cut)>=0) ui.cutDim = d.cut;
    if(d.preset){
      var p2 = PRESETS.filter(function(x){ return x.id===d.preset; })[0];
      if(p2){ cfg = JSON.parse(JSON.stringify(p2.cfg)); activePreset = p2.id; }
    }
    if(typeof d.sel === 'number' && d.sel >= 0) sel = d.sel;
    if(d.sel === null) sel = null;
    if(d.l5 === true || d.l5 === false) (ui.layersUser[ui.view] = ui.layersUser[ui.view]||{}).L5 = d.l5;
    if(d.theme==='dark'||d.theme==='light') document.documentElement.setAttribute('data-theme', d.theme);
    render();
    /* 回报当前状态，宿主据此对齐别的格（选中卡可能被本页夹紧过） */
    if(ev.source) ev.source.postMessage({type:'pto:state-ack', view:ui.view, cut:ui.cutDim, sel:sel, preset:activePreset}, '*');
  }
});
/* 页内换选中卡时主动上报，宿主用它联动别的组件（A8 的跨组件版）。
   独立打开时 parent===window，函数存在但什么也不做。 */
window.ptoNotifyHost = function(){
  if(window.parent && window.parent !== window)
    window.parent.postMessage({type:'pto:select', sel:sel, view:ui.view, cut:ui.cutDim}, '*');
};

/* 刀序视图的 viewBox 宽度是**按舞台实测长宽比**反解的（见 renderChain）。
   首帧量到的是布局还没落定的高度，之后底部图例一排下来舞台会缩——不重画就永远按错的比例
   letterbox。盯着舞台的尺寸变化重画一次；重画只换 SVG 内容、不改舞台本身，不会自激。 */
if(window.ResizeObserver){
  var roLast = 0, roTimer = 0;
  new ResizeObserver(function(){
    var el = $('stage'); if(!el || ui.view!=='chain' || el.clientHeight<60) return;
    var ar = (el.clientWidth-20)/(el.clientHeight-12);
    if(Math.abs(ar - roLast) < 0.02) return;
    roLast = ar;
    clearTimeout(roTimer); roTimer = setTimeout(render, 60);
  }).observe($('stage'));
}

urlLoad();
render();
})();
</script>
