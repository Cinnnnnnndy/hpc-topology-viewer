<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>并行拓扑 · PRD Demo（应用形态）</title>
<!-- PTO Design System：与逻辑魔方 / net-sharding 同一 token 层；缺失时以下所有 var() 均带回退值 -->
<link rel="stylesheet" href="../vendor/pto-design-system/styles.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   parallel-topology demo —— PRD 的应用形态呈现（参照逻辑魔方 pattern 的壳）。
   纪律与 net-sharding 相同：视觉一律取 token（带回退），维度只用签名色；
   五类对象五种画法：容器=线框、内容=实心体积、结构=无厚度线、地址=文字、动作=连线。
   ════════════════════════════════════════════════════════════════════ */
.pt-root{
  --pt-tp: var(--dim-tp, #22d3ee);
  --pt-pp: var(--warning, #ffaa3b);
  --pt-dp: var(--primary, #4369ef);
  --pt-ep: var(--highlight-l0a-violet-400, #9b3cf6);
  --pt-cp: var(--highlight-ub-green-600, #86c70f);
  --pt-bg: var(--background, #f6f7f9);
  --pt-s1: var(--surface-1, #ffffff);
  --pt-s2: var(--surface-2, #eef0f3);
  --pt-fg: var(--foreground, rgba(10,14,20,.92));
  --pt-fg2: var(--foreground-secondary, rgba(10,14,20,.62));
  --pt-fg3: var(--foreground-muted, rgba(10,14,20,.42));
  --pt-bd: var(--border-default, rgba(10,14,20,.14));
  --pt-bds: var(--border-strong, rgba(10,14,20,.26));
  --pt-danger: var(--danger, #d1242f);
  --pt-face1: color-mix(in srgb, var(--pt-s1) 94%, #ffffff 6%);
  --pt-face2: color-mix(in srgb, var(--pt-s1) 88%, #000000 12%);
  --pt-face3: color-mix(in srgb, var(--pt-s1) 78%, #000000 22%);
  --pt-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
  --pt-sans: var(--font-sans, -apple-system, "PingFang SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif);
  position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--pt-bg); color:var(--pt-fg); font-family:var(--pt-sans); font-size:13px;
}
.pt-root *{box-sizing:border-box}
.pt-root button{font-family:inherit; cursor:pointer}
.pt-root .mono{font-family:var(--pt-mono)}

/* ── 顶栏 ── */
.pt-bar{
  flex:none; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;
  padding:8px 14px; border-bottom:1px solid var(--pt-bd); background:var(--pt-s1); z-index:12;
}
.pt-title{line-height:1.25; margin-right:2px}
.pt-title b{font-size:14px}
.pt-title .sub{display:block; font-size:10.5px; color:var(--pt-fg2)}
.pt-title .sub a{color:inherit}
.pt-seg{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--pt-bd); border-radius:999px; background:var(--pt-s2)}
.pt-seg button{
  min-height:26px; padding:0 12px; font-size:12px; font-weight:600; border:none; border-radius:999px;
  background:transparent; color:var(--pt-fg2);
}
.pt-seg button:hover{color:var(--pt-fg)}
.pt-seg button.is-on{background:var(--pt-fg); color:var(--pt-bg)}
.pt-chips{display:inline-flex; gap:5px; flex-wrap:wrap; align-items:center}
.pt-chip{
  font-family:var(--pt-mono); font-size:11px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s1);
}
.pt-chip b{color:var(--pt-fg)}
.pt-chip.is-btn:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-chip.err{color:#fff; background:var(--pt-danger); border-color:var(--pt-danger); font-weight:700}
.pt-actions{margin-left:auto; display:inline-flex; gap:6px}
.pt-actions button{
  min-height:28px; padding:0 13px; font-size:12px; font-weight:600; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
.pt-actions button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-actions button.is-on{background:var(--pt-fg); border-color:var(--pt-fg); color:var(--pt-bg)}

/* ── 主区 ── */
.pt-main{flex:1 1 auto; position:relative; min-height:0}
.pt-stage{position:absolute; inset:0; padding:6px 10px}
.pt-stage svg{width:100%; height:100%; display:block}
.pt-stagebar{
  position:absolute; top:10px; left:14px; z-index:6; display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  max-width:min(64%, 720px);
}
.pb{
  min-height:26px; padding:0 11px; font-size:11.5px; font-weight:600; border-radius:999px;
  border:1px solid var(--pt-bd); background:var(--pt-s1); color:var(--pt-fg2);
}
.pb:hover{border-color:var(--c, var(--pt-bds)); color:var(--pt-fg)}
.pb.is-on{background:var(--c, var(--pt-fg)); border-color:var(--c, var(--pt-fg)); color:var(--pt-bg)}
.pb:disabled{opacity:.38; cursor:not-allowed; text-decoration:line-through}
.pb.mono{font-family:var(--pt-mono); font-weight:600}
.pb .cmn{font-size:9px; opacity:.75; margin-left:4px; font-weight:400}
.pt-cap{font-family:var(--pt-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--pt-fg3); align-self:center; margin:0 2px}

/* 浮动卡通用 */
.pt-card{
  position:absolute; z-index:8; background:var(--pt-s1); border:1px solid var(--pt-bd);
  border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.14); padding:12px 14px;
}
/* 右侧读出卡（FR-3） */
.pt-detail{top:10px; right:14px; width:304px; max-height:calc(100% - 20px); overflow:auto; font-size:12px}
.pt-detail h4{margin:0 0 6px; font-family:var(--pt-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--pt-fg3); display:flex; justify-content:space-between; align-items:center; gap:8px}
.pt-detail .grank{font-family:var(--pt-mono); font-size:21px; font-weight:800}
.pt-detail .grank small{font-size:10px; font-weight:400; color:var(--pt-fg3); margin-left:6px}
.pt-x{border:none; background:none; color:var(--pt-fg3); font-size:14px; padding:0 3px}
.pt-x:hover{color:var(--pt-danger)}
.coords{display:flex; flex-wrap:wrap; gap:4px; margin:7px 0}
.coords .c{font-family:var(--pt-mono); font-size:10.5px; border:1px solid var(--pt-bd); border-radius:5px; padding:1.5px 7px; color:var(--pt-fg2)}
.coords .c.hot{color:#fff; border-color:transparent; background:var(--c)}
.pt-detail .formula{font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg2); background:var(--pt-s2); border-radius:6px; padding:6px 8px; margin:7px 0; line-height:1.7; overflow-x:auto}
.pt-detail table{width:100%; border-collapse:collapse; font-size:11.5px; margin:4px 0}
.pt-detail td{padding:2.5px 3px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.pt-detail td:first-child{color:var(--pt-fg3); font-family:var(--pt-mono); font-size:10.5px; white-space:nowrap}
.pt-detail code{font-family:var(--pt-mono); font-size:10.5px; background:var(--pt-s2); padding:.5px 4px; border-radius:4px}
.pt-detail .rev{margin-top:9px; border-top:1px solid var(--pt-bd); padding-top:8px}
.pt-detail .rev input{width:56px; font-family:var(--pt-mono); font-size:11px; padding:2px 6px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.rankchips{display:flex; flex-wrap:wrap; gap:3px; margin-top:5px}
.rankchips button{font-family:var(--pt-mono); font-size:10px; padding:1px 6px; border-radius:5px; border:1px solid var(--pt-bd); background:var(--pt-s2); color:var(--pt-fg2)}
.rankchips button:hover{border-color:var(--pt-bds); color:var(--pt-fg)}
.pt-go{display:inline-block; margin-top:7px; font-size:11px; font-weight:600; color:var(--pt-dp); cursor:pointer}

/* 抽屉（配置 / 验收）：从顶栏落下，右侧 */
.pt-drawer{top:10px; right:14px; width:min(680px, calc(100% - 28px)); max-height:calc(100% - 20px); overflow:auto; z-index:11}
.pt-drawer h4{margin:0 0 8px; font-family:var(--pt-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--pt-fg3)}
.cfg-cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:10px 16px}
.frow{display:flex; align-items:center; gap:7px; margin-bottom:6px; font-size:12px}
.frow label{flex:0 0 108px; color:var(--pt-fg2); display:flex; align-items:center; gap:5px}
.frow input{width:84px; font-family:var(--pt-mono); font-size:12px; padding:3px 7px; border:1px solid var(--pt-bd); border-radius:6px; background:var(--pt-s2); color:var(--pt-fg)}
.frow input:disabled{opacity:.5}
.frow .hint{font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg3)}
.frow.derived{background:color-mix(in srgb, var(--pt-dp) 10%, transparent); border-radius:7px; padding:4px 6px; margin-left:-6px}
.frow.derived .val{font-family:var(--pt-mono); font-weight:800; font-size:13px; color:var(--pt-dp)}
.stepn{display:inline-block; font-family:var(--pt-mono); font-size:9px; color:var(--pt-bg); background:var(--pt-fg3); border-radius:50%; width:14px; height:14px; line-height:14px; text-align:center; flex:none}
.dk{font-family:var(--pt-mono); font-weight:700; font-size:10px; padding:0 5px; border-radius:4px; color:#fff; background:var(--c)}
.verr,.vwarn,.vok{border-radius:8px; padding:7px 11px; margin-top:7px; font-size:12px; border:1px solid}
.verr{background:color-mix(in srgb, var(--pt-danger) 9%, transparent); border-color:color-mix(in srgb, var(--pt-danger) 40%, transparent); color:var(--pt-danger)}
.vwarn{background:color-mix(in srgb, var(--pt-pp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-pp) 40%, transparent); color:color-mix(in srgb, var(--pt-pp) 70%, var(--pt-fg) 30%)}
.vok{background:color-mix(in srgb, var(--pt-cp) 10%, transparent); border-color:color-mix(in srgb, var(--pt-cp) 40%, transparent); color:color-mix(in srgb, var(--pt-cp) 60%, var(--pt-fg) 40%)}
.fixes{margin-top:5px; display:flex; flex-wrap:wrap; gap:5px}
.fixes button{font-family:var(--pt-mono); font-size:10.5px; padding:2px 9px; border-radius:999px; border:1px solid currentColor; background:transparent; color:inherit}
.fixes button:hover{background:var(--pt-danger); border-color:var(--pt-danger); color:#fff}
.diagrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.dstat{font-family:var(--pt-mono); font-size:10.5px; padding:3px 9px; border-radius:7px; border:1px solid var(--pt-bd); color:var(--pt-fg2); background:var(--pt-s2)}
.dstat.warn{border-color:color-mix(in srgb, var(--pt-pp) 55%, transparent); color:color-mix(in srgb, var(--pt-pp) 75%, var(--pt-fg) 25%)}
.acc-t{width:100%; border-collapse:collapse; font-size:11.5px}
.acc-t td{padding:5px 7px; border-bottom:1px solid color-mix(in srgb, var(--pt-bd) 55%, transparent); vertical-align:top}
.acc-t td:first-child{font-family:var(--pt-mono); font-weight:700; white-space:nowrap}
.badge{font-family:var(--pt-mono); font-size:9.5px; padding:1.5px 7px; border-radius:999px; white-space:nowrap; border:1px solid}
.badge.pass{color:color-mix(in srgb, var(--pt-cp) 65%, var(--pt-fg) 35%); border-color:color-mix(in srgb, var(--pt-cp) 50%, transparent); background:color-mix(in srgb, var(--pt-cp) 10%, transparent)}
.badge.manual{color:var(--pt-fg2); border-color:var(--pt-bd); background:var(--pt-s2)}
.badge.fail{color:var(--pt-danger); border-color:var(--pt-danger)}

/* 抽离图 / 折叠提示：舞台内底部浮动 */
.pt-detach{left:14px; bottom:12px; width:min(600px, 62%); z-index:7; padding:10px 12px}
.pt-detach svg{width:100%; height:auto; display:block}
.pt-note{
  position:absolute; left:14px; bottom:12px; z-index:5; max-width:min(520px, 60%);
  background:var(--pt-s1); border:1px solid var(--pt-bd); border-left:3px solid var(--pt-fg);
  border-radius:8px; padding:7px 11px; font-size:11.5px; color:var(--pt-fg2);
}
.pt-note .pb{margin-left:6px; min-height:22px; padding:0 9px; font-size:10.5px}
.pt-detach:not([hidden]) ~ .pt-note{bottom:auto; top:10px; left:50%; transform:translateX(-50%)}
/* 动画字幕 */
.pt-animcap{
  position:absolute; left:50%; transform:translateX(-50%); bottom:14px; z-index:9; display:none;
  font-family:var(--pt-mono); font-size:11px; background:color-mix(in srgb, var(--pt-fg) 92%, transparent);
  color:var(--pt-bg); border-radius:999px; padding:6px 16px; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pt-animcap b{color:var(--pt-bg)}
/* 舞台被配置错误封锁 */
.pt-blocked{position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:var(--pt-fg2); z-index:4; font-size:13px}
.pt-blocked b{color:var(--pt-danger)}
.pt-blocked .pb{margin-top:10px; justify-self:center}

/* ── 底栏 ── */
.pt-foot{flex:none; border-top:1px solid var(--pt-bd); background:var(--pt-s1); padding:6px 14px 8px; z-index:10; display:flex; flex-direction:column; gap:5px}
.pt-lrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pt-sep{width:1px; height:16px; background:var(--pt-bd); margin:0 4px}
.pt-krow{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--pt-fg2)}
.pt-key{display:inline-flex; align-items:center; gap:5px; font-family:var(--pt-mono); font-size:10px; color:var(--pt-fg2); white-space:nowrap}
.pt-key svg{display:block}
.pt-say{flex:1 1 260px; min-width:200px; line-height:1.55}
.pt-say b{color:var(--pt-fg)}
.pt-say .a5{color:var(--pt-danger); font-weight:700}

/* tooltip */
#tip{position:fixed; z-index:50; pointer-events:none; display:none; background:var(--pt-fg); color:var(--pt-bg);
  font-family:var(--pt-mono); font-size:10.5px; padding:5px 9px; border-radius:7px; line-height:1.6; max-width:270px}

/* SVG 通用类：容器面 / 文字（颜色全走 token，明暗随主题翻转） */
.f1{fill:var(--pt-face1)} .f2{fill:var(--pt-face2)} .f3{fill:var(--pt-face3)}
.tI{fill:var(--pt-fg)} .tII{fill:var(--pt-fg2)} .tIII{fill:var(--pt-fg3)}
.lane{fill:var(--pt-s2); stroke:var(--pt-bd)}
@keyframes pulse2{0%,100%{opacity:.06} 30%,70%{opacity:1}}
.pulse2{animation:pulse2 .46s ease-in-out 2}
.pulse1{animation:pulse2 .8s ease-in-out 1}
/* 刀序链的变形效果：变形带自上而下生长、子块随后浮现 */
.mband{transform-box:fill-box;transform-origin:top center;animation:mgrow .5s ease-out both}
@keyframes mgrow{from{transform:scaleY(.04);opacity:0}to{transform:scaleY(1);opacity:1}}
.cgrow{animation:cfade .55s ease-out both;animation-delay:.22s}
@keyframes cfade{from{opacity:0}to{opacity:1}}

@media (max-width:900px){
  .pt-detail{width:min(86%, 304px)}
  .pt-stagebar{max-width:96%}
}
</style>
</head>
<body>
<div class="pt-root" id="app">
  <header class="pt-bar">
    <div class="pt-title"><b>并行拓扑</b><span class="sub">PRD Demo · <a href="./prd.html" target="_blank">PRD</a> / <a href="./concept-map.html" target="_blank">参照系</a></span></div>
    <nav class="pt-seg" id="viewSeg"></nav>
    <div class="pt-chips" id="barChips"></div>
    <div class="pt-actions" id="barActs"></div>
  </header>
  <div class="pt-main" id="main">
    <div class="pt-stage" id="stage"></div>
    <div class="pt-stagebar" id="stagebar"></div>
    <div class="pt-animcap" id="animCap"></div>
    <aside class="pt-card pt-detail" id="detail" hidden></aside>
    <div class="pt-card pt-drawer" id="drawer" hidden></div>
    <div class="pt-card pt-detach" id="detach" hidden></div>
    <div class="pt-note" id="stageNote" hidden></div>
  </div>
  <footer class="pt-foot">
    <div class="pt-lrow" id="footCtl"></div>
    <div class="pt-krow"><div class="pt-say" id="say"></div><div id="keys" style="display:inline-flex;gap:12px;flex-wrap:wrap"></div></div>
  </footer>
</div>
<div id="tip"></div>
<script>
(function(){
"use strict";

/* ═════════ 基础 ═════════ */
var C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtGB(b){ return (b/Math.pow(2,30)).toFixed(b >= Math.pow(2,30)*10 ? 0 : 1); }
function fmtP(n){ return n>=1e9 ? (n/1e9).toFixed(2)+' B' : n>=1e6 ? (n/1e6).toFixed(1)+' M' : fmt(n); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function proj(x,y,z,s){ return [(x-z)*C*s, ((x+z)*S - y)*s]; }
function ptsStr(p){ return p.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); }
/* 维度签名色：与逻辑魔方 / net-sharding 同一套 token */
var VC = {tp:'var(--pt-tp)', cp:'var(--pt-cp)', pp:'var(--pt-pp)', dp:'var(--pt-dp)', ep:'var(--pt-ep)'};
var DIMN = {tp:'TP', cp:'CP', pp:'PP', dp:'DP', ep:'EP'};
function mix(colVar, pct){ return 'color-mix(in srgb, '+colVar+' '+pct+'%, transparent)'; }

/* A4 锚点：卡网格 axis 取值域（常量，不含 cp） */
var AXIS_DOMAIN = ['tp','pp','dp','ep'];
var COMM_DIMS = ['tp','cp','pp','dp','ep'];
/* 原语两类（§08）：P2P 是点对点，是所有集合原语的底座——ring AllReduce / AllGather
   本身就是一串 send/recv 接起来的；集合原语是「一组卡一起完成一次状态转换」的封装。
   两类都在计算图里以算子节点出现（send/recv、hcom_*），但在参照系里都是动作（线）：
   不持有字节、不被切，只占链路与时间。 */
var PRIMS = [
  {id:'p2p', name:'P2P(Ring)', kind:'点对点', why:'send/recv 一对一：不是集合通信，而是集合原语的底座——ring AllReduce/AllGather 都由一串 P2P 接成'},
  {id:'allgather', name:'AllGather', kind:'集合', why:'组内每张卡把自己的片给所有人 → 人人持全份'},
  {id:'reducescatter', name:'ReduceScatter', kind:'集合', why:'求和后按片散开 → 人人持一片的和'},
  {id:'allreduce', name:'AllReduce', kind:'集合', why:'ReduceScatter + AllGather：人人持全份的和'},
  {id:'alltoall', name:'All-to-All', kind:'集合', why:'每张卡给每张卡各发一份不同载荷 → 载荷不等（MoE 路由）'}
];
var COMMON = { tp:['allreduce','reducescatter','allgather'], cp:['p2p','alltoall','allgather'], pp:['p2p'], dp:['allreduce'], ep:['alltoall'] };

var PRESETS = [
  {id:'default128', name:'默认·128卡 tp2·pp4·dp16·ep8', cfg:{world:128, tp:2, cp:1, pp:4, ep:8, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:2048, vocab:128256, seq:8192, experts:64, topk:8, mbs:1, ga:8, hbm:64}},
  {id:'dense64', name:'稠密·64卡', cfg:{world:64, tp:4, cp:1, pp:4, ep:1, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:14336, vocab:128256, seq:8192, experts:0, topk:0, mbs:1, ga:8, hbm:64}},
  {id:'longcp', name:'长序列CP·64卡', cfg:{world:64, tp:4, cp:4, pp:2, ep:1, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:14336, vocab:128256, seq:131072, experts:0, topk:0, mbs:1, ga:16, hbm:64}},
  {id:'moe64', name:'MoE折叠·64卡', cfg:{world:64, tp:2, cp:1, pp:4, ep:8, etp:1, layers:32, hidden:4096, heads:32, kv:8, ffn:2048, vocab:128256, seq:8192, experts:64, topk:2, mbs:1, ga:8, hbm:64}},

/* URL 读入 / 写出（与逻辑魔方同一约定：不认识的参数忽略，非法退默认） */
function urlLoad(){
  var q = new URLSearchParams(location.search);
  var theme = q.get('theme')==='dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var p = PRESETS.filter(function(x){ return x.id===q.get('preset'); })[0];
  if(p){ cfg = JSON.parse(JSON.stringify(p.cfg)); activePreset = p.id; }
  ['world','tp','cp','pp','ep','etp','layers','hidden','heads','kv','ffn','vocab','seq','experts','topk','mbs','ga','hbm'].forEach(function(k){
    var v = parseInt(q.get(k),10);
    if(isFinite(v) && v>=0){ cfg[k]=v; if(p===undefined) activePreset=null; }
  });
  /* 旧链接别名：v1..v5 仍可用（发出去的链接不能失效） */
  var vw = q.get('view');
  var LEGACY = {v1:'compose', v2:'time', v3:'anatomy', v4:['dim','dp'], v5:['dim','cp']};
  if(LEGACY[vw]){ var lg = LEGACY[vw]; if(Array.isArray(lg)){ ui.view = lg[0]; ui.cutDim = lg[1]; } else ui.view = lg; }
  else if(VIEWS.some(function(x){return x.id===vw;})) ui.view = vw;
  if(COMM_DIMS.indexOf(q.get('cut'))>=0) ui.cutDim = q.get('cut');
  var sl = parseInt(q.get('sel'),10); if(isFinite(sl) && sl>=0) sel = sl;
  if(AXIS_DOMAIN.indexOf(q.get('axis'))>=0) ui.axis = q.get('axis');
  if(COMM_DIMS.indexOf(q.get('dim'))>=0) ui.commDim = q.get('dim');
  if(PRIMS.some(function(x){return x.id===q.get('prim');})) ui.commPrim = q.get('prim');
  if(q.get('l5')==='1') (ui.layersUser[ui.view]=ui.layersUser[ui.view]||{}).L5 = true;
  var fc = parseInt(q.get('facet'),10); if(isFinite(fc)&&fc>=0) ui.cpFacet = fc;
  if(q.get('skew')==='0') ui.skew = false;
}
function urlWrite(){
  var q = new URLSearchParams();
  var theme = document.documentElement.getAttribute('data-theme');
  if(theme==='dark') q.set('theme','dark');
  if(ui.view!=='dim') q.set('view', ui.view);
  if(ui.view==='dim' && ui.cutDim!=='dp') q.set('cut', ui.cutDim);
  if(activePreset && activePreset!=='default128') q.set('preset', activePreset);
  if(!activePreset){
    ['world','tp','cp','pp','ep','etp','layers','seq','experts'].forEach(function(k){ q.set(k, cfg[k]); });
  }
  if(sel!==null) q.set('sel', sel);
  if(layerOn('L5') && (ui.view==='compose'||ui.view==='time')) q.set('l5','1');
  if(ui.commDim!=='tp') q.set('dim', ui.commDim);
  if(ui.commPrim!=='allreduce') q.set('prim', ui.commPrim);
  if(ui.cpFacet) q.set('facet', ui.cpFacet);
  var s = q.toString();
  history.replaceState(null, '', s ? '?'+s : location.pathname);
}

/* ═════════ 校验与推导（FR-1） ═════════ */
function divisorsOf(n){ var d=[],i; for(i=1;i<=n;i++) if(n%i===0) d.push(i); return d; }
function nearDiv(n,x){ var d=divisorsOf(n),lo=null,hi=null; d.forEach(function(v){ if(v<=x) lo=v; if(hi===null&&v>=x) hi=v; }); var o=[]; if(lo&&lo!==x)o.push(lo); if(hi&&hi!==x)o.push(hi); return o; }
function nearMult(v,m){ var lo=Math.max(m,Math.floor(v/m)*m),hi=lo+m,o=[]; if(lo!==v)o.push(lo); if(hi!==v)o.push(hi); return o.filter(function(x,i,a){return a.indexOf(x)===i;}); }

function derive(c){
  var D = {tp:+c.tp, cp:+c.cp, pp:+c.pp, world:+c.world, layers:+c.layers, hidden:+c.hidden,
    heads:+c.heads, kv:+c.kv, ffn:+c.ffn, vocab:+c.vocab, seq:+c.seq, experts:+c.experts,
    topk:+c.topk, mbs:+c.mbs, ga:+c.ga, hbm:+c.hbm, errors:[], warns:[]};
  D.moe = D.experts > 0;
  D.ep = D.moe ? +c.ep : 1; D.etp = D.moe ? +c.etp : 1;
  var denom = D.tp*D.cp*D.pp;
  D.dpOk = denom>0 && D.world % denom === 0;
  D.dp = D.dpOk ? D.world/denom : Math.max(1, Math.round(D.world/denom));
  function err(id,msg,fx){ D.errors.push({id:id,msg:msg,fixes:fx||[]}); }
  if(!D.dpOk) err('world_div','world % (TP·CP·PP) ≠ 0：world='+D.world+' 不能被 '+denom+' 整除，DP 算不出整数（残差维，§11）。',
    nearMult(D.world,denom).map(function(w){return {label:'world → '+w, patch:{world:w}};}));
  if(D.heads % D.tp !== 0) err('heads_tp','heads % TP ≠ 0：heads='+D.heads+' 不能被 TP='+D.tp+' 整除——注意力头须均分到 TP 组（§11）。',
    nearDiv(D.heads,D.tp).map(function(t){return {label:'TP → '+t, patch:{tp:t}};})
    .concat(nearMult(D.heads,D.tp).map(function(h){return {label:'heads → '+h, patch:{heads:h}};})));
  if(D.layers % D.pp !== 0) err('layers_pp','layers % PP ≠ 0：layers='+D.layers+' 不能被 PP='+D.pp+' 整除——层须均分成 stage（§11）。',
    nearDiv(D.layers,D.pp).map(function(p){return {label:'PP → '+p, patch:{pp:p}};})
    .concat(nearMult(D.layers,D.pp).map(function(l){return {label:'layers → '+l, patch:{layers:l}};})));
  if(D.seq % (2*D.cp) !== 0) err('seq_cp','seq % (2·CP) ≠ 0：seq='+D.seq+' 不能被 '+(2*D.cp)+' 整除——因果负载均衡取首尾对称两段（§11，V5 可见）。',
    nearMult(D.seq,2*D.cp).map(function(s){return {label:'seq → '+s, patch:{seq:s}};}));
  if(D.moe){
    if(D.experts % D.ep !== 0) err('experts_ep','experts % EP ≠ 0：experts='+D.experts+' 不能被 EP='+D.ep+' 整除（§11）。',
      nearDiv(D.experts,D.ep).map(function(e){return {label:'EP → '+e, patch:{ep:e}};}));
    D.moeMin = D.pp * Math.max(D.tp*D.cp, D.ep*D.etp);
    if(D.world < D.moeMin) err('moe_min','总卡数不足：MoE 最小卡数 = PP × max(TP·CP, EP·ETP) = '+D.moeMin+'（不是各维连乘）。当前 '+D.world+'。',
      [{label:'world → '+D.moeMin, patch:{world:D.moeMin}}]);
    if(D.dpOk){
      D.plane = D.tp*D.cp*D.dp;
      if(D.plane % (D.ep*D.etp) !== 0) err('plane_ep','(TP·CP·DP) % (EP·ETP) ≠ 0：stage 内平面 '+D.plane+' 张卡折不成 EP·ETP='+(D.ep*D.etp)+' 组（folding）。', []);
    }
  }
  if(D.hidden % D.heads !== 0) D.warns.push('hidden % heads ≠ 0：headDim 非整数，按取整显示。');
  if(D.kv % D.tp !== 0) D.warns.push('kvHeads='+D.kv+' 不被 TP='+D.tp+' 整除：KV 头复制（GQA 常见）。');
  if(D.ga < D.pp) D.warns.push('GA='+D.ga+' < PP='+D.pp+'：流水线灌不满，气泡率恶化（FR-11）。');
  D.ok = D.errors.length === 0;
  D.layersPerStage = D.ok ? D.layers/D.pp : Math.ceil(D.layers/D.pp);
  D.headDim = Math.floor(D.hidden/D.heads) || 1;
  D.gbs = D.mbs*D.ga*D.dp;
  D.bubble = D.pp>1 ? (D.pp-1)/D.ga : 0;
  return D;
}

/* ═════════ 坐标算术（FR-3，可逆）：order = tp‑cp‑dp‑pp ═════════ */
function coordsOf(g,D){
  return { t: g % D.tp, c: Math.floor(g/D.tp) % D.cp,
           d: Math.floor(g/(D.tp*D.cp)) % D.dp, p: Math.floor(g/(D.tp*D.cp*D.dp)) % D.pp };
}
function rankOf(t,c,d,p,D){ return ((p*D.dp + d)*D.cp + c)*D.tp + t; }
function epOf(t,c,d,D){
  if(!D.moe) return null;
  var q = (d*D.cp + c)*D.tp + t;
  return {etp:q % D.etp, ep:Math.floor(q/D.etp) % D.ep, mdp:Math.floor(q/(D.etp*D.ep)), q:q};
}
function epMembers(g,D){
  var co = coordsOf(g,D), me = epOf(co.t,co.c,co.d,D), out=[], e;
  for(e=0;e<D.ep;e++){
    var q = (me.mdp*D.ep + e)*D.etp + me.etp;
    out.push(rankOf(q % D.tp, Math.floor(q/D.tp) % D.cp, Math.floor(q/(D.tp*D.cp)) % D.dp, co.p, D));
  }
  return out;
}
/* EP 组跨了哪几根轴——实算，不靠印象。
   折叠是 q=(d·CP+c)·TP+t，低位是 t、再 c、再 d；EP 组是 q 上一段步长 ETP 的连续位置
   （共 EP·ETP 个），所以它先填满 TP、再填 CP、最后才咬到 DP。判据就是大小比较：
   EP·ETP ≤ TP·CP → 整组落在同一份 DP 副本里；> 才跨 DP。p 恒等于 co.p ⇒ 永不跨 PP。 */
function epSpanText(D){
  if(!D.moe) return '';
  var g0 = (sel!==null && sel<D.world) ? sel : 0;
  var co = epMembers(g0, D).map(function(r){ return coordsOf(r, D); });
  function nUniq(k){ var s = {}; co.forEach(function(x){ s[x[k]] = 1; }); return Object.keys(s).length; }
  var tot = D.ep*D.etp, plane2 = D.tp*D.cp, wide = tot > plane2;
  return ' <b>这一组跨哪几根轴</b>：EP 组是折叠序 q 上连续 EP·ETP='+tot+' 个位置（步长 ETP），'
    + 'q 的低位依次是 tp→cp→dp，所以先填满 TP、再 CP、最后才咬到 DP——判据只有一个大小比较：'
    + '<b>'+tot+(wide?' &gt; ':' ≤ ')+'TP·CP='+plane2+'</b> ⇒ 本配置一组 '+co.length+' 张卡跨 '
    + 'tp×'+nUniq('t')+(D.cp>1?' · cp×'+nUniq('c'):'')+' · <b>dp×'+nUniq('d')+'</b> · pp×'+nUniq('p')
    + '。EP·ETP ≤ TP·CP 时整组落在<b>同一份 DP 副本</b>里（例：tp8·ep4 → 4 张卡全在 dp0）；'
    + '<b>不跨 PP 恒成立</b>，与配置无关。';
}
function groupMembers(dim,g,D){
  var co = coordsOf(g,D), out=[], i;
  if(dim==='tp'){ for(i=0;i<D.tp;i++) out.push(rankOf(i,co.c,co.d,co.p,D)); }
  else if(dim==='cp'){ for(i=0;i<D.cp;i++) out.push(rankOf(co.t,i,co.d,co.p,D)); }
  else if(dim==='dp'){ for(i=0;i<D.dp;i++) out.push(rankOf(co.t,co.c,i,co.p,D)); }
  else if(dim==='pp'){ for(i=0;i<D.pp;i++) out.push(rankOf(co.t,co.c,co.d,i,D)); }
  else if(dim==='ep'){ out = D.moe ? epMembers(g,D) : [g]; }
  return out;
}

/* ═════════ 持有内容 / 显存（FR-3 / FR-6：函数里没有 DP） ═════════ */
function kvPerTp(D){ return Math.ceil(D.kv/D.tp); }
function opBytes(D){ /* 单层各算子的每卡权重字节（bf16），供 V3 卡内解剖 & 读出 */
  var hd = D.headDim, o = [];
  o.push({id:'attn.q',  cut:'tp', how:'列切 ×'+D.tp, b:2*D.hidden*(D.heads/D.tp)*hd, shape:'['+fmt(D.hidden)+', '+(D.heads/D.tp)+'·'+hd+']'});
  o.push({id:'attn.kv', cut:'tp', how:'头切 ×'+D.tp+(D.kv%D.tp?'（复制）':''), b:2*D.hidden*2*kvPerTp(D)*hd, shape:'['+fmt(D.hidden)+', 2·'+kvPerTp(D)+'·'+hd+']'});
  o.push({id:'attn.core', cut:'none', how:'不切权重（无参）', b:0, shape:'flash-attn（激活算子）'});
  o.push({id:'attn.out', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.heads/D.tp)*hd*D.hidden, shape:'['+(D.heads/D.tp)+'·'+hd+', '+fmt(D.hidden)+']'});
  if(D.moe){
    o.push({id:'router', cut:'none', how:'复制', b:2*D.hidden*D.experts, shape:'['+fmt(D.hidden)+', '+D.experts+']'});
    o.push({id:'experts', cut:'ep', how:'桶切 ×'+D.ep+'·ETP'+D.etp, b:2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp), shape:(D.experts/D.ep)+'个 × ['+fmt(D.hidden)+', '+fmt(Math.floor(D.ffn/D.etp))+']×3'});
  }else{
    o.push({id:'mlp.gate/up', cut:'tp', how:'列切 ×'+D.tp, b:2*2*D.hidden*(D.ffn/D.tp), shape:'['+fmt(D.hidden)+', 2·'+fmt(Math.floor(D.ffn/D.tp))+']'});
    o.push({id:'mlp.down', cut:'tp', how:'行切 ×'+D.tp, b:2*(D.ffn/D.tp)*D.hidden, shape:'['+fmt(Math.floor(D.ffn/D.tp))+', '+fmt(D.hidden)+']'});
  }
  o.push({id:'norm×2', cut:'none', how:'复制', b:2*2*D.hidden, shape:'['+fmt(D.hidden)+']×2'});
  return o;
}
function paramsPerCard(D, ppRank){
  var perLayer = opBytes(D).reduce(function(a,x){ return a+x.b; },0)/2;
  var p = perLayer * D.layersPerStage;
  if(ppRank===0) p += Math.ceil(D.vocab/D.tp)*D.hidden;
  if(ppRank===D.pp-1) p += D.hidden*Math.ceil(D.vocab/D.tp);
  return p;
}
var ACT_COEF = 4;
function memParts(D, ppRank){
  var P = paramsPerCard(D, ppRank);
  var inflight = Math.max(1, Math.min(D.pp, D.ga) - ppRank);
  var act = D.mbs*(D.seq/D.cp)*D.hidden*D.layersPerStage*ACT_COEF*inflight;
  return [
    {k:'w', label:'权重 (bf16)', bytes:2*P, color:'var(--pt-fg)'},
    {k:'g', label:'梯度 (bf16)', bytes:2*P, color:'var(--pt-fg2)'},
    {k:'opt', label:'优化器态 (fp32×3)', bytes:12*P, color:'var(--pt-fg3)'},
    {k:'act', label:'激活·在途'+inflight+'μb', bytes:act, color:'var(--pt-dp)'},
    {k:'rsv', label:'碎片/预留', bytes:1.5*Math.pow(2,30), color:'var(--pt-bd)'}
  ];
}
function holdRows(g,D){
  var co = coordsOf(g,D), l0 = co.p*D.layersPerStage, l1 = (co.p+1)*D.layersPerStage-1, rows=[];
  rows.push(['五元组区间','<small>'+esc(quintRow(g,D))+'</small>（§03·可逆）']);
  rows.push(['持有占比','<small>ℓ '+D.layersPerStage+'/'+D.layers+' · h '+fmt(Math.floor(D.hidden/D.tp))+'/'+fmt(D.hidden)
    +(D.moe?' · e '+(D.experts/D.ep)+'/'+D.experts:'')+' · b '+(D.mbs*D.ga)+'/'+fmt(D.gbs)
    +' · s '+(D.cp>1?fmt(D.seq/D.cp)+'/'+fmt(D.seq):'全部')+'</small>——卡=各维区间的<b>交集</b>，不是小整网']);
  rows.push(['层段','L'+l0+'–L'+l1+'（'+D.layersPerStage+' 层 / stage '+co.p+'）']);
  opBytes(D).forEach(function(o){ if(o.b || o.id==='attn.core') rows.push([o.id, '<code>'+esc(o.shape)+'</code>']); });
  if(D.moe){
    var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep, e0 = me.ep*kE;
    rows.push(['专家桶','E'+e0+'–E'+(e0+kE-1)+'（ep_rank '+me.ep+'）']);
  }
  if(co.p===0) rows.push(['embedding','<code>['+fmt(Math.ceil(D.vocab/D.tp))+', '+fmt(D.hidden)+']</code>（仅 stage 0）']);
  if(co.p===D.pp-1) rows.push(['lm_head','<code>['+fmt(D.hidden)+', '+fmt(Math.ceil(D.vocab/D.tp))+']</code>（仅末 stage）']);
  var a = '<code>['+D.mbs+', '+fmt(D.seq/D.cp)+', '+fmt(D.hidden)+']</code>';
  if(D.cp>1) a += '<br><small>CP 双段：#'+co.c+' 与 #'+(2*D.cp-1-co.c)+'（V5）</small>';
  rows.push(['激活/μbatch', a]);
  return rows;
}

/* ═════════ 1F1B 合成调度（FR-7） ═════════ */
function schedule(D){
  var PP=D.pp, GA=Math.min(D.ga,8), F=1, B=2, truncated=D.ga>GA;
  var order=[],s,m;
  for(s=0;s<PP;s++){
    var w=Math.min(GA,PP-1-s), ops=[];
    for(m=0;m<w;m++) ops.push({t:'F',m:m});
    var fi=w, bi=0;
    while(fi<GA || bi<GA){ if(fi<GA) ops.push({t:'F',m:fi++}); if(bi<GA) ops.push({t:'B',m:bi++}); }
    order.push(ops);
  }
  var fEnd=[],bEnd=[],blocks=[],clock=[];
  for(s=0;s<PP;s++){ fEnd.push({}); bEnd.push({}); clock.push(0); }
  var ptr=order.map(function(){return 0;}), guard=PP*GA*4+8, prog=true;
  while(prog && guard-->0){
    prog=false;
    for(s=0;s<PP;s++){
      while(ptr[s]<order[s].length){
        var op=order[s][ptr[s]], dep=0, durn=op.t==='F'?F:B;
        if(op.t==='F'){ if(s>0){ if(fEnd[s-1][op.m]===undefined) break; dep=fEnd[s-1][op.m]; } }
        else{
          if(fEnd[s][op.m]===undefined) break;
          dep=fEnd[s][op.m];
          if(s<PP-1){ if(bEnd[s+1][op.m]===undefined) break; dep=Math.max(dep,bEnd[s+1][op.m]); }
        }
        var t0=Math.max(clock[s],dep), t1=t0+durn;
        blocks.push({s:s,m:op.m,type:op.t,t0:t0,t1:t1,recv:(op.t==='F'&&s>0)||(op.t==='B'&&s<PP-1)});
        clock[s]=t1;
        if(op.t==='F') fEnd[s][op.m]=t1; else bEnd[s][op.m]=t1;
        ptr[s]++; prog=true;
      }
    }
  }
  var T=0;
  for(s=0;s<PP;s++){ blocks.push({s:s,type:'AR',t0:clock[s],t1:clock[s]+1.4}); T=Math.max(T,clock[s]+1.4); }
  return {blocks:blocks,T:T,GA:GA,truncated:truncated};
}

/* ═════════ 线型语义（§8）：由原语决定，与维度无关 ═════════ */
function edgeSVG(pts, prim, color, opts){
  opts = opts || {};
  var w = opts.w || 2, out='', i, j, n = pts.length, mid = opts.mid || 'x';
  if(n<2) return '<g></g>';
  function line(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  if(prim==='p2p'){
    for(i=0;i<n-1;i++) out += line(pts[i],pts[i+1],'stroke:'+color+';stroke-width:'+w+';marker-end:url(#arr'+mid+')');
    if(opts.ring!==false && n>2) out += line(pts[n-1],pts[0],'stroke:'+color+';stroke-width:'+w+';stroke-opacity:.5;marker-end:url(#arr'+mid+')');
  }else if(prim==='allreduce'){
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+(w+0.6)+';stroke-linejoin:round"/>';
  }else if(prim==='allgather'||prim==='reducescatter'){
    var dash = prim==='allgather'?'7 4':'2 5';
    out += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:'+color+';stroke-width:'+w+';stroke-dasharray:'+dash+';stroke-linejoin:round"/>';
    pts.forEach(function(p){
      out += prim==='allgather'
        ? '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" style="fill:var(--pt-s1);stroke:'+color+';stroke-width:1.4"/>'
        : '<rect x="'+(p[0]-3)+'" y="'+(p[1]-3)+'" width="6" height="6" transform="rotate(45 '+p[0]+' '+p[1]+')" style="fill:'+color+'"/>';
    });
  }else if(prim==='alltoall'){
    for(i=0;i<n;i++) for(j=i+1;j<n;j++){
      var lw = 0.7 + ((i*7+j*13)%3)*0.55;
      out += line(pts[i],pts[j],'stroke:'+color+';stroke-width:'+lw.toFixed(2)+';stroke-opacity:.72');
    }
  }
  return '<g>'+out+'</g>';
}
function defsSVG(){

/* 一只 3D 盒（三可见面）；cls 面用 token 类，动态描边走 style */
function boxSVG(x,y,z,w,h,d,s, o){
  o = o || {};
  var f = {
    top:[proj(x,y+h,z,s),proj(x+w,y+h,z,s),proj(x+w,y+h,z+d,s),proj(x,y+h,z+d,s)],
    left:[proj(x,y,z+d,s),proj(x,y+h,z+d,s),proj(x+w,y+h,z+d,s),proj(x+w,y,z+d,s)],
    right:[proj(x+w,y,z,s),proj(x+w,y+h,z,s),proj(x+w,y+h,z+d,s),proj(x+w,y,z+d,s)]
  };
  var st = o.stroke ? 'stroke:'+o.stroke+';stroke-width:'+(o.sw||1) : 'stroke:var(--pt-bds);stroke-width:'+(o.sw||1);
  if(o.fill){ /* 实心内容块：一个颜色三个明度 */
    return '<g'+(o.attrs||'')+'>'
      + '<polygon points="'+ptsStr(f.top)+'" style="fill:color-mix(in srgb,'+o.fill+' 86%, #fff 14%);'+st+'"/>'
      + '<polygon points="'+ptsStr(f.left)+'" style="fill:color-mix(in srgb,'+o.fill+' 82%, #000 18%);'+st+'"/>'
      + '<polygon points="'+ptsStr(f.right)+'" style="fill:color-mix(in srgb,'+o.fill+' 68%, #000 32%);'+st+'"/></g>';
  }
  if(o.wire){ /* 容器线框：只画棱 */
    var p8 = [proj(x,y,z,s),proj(x+w,y,z,s),proj(x+w,y,z+d,s),proj(x,y,z+d,s),proj(x,y+h,z,s),proj(x+w,y+h,z,s),proj(x+w,y+h,z+d,s),proj(x,y+h,z+d,s)];
    var E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    return '<g'+(o.attrs||'')+'>'+E.map(function(e){
      return '<line x1="'+p8[e[0]][0].toFixed(1)+'" y1="'+p8[e[0]][1].toFixed(1)+'" x2="'+p8[e[1]][0].toFixed(1)+'" y2="'+p8[e[1]][1].toFixed(1)+'" style="'+st+(o.dash?';stroke-dasharray:'+o.dash:'')+'"/>';
    }).join('')+'</g>';

  return '<g'+(o.attrs||'')+' '+(o.gstyle?'style="'+o.gstyle+'"':'')+'>'
    + '<polygon class="f1" points="'+ptsStr(f.top)+'" style="'+st+(o.topFill?';fill:'+o.topFill:'')+'"/>'
    + '<polygon class="f2" points="'+ptsStr(f.left)+'" style="'+st.replace(/stroke-width:[\d.]+/,'stroke-width:'+((o.sw||1)*0.8))+'"/>'
    + '<polygon class="f3" points="'+ptsStr(f.right)+'" style="'+st.replace(/stroke-width:[\d.]+/,'stroke-width:'+((o.sw||1)*0.8))+'"/>'
    + (o.inner||'') + '</g>';
}
function txt(x,y,t,size,fillVar,anchor,extra){

/* ═════════ 单维切分（模板 = 参照系最后一张总图）═════════
   粒度做竖轴：输入 → 整网 → 层 → 算子 → kernel；rank 柱（虚线容器）贯穿全高。
   块的横跨范围 = 共有关系；kernel 永不跨柱；通信画在对应粒度层的柱间。
   五个维共用同一模板——只有「归属边界线的位置」与「片的着色」在变（§02/§03/§07/§15）。 */
var GY = {ker:0, op:3.4, lay:6.8, net:10.2, inp:14.4};   /* 输入与粒度链之间留缝：它是另一个对象，不在包含链里 */
function quintRow(g, D){ /* 索引五元组：这张卡的 rank 元组 ⇢ 五根轴上的区间（§03，双链可逆 §07） */
  var co = coordsOf(g, D), l0 = co.p*D.layersPerStage;
  var hK = Math.floor(D.hidden/D.tp);
  var parts = ['ℓ∈[L'+l0+',L'+((co.p+1)*D.layersPerStage-1)+']', 'h∈['+fmt(co.t*hK)+','+fmt((co.t+1)*hK)+')'];
  if(D.moe){ var me = epOf(co.t,co.c,co.d,D), kE = D.experts/D.ep; parts.push('e∈[E'+(me.ep*kE)+',E'+((me.ep+1)*kE-1)+']'); }
  else parts.push('e=—');
  parts.push('b=副本'+co.d+'的 '+(D.mbs*D.ga)+' 样本', 's=段'+co.c+'∪段'+(2*D.cp-1-co.c));
  return parts.join(' · ');
}
function renderDim(D){
  var dim = ui.cutDim;
  var size = {tp:D.tp, pp:D.pp, cp:D.cp, dp:D.dp, ep:D.ep}[dim];
  var col = VC[dim];

  /* 该维没切开：给说明与一键预置，不硬画（DP-5） */
  if(size <= 1 || (dim==='ep' && !D.moe)){
    var fix = dim==='cp' ? {id:'longcp', label:'载入「长序列 CP」预置'} : {id:'default128', label:'载入默认 128 卡（含 EP8）'};
    $('stage').innerHTML = '<div class="pt-blocked"><div><b style="color:'+col+'">'+DIMN[dim]+' = '+size+'</b><br>'
      + '<span style="font-size:12.5px">当前配置里这一维没有发生切分——没有片、没有组内通信,也就没有可画的关系(宁缺毋误)。</span><br>'
      + '<button class="pb" data-act="preset" data-id="'+fix.id+'">'+fix.label+'</button></div></div>';
    renderDimBar(D, dim);
    $('stageNote').hidden = true; $('detach').hidden = true;
    return;
  }

  var N = Math.min(size, 8), folded = N < size;
  var RX = 3.5, CW = 2.3, DZ = 2.0, s = 26;
  var span = (N-1)*RX + CW;
  var parts = [], bx=[], by=[];
  function reg(p, wL, wR, hU, hD){ bx.push(p[0]-(wL||0), p[0]+(wR||0)); by.push(p[1]-(hU||0), p[1]+(hD||0)); }
  function regBox(x,y,z,w,h,d){
    [[x,y,z],[x+w,y,z],[x,y,z+d],[x+w,y,z+d],[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d]]
      .forEach(function(c){ reg(proj(c[0],c[1],c[2],s)); });
  }
  var xOf = function(i){ return i*RX; };
  var mid = function(i){ return i*RX + CW/2; };
  var anchor = function(i, y){ return proj(mid(i), y, DZ/2, s); };

  /* 每柱的示例 global_rank（其余维折叠取 0；EP 用折叠平面反解） */
  var colRanks = [];
  for(var i0=0;i0<N;i0++){
    if(dim==='tp') colRanks.push(rankOf(i0,0,0,0,D));
    else if(dim==='cp') colRanks.push(rankOf(0,i0,0,0,D));
    else if(dim==='dp') colRanks.push(rankOf(0,0,i0,0,D));
    else if(dim==='pp') colRanks.push(rankOf(0,0,0,i0,D));
  }
  if(dim==='ep') colRanks = epMembers(rankOf(0,0,0,0,D), D).slice(0,N);

  /* ── rank 柱 = 卡（容器）：要一眼读出"这是一个有容量的盒子"，不是几条参考线。
     线框加实、给一层极淡的体积感填充、柱脚标真实显存占用/HBM（容器约束 §15）。 ── */
  for(var i=0;i<N;i++){
    var isSel = sel===colRanks[i];
    var btm = -1.3, top = btm + GY.inp + 2.4, xc = xOf(i);

                       proj(xc+CW,top,DZ,s), proj(xc,top,DZ,s), proj(xc,top,0,s)]);
    parts.push('<g class="dimcol" data-g="'+colRanks[i]+'" style="cursor:pointer">'
      + '<polygon points="'+hull+'" style="fill:'+(isSel?mix('var(--pt-fg)',6):mix('var(--pt-fg)',3))+';stroke:none"/>'
      + boxSVG(xc, btm, 0, CW, GY.inp+2.4, DZ, s, {wire:true, stroke:isSel?'var(--pt-fg)':'var(--pt-bds)', sw:isSel?1.8:1.25, dash:isSel?'':'7 3'})
      + '</g>');
    regBox(xc, btm, 0, CW, GY.inp+2.4, DZ);
    var lb = anchor(i, -2.1);
    parts.push(txt(lb[0], lb[1], dim+'_rank '+i, 10, col, 'middle', 'font-weight="700"'));
    parts.push(txt(lb[0], lb[1]+12, 'g='+colRanks[i], 8.5, 'var(--pt-fg3)'));
    /* 容器约束：这张卡的显存占用 / HBM 容量（真实数，随 stage 不同——PP 视图里 stage0 最高） */
    var stI = coordsOf(colRanks[i], D).p;
    var memI = memParts(D, stI).reduce(function(a,x){ return a+x.bytes; }, 0);
    var over = memI > D.hbm*Math.pow(2,30)*.9;
    parts.push(txt(lb[0], lb[1]+24, '▮ '+fmtGB(memI)+'/'+D.hbm+' GB', 8.5, over?'var(--pt-danger)':'var(--pt-fg2)', 'middle', over?'font-weight="700"':''));
    reg([lb[0], lb[1]+24], 40, 40, 6, 8);
  }
  var interactiveEnd = parts.length;   /* 此后一切图元不吃事件 */
  if(folded){
    var fb = proj(N*RX+.4, GY.op, 0, s);
    parts.push(txt(fb[0], fb[1], '+'+(size-N)+' 柱相同（对称维折叠）', 9.5, 'var(--pt-fg3)', 'start'));
    reg([fb[0], fb[1]], 0, 150, 8, 4);
  }

  var BH = .55;
  function spanBlock(y, label, tint, subl){ /* 横跨全部柱的块 = 共有 */

    colBlocks(y+.04, function(){ return ''; }, function(j){ return mix(col, 34+j*4); }, .12, CW*.9, DZ*.82);

    reg([t[0]+6, t[1]], 0, 230, 10, 6);
  }

  /* ── 五个粒度层，随维差分。诚实纪律：其它维已经切掉的部分不冒充完整——

  /* 输入层 */
  var inpCut = [];

  if(dim!=='cp' && D.cp>1) inpCut.push('s 已被 CP 切（cp0）');
  if(dim==='cp') {
    /* CP 的动词=切一条序列：整条 s 轴横铺 → 2·CP 段 → 首尾配对弧 → 落入各柱 */
    var segN = 2*size, segW = span/segN;

    for(var sg=0; sg<segN; sg++){

    parts.push(txt(tI[0]+6,tI[1],'一条序列 → 2·CP 段；cp_rank c 拿 段c ∪ 段'+(2*size-1)+'−c（弧=配对）',9.5,col,'start','font-weight="700"'));
    parts.push(txt(tI[0]+6,tI[1]+11,'因果注意力下首尾配对才负载均衡——seq%(2·CP) 约束的来源'+(D.dp>1?' · b 已被 DP 切（dp0）':''),8,'var(--pt-fg3)','start'));

  else if(dim==='dp'){ colBlocks(GY.inp, function(j){ return 'b·副本'+j+'的样本'; }, function(j){ return mix(col, 20+Math.round(j/(N-1||1)*30)); }); var tD=proj(span+.35, GY.inp+BH/2,0,s); parts.push(txt(tD[0]+6,tD[1],'输入·样本批被切 ×DP（每副本 MBS·GA='+(D.mbs*D.ga)+'）',9.5,col,'start','font-weight="700"')); reg([tD[0]+6,tD[1]],0,260,10,6); }
  else spanBlock(GY.inp, '输入 — 本维不切输入', null, inpCut.length?inpCut.join(' · '):(dim==='tp'?'TP 切的是权重体的 h/e 轴':dim==='pp'?'PP 切的是层序 ℓ 轴':'EP 重分组专家 e 轴'));
  /* 整网层 */

  else spanBlock(GY.net, '整网 — 逻辑上一张，不属于任何柱', null, '本组是 '+fmt(groups)+' 个同构组之一');

  if(dim==='pp'){

      var t2p = anchor(jp, yj+BH+.12); parts.push(txt(t2p[0], t2p[1]-4, 'stage'+jp+'·L'+(jp*D.layersPerStage)+'–L'+((jp+1)*D.layersPerStage-1), 7.8, 'var(--pt-fg)', 'middle'));

  }
  else if(dim==='dp'){

    for(var jq=0;jq<N-1;jq++){
      var eqp = proj(xOf(jq)+CW+(RX-CW)/2, GY.lay+BH/2, DZ/2, s);
      parts.push(txt(eqp[0], eqp[1]+5, '≡', 16, col, 'middle', 'font-weight="800"'));
    }
  }
  else if(D.pp>1) spanBlock(GY.lay, '层 — 本组只持 stage0：L0–L'+(D.layersPerStage-1), mix(VC.pp,12), 'ℓ 已被 PP 切——那是 PP 干的，不是本维');
  else spanBlock(GY.lay, dim==='ep' ? '层 — MoE 层在每个 stage 里' : '层 — 不切 ℓ，每柱都过全部层');
  /* 算子层：画真算子（一层内的实际序列，宽度∝每卡字节；被本维切的画成片，没切的整块） */
  function realOps(cutKind){
    var ops = opBytes(D).filter(function(o){ return o.b>0 || o.id==='attn.core'; });
    var totB = ops.reduce(function(a,o){ return a+o.b; }, 0);
    /* 宽∝字节，但截顶+地板保证可读：单算子 ≤30%、≥7%（experts 会吃掉全部宽度） */
    var wShare = ops.map(function(o){ return clamp(o.b, totB*.07, totB*.30); });
    var wTot = wShare.reduce(function(a,x){ return a+x; }, 0);
    var W = Math.max(span, 11);   /* 算子带用自己的宽度：真算子多，别挤进柱距里 */
    var gapO = .16, usable = W - gapO*(ops.length-1), x = 0, posMap = {};
    ops.forEach(function(o, oi){
      var w = usable * wShare[oi] / wTot;
      posMap[o.id] = {x:x, w:w};
      var isCut = cutKind==='tp' ? (o.cut==='tp') : cutKind==='ep' ? (o.cut==='ep') : false;
      if(o.b===0){ /* attn.core：无参激活算子——结构线框 */
        parts.push(boxSVG(x, GY.op, 0, w, .3, DZ*.8, s, {wire:true, stroke:'var(--pt-fg3)', sw:.7, dash:'3 3'}));
      }else if(isCut){ /* 被本维切：一个算子的线框 + N 片各归各柱位置比例 */
        parts.push(boxSVG(x, GY.op, 0, w, BH, DZ*.9, s, {wire:true, stroke:col, sw:.8}));
        for(var q2=0;q2<N;q2++){
          parts.push(boxSVG(x + q2*(w/N) + .02, GY.op+.04, .1, w/N-.04, BH*.82, DZ*.68, s,
            {fill:mix(col, 40+q2*4), stroke:'transparent', attrs:' pointer-events="none"'}));
        }
      }else{ /* 没被本维切：整块（复制或随层归属） */
        parts.push(boxSVG(x, GY.op, 0, w, BH*.8, DZ*.8, s, {fill:mix('var(--pt-fg2)',20), stroke:'var(--pt-bds)', sw:.6}));
      }
      var tc = proj(x+w/2, GY.op, DZ*.95, s);
      var ty = tc[1] + 12 + (oi%3)*11;
      parts.push(txt(tc[0], ty, o.id, 7.6, isCut?col:'var(--pt-fg3)', 'middle', isCut?'font-weight="700"':''));
      reg([tc[0], ty], 26, 26, 0, 6);
      x += w + gapO;
    });
    regBox(0, GY.op, 0, W, BH, DZ);
    return {W:W, pos:posMap};
  }
  if(dim==='tp'){
    var Rt = realOps('tp'), Wt = Rt.W;
    var tT = proj(Wt+.35, GY.op+BH/2, 0, s);
    parts.push(txt(tT[0]+6, tT[1], '一层的真算子序列（宽∝字节）：q/kv/out/mlp 被切 ×'+size+'，core/norm 不切', 9.5, col, 'start', 'font-weight="700"'));
    parts.push(txt(tT[0]+6, tT[1]+11, '每柱权重 '+fmtGB(2*paramsPerCard(D,0))+' GB（片，不是整层×N）', 8, 'var(--pt-fg3)', 'start'));
    reg([tT[0]+6, tT[1]+11], 0, 300, 10, 8);
    /* TP 的动词=锯开：给第一个被锯的算子加锯注 + 每片一条落线到自己的柱（片各归各柱，画实了） */
    var saw = Rt.pos['attn.q'];
    if(saw){
      var bkA = proj(saw.x, GY.op+BH+.16, 0, s), bkB = proj(saw.x+saw.w, GY.op+BH+.16, 0, s);
      parts.push('<path d="M'+bkA[0]+' '+(bkA[1]+4)+' L'+bkA[0]+' '+(bkA[1]-3)+' L'+bkB[0]+' '+(bkB[1]-3)+' L'+bkB[0]+' '+(bkB[1]+4)+'" style="fill:none;stroke:'+col+';stroke-width:1.2"/>');
      parts.push(txt((bkA[0]+bkB[0])/2, bkA[1]-8, '锯开：1 个算子 → '+size+' 片', 8.6, col, 'middle', 'font-weight="800"'));
      reg([(bkA[0]+bkB[0])/2, bkA[1]-8], 70, 70, 12, 0);
      for(var q3=0;q3<N;q3++){
        var sp3 = proj(saw.x+(q3+.5)*(saw.w/N), GY.op+.02, DZ*.7, s), cp3 = proj(mid(q3), GY.op-1.0, DZ/2, s);
        parts.push('<line x1="'+sp3[0]+'" y1="'+sp3[1]+'" x2="'+cp3[0]+'" y2="'+cp3[1]+'" style="stroke:'+col+';stroke-width:.9;stroke-dasharray:3 3;opacity:.65"/>');
        parts.push('<circle cx="'+cp3[0]+'" cy="'+cp3[1]+'" r="2.2" style="fill:'+col+'"/>');
        reg([cp3[0], cp3[1]], 8, 8, 4, 6);
      }
      var dl = proj(mid(N-1)+1.1, GY.op-1.0, DZ/2, s);
      parts.push(txt(dl[0], dl[1]+3, '片各归各柱（落线）', 7.6, col, 'start'));
      reg([dl[0], dl[1]], 0, 110, 6, 6);
    }
  }
  else if(dim==='ep'){
    var Re = realOps('ep'), We = Re.W;
    var tE = proj(We+.35, GY.op+BH/2, 0, s);
    parts.push(txt(tE[0]+6, tE[1], '真算子序列：experts 被 e 轴重分组 ×'+size+'（每桶 '+kE+' 个），attn/router 不归本维', 9.5, col, 'start', 'font-weight="700"'));
    parts.push(txt(tE[0]+6, tE[1]+11, 'EP 是视图，不是新轴（勘误 K）', 8, 'var(--pt-fg3)', 'start'));
    reg([tE[0]+6, tE[1]+11], 0, 300, 10, 8);
    /* EP 的动词=路由：token 从 router 出发，动态挑 top-k 个桶（不是静态切开） */
    var expP = Re.pos['experts'], rtP = Re.pos['router'];
    if(expP){
      var tok = proj((rtP?rtP.x+rtP.w/2:expP.x-.6), GY.op+BH+1.15, DZ*.4, s);
      parts.push('<circle cx="'+tok[0]+'" cy="'+tok[1]+'" r="3.2" style="fill:'+col+'"/>');
      parts.push(txt(tok[0], tok[1]-8, '一个 token', 8, col, 'middle', 'font-weight="700"'));
      reg([tok[0], tok[1]-8], 34, 34, 12, 0);
      var picks = [1, Math.min(N-1, 6)];
      for(var bi=0;bi<N;bi++){
        var tgt = proj(expP.x+(bi+.5)*(expP.w/N), GY.op+BH, DZ*.35, s);
        var hit = picks.indexOf(bi)>=0;
        parts.push('<line x1="'+tok[0]+'" y1="'+(tok[1]+4)+'" x2="'+tgt[0]+'" y2="'+tgt[1]+'" style="stroke:'+col+';stroke-width:'+(hit?1.7:.6)+';stroke-dasharray:'+(hit?'none':'2 4')+';opacity:'+(hit?.95:.3)+';'+(hit?'marker-end:url(#arrep)':'')+'"/>');
      }
      parts.push(txt(tok[0]+66, tok[1]+2, 'top-'+(D.topk||2)+' 动态路由：每个 token 挑自己的桶——路由是运行时的，切分是静态的', 8.4, 'var(--pt-fg2)', 'start'));
      reg([tok[0]+66, tok[1]+2], 0, 320, 8, 6);
    }
  }
  else if(dim==='pp') colBlocks(GY.op, function(){ return ''; }, function(j){ return mix(col, 22+Math.round(j/(N-1||1)*18)); });
  else if(dim==='dp') colBlocks(GY.op, function(){ return ''; }, function(){ return mix('var(--pt-fg2)',22); });
  else spanBlock(GY.op, '算子 — 权重完整（CP 只切激活的 s 轴）');
  /* kernel 层：严格单柱 + 流 */
  for(var q=0;q<N;q++) for(var kr=0;kr<3;kr++){
    parts.push(boxSVG(xOf(q)+.12, GY.ker, .12+kr*.62, CW-.24, .4, .5, s, {fill:mix('var(--pt-fg2)', 40-kr*8), stroke:'transparent', attrs:' pointer-events="none"'}));
  }
  regBox(0, GY.ker, 0, span, .5, DZ);
  var tk = proj(span+.35, GY.ker+.25, 0, s);
  parts.push(txt(tk[0]+6, tk[1], 'kernel — 永不跨柱；在「流」（容量=时间）里排队', 9.5, 'var(--pt-fg)', 'start', 'font-weight="600"'));
  reg([tk[0]+6, tk[1]], 0, 280, 10, 6);

  /* ── 归属边界线（§02）：线下各柱内容开始不同 ── */
  var bY = {tp:(GY.lay+GY.op+BH)/2, ep:(GY.lay+GY.op+BH)/2, pp:(GY.net+GY.lay+BH)/2, cp:(GY.inp+GY.net+BH)/2, dp:(GY.inp+GY.net+BH)/2}[dim];
  var bEnd = (dim==='tp'||dim==='ep') ? Math.max(span, 11)+1.0 : span+1.2;
  var b1 = proj(-1.4, bY, DZ, s), b2 = proj(bEnd, bY, 0, s);
  parts.push('<line x1="'+b1[0]+'" y1="'+b1[1]+'" x2="'+b2[0]+'" y2="'+b2[1]+'" style="stroke:'+col+';stroke-width:2;stroke-dasharray:9 5"/>');
  parts.push(txt(b2[0]+8, b2[1]-16, '归属边界（§02）', 10, col, 'start', 'font-weight="800"'));
  parts.push(txt(b2[0]+8, b2[1]-4, (dim==='cp'||dim==='dp')?'边界在输入——模型侧'+(dim==='dp'?'整套复制':'完整共有'):'此线以下，各柱内容不同', 8.5, 'var(--pt-fg2)', 'start'));
  reg([b2[0]+8, b2[1]-16], 0, 175, 14, 8);

  /* ── 通信（L5）：画在它发生的那一粒度层的柱间 ── */
  if(layerOn('L5')){
    var prim = dim==='cp' ? (['p2p','alltoall','allgather'].indexOf(ui.commPrim)>=0 ? ui.commPrim : 'p2p')
             : {tp:'allreduce', pp:'p2p', dp:'allreduce', ep:'alltoall'}[dim];
    var cy = {tp:GY.op+1.7, ep:GY.op+1.7, pp:GY.lay+1.7, cp:GY.op+1.7, dp:GY.net+1.8}[dim];
    var pts = []; for(var a=0;a<N;a++) pts.push(anchor(a, cy));
    parts.push('<g opacity=".95">'+edgeSVG(pts, prim, col, {mid:dim, ring:dim==='cp'&&prim==='p2p'})+'</g>');
    pts.forEach(function(p2, ai){
      var top = anchor(ai, {tp:GY.op+BH, ep:GY.op+BH, pp:GY.lay+BH, cp:GY.op+BH, dp:GY.net+BH}[dim]);
      parts.push('<line x1="'+p2[0]+'" y1="'+p2[1]+'" x2="'+top[0]+'" y2="'+top[1]+'" style="stroke:'+col+';stroke-width:1;stroke-dasharray:3 3;opacity:.6"/>');
    });
    var cl = proj(span+.35, cy-.85, 0, s);   /* 弧线下方，避开归属边界标签的水平带 */
    /* 真实载荷量级（示意公式，bf16）：让「每层两下」有一个可核对的数 */
    var actB = D.mbs*(D.seq/D.cp)*D.hidden*2;
    function mb(b){ return b>=Math.pow(2,30) ? fmtGB(b)+' GB' : Math.round(b/Math.pow(2,20))+' MB'; }
    var commTxt = {tp:'TP AllReduce · 每层两下 · 每次≈'+mb(actB)+'（B·S/CP·H·2B）',
                   pp:'PP P2P · 有方向 · 每 μbatch ≈'+mb(actB),
                   dp:'DP 梯度 AllReduce · 步末一次 · 每卡≈'+mb(2*paramsPerCard(D,0))+'（2P 字节）',
                   ep:'EP All-to-All · top-k='+(D.topk||'—')+' 路由 · 各边载荷不等',
                   cp:{p2p:'CP Ring（P2P 逐跳传 KV 块）', alltoall:'CP Ulysses（All-to-All 换轴）', allgather:'CP 朴素（AllGather 收全序列）'}[prim]}[dim];
    parts.push(txt(cl[0]+6, cl[1], commTxt, 9.5, col, 'start', 'font-weight="700"'));
    /* 作用域（§06 通则：通信算子插在归属边界处）——层内 / 跨层 / 跨 step 三档 */
    var SCOPE = {
      tp:'作用域：层内（算子内部）· 每层 2 次，不跨层',
      ep:'作用域：层内（层的内部·MoE 层）· 每 MoE 层 2 次 dispatch+combine，不跨层；路由逐层重算',
      cp:'作用域：层内（attention 内部）· 每层一轮，不跨层',
      pp:'作用域：跨层（层的边界）· stage 之间，每 μbatch 一次',
      dp:'作用域：跨 step（整网之外）· 步末一次，层内不发生'
    }[dim];
    parts.push(txt(cl[0]+6, cl[1]+12, SCOPE, 8, 'var(--pt-fg2)', 'start'));
    reg([cl[0]+6, cl[1]+12], 0, 320, 22, 8);
  }

  /* ── 左侧粒度标尺（「共有」只对本组视野为真）。
     竖轴是「粒度」坐标（§15）：整网⊃层⊃算子⊃kernel 是同一份内容的逐级放大，
     不是四样东西堆叠；输入是另一个对象（激活体），不在这条包含链上。 ── */
  var spanN = '组内共有', single = '各柱一份';
  var layShared = D.pp>1 ? '本组=stage0 段' : spanN;
  var ruler = {
    tp: [['输入',spanN],['整网',spanN],['层',layShared],['算子',spanN+'·片各归各柱'],['kernel','不跨柱']],
    pp: [['输入',spanN],['整网',spanN+'·逻辑上一张'],['层',single+'·有序'],['算子','随层归属'],['kernel','不跨柱']],
    cp: [['输入','s 轴切开'],['整网',spanN],['层',D.pp>1?'本组=stage0 段':spanN],['算子',spanN+'·权重完整'],['kernel','不跨柱']],
    dp: [['输入','b 轴切开'],['整网','同一片·相同'],['层','同一片·相同'],['算子','同一片·相同'],['kernel','不跨柱']],
    ep: [['输入',spanN],['整网',spanN],['层',layShared],['算子','桶各归各柱'],['kernel','不跨柱']]
  }[dim];
  [GY.inp, GY.net, GY.lay, GY.op, GY.ker].forEach(function(y, li){
    var lp = proj(-.9, y+BH+.15, DZ, s);
    var name = li===0 ? '输入 ②' : ruler[li][0];
    parts.push(txt(lp[0]-6, lp[1], name, 11, 'var(--pt-fg)', 'end', 'font-weight="700"'));
    parts.push(txt(lp[0]-6, lp[1]+12, li===0 ? '激活体②的入口·'+ruler[0][1] : ruler[li][1], 8, 'var(--pt-fg3)', 'end'));
    /* 输入只是入口：激活体是它流过整网后逐层堆积的中间结果，不是同一样东西 */
    if(li===0) parts.push(txt(lp[0]-6, lp[1]+23, '≠ 激活体本身（中间结果 ×几千倍）', 7.4, 'var(--pt-fg3)', 'end'));
    reg([lp[0]-6, lp[1]+23], 150, 0, 12, 5);
  });
  /* 包含/放大关系：模型四级之间画 ⊃ 连线（同一内容，放大一级）；输入与整网之间画「断」 */
  [[GY.net, GY.lay], [GY.lay, GY.op], [GY.op, GY.ker]].forEach(function(pair){
    var a = proj(-.55, pair[0]-.06, DZ, s), b = proj(-.55, pair[1]+BH+.12, DZ, s);
    parts.push('<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:2 3"/>');
    var m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    parts.push(txt(m[0]-6, m[1]+3, '⊃ 放大', 8, 'var(--pt-fg3)', 'end'));
    reg([m[0]-6, m[1]], 60, 0, 8, 8);
  });
  var gapA = proj(-.55, GY.inp-.15, DZ, s), gapB = proj(-.55, GY.net+BH+.15, DZ, s);
  parts.push(txt((gapA[0]+gapB[0])/2-6, (gapA[1]+gapB[1])/2+3, '⊥ 不在链上', 8, 'var(--pt-fg3)', 'end'));
  reg([(gapA[0]+gapB[0])/2-6, (gapA[1]+gapB[1])/2], 70, 0, 8, 8);
  var axTop = proj(-2.35, GY.net+BH+.3, DZ, s), axBot = proj(-2.35, GY.ker-.1, DZ, s);
  parts.push('<line x1="'+axTop[0]+'" y1="'+axTop[1]+'" x2="'+axBot[0]+'" y2="'+axBot[1]+'" style="stroke:var(--pt-fg3);stroke-width:1.2;marker-end:url(#arrx)"/>');
  parts.push(txt(axBot[0], axBot[1]+14, '粒度（坐标轴 §15）', 8.6, 'var(--pt-fg2)', 'middle', 'font-weight="700"'));
  reg([axTop[0], axTop[1]], 70, 40, 8, 0); reg([axBot[0], axBot[1]+14], 70, 70, 0, 10);
  /* 输入带的对象隔离框：虚线围出「另一个对象」 */
  parts.push(boxSVG(-.18, GY.inp-.2, -.15, span+.36, BH+.46, DZ+.3, s, {wire:true, stroke:'var(--pt-fg3)', sw:.8, dash:'5 4'}));
  regBox(-.18, GY.inp-.2, -.15, span+.36, BH+.46, DZ+.3);

  var pad = 24, padTop = 76;   /* 顶部多留：舞台工具条（HTML 浮层）盖在画布上 */
  var vb = [Math.min.apply(0,bx)-pad, Math.min.apply(0,by)-padTop,
            (Math.max.apply(0,bx)-Math.min.apply(0,bx))+2*pad, (Math.max.apply(0,by)-Math.min.apply(0,by))+pad+padTop];
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + parts.slice(0, interactiveEnd).join('')
    + '<g pointer-events="none">'+parts.slice(interactiveEnd).join('')+'</g></svg>';

  renderDimBar(D, dim);
  /* 索引五元组条（§03）：本维认领哪根轴；rank元组 ⇄ 区间双链可逆（§07） */
  var AXQ = {tp:'h', pp:'ℓ', cp:'s', dp:'b', ep:'e'};
  var ivl = {tp:'tp_rank t ⇢ h∈[t·'+fmt(Math.floor(D.hidden/size))+', (t+1)·'+fmt(Math.floor(D.hidden/size))+')',
             pp:'pp_rank p ⇢ ℓ∈[p·'+D.layersPerStage+', (p+1)·'+D.layersPerStage+')',
             cp:'cp_rank c ⇢ s = 段c ∪ 段'+(2*size-1)+'−c（各 '+fmt(D.seq/(2*size))+' token）',
             dp:'dp_rank d ⇢ b = 第 d 份 '+(D.mbs*D.ga)+' 样本',
             ep:'ep_rank e ⇢ e∈[e·'+kE+', (e+1)·'+kE+')'}[dim];
  var slots = [['ℓ','层号','pp'],['h','隐藏/头','tp'],['e','专家号','ep'],['b','样本号','dp'],['s','序列位','cp']];
  $('stageNote').hidden = false;
  $('stageNote').innerHTML = '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">'
    + '<span class="pt-cap">索引五元组 §03</span>'
    + slots.map(function(sl){
        var hot = AXQ[dim]===sl[0];
        return '<span class="pt-chip" style="'+(hot?'background:'+VC[sl[2]]+';border-color:'+VC[sl[2]]+';color:var(--pt-bg);font-weight:800':'')+'">'+sl[0]+'·'+sl[1]+'→'+DIMN[sl[2]]+'</span>';
      }).join('')+'</div>'
    + '<div class="mono" style="font-size:10.5px;margin-top:5px;color:var(--pt-fg2)">本维认领 <b style="color:'+col+'">'+AXQ[dim]+'</b> 轴：'+ivl+'（rank元组 ⇄ 区间，双链可逆 §07）</div>'
    + '<div style="font-size:10.5px;margin-top:3px;color:var(--pt-fg3)">切分的最小单位是<b>片 / 段 / 桶（'+AXQ[dim]+' 轴区间）</b>，不是卡——卡只是各维区间交集的落位容器（§15）。</div>';
  $('detach').hidden = true;
}
/* ═════════ 刀序·切分链：用「先后/上下」把五把刀组织起来 ═════════
   两种顺序，方向相反，都真实存在（§11 / §02）：
   · 嵌套序（本图自上而下）：每一刀切在上一刀的产物里——DP 复制整网(最外) →
     PP 切层段 → TP 锯进算子内部 / EP 重组专家(最深)；输入侧 全局批 →DP→ 样本份 →CP→ 双段
   · 决策序（§11，自下而上）：①TP ②PP ③CP ④EP ⑤DP(残差)
   反向不是巧合：刀越深 → 通信越密 → 越要先定、越要贴机内。 */
function renderChain(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;

function renderDimBar(D, dim){
  var size = {tp:D.tp, pp:D.pp, cp:D.cp, dp:D.dp, ep:D.ep}[dim] || 1, col2 = VC[dim];
  /* 每个维的「动词」——切的动作本质不同，先用一句话钉住，再由几何呈现 */
  var VERB = {tp:'锯开算子（同一算子 → N 片）', pp:'层的接力（一段传一段，有序）', cp:'切输入序列（首尾对称双段）', dp:'整套复印（模型不动，切样本）', ep:'专家分桶 + 按 token 路由'};
  /* 按嵌套序组织（与刀序·切分链同一根轴）：模型侧 刀1 DP → 刀2 PP → 刀3 TP → 刀4 EP；输入侧 CP。
     角标 = 决策顺位（§11），与嵌套序反向。 */
  var NEST_M = [['dp','⑤'],['pp','②'],['tp','①'],['ep','④']], NEST_I = [['cp','③']];
  function pill(dm, ord, k){
    return '<button class="pb mono'+(dim===dm?' is-on':'')+'" data-act="cutdim" data-d="'+dm+'" style="--c:'+VC[dm]+'" title="嵌套第'+k+'刀 · 决策顺位'+ord+'">'
      + '刀'+k+'·'+DIMN[dm]+'<span class="cmn">'+ord+'</span></button>';
  }
  var sb = '<span class="pt-cap">按嵌套序看刀（角标=决策顺位）</span>'
    + NEST_M.map(function(nm,i){ return pill(nm[0], nm[1], i+1); }).join('')
    + '<span class="pt-sep"></span><span class="pt-cap">输入侧</span>' + pill('cp','③','—')
    + '<span class="pt-chip" style="border-color:'+col2+';color:'+col2+';font-weight:800">'+DIMN[dim]+' = '+VERB[dim]+'</span>';
  /* 刀序带：前面的刀已切（把视野缩到本组），本刀在切，后面的刀待切——
     取代旧「折叠上下文」：固定坐标不是任意折叠，是前序刀的选择 */
  var CUTS = {dp:D.dp, pp:D.pp, tp:D.tp, ep:(D.moe?D.ep:1), cp:D.cp};
  var PICK = {dp:'副本0', pp:'stage0', tp:'片0', ep:'桶0', cp:'段0∪'+(2*D.cp-1)};
  var seq = dim==='cp' ? ['dp','cp'] : ['dp','pp','tp','ep'];
  var cur = seq.indexOf(dim);
  var strip = seq.map(function(dm, i){
    var n2 = CUTS[dm], st;
    if(n2<=1) st = '<s style="opacity:.6">未开</s>';
    else if(i<cur) st = '已切→'+PICK[dm];
    else if(i===cur) st = '<b>本刀 ×'+n2+'</b>';
    else st = '待切 ×'+n2;
    var hot = i===cur;
    return '<span class="pt-chip" style="'+(hot?'border-color:'+VC[dm]+';color:'+VC[dm]+';font-weight:800':'')+'">'+DIMN[dm]+' '+st+'</span>';
  }).join('<span style="color:var(--pt-fg3);font-size:10px">▸</span>');
  sb += '<span class="pt-sep"></span><span class="pt-cap">'+(dim==='cp'?'输入链':'模型链')+'</span>' + strip
     + (size>1 ? '<span class="pt-chip">本刀组：全网 '+fmt(D.world)+' 卡 = '+fmt(Math.round(D.world/size))+' 组 × '+size+'</span>' : '');
  if(dim==='cp' && D.cp>1){
    sb += '<span class="pt-sep"></span><span class="pt-cap">原语（N:M 可换，A1）</span>'
      + [['p2p','Ring'],['alltoall','Ulysses'],['allgather','朴素']].map(function(pr){
          var on = (ui.commPrim===pr[0]) || (['p2p','alltoall','allgather'].indexOf(ui.commPrim)<0 && pr[0]==='p2p');
          return '<button class="pb mono'+(on?' is-on':'')+'" data-act="commprim" data-p="'+pr[0]+'" style="--c:'+VC.cp+'">'+pr[1]+'</button>';
        }).join('');
  }
  sb += '<span class="pt-chip">柱=卡（容器）· 块的横跨=共有 · 门牌=rank（1:N，同一张卡在别的维还有别的号 §10）</span>';
  $('stagebar').innerHTML = sb;
}

/* ═════════ V1 卡阵 ═════════ */
var GEO = {w:.78, d:.78, h:.16};
function v1Layout(D){
  var dpShown;
  if(ui.unfold){ dpShown = D.dp; }
  else{
    dpShown = Math.min(D.dp, Math.floor(88/D.pp - D.tp - 1.1));
    dpShown = Math.max(Math.min(D.dp,2), Math.min(dpShown, Math.max(1, Math.floor(1600/(D.tp*D.pp)))));
    if(!isFinite(dpShown) || dpShown<1) dpShown = 1;
  }
  var ypitch = (D.tp+dpShown)*S + 0.55 + GEO.h;
  return {dpShown:dpShown, folded:dpShown<D.dp, ypitch:ypitch, scale:30};
}
function yawXZ(x,z,X,Z){
  switch(ui.yaw & 3){
    case 1: return [z, X-x];
    case 2: return [X-x, Z-z];
    case 3: return [Z-z, x];
    default: return [x, z];
  }
}
function cardAnchor(t,d,p,D,LY){
  var xz = yawXZ(t+.5, d+.5, D.tp, LY.dpShown);
  return proj(xz[0], p*LY.ypitch+GEO.h, xz[1], LY.scale);
}
function renderV1(D){
  var LY = v1Layout(D), TPn=D.tp, DPn=LY.dpShown, PPn=D.pp, s=LY.scale, ypitch=LY.ypitch;
  var facet = clamp(ui.cpFacet, 0, D.cp-1); ui.cpFacet = facet;
  var Xe = (ui.yaw%2)?DPn:TPn, Ze=(ui.yaw%2)?TPn:DPn;
  var yMax = (PPn-1)*ypitch + GEO.h + .55, pad=26;
  var vb = [(-Ze*C-1)*s-pad-56, -yMax*s-pad-16, ((Xe+Ze)*C+3.1)*s+2*pad+56, (yMax+(Xe+Ze)*S)*s+2*pad+20];

  var showLabel = layerOn('L4') && TPn*DPn*PPn <= 480;
  var L3 = layerOn('L3'), L2 = layerOn('L2'), commActive = layerOn('L5');
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, facet, 0, 0, D);
  var axisSet = {};
  if(layerOn('L4') && ui.axis) groupMembers(ui.axis, refG, D).forEach(function(r){ axisSet[r]=1; });
  var maxB = 1, pi;
  if(L2) for(pi=0;pi<PPn;pi++) maxB = Math.max(maxB, 2*paramsPerCard(D,pi));

  var boxes=[],p,d,t;
  for(p=0;p<PPn;p++) for(d=0;d<DPn;d++) for(t=0;t<TPn;t++){
    var xz = yawXZ(t+(1-GEO.w)/2, d+(1-GEO.d)/2, TPn, DPn);
    boxes.push({t:t,d:d,p:p,g:rankOf(t,facet,d,p,D), x:xz[0], z:xz[1]});
  }
  boxes.sort(function(a,b){ return (a.x+a.z+a.p*999)-(b.x+b.z+b.p*999); });

  var cells='';
  boxes.forEach(function(b){
    var y0 = b.p*ypitch, isSel = sel===b.g, inAxis = axisSet[b.g];
    var st = 'var(--pt-bds)', sw = .9, topFill = '';
    if(inAxis){ st = VC[ui.axis]; topFill = mix(VC[ui.axis], 16); }
    if(isSel){ st = 'var(--pt-fg)'; sw = 2; }
    var inner = '';
    if(L2){
      var share = (2*paramsPerCard(D,b.p))/maxB;
      var ih = GEO.h*.9*share, iw = GEO.w*.58, idp = GEO.d*.58;
      inner = boxSVG(b.x+(GEO.w-iw)/2, y0+GEO.h, b.z+(GEO.d-idp)/2, iw, ih, idp, s, {fill:'var(--pt-fg2)', stroke:'transparent', attrs:' pointer-events="none"'});
    }
    var lbl = showLabel ? txt.apply(null, (function(){ var c2 = proj(b.x+GEO.w/2, y0+GEO.h, b.z+GEO.d/2, s); return [c2[0], c2[1]+3.2, b.g, clamp(s*.34,7.5,11), inAxis||isSel?'var(--pt-fg)':'var(--pt-fg2)', 'middle', 'pointer-events="none" font-weight="600"']; })()) : '';
    cells += '<g class="cardg" data-g="'+b.g+'" style="cursor:pointer'+(L3?'':';opacity:.16')+'">'
      + boxSVG(b.x, y0, b.z, GEO.w, GEO.h, GEO.d, s, {stroke:st, sw:sw, topFill:topFill, inner:inner})
      + lbl + '</g>';
  });
  /* stage 标注（L4：文字门牌） */
  if(layerOn('L4')){
    for(var ps=0;ps<PPn;ps++){
      var lp = proj(Xe, ps*ypitch+GEO.h, 0, s);
      cells += txt(lp[0]+10, lp[1]+4, 'stage '+ps, 10.5, VC.pp, 'start', 'font-weight="700"')
             + txt(lp[0]+10, lp[1]+16, 'L'+(ps*D.layersPerStage)+'–L'+((ps+1)*D.layersPerStage-1), 9, 'var(--pt-fg3)', 'start');
    }
  }
  /* 轴箭头 */
  var uT = yawXZ(1,0,TPn,DPn), o = yawXZ(0,0,TPn,DPn), uD = yawXZ(0,1,TPn,DPn), ax='';
  function arrow(dim, a, b, label, dy){
    var A = proj(a[0],a[1],a[2],s), B2 = proj(b[0],b[1],b[2],s);
    return '<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B2[0]+'" y2="'+B2[1]+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>'
      + txt(B2[0], B2[1]+dy, label, 11, VC[dim], 'middle', 'font-weight="700"');
  }
  ax += arrow('tp', [o[0],-.55,o[1]], [o[0]+(uT[0]-o[0])*Math.min(TPn,3), -.55, o[1]+(uT[1]-o[1])*Math.min(TPn,3)], 'TP', 14);
  ax += arrow('dp', [o[0],-.55,o[1]], [o[0]+(uD[0]-o[0])*Math.min(DPn,3), -.55, o[1]+(uD[1]-o[1])*Math.min(DPn,3)], 'DP', 14);
  var ppx = (-Ze*C-.6)*s;
  ax += '<line x1="'+ppx+'" y1="0" x2="'+ppx+'" y2="'+(-((PPn-1)*ypitch+.6)*s)+'" style="stroke:'+VC.pp+';stroke-width:1.6;marker-end:url(#arrpp)"/>'
      + txt(ppx, -((PPn-1)*ypitch+.9)*s, 'PP↑', 11, VC.pp, 'middle', 'font-weight="700"');

  /* L5 通信 */
  var comm='';
  if(commActive && ui.commDim!=='cp'){
    var mem = groupMembers(ui.commDim, refG, D).filter(function(r){
      var c2 = coordsOf(r,D); return c2.c===facet && c2.d<DPn;
    });
    var pts = mem.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t,c2.d,c2.p,D,LY); });
    comm = '<g opacity=".95">'+edgeSVG(pts, ui.commPrim, VC[ui.commDim], {mid:ui.commDim})+'</g>';
  }
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'
    + defsSVG() + '<g>'+cells+'</g><g id="commLayer">'+comm+'</g><g id="animLayer"></g><g pointer-events="none">'+ax+'</g></svg>';

  /* 舞台工具条 */
  var sb = '';
  sb += '<span class="pt-cap">CP 分面</span>';
  if(D.cp===1) sb += '<span class="pt-chip">CP=1 无分面</span>';
  else for(var ci=0; ci<D.cp; ci++) sb += '<button class="pb mono" data-act="facet" data-i="'+ci+'" style="--c:'+VC.cp+'"'+(facet===ci?' aria-pressed="true" ':'')+(facet===ci?' class="pb mono is-on"':'')+'>'+(facet===ci?'cp'+ci:'cp'+ci)+'</button>';
  sb += '<span class="pt-sep"></span><button class="pb" data-act="yaw" data-d="-1">⟲</button><button class="pb" data-act="yaw" data-d="1">⟳</button>'
      + (ui.yaw!==0?'<button class="pb" data-act="yawreset">复位等轴测</button>':'')
      + '<span class="pt-sep"></span><button class="pb'+(anim.on?' is-on':'')+'" data-act="anim">'+(anim.on?'■ 停止':'▶ 播放一个训练步')+'</button>';
  $('stagebar').innerHTML = sb;
  fixFacetButtons(facet);

  /* 折叠提示 */
  var LYf = LY.folded;
  if(LYf || (ui.unfold && D.dp*D.tp*D.pp>1600)){
    $('stageNote').hidden = false;
    $('stageNote').innerHTML = LYf
      ? 'DP='+D.dp+' 为对称维，只画前 '+DPn+' 个副本——看一个组等于看全部（DP-3/DP-5）。<button class="pb" data-act="unfold">全部画出</button>'
      : fmt(D.tp*DPn*D.pp)+' 张卡全量渲染中。<button class="pb" data-act="refold">恢复折叠</button>';
  }else{ $('stageNote').hidden = true; }

  /* 抽离图（R2；CP 组唯一入口） */
  if(commActive && (ui.detach || ui.commDim==='cp')){
    $('detach').hidden = false;
    $('detach').innerHTML = detachHTML(D, refG);
  }else{ $('detach').hidden = true; }
}
function fixFacetButtons(facet){ /* 简化 is-on 写法（字符串拼接里难做干净） */
  var btns = document.querySelectorAll('[data-act="facet"]');
  btns.forEach(function(b){ b.classList.toggle('is-on', +b.getAttribute('data-i')===facet); });
}
function detachHTML(D, refG){
  var dim = ui.commDim, col = VC[dim], mem = groupMembers(dim, refG, D);
  var n = mem.length;
  if(n===1) return '<b style="font-size:12px">抽离 · '+DIMN[dim]+' 组</b><div style="font-size:11.5px;color:var(--pt-fg2);margin-top:4px">'+DIMN[dim]+'=1：组内只有一张卡（rank '+mem[0]+'），无通信发生。</div>';

      + txt(p2[0], p2[1]+4, mem[i3], 10, 'var(--pt-fg)', 'middle', 'font-weight="700"')
      + txt(p2[0], p2[1]+23, dim+'_rank '+i3, 8.5, col);

    + '<svg viewBox="0 0 '+w+' '+h+'">'+defsSVG()+edges+nodes+'</svg>';
