/* ═════════ FR-10 动画 ═════════ */
function buildPhases(D){
  var ph=[], MB=Math.min(D.ga,2), m, s2, s3;
  for(m=1;m<=MB;m++) for(s2=0;s2<D.pp;s2++){
    ph.push({k:'tp',s:s2,m:m,dir:'前向'});
    if(D.moe) ph.push({k:'a2a',s:s2,m:m,dir:'前向'});
    if(s2<D.pp-1) ph.push({k:'p2p',s:s2,to:s2+1,m:m,dir:'前向'});
  }
  for(m=1;m<=MB;m++) for(s3=D.pp-1;s3>=0;s3--){
    ph.push({k:'tp',s:s3,m:m,dir:'反向'});
    if(s3>0) ph.push({k:'p2p',s:s3,to:s3-1,m:m,dir:'反向'});
  }
  ph.push({k:'dp'});
  return ph;
}
function animTick(D){
  var lay = document.getElementById('animLayer');
  if(!lay){ stopAnim(); return; }
  if(anim.i >= anim.phases.length){ stopAnim(); render(); return; }
  var p = anim.phases[anim.i++], LY = v1Layout(D);
  var refG = (sel!==null && sel<D.world) ? sel : rankOf(0, ui.cpFacet, 0, 0, D);
  var co = coordsOf(refG, D); if(co.d >= LY.dpShown) co.d = 0;
  var html='', capEl = $('animCap');
  function anchors(list){ return list.map(function(r){ var c2=coordsOf(r,D); return cardAnchor(c2.t, Math.min(c2.d,LY.dpShown-1), c2.p, D, LY); }); }
  if(p.k==='tp'){
    var mem=[]; for(var t=0;t<D.tp;t++) mem.push(rankOf(t, ui.cpFacet, co.d, p.s, D));
    html = '<g class="pulse2">'+edgeSVG(anchors(mem),'allreduce',VC.tp,{mid:'tp'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · stage '+p.s+' · <b>TP AllReduce</b>（每层两下，按 stage 折叠示意）';
  }else if(p.k==='p2p'){
    var a = cardAnchor(co.t,co.d,p.s,D,LY), b = cardAnchor(co.t,co.d,p.to,D,LY);
    html = '<g class="pulse1"><line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" style="stroke:'+VC.pp+';stroke-width:3;marker-end:url(#arrpp)"/></g>';
    capEl.innerHTML = 'μb'+p.m+' · '+p.dir+' · <b>PP P2P</b> stage '+p.s+'→'+p.to;
  }else if(p.k==='a2a'){
    var memE = D.moe ? epMembers(rankOf(co.t,ui.cpFacet,co.d,p.s,D),D).filter(function(r){ var c3=coordsOf(r,D); return c3.c===ui.cpFacet && c3.d<LY.dpShown; }) : [];
    html = '<g class="pulse1">'+edgeSVG(anchors(memE),'alltoall',VC.ep,{mid:'ep'})+'</g>';
    capEl.innerHTML = 'μb'+p.m+' · stage '+p.s+' · <b>MoE All-to-All</b> 成片爆发';
  }else if(p.k==='dp'){
    var memD=[]; for(var d2=0; d2<Math.min(D.dp,LY.dpShown); d2++) memD.push(rankOf(co.t,ui.cpFacet,d2,co.p,D));
    html = '<g class="pulse2">'+edgeSVG(anchors(memD),'allreduce',VC.dp,{mid:'dp'})+'</g>';
    capEl.innerHTML = '<b>DP 梯度 AllReduce</b>——整步静默，末尾闪一次';
  }
  lay.innerHTML = html;
}
function startAnim(D){
  anim.on = true; anim.phases = buildPhases(D); anim.i = 0;
  $('animCap').style.display = 'block';
  anim.timer = setInterval(function(){ animTick(derive(cfg)); }, 620);
}
function stopAnim(){
  anim.on = false;
  if(anim.timer){ clearInterval(anim.timer); anim.timer = null; }
  var c = $('animCap'); if(c) c.style.display = 'none';
  var l = document.getElementById('animLayer'); if(l) l.innerHTML = '';
}

/* ═════════ V2 时间·流（FR-7/8）：流=容器，容量是时间 ═════════ */
function renderV2(D){
  var sch = schedule(D), T = sch.T, PP = D.pp;
  var W=920, LBL=128, rowH=40, px=(W-LBL-20)/T, H=PP*rowH+56;
  var selCo = (sel!==null && sel<D.world) ? coordsOf(sel,D) : null;
  var rows='', blocks='', ticks='';
  for(var s2=0;s2<PP;s2++){
    var y = 22+s2*rowH, hot = selCo && selCo.p===s2;
    if(layerOn('L3')) rows += '<rect x="'+LBL+'" y="'+(y-2)+'" width="'+(W-LBL-16)+'" height="'+(rowH-10)+'" class="lane" style="'+(hot?'stroke:var(--pt-dp);stroke-width:1.4;fill:'+mix(VC.dp,7):'')+'"/>';
    if(layerOn('L4')) rows += txt(LBL-8, y+rowH/2-4, 'stage '+s2+(hot?' ◀ r'+sel:''), 10.5, hot?VC.dp:'var(--pt-fg3)', 'end', hot?'font-weight="700"':'');
  }
  sch.blocks.forEach(function(b){
    var y=22+b.s*rowH, x=LBL+b.t0*px, w2=(b.t1-b.t0)*px-1.2;
    if(b.type==='AR'){
      blocks += '<g data-act="zoomar" style="cursor:pointer"><rect x="'+x+'" y="'+(y+1)+'" width="'+w2+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.dp,26)+';stroke:'+VC.dp+';stroke-width:1.1"/>'
        + (w2>36?txt(x+w2/2, y+rowH/2-4, 'AllReduce', 8.5, VC.dp):'')+'</g>';
    }else{
      var fw = b.type==='F';
      blocks += '<rect x="'+x+'" y="'+(y+1)+'" width="'+Math.max(1,w2)+'" height="'+(rowH-16)+'" style="fill:'+mix(VC.pp, fw?22:46)+';stroke:'+VC.pp+';stroke-width:.7"/>'
        + (w2>15?txt(x+w2/2, y+rowH/2-4, (fw?'F':'B')+b.m, 8.2, 'var(--pt-fg2)'):'');
      if(layerOn('L5') && b.recv) ticks += '<path d="M'+x+' '+(y-3)+' l4 -5 l-8 0 z" style="fill:'+VC.pp+'"/>';
    }
  });
  var axis = '<line x1="'+LBL+'" y1="'+(22+PP*rowH+2)+'" x2="'+(W-14)+'" y2="'+(22+PP*rowH+2)+'" style="stroke:var(--pt-fg);stroke-width:1"/>'
    + txt(W-14, 22+PP*rowH+15, '时间 →  F=1 B=2 · 1F1B 合成'+(sch.truncated?' · 只画前 '+sch.GA+' 个 μbatch':''), 9, 'var(--pt-fg3)', 'end');
  var zoom = ui.zoomAR ? arZoomSVG(D) : '';
  $('stage').innerHTML = '<svg viewBox="0 0 '+W+' '+(H+(ui.zoomAR?236:0))+'" preserveAspectRatio="xMidYMid meet">'
    + rows+blocks+ticks+axis + (zoom?'<g transform="translate(0 '+(H+8)+')">'+zoom+'</g>':'') + '</svg>';
  $('stagebar').innerHTML =
    '<button class="pb'+(ui.skew?' is-on':'')+'" data-act="skew">注入偏斜（某副本慢）</button>'
    + '<button class="pb'+(ui.zoomAR?' is-on':'')+'" data-act="zoomar">放大末尾 AllReduce</button>'
    + '<span class="pt-chip">流 = 时间容器：装 kernel，装满不会崩，只是变慢（§08）</span>';
  $('stageNote').hidden = true; $('detach').hidden = true;
}
function arZoomSVG(D){
  var n = Math.min(D.dp,6), base=1.0, xfer=0.9, culprit = ui.skew ? Math.min(2,n-1) : -1;
  var entries=[], i;
  for(i=0;i<n;i++) entries.push(base + ((i*37)%7)/40 + (i===culprit?.85:0));
  var exit = Math.max.apply(0,entries)+xfer;
  var W=920, LBL=128, rowH=27, px=(W-LBL-30)/(exit+.4);
  var spans = entries.map(function(e){ return exit-e; });
  var shortest = spans.indexOf(Math.min.apply(0,spans));
  var out = txt(LBL, 12, '放大：stage '+((sel!==null&&sel<D.world)?coordsOf(sel,D).p:0)+' 的 DP 组梯度 AllReduce ——虚线=进入 · 实线=共同退出 · 条长=在集合里耗的时间'+(D.dp>n?' · 前 '+n+' 个副本':''), 9.5, 'var(--pt-fg2)', 'start');
  for(var r=0;r<n;r++){
    var y=22+r*rowH, x0=LBL+entries[r]*px, x1=LBL+exit*px, isCul = r===shortest && ui.skew;
    out += txt(LBL-8, y+13, 'dp_rank '+r, 10, 'var(--pt-fg2)', 'end')
      + '<line x1="'+LBL+'" y1="'+(y+9)+'" x2="'+(W-20)+'" y2="'+(y+9)+'" style="stroke:var(--pt-bd)"/>'
      + '<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="18" style="fill:'+(isCul?mix('var(--pt-danger)',14):mix(VC.dp,22))+';stroke:'+(isCul?'var(--pt-danger)':VC.dp)+';stroke-width:'+(isCul?1.6:1)+'"/>'
      + '<line x1="'+x0+'" y1="'+(y-3)+'" x2="'+x0+'" y2="'+(y+21)+'" style="stroke:var(--pt-fg);stroke-width:1.3;stroke-dasharray:2 2"/>'
      + (isCul?txt(x0+4, y+13, '最后进入 · 段最短 = 嫌疑人', 9, 'var(--pt-danger)', 'start', 'font-weight="700"'):'');
  }
  out += '<line x1="'+(LBL+exit*px)+'" y1="14" x2="'+(LBL+exit*px)+'" y2="'+(22+n*rowH)+'" style="stroke:var(--pt-fg);stroke-width:1.1"/>'
      + txt(LBL+exit*px, 10, '共同退出', 8.5, 'var(--pt-fg)');
  return out;
}

/* ═════════ V3 卡内解剖：容器打开 —— 层 → 算子 → kernel → 流 ═════════ */
function renderV3(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g,D), Lps = D.layersPerStage, l0 = co.p*Lps;
  var ops = opBytes(D);
  var s = 46;
  var maxOpB = Math.max.apply(0, ops.map(function(o){return Math.max(o.b,1);}));
  var CW = 4.6, CH = 2.6, CD = Math.max(2.2, Math.min(6, Lps*.42));
  var picked = clamp(ui.selLayerOff, 0, Lps-1);
  var CIRC = '①②③④⑤⑥⑦⑧⑨⑩';   /* 算子编号：算子↔kernel 用同号对应（N:M） */
  var opIdx = {}, opFront = {};
  var parts = [];
  /* 包围盒：边生成边登记（文字给出估算宽度），最后据此定 viewBox */
  var bx=[], by=[];
  function reg(p, wL, wR, hU, hD){ bx.push(p[0]-(wL||0), p[0]+(wR||0)); by.push(p[1]-(hU||0), p[1]+(hD||0)); }
  function regBox(x,y,z,w,h,d){
    [[x,y,z],[x+w,y,z],[x,y,z+d],[x+w,y,z+d],[x,y+h,z],[x+w,y+h,z],[x,y+h,z+d],[x+w,y+h,z+d]]
      .forEach(function(c){ reg(proj(c[0],c[1],c[2],s)); });
  }

  /* ① 卡容器（线框=容量边界）+ 门牌（地址=文字，§15） */
  parts.push(boxSVG(0, 0, 0, CW, CH, CD, s, {wire:true, stroke:'var(--pt-fg)', sw:1.4}));
  regBox(0,0,0,CW,CH,CD);
  var door = proj(0, CH, CD, s);   /* 容器左上角外侧 */
  parts.push(txt(door[0]-6, door[1]-26, '卡 = 容器（容量 = 显存 '+D.hbm+'GB）', 11, 'var(--pt-fg)', 'start', 'font-weight="700"'));
  parts.push(txt(door[0]-6, door[1]-12, '门牌: global_rank '+g+' · tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(D.moe?(function(){var me=epOf(co.t,co.c,co.d,D);return ' ep'+me.ep;})():'')+'（地址只标不画）', 9.5, 'var(--pt-fg2)', 'start'));
  reg([door[0]-6, door[1]-26], 0, 320, 14, 0);

  /* ② 层 slabs（这段的 Lps 层；点选） */
  for(var li=0; li<Lps; li++){
    var lz = .25 + li*(CD-.5)/Lps, lh = .42, isPick = li===picked;
    parts.push('<g class="l3pick" data-li="'+li+'" style="cursor:pointer">'
      + boxSVG(.3, .2, lz, CW-.6, lh, Math.max(.16,(CD-.7)/Lps*.72), s,
        {stroke: isPick?VC.pp:'var(--pt-bds)', sw:isPick?1.8:.8, topFill:isPick?mix(VC.pp,26):''})
      + '</g>');
    /* 端点 + 选中层标全局层号：只标选中那层会让人以为 L 是卡内序号，逐层都标又会糊成一团 */
    var lc = proj(CW-.3, .2+lh, lz, s);
    if(isPick){
      parts.push(txt(lc[0]+8, lc[1]-2, 'L'+(l0+li), 10, VC.pp, 'start', 'font-weight="800"'));
      reg([lc[0]+8, lc[1]-2], 0, 34, 8, 4);
    }else if(li===0 || li===Lps-1){
      parts.push(txt(lc[0]+7, lc[1]-1, 'L'+(l0+li), 7.2, 'var(--pt-fg3)', 'start'));
      reg([lc[0]+7, lc[1]-1], 0, 26, 6, 3);
    }
  }
  var capL = proj(CW, 0, CD, s);   /* 容器最低点下方，谁也不压 */
  parts.push(txt(capL[0], capL[1]+20, '层段 L'+l0+'–L'+(l0+Lps-1)+'（'+Lps+' 层 · 点任一层抽出）', 9.5, 'var(--pt-fg3)', 'middle'));
  parts.push(txt(capL[0], capL[1]+32, 'L = 整网的全局层号（ℓ 轴 · 整网共 '+D.layers+' 层 L0–L'+(D.layers-1)+'）——不是卡内序号；PP 刀把它切成 '+D.pp+' 段，这张卡只装 stage'+co.p+' 这一段', 8.2, 'var(--pt-fg2)', 'middle'));
  parts.push(txt(capL[0], capL[1]+44, '当前抽出：L'+(l0+picked)+' = 整网第 '+(l0+picked)+' 层 · 段内第 '+(picked+1)+'/'+Lps, 8.6, VC.pp, 'middle', 'font-weight="700"'));
  reg([capL[0], capL[1]+44], 300, 300, 0, 10);

  /* ③ 抽出的层 → 算子块（体积∝字节；切法着色） */
  var opW = 1.05, gap = .38, opsDrawn = ops.filter(function(o){ return o.b>0 || o.id==='attn.core'; });
  var bandW = opsDrawn.length*(opW+gap);
  var ox = CW + 2.4, oy = 0, hookPts = {};   /* 算子带放容器右前方，同一地面 */
  opsDrawn.forEach(function(o, oi){
    var hgt = o.b>0 ? .3 + 1.35*(o.b/maxOpB) : .26;
    var x0 = ox + oi*(opW+gap);
    var col = o.cut==='tp' ? VC.tp : o.cut==='ep' ? VC.ep : 'var(--pt-fg3)';
    if(o.b>0) parts.push(boxSVG(x0, oy, 0, opW, hgt, .9, s, {fill:mix(col,70), stroke:col, sw:1, attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    else parts.push(boxSVG(x0, oy, 0, opW, .26, .9, s, {wire:true, stroke:col, sw:1, dash:'3 3', attrs:' class="opblk" data-op="'+esc(o.id)+'"'}));
    regBox(x0, oy, 0, opW, Math.max(hgt,.9), .9);
    var tc = proj(x0+opW/2, oy, .9, s);   /* 标注放块的前下方，斜排避让 */
    var ty = tc[1] + 14 + (oi%2)*18;
    opIdx[o.id] = CIRC.charAt(oi); opFront[o.id] = tc;
    parts.push(txt(tc[0], ty, opIdx[o.id]+' '+o.id, 8.8, 'var(--pt-fg)', 'middle', 'font-weight="600"'));
    parts.push(txt(tc[0], ty+10, o.how, 7.6, col));
    reg([tc[0], ty+10], 40, 40, 0, 8);
    hookPts[o.id] = proj(x0+opW/2, oy+hgt, .45, s);
  });
  /* 层→算子 展开引线（结构：无厚度虚线） */
  var pickedZ = .25 + picked*(CD-.5)/Lps;
  var pa = proj(CW-.3, .2+.21, pickedZ, s), pb = proj(ox-.15, .5, .45, s);
  parts.push('<path d="M'+pa[0]+' '+pa[1]+' C '+(pa[0]+60)+' '+(pa[1]-30)+', '+(pb[0]-60)+' '+(pb[1]-30)+', '+pb[0]+' '+pb[1]+'" style="fill:none;stroke:'+VC.pp+';stroke-width:1.2;stroke-dasharray:5 4;marker-end:url(#arrpp)"/>');
  var bandTop = proj(ox+bandW/2, 2.2, 0, s);
  parts.push(txt(bandTop[0], bandTop[1], '抽出的 L'+(l0+picked)+' = 一排算子的「片」（结构无厚度 · 内容有体积 · 切法看颜色）', 9.5, 'var(--pt-fg2)', 'middle', 'font-weight="600"'));
  reg([bandTop[0], bandTop[1]], 230, 230, 10, 0);

  /* ④ 通信钩子（动作：发生在切口上） */
  if(layerOn('L5')){
    var hook = function(opId, dim, label, dx){
      if(!hookPts[opId]) return;
      var hp = hookPts[opId], gx = hp[0]+dx, gy = hp[1]-46;
      parts.push('<line x1="'+hp[0]+'" y1="'+(hp[1]-8)+'" x2="'+gx+'" y2="'+gy+'" style="stroke:'+VC[dim]+';stroke-width:1.6;marker-end:url(#arr'+dim+')"/>');
      parts.push(txt(gx+3, gy-4, label, 8.6, VC[dim], 'start', 'font-weight="700"'));
      reg([gx+3, gy-4], 0, 120, 12, 0);
    };
    hook('attn.out', 'tp', 'TP AllReduce ①', 14);
    hook(D.moe?'experts':'mlp.down', D.moe?'ep':'tp', D.moe?'EP All-to-All':'TP AllReduce ②', 20);
    if(D.moe) hook('router', 'ep', '路由', 6);
    var edge = proj(CW, CH*.86, 0, s);
    parts.push('<line x1="'+edge[0]+'" y1="'+edge[1]+'" x2="'+(edge[0]+58)+'" y2="'+(edge[1]-20)+'" style="stroke:'+VC.pp+';stroke-width:1.8;marker-end:url(#arrpp)"/>');
    parts.push(txt(edge[0]+62, edge[1]-24, 'PP P2P → '+(co.p+1<D.pp?'stage '+(co.p+1):'（末段→loss）'), 8.8, VC.pp, 'start', 'font-weight="700"'));
    reg([edge[0]+62, edge[1]-24], 0, 130, 12, 0);
    var edge2 = proj(0, .25, 0, s);   /* 左前棱下部，远离门牌 */
    parts.push('<line x1="'+edge2[0]+'" y1="'+edge2[1]+'" x2="'+(edge2[0]-58)+'" y2="'+(edge2[1]+14)+'" style="stroke:'+VC.dp+';stroke-width:1.5;stroke-dasharray:6 3;marker-end:url(#arrdp)"/>');
    parts.push(txt(edge2[0]-62, edge2[1]+18, 'DP AllReduce（整步静默，步末一次）', 8.6, VC.dp, 'end'));
    reg([edge2[0]-62, edge2[1]+18], 210, 0, 6, 10);
  }

  /* ⑤ 流 = 时间容器：kernel 排队（算子→kernel N:M）——压到算子带正下方更深处 */
  var fw = Math.max(bandW+.6, 5.4), fh = .6, fx = ox - .2, fy = -3.9;
  parts.push(boxSVG(fx, fy, 0, fw, fh, .8, s, {wire:true, stroke:'var(--pt-fg)', sw:1.1}));
  regBox(fx, fy, 0, fw, fh, .8);
  /* kernel 用 src 声明它由哪些算子来——标签打同号，并逐条画对应引线 */
  var kdefs = D.moe
    ? [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:.7, src:['router'], c:VC.ep},
       {w:.8, from:'组批 1/2', src:['experts'], c:VC.ep}, {w:.8, from:'组批 2/2', src:['experts'], c:VC.ep}]
    : [{w:1.5, from:'融合', src:['attn.q','attn.kv'], c:VC.tp}, {w:.9, src:['attn.core'], c:'var(--pt-fg3)'},
       {w:.8, src:['attn.out'], c:VC.tp}, {w:1.1, src:['mlp.gate/up'], c:VC.tp},
       {w:.45, from:'分段 1/2', src:['mlp.down'], c:VC.tp}, {w:.45, from:'分段 2/2', src:['mlp.down'], c:VC.tp}];
  var kx = fx+.15, kLines = [];
  kdefs.forEach(function(k, ki){
    parts.push(boxSVG(kx, fy+.07, .12, k.w, fh-.18, .5, s, {fill:mix(k.c,52), stroke:k.c, sw:.8}));
    var badges = k.src.map(function(id){ return opIdx[id]||'·'; }).join('+');
    var kc = proj(kx+k.w/2, fy, .8, s);              /* 前下棱：标签落在轨道外侧 */
    var kty = kc[1] + 24 + (ki%2)*13;
    parts.push(txt(kc[0], kty, badges+(k.from?' '+k.from:''), 7.6, k.c, 'middle', 'font-weight="700"'));
    reg([kc[0], kty], 38, 38, 0, 8);
    var kTop = proj(kx+k.w/2, fy+fh, .3, s);
    k.src.forEach(function(id){ if(opFront[id]) kLines.push([opFront[id], kTop, k.c]); });
    kx += k.w + .12;
  });
  kLines.forEach(function(L){                        /* 算子 → kernel：同号 + 引线双保险 */
    parts.push('<path d="M'+L[0][0]+' '+(L[0][1]+34)+' C '+L[0][0]+' '+(L[0][1]+90)+', '+L[1][0]+' '+(L[1][1]-60)+', '+L[1][0]+' '+L[1][1]+'" style="fill:none;stroke:'+L[2]+';stroke-width:.8;stroke-dasharray:3 4;opacity:.6"/>');
  });
  var fl = proj(fx, fy+fh/2, .4, s);   /* 轨道左端外侧的空白区（容器正下方） */
  parts.push(txt(fl[0]-16, fl[1]-4, '流 = 另一个容器（容量 = 时间）', 10, 'var(--pt-fg)', 'end', 'font-weight="700"'));
  parts.push(txt(fl[0]-16, fl[1]+9, 'kernel 在此排队；装满不会崩，只是变慢（§08）', 8.6, 'var(--pt-fg2)', 'end'));
  reg([fl[0]-16, fl[1]+9], 300, 0, 14, 8);
  /* 流的全部说明都收到左列：右端会被读出卡浮层压住 */
  var nDown = D.moe ? 'experts' : 'mlp.down';
  parts.push(txt(fl[0]-16, fl[1]+26, '算子→kernel = N:M（融合 / 分段）', 8.8, 'var(--pt-fg2)', 'end', 'font-weight="600"'));
  parts.push(txt(fl[0]-16, fl[1]+38, '同号对应：'+(opIdx['attn.q']||'①')+'+'+(opIdx['attn.kv']||'②')+' → 一个 kernel（融合 N:1）', 8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(fl[0]-16, fl[1]+50, (opIdx[nDown]||'⑥')+' → 两个 kernel（分段 1:N）· 标签在轨道下方，与块同号', 8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(fl[0]-16, fl[1]+62, 'kernel 永远单卡持有——逻辑与物理唯一的交点', 8, 'var(--pt-fg3)', 'end'));
  reg([fl[0]-16, fl[1]+62], 340, 0, 12, 8);

  var pad = 22;
  var vb = [Math.min.apply(0,bx)-pad, Math.min.apply(0,by)-pad,
            (Math.max.apply(0,bx)-Math.min.apply(0,bx))+2*pad, (Math.max.apply(0,by)-Math.min.apply(0,by))+2*pad];
  $('stage').innerHTML = '<svg viewBox="'+vb.map(function(v){return v.toFixed(0);}).join(' ')+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()+parts.join('')+'</svg>';

  $('stagebar').innerHTML =
    '<span class="pt-cap">解剖对象</span><span class="pt-chip">rank <b>'+g+'</b>'+(sel===null?'（未选卡，示例 0）':'')+'</span>'
    + '<span class="pt-cap">抽哪一层</span>'
    + '<button class="pb mono" data-act="v3layer" data-d="-1">‹</button>'
    + '<span class="pt-chip">L'+(l0+picked)+'</span>'
    + '<button class="pb mono" data-act="v3layer" data-d="1">›</button>'
    + '<span class="pt-chip">整网 → 层 → 算子 → kernel：粒度链在容器里走完（FR-12）</span>';
  $('stageNote').hidden = true; $('detach').hidden = true;
}

/* ═════════ 读出卡（FR-3） ═════════ */
function renderDetail(D){
  var el = $('detail');
  if(!D.ok){ el.hidden = true; return; }
  if(sel===null || sel>=D.world){
    if(ui.view==='anatomy'||ui.view==='dim'||ui.view==='chain'){ el.hidden = (sel===null); if(sel===null) return; }
    el.hidden = false;
    el.innerHTML = '<h4>结构总览 · 点卡读出</h4>'
      + '<table>'
      + '<tr><td>副本</td><td><span class="dk" style="--c:'+VC.dp+'">DP</span> ×'+D.dp+'</td></tr>'
      + '<tr><td>段</td><td><span class="dk" style="--c:'+VC.pp+'">PP</span> ×'+D.pp+'，每段 '+D.layersPerStage+' 层（有序）</td></tr>'
      + '<tr><td>TP组</td><td><span class="dk" style="--c:'+VC.tp+'">TP</span> ×'+D.tp+'，组内切头/列</td></tr>'
      + (D.cp>1?'<tr><td>CP</td><td><span class="dk" style="--c:'+VC.cp+'">CP</span> ×'+D.cp+'，切输入 token（分面）</td></tr>':'')
      + (D.moe?'<tr><td>EP</td><td><span class="dk" style="--c:'+VC.ep+'">EP</span> ×'+D.ep+'，stage 平面重解释（视图）</td></tr>':'')
      + '<tr><td>卡</td><td>'+fmt(D.world)+' 张 = '+D.tp+'·'+D.cp+'·'+D.pp+'·'+D.dp+'</td></tr></table>'
      + revHTML(D);
  }else{

      ep:'<b style="color:'+VC.ep+'">EP</b> 不是新轴，是对 stage 平面的<b>重解释</b>（勘误 K）：MoE 层把同一批卡按 e 轴重分组成专家桶，All-to-All 是路由不是同步。<b>两层切法</b>：EP 切<b>专家之间</b>（e 轴，'+D.experts+' 个专家→每卡 '+(D.moe?D.experts/D.ep:'—')+' 个），<b>ETP='+D.etp+'</b> 切<b>专家之内</b>（每个专家的 ffn 维 → ffn/ETP，本质是限定在专家权重上的 TP）。'+(D.etp>1?'ETP&gt;1 时专家内部还要各自 AllReduce，叠在两次 A2A 之外。':'')+' <b>只在层内</b>：每个 MoE 层 2 次（dispatch 送去 + combine 送回），反向同样 2 次，<b>不跨层</b>；router 逐层独立，同一 token 换层就可能换专家。跨层的是 PP 的 P2P，跨 step 的是 DP 的 AllReduce（§06 通则）。'+epSpanText(D)
    }[ui.cutDim];
    s = verdict + ' 竖轴是<b>粒度坐标</b>：整网⊃层⊃算子⊃kernel 是同一份内容的逐级放大（不是四样东西）；输入是另一个对象，单独一格。<b>切分的最小单位是片/段/桶，不是卡</b>——卡是落位容器。点柱读五元组区间。';
  }else if(ui.view==='compose'){
    s = '<b>合成·卡阵</b>：五维相乘后的全局（TP×PP×DP 三轴，CP 分面）。单维讲关系，这里讲落位。'
      + (layerOn('L5') ? ' 通信组=<b>'+DIMN[ui.commDim]+'</b>×<b>'+PRIMS.filter(function(x){return x.id===ui.commPrim;})[0].name+'</b>——维度管分组、原语管画法，互不绑定。' : ' 底栏开 L5 看通信；▶ 播放一个训练步。');
  }else if(ui.view==='time'){
    s = '<b>时间·流</b>：流=时间容器。空间折叠到只剩 PP；▲=P2P recv 进入时刻。气泡率≈(PP−1)/GA='+(D.bubble*100).toFixed(1)+'%。';
    if(ui.zoomAR && ui.skew) s += ' <span class="a5">归因（A5）：段最短=最后进入的副本是嫌疑人；等最久的是受害者，不是根因（§12 诊断陷阱）。</span>';
    else s += ' 点 AllReduce 块放大「谁在等谁」。';
  }else{
    s = '<b>卡内解剖</b>：钻进一张卡——外壳=显存容器，层→算子（体积∝字节，切法着色），底部<b>流=时间容器</b>装 kernel（<b>算子↔kernel 同号对应</b>，N:M：多算子可融合成一个 kernel、一个算子也可分段成多个）。<b>L 是整网的全局层号</b>（ℓ 轴，L0–L'+(D.layers-1)+'）——不是卡内序号，这张卡只装 PP 切出的那一段。通信是从切口伸出去的动作线。';
  }
  return s;
}

/* ═════════ 总渲染 ═════════ */
function render(){
  var D = derive(cfg);
  if(sel!==null && (!D.ok || sel>=D.world)) sel = null;
  if(!D.moe){ if(ui.axis==='ep') ui.axis='tp'; if(ui.commDim==='ep') ui.commDim='tp'; }
  renderBar(D);
  renderFoot(D);
  if(!D.ok){
    $('stage').innerHTML = '';
    $('stagebar').innerHTML = '';
    $('stageNote').hidden = true; $('detach').hidden = true;
    $('stage').innerHTML = '<div class="pt-blocked"><div><b>✕ 配置不合法，不渲染视图</b><br><span style="font-size:12px">'+D.errors.length+' 条整除约束未满足（DP-5 宁缺毋误）</span><br><button class="pb" data-act="drawer" data-d="cfg">打开配置修正</button></div></div>';
  }else{
    if(ui.view==='dim') renderDim(D);
    else if(ui.view==='chain') renderChain(D);
    else if(ui.view==='compose') renderV1(D);
    else if(ui.view==='anatomy') renderV3(D);
    else renderV2(D);
  }
  renderDetail(D);
  var dr = $('drawer');
  if(ui.drawer){ dr.hidden = false; dr.innerHTML = drawerHTML(D); }
  else dr.hidden = true;
  $('say').innerHTML = sayText(D);
  urlWrite();
}

/* ═════════ 事件 ═════════ */
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(t.matches('[data-cfg]')){
    var k = t.getAttribute('data-cfg'), v = parseInt(t.value,10);
    if(isNaN(v)) return;
    cfg[k] = Math.max(k==='experts'?0:1, v);
    if(k==='experts' && v===0){ cfg.ep=1; cfg.etp=1; }
    activePreset = null; stopAnim(); render();
    var nf = document.querySelector('[data-cfg="'+k+'"]'); if(nf) nf.focus();
  }
  if(t.id==='revLayer'){ ui.revLayer = t.value; renderRevOut(derive(cfg)); }
});
document.addEventListener('click', function(ev){
  var card = ev.target.closest('.cardg');
  if(card){ sel = +card.getAttribute('data-g'); render(); return; }
  var dc = ev.target.closest('.dimcol');
  if(dc){ sel = (sel === +dc.getAttribute('data-g')) ? null : +dc.getAttribute('data-g'); render(); return; }
  var lp = ev.target.closest('.l3pick');
  if(lp){ ui.selLayerOff = +lp.getAttribute('data-li'); render(); return; }
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(act==='preset'){
    var p = PRESETS.filter(function(x){return x.id===b.getAttribute('data-id');})[0];
    cfg = JSON.parse(JSON.stringify(p.cfg)); activePreset = p.id; sel = null;
    ui.cpFacet = 0; ui.unfold = false; stopAnim(); render();
  }
  else if(act==='fix'){
    var D0 = derive(cfg);
    var e = D0.errors.filter(function(x){return x.id===b.getAttribute('data-err');})[0];
    var f = e && e.fixes[+b.getAttribute('data-i')];
    if(f){ Object.keys(f.patch).forEach(function(k){ cfg[k]=f.patch[k]; }); activePreset=null; render(); }
  }
  else if(act==='view'){ ui.view = b.getAttribute('data-v'); stopAnim(); render(); }
  else if(act==='gov'){ ui.view = b.getAttribute('data-v'); stopAnim(); render(); }
  else if(act==='layer'){
    var L = b.getAttribute('data-l');
    if(!AVAIL[ui.view][L]) return;
    setLayer(L, !layerOn(L)); render();
  }
  else if(act==='cutdim'){ ui.cutDim = b.getAttribute('data-d'); render(); }
  else if(act==='chainpick'){
    var Dq = derive(cfg); if(!Dq.ok) return;
    var g0 = (sel!==null&&sel<Dq.world)?sel:0, c0 = coordsOf(g0,Dq);
    var kk = b.getAttribute('data-k'), iv = +b.getAttribute('data-i');
    if(kk==='d') sel = rankOf(c0.t,c0.c,iv,c0.p,Dq);
    else if(kk==='p') sel = rankOf(c0.t,c0.c,c0.d,iv,Dq);
    else if(kk==='t') sel = rankOf(iv,c0.c,c0.d,c0.p,Dq);
    else if(kk==='e' && Dq.moe){
      var m0 = epOf(c0.t,c0.c,c0.d,Dq);
      var q0 = (m0.mdp*Dq.ep+iv)*Dq.etp+m0.etp;
      sel = rankOf(q0%Dq.tp, Math.floor(q0/Dq.tp)%Dq.cp, Math.floor(q0/(Dq.tp*Dq.cp))%Dq.dp, c0.p, Dq);
    }
    else if(kk==='c' && Dq.cp>1){
      var ownerC2 = iv<Dq.cp ? iv : 2*Dq.cp-1-iv;
      sel = rankOf(c0.t, ownerC2, c0.d, c0.p, Dq);
    }
    render();
  }
  else if(act==='axis'){ ui.axis = b.getAttribute('data-a'); render(); }
  else if(act==='facet'){ ui.cpFacet = +b.getAttribute('data-i'); render(); }
  else if(act==='yaw'){ ui.yaw = (ui.yaw + (+b.getAttribute('data-d')) + 4) & 3; render(); }
  else if(act==='yawreset'){ ui.yaw = 0; render(); }
  else if(act==='unfold'){ ui.unfold = true; render(); }
  else if(act==='refold'){ ui.unfold = false; render(); }
  else if(act==='commdim'){ ui.commDim = b.getAttribute('data-d'); setLayer('L5', true); render(); }
  else if(act==='commprim'){ ui.commPrim = b.getAttribute('data-p'); setLayer('L5', true); render(); }
  else if(act==='detach'){ ui.detach = !ui.detach; if(ui.detach) setLayer('L5', true); render(); }
  else if(act==='anim'){
    if(anim.on){ stopAnim(); render(); }
    else{ var D2 = derive(cfg); if(D2.ok && ui.view==='compose'){ render(); startAnim(D2); } }
  }
  else if(act==='skew'){ ui.skew = !ui.skew; render(); }
  else if(act==='zoomar'){ ui.zoomAR = !ui.zoomAR; render(); }
  else if(act==='v3layer'){ ui.selLayerOff = clamp(ui.selLayerOff + (+b.getAttribute('data-d')), 0, derive(cfg).layersPerStage-1); render(); }
  else if(act==='clearsel'){ sel = null; render(); }
  else if(act==='pick'){
    sel = +b.getAttribute('data-g');
    var Dp = derive(cfg);
    if(Dp.ok && sel<Dp.world) ui.cpFacet = coordsOf(sel,Dp).c;
    render();
  }
  else if(act==='drawer'){ var d = b.getAttribute('data-d'); ui.drawer = (ui.drawer===d)?'':d; render(); }
  else if(act==='theme'){
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
    render();
  }
});
/* 悬停 tooltip */
var tip = document.getElementById('tip');
document.addEventListener('mousemove', function(ev){
  var g = ev.target.closest ? ev.target.closest('.cardg, .opblk') : null;
  if(g && g.classList.contains('cardg')){
    var D = derive(cfg), r = +g.getAttribute('data-g');
    if(D.ok && r<D.world){
      var co = coordsOf(r,D), me = D.moe?epOf(co.t,co.c,co.d,D):null;
      tip.innerHTML = '<b>global_rank '+r+'</b><br>tp '+co.t+' · cp '+co.c+' · dp '+co.d+' · pp '+co.p+(me?'<br>ep '+me.ep+' · etp '+me.etp:'')+'<br><span style="opacity:.6">点击选中（跨视图保持）</span>';
      tip.style.display='block';
      tip.style.left = Math.min(window.innerWidth-280, ev.clientX+13)+'px';
      tip.style.top = (ev.clientY+13)+'px';
      return;
    }
  }
  if(g && g.classList.contains('opblk')){
    var D3 = derive(cfg), o = opBytes(D3).filter(function(x){return x.id===g.getAttribute('data-op');})[0];
    if(o){
      tip.innerHTML = '<b>'+esc(o.id)+'</b><br>'+esc(o.how)+'<br>'+esc(o.shape)+(o.b?'<br>'+fmtGB(o.b)+' GB / 卡':'');
      tip.style.display='block';
      tip.style.left = Math.min(window.innerWidth-280, ev.clientX+13)+'px';
      tip.style.top = (ev.clientY+13)+'px';
      return;
    }
  }
  tip.style.display='none';
});
/* 宿主 postMessage 主题联动（与逻辑魔方同约定） */
window.addEventListener('message', function(ev){
  var d = ev && ev.data;
  if(d && (d.type==='theme'||d.type==='pto:theme') && (d.value==='dark'||d.value==='light')){
    document.documentElement.setAttribute('data-theme', d.value); render();
  }
});

urlLoad();
render();
})();
</script>
