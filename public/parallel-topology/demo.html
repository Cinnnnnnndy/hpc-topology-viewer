  function slab(x,y,w,h,fill,stroke,sw,extra){
    var st = stroke||'var(--pt-bds)', sww = (sw===undefined?.8:sw), ex = extra||'';
    var side = (x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+w+D3)+','+(y+h-E3)+' '+(x+w)+','+(y+h);
    var top  = x+','+y+' '+(x+w)+','+y+' '+(x+w+D3)+','+(y-E3)+' '+(x+D3)+','+(y-E3);
    return '<polygon points="'+side+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+side+'" style="fill:rgba(0,0,0,.16);stroke:none" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:'+fill+';stroke:'+st+';stroke-width:'+(sww*.7)+'" '+ex+'/>'
      + '<polygon points="'+top+'" style="fill:rgba(255,255,255,.34);stroke:none" '+ex+'/>'
      + rect(x, y, w, h, fill, st, sww, ex);
  }
  /* 线框盒（容器/父块外框）：只有棱，没有面——容器无厚度、不抢内容的视觉重量 */
  function wire3(x,y,w,h,stroke,sw,extra){
    var ex = extra||'', s = 'stroke:'+stroke+';stroke-width:'+sw+';fill:none';
    return rect(x, y, w, h, 'none', stroke, sw, ex)
      + '<polyline points="'+x+','+y+' '+(x+D3)+','+(y-E3)+' '+(x+w+D3)+','+(y-E3)+' '+(x+w)+','+y+'" style="'+s+'" '+ex+'/>'
      + '<line x1="'+(x+w+D3)+'" y1="'+(y-E3)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>'
      + '<line x1="'+(x+w)+'" y1="'+(y+h)+'" x2="'+(x+w+D3)+'" y2="'+(y+h-E3)+'" style="'+s+'" '+ex+'/>';
  }
  function sx(i){ return X0 + i*slot; }                       /* 第 i 份的左边 */
  function scx(i){ return X0 + i*slot + slot/2; }             /* 第 i 份的中心 */
  var wide = slot > 30;                                       /* 够宽才逐格标注 */
  var cardTier = slot > 68 ? 2 : slot > 34 ? 1 : 0;           /* 卡格标注档位：全 / 序号+容量 / 只序号 */
  /* 右侧判词 */
  function say(y, main, sub){
    parts.push(txt(RL, y, main, 9, col, 'start', 'font-weight="700"'));
    if(sub) parts.push(txt(RL, y+11, sub, 7.8, 'var(--pt-fg3)', 'start'));
  }
  /* 共有：一整块横跨全宽 —— 谁都没切它 */
  function spanLane(y, h, label, sub, tint){
    parts.push(slab(X0, y, MW, h, tint||mix('var(--pt-fg2)',16), 'var(--pt-bds)', .8));
    say(y+h/2-2, label, sub);
  }
  /* 真切：外框跨满（合起来=那一个）+ size 份紧贴（每份 1/size） */
  function cutLane(y, h, tintOf, labelOf){
    parts.push(wire3(X0, y, MW, h, col, 1.1));
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y+1.5, slot-gap, h-3, tintOf(j), 'transparent', 0, 'pointer-events="none"'));
      var l = labelOf ? labelOf(j) : '';
      if(l && wide) parts.push(txt(scx(j), y+h/2+3, l, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));
    }
    if(tail>0) tailBand(y, h, tintOf(N-1));
  }
  /* 压缩带：宽度就是 tail·slot（真实占比），不省面积、只省标注 */
  function tailBand(y, h, tint){
    var x0 = sx(N), w = X0+MW-x0;
    parts.push(slab(x0+gap/2, y+1.5, w-gap, h-3, tint, 'transparent', 0, 'opacity=".45" pointer-events="none"'));
    if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
  }
  /* 复印：各自成框、等大 —— 不是变小（DP 在模型侧的动作） */
  function copyLane(y, h, tint, label){
    for(var j=0;j<N;j++){
      parts.push(slab(sx(j)+gap/2, y, slot-gap, h, tint, 'var(--pt-bds)', .8, 'pointer-events="none"'));
      if(wide && j===0 && label) parts.push(txt(scx(j), y+h/2+3, label, 7.4, 'var(--pt-fg)', 'middle', 'pointer-events="none"'));
      if(j<N-1 && slot>16) parts.push(txt(sx(j+1), y+h/2+4, '≡', Math.min(13, slot*.4), col, 'middle', 'font-weight="800" pointer-events="none"'));
    }
    if(tail>0){
      var x0 = sx(N), w = X0+MW-x0;
      parts.push(slab(x0+gap/2, y, w-gap, h, tint, 'var(--pt-bds)', .6, 'opacity=".5" pointer-events="none"'));
      if(w > 34) parts.push(txt(x0+w/2, y+h/2+3, '+'+tail+' 份', 7.4, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
    }
  }

  /* 每份的代表卡（其余维取 0；EP 走折叠平面反解） */
  var colRanks = [];
  for(var i0=0;i0<N;i0++){
    if(dim==='tp') colRanks.push(rankOf(i0,0,0,0,D));
    else if(dim==='cp') colRanks.push(rankOf(0,i0,0,0,D));
    else if(dim==='dp') colRanks.push(rankOf(0,0,i0,0,D));
    else if(dim==='pp') colRanks.push(rankOf(0,0,0,i0,D));
  }
  if(dim==='ep') colRanks = epMembers(rankOf(0,0,0,0,D), D).slice(0,N);

  /* ── 包含链的样本层：整网⊃层⊃算子⊃kernel 不是四样东西，是同一份内容的
     逐级放大——光在左侧标尺写「⊃」是**说**，不是**画**。这里选定一层（L·li）
     当样本，让放大真的发生两跳：层→算子（⊕ 锥张开到整行）、算子→kernel
     （⊕ 锥收进选中那张卡的柱里）。锥落在柱里那一下就是两条线的交点：
     内容的包含链到 kernel 为止，落位的容器（卡）从 kernel 接手。
     选哪层：MoE 模型选换挡后的第一层（算子最全，EP 那一刀也在场），
     稠密模型选 L0。lps 覆盖不到时退回段首。 */
  var Lc = D.layers, lpsC = D.layersPerStage;
  var denseTopC = D.moe ? Math.min(2, Lc) : Lc;
  var laySpanN = D.pp > 1 ? lpsC : Lc;               /* 层那一行代表的层数（stage0 段或全部） */
  var liHi = (D.moe && denseTopC < laySpanN) ? denseTopC : 0;
  /* 整网行的真图刻度：L 层逐层画出来，Dense 段与 MoE 段异色、两头是入口/出口——
     和 3D 场景「层与层不一样」的那套事实同一口径，整网不再是一块无内容的灰板。 */
  function netTicks(x0, w, y, h, mark){
    var cap = Math.min(9, w*0.03), pad = 1.6, iw = (w - cap*2 - pad*2)/Lc;
    parts.push(rect(x0, y+3, cap, h-6, mix('var(--pt-fg2)',34), 'var(--pt-bds)', .6, 'pointer-events="none"'));
    parts.push(rect(x0+w-cap, y+3, cap, h-6, mix('var(--pt-fg2)',34), 'var(--pt-bds)', .6, 'pointer-events="none"'));
    if(cap > 7){
      parts.push(txt(x0+cap/2, y+h+8, '入口', 6.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
      parts.push(txt(x0+w-cap/2, y+h+8, '出口', 6.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }
    for(var t9 = 0; t9 < Lc; t9++){
      var tx = x0 + cap + pad + t9*iw;
      var tc = t9 < denseTopC ? mix(VC.tp, 34) : (D.moe ? mix(VC.ep, 30) : mix('var(--pt-fg2)',22));
      parts.push(rect(tx, y+5, Math.max(.5, iw*.78), h-10, tc, 'transparent', 0, 'pointer-events="none"'));
    }
    if(mark){
      var mx = x0 + cap + pad + liHi*iw - .8;
      parts.push(rect(mx, y+2.5, Math.max(1.4, iw*.78)+1.6, h-5, 'none', 'var(--pt-fg)', 1.3, 'pointer-events="none"'));
      return [mx, Math.max(1.4, iw*.78)+1.6];
    }
    return null;
  }
  var netMark = null, layMark = null;

  /* ── 输入②（激活体的入口）：另一个对象，虚线圈出、不在包含链上 ── */
  if(dim==='cp'){
    /* CP 的动词=切一条序列：2·CP 段 + 首尾配对弧（因果均衡） */
    var segN = 2*size, segW = MW/segN;
    parts.push(wire3(X0, R.inp, MW, HR.inp, col, 1.1));
    for(var sg=0;sg<segN;sg++){
      var ownerC = sg<size ? sg : 2*size-1-sg;
      parts.push(slab(X0+sg*segW+.6, R.inp+1.5, segW-1.2, HR.inp-3, mix(col, 14+Math.round(ownerC/(size-1||1)*40)), 'transparent', 0, 'pointer-events="none"'));
      if(segW>22) parts.push(txt(X0+sg*segW+segW/2, R.inp+HR.inp/2+3, '段'+sg, 7.2, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }
    for(var pc=0;pc<N;pc++){
      var aX = X0+pc*segW+segW/2, bX = X0+(2*size-1-pc)*segW+segW/2, hArc = 10+pc*5;
      parts.push('<path d="M'+aX+' '+(R.inp-2)+' C '+aX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2-hArc)+', '+bX+' '+(R.inp-2)+'" style="fill:none;stroke:'+mix(col,70)+';stroke-width:1.1"/>');
    }
    say(R.inp+HR.inp/2-2, '序列 → 2·CP='+segN+' 段；c 拿 段c ∪ 段'+(2*size-1)+'−c',
        '每段 '+fmt(D.seq/segN)+' token · 合起来=1 条');
  }
  else if(dim==='dp'){
    cutLane(R.inp, HR.inp, function(j){ return mix(col, 18+Math.round(j/(N-1||1)*34)); }, function(j){ return 'b份'+j; });
    say(R.inp+HR.inp/2-2, '全局批真切 ×DP='+size+'（每份 '+(D.mbs*D.ga)+' 样本）',
        '外框=GBS '+fmt(D.gbs)+' · 每份 1/'+size);
  }
  else{
    var inpCut = [];
    if(D.dp>1) inpCut.push('b 已被 DP 切（本组见 dp0）');
    if(D.cp>1) inpCut.push('s 已被 CP 切（cp0）');
    spanLane(R.inp, HR.inp, '输入 — 本维不切输入',
      inpCut.length?inpCut.join(' · '):(dim==='tp'?'TP 切权重体的 h 轴':dim==='pp'?'PP 切层序 ℓ 轴':'EP 重分组专家 e 轴'));
  }
  parts.push(rect(X0-6, R.inp-6, MW+12, HR.inp+12, 'none', 'var(--pt-fg3)', .8, 'stroke-dasharray="5 4" pointer-events="none"'));

  /* ── 整网 ── */
  if(dim==='dp'){
    copyLane(R.net, HR.net, mix('var(--pt-fg2)',18), null);
    /* 复印件逐份画真图刻度：等大不是一句话，是每份里同样的 L 层排布 */
    for(var nc9 = 0; nc9 < N; nc9++)
      netMark = netTicks(sx(nc9)+gap/2+1, slot-gap-2, R.net+2, HR.net-4, nc9===0) || netMark;
    say(R.net+HR.net/2-2, '整网 — 复印 ×'+size+'（每份=原尺寸）',
        '同一把刀：输入变小 · 模型等大（A3）');
  }
  else{
    spanLane(R.net, HR.net, '整网 — 逻辑上一张，不属于任何格', '本组是 '+fmt(groups)+' 个同构组之一');
    netMark = netTicks(X0+2, MW-4, R.net+1, HR.net-2, true);
  }

  /* ── 层 ── */
  if(dim==='pp'){
    var rise = Math.min(9, 26/size);
    parts.push(wire3(X0, R.lay, MW, HR.lay, col, 1.1));
    for(var jp=0;jp<N;jp++){
      var yj = R.lay + jp*rise;
      parts.push(slab(sx(jp)+gap/2, yj, slot-gap, HR.lay-rise*.6, mix(col, 26+Math.round(jp/(N-1||1)*30)), 'var(--pt-bds)', .7, 'pointer-events="none"'));
      if(wide) parts.push(txt(scx(jp), yj+13, 'stage'+jp, 7.4, 'var(--pt-fg)', 'middle', 'font-weight="700" pointer-events="none"'));
      if(wide) parts.push(txt(scx(jp), yj+22, 'L'+(jp*D.layersPerStage)+'–L'+((jp+1)*D.layersPerStage-1), 6.8, 'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
      if(jp<N-1){
        parts.push('<path d="M'+(sx(jp+1)-1)+' '+(yj+6)+' l 7 0 l -3 4 z" style="fill:'+col+'" pointer-events="none"/>');
        parts.push('<path d="M'+(sx(jp+1)+7)+' '+(yj+HR.lay-8)+' l -7 0 l 3 -4 z" style="fill:'+mix(col,55)+'" pointer-events="none"/>');
      }
    }
    if(tail>0) tailBand(R.lay+(N-1)*rise, HR.lay-rise*.6, mix(col,52));
    say(R.lay+HR.lay/2-2, '层 — 真切 ×PP='+size+'：段合起来=1 份整网',
        '升阶=有序 · ▸F 上行 · 淡▸B 下行');
  }
  else if(dim==='dp'){
    copyLane(R.lay, HR.lay, mix('var(--pt-fg2)',18), null);
    say(R.lay+HR.lay/2-2, '层 — 同一份，逐字节相同（≡）', '复制≠共有：容器纹丝不动（§08）');
  }
  else if(D.pp>1) spanLane(R.lay, HR.lay, '层 — 本组只持 stage0：L0–L'+(D.layersPerStage-1), 'ℓ 已被 PP 切——那是 PP 干的，不是本维', mix(VC.pp,10));
  else spanLane(R.lay, HR.lay, dim==='ep'?'层 — MoE 层在每个 stage 里':'层 — 不切 ℓ，每格都过全部层');

  /* ── 层行上的样本层：同一层在整网行与层行各有位置，细线连起来——
     这一跳是**同宽重读**（分层），不是放大；放大从下一跳才开始。 */
  (function(){
    var lx, lw;
    if(dim==='pp'){
      var j9 = Math.min(N-1, Math.floor(liHi/lpsC)), rise9 = Math.min(9, 26/size);
      lw = (slot-gap)/lpsC;
      lx = sx(j9)+gap/2 + ((liHi - j9*lpsC)/lpsC)*(slot-gap);
      layMark = [lx, Math.max(1.4, lw), R.lay + j9*rise9, HR.lay - rise9*.6];
    }else if(dim==='dp'){
      lw = (slot-gap)/Lc;
      lx = sx(0)+gap/2 + (liHi/Lc)*(slot-gap);
      layMark = [lx, Math.max(1.4, lw), R.lay, HR.lay];
    }else{
      lw = MW/laySpanN;
      lx = X0 + (liHi/laySpanN)*MW;
      layMark = [lx, Math.max(1.4, lw), R.lay, HR.lay];
    }
    parts.push(rect(layMark[0], layMark[2], layMark[1], layMark[3], mix('var(--pt-fg)',7), 'var(--pt-fg)', 1.3, 'pointer-events="none"'));
    parts.push(txt(layMark[0]+layMark[1]/2, layMark[2]-3, 'L'+liHi, 6.8, 'var(--pt-fg)', 'middle', 'font-weight="800" pointer-events="none"'));
    if(netMark) parts.push('<line x1="'+(netMark[0]+netMark[1]/2)+'" y1="'+(R.net+HR.net-2)+'" x2="'+(layMark[0]+layMark[1]/2)+'" y2="'+(layMark[2]+1)
      +'" style="stroke:var(--pt-fg3);stroke-width:.9" pointer-events="none"/>');
  })();

  /* ── 算子（真算子序列，宽∝每卡字节；被本维切的画成 size 片） ── */
  var opPos = {};
  var co0 = (function(){ var c = coordsOf(Math.min(S0(), D.world-1), D);
    return {tp:c.t, cp:c.c, dp:c.d, pp:c.p, ep:(D.moe?epOf(c.t,c.c,c.d,D).ep:0)}[dim] || 0; })();
  function opLane(cutKind){
    /* 优先用真整网的算子（35 个真节点 + 手工标注的切法/轴/原因），拿不到才退回内置示意口径。
       宽度口径两者不同：真数据按类别权重（真图无 shape），内置按每卡字节——图上分别标明。 */
    var rops = realOps(D, (sel!==null && sel<D.world) ? sel : 0), useReal = !!rops, ops, sh;
    if(useReal){
      ops = rops.filter(function(o){ return !o.comm; });        /* 通信算子是动作，另画成线 */
      sh = ops.map(function(o){ return o.w; });
    }else{
      ops = opBytes(D).filter(function(o){ return o.b>0 || o.id==='attn.core'; });
      var totB = ops.reduce(function(a,o){ return a+o.b; }, 0);
      sh = ops.map(function(o){ return clamp(o.b, totB*.07, totB*.30); });
    }
    opLane.real = useReal; opLane.commOps = useReal ? rops.filter(function(o){ return o.comm; }) : [];
    var shT = sh.reduce(function(a,x){ return a+x; }, 0);
    var og = 2, usable = MW - og*(ops.length-1), x = X0;
    ops.forEach(function(o, oi){
      var w = usable*sh[oi]/shT;
      opPos[o.id] = {x:x, w:w};
      var isCut = cutKind && (o.cut===cutKind || (cutKind==='tp' && o.cut==='sp'));
      var pieces = (useReal && o.total) ? o.total : size;      /* 真标注带 total：片数用真的 */
      if(!useReal && o.b===0) parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(useReal && !isCut && o.cut==='none') parts.push(wire3(x, R.op+6, w, HR.op-12, 'var(--pt-fg3)', .7, 'stroke-dasharray="3 3" pointer-events="none"'));
      else if(isCut){
        /* 片数用真标注的 total（如 q_b_proj 沿 head 切 32 份，本卡持 16–31），
           没有标注时退回本刀的份数 size。片贴片=面积守恒，跟别处一个纪律。 */
        var np = Math.max(1, Math.min(pieces, 64)), pw = w/np;
        var hot = (useReal && o.range && o.total) ? Math.floor(o.range[0]/(o.total/np)) : co0;
        parts.push(wire3(x, R.op, w, HR.op, col, 1, 'pointer-events="none"'));
        for(var q=0;q<np;q++)
          parts.push(slab(x+q*pw+.4, R.op+1.5, Math.max(.6,pw-.8), HR.op-3,
            mix(col, q===hot ? 62 : 30), 'transparent', 0, 'pointer-events="none"'));
        /* 被切最宽的那个算子当 kernel 锥的起点：热片（本卡那片）→ 本卡的柱 */
        if(!opLane.tgt || w > opLane.tgt.w)
          opLane.tgt = {id:o.id, label:(o.label||o.id), w:w, hotX:x+hot*pw+.4, hotW:Math.max(.6,pw-.8)};
      }
      else parts.push(slab(x, R.op+3, w, HR.op-6, mix('var(--pt-fg2)',16), 'var(--pt-bds)', .6, 'pointer-events="none"'));
      /* CP 不切权重，kernel 锥退而锚在 attention 上：CP 的通信与算子改写都发生在这儿 */
      if(useReal && !opLane.attn && /attention|mla/i.test(o.id) && !o.comm)
        opLane.attn = {id:o.id, label:(o.label||o.id), hotX:x, hotW:w};
      var lbl = useReal ? (o.label||o.id) : o.id;
      if(w>26) parts.push(txt(x+w/2, R.op+HR.op+9+(oi%2)*9, lbl.length>16?lbl.slice(0,15)+'…':lbl, 7, isCut?col:'var(--pt-fg3)', 'middle', (isCut?'font-weight="700" ':'')+'pointer-events="none"'));
      if(w>26 && useReal && isCut && o.axisName)
        parts.push(txt(x+w/2, R.op+HR.op+18+(oi%2)*9, '沿'+o.axisName+(o.partial?'·partial':''), 6.4, col, 'middle', 'pointer-events="none"'));
      x += w + og;
    });
  }
  if(dim==='tp'){
    opLane('tp');
    say(R.op+HR.op/2-2, '算子 — 锯开 ×TP='+size+'：每片 1/'+size,
        'q/kv/out/mlp 被切 · 每格 '+fmtGB(2*paramsPerCard(D,0))+' GB（片非整层）');
  }
  else if(dim==='ep'){
    opLane('ep');
    say(R.op+HR.op/2-2, '算子 — experts 重分组 ×EP='+size+'（每桶 '+kE+'）',
        'EP 是视图不是新轴（勘误 K）');
    var ex = opPos['experts'], rt = opPos['router'];
    if(ex){   /* 路由：token 动态挑 top-k 个桶——运行时的，不是静态切开 */
      var tk0 = rt ? rt.x+rt.w/2 : ex.x-14, ty0 = R.op-24;
      parts.push('<circle cx="'+tk0+'" cy="'+ty0+'" r="3.2" style="fill:'+col+'" pointer-events="none"/>');
      parts.push(txt(tk0, ty0-7, '一个 token', 7.6, col, 'middle', 'font-weight="700" pointer-events="none"'));
      var picks = [1, Math.min(N-1, 5)];
      for(var bi=0;bi<N;bi++){
        var tgx = ex.x+(bi+.5)*(ex.w/size), hit = picks.indexOf(bi)>=0;
        parts.push('<line x1="'+tk0+'" y1="'+(ty0+4)+'" x2="'+tgx+'" y2="'+R.op+'" style="stroke:'+col+';stroke-width:'+(hit?1.6:.55)+';stroke-dasharray:'+(hit?'none':'2 4')+';opacity:'+(hit?.95:.28)+'" pointer-events="none"/>');
      }
      /* 说明放右栏第三行：这一带的 y 正好是 tp/ep 的归属边界线，写在图里会压线 */
      parts.push(txt(RL, R.op+HR.op/2+20, 'top-'+(D.topk||2)+' 动态路由：每 token 挑自己的桶', 7.6, 'var(--pt-fg2)', 'start'));
      parts.push(txt(RL, R.op+HR.op/2+31, '路由是运行时的 · 切分是静态的', 7.6, 'var(--pt-fg3)', 'start'));
    }
  }
  else if(dim==='pp'){
    cutLane(R.op, HR.op, function(j){ return mix(col, 20+Math.round(j/(N-1||1)*20)); }, null);
    say(R.op+HR.op/2-2, '算子 — 随层归属（段里有哪些层）', '面积守恒同上一行');
  }
  else if(dim==='dp'){
    copyLane(R.op, HR.op, mix('var(--pt-fg2)',16), null);
    say(R.op+HR.op/2-2, '算子 — 同一份，逐字节相同', '加 DP 不买余量（A3）');
  }
  else{
    /* CP 也走真算子带：它确实不切任何权重（isCut 全 false，35 个算子全画成整块），
       但「不切」值得用真图说——每个算子都完整地在，s 轴上变少的是流过它们的 token。 */
    opLane('cp');
    say(R.op+HR.op/2-2, '算子 — 权重完整（CP 只切激活的 s 轴）',
        '每卡 token 少 1/'+size+' · 算子一个不缺');
  }

  /* ── 放大锥①：层 → 算子。样本层张开成整行——「算子行就是 L·liHi 的内部」。
     这一跳尺寸不守恒（一层张满全宽），所以标 ⊕，跟切分链同一条纪律。
     PP 不画这只锥：它的算子行讲的是「随层归属」（哪段有哪些层的算子），
     不是一层的内部——锥画上去就是把归属说成了放大。 */
  if(layMark && dim!=='pp'){
    var cnA = dim==='dp' ? sx(0)+gap/2 : X0, cnB = dim==='dp' ? sx(0)+slot-gap/2 : X0+MW;
    var cnY0 = layMark[2]+layMark[3]+1, cnY1 = R.op-2;
    ['<line x1="'+layMark[0]+'" y1="'+cnY0+'" x2="'+cnA+'" y2="'+cnY1+'"',
     '<line x1="'+(layMark[0]+layMark[1])+'" y1="'+cnY0+'" x2="'+cnB+'" y2="'+cnY1+'"'].forEach(function(l9){
      parts.push(l9+' style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:4 3;opacity:.75" pointer-events="none"/>');
    });
    parts.push(txt(X0+4, cnY1-6, '⊕ 放大 · L'+liHi+' 的内部（算子级）', 7.2, 'var(--pt-fg2)', 'start',
      'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6" pointer-events="none"'));
  }

  /* ── kernel：永不跨格 ── */
  for(var q2=0;q2<N;q2++){
    var kw = (slot-gap)/3.4;
    for(var kr=0;kr<3;kr++)
      parts.push(slab(sx(q2)+gap/2+kr*(kw+1.5), R.ker, kw, HR.ker, mix('var(--pt-fg2)', 34-kr*7), 'transparent', 0, 'pointer-events="none"'));
  }
  if(tail>0) tailBand(R.ker, HR.ker, mix('var(--pt-fg2)',28));
  /* ── 放大锥②：算子 → kernel，而且收进**选中那张卡的柱**。起点按刀选：
     TP/EP 从被切最宽那个算子的**热片**出发（本卡拿的那一片）；CP 没有片，
     从 attention 出发（它的通信与算子改写都在这儿）。DP 与 PP 不画这只锥：
     DP 的算子行是复印件（没有单算子坐标）、PP 讲的是归属——两者的落位都由
     竖直对齐说完了。终点是第 co0 根柱的 kernel 块。这一下把两条线钉在一起：
     整网⊃层⊃算子⊃kernel 是**内容**的包含链，卡是**落位**的容器——
     链的末端（kernel）永远整只落在某一根柱里，两条线在这儿相交。 */
  (function(){
    var src = (dim==='tp'||dim==='ep') ? opLane.tgt : opLane.attn;
    if(!src || dim==='pp') return;
    var i9 = Math.max(0, Math.min(N-1, co0));
    var kx0 = sx(i9)+gap/2, kx1 = sx(i9)+slot-gap/2;
    var ky0 = R.op+HR.op+1, ky1 = R.ker-2;
    ['<line x1="'+src.hotX+'" y1="'+ky0+'" x2="'+kx0+'" y2="'+ky1+'"',
     '<line x1="'+(src.hotX+src.hotW)+'" y1="'+ky0+'" x2="'+kx1+'" y2="'+ky1+'"'].forEach(function(l9){
      parts.push(l9+' style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:4 3;opacity:.75" pointer-events="none"/>');
    });
    parts.push(rect(kx0-1.2, R.ker-1.5, (kx1-kx0)+2.4, HR.ker+3, 'none', 'var(--pt-fg)', 1.2, 'pointer-events="none"'));
    var midX9 = Math.max(X0+70, Math.min(X0+MW-70, (src.hotX+src.hotW/2+kx0+(kx1-kx0)/2)/2));
    parts.push(txt(midX9, ky1-5, '⊕ '+(src.label.length>13?src.label.slice(0,12)+'…':src.label)
      +((dim==='tp'||dim==='ep')?' 的本卡那片':'')+' → 这张卡的 kernel', 7.2, 'var(--pt-fg2)', 'middle',
      'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6" pointer-events="none"'));
  })();
  say(R.ker+HR.ker/2-2, 'kernel — 永不跨柱（柱壁就是它的边界）',
      '内容链（整网⊃层⊃算子⊃kernel）到这儿收进柱：末端整只落进卡，容器从此接手');

  /* ── 卡（容器）：一柱一份，虚线柱贯穿全高（rank 是柱上的门牌，容器是卡本身 §15）。
     柱脚放门牌与容量计；整柱可点。竖直对齐 = 映射：柱里那一份就是它持有的。 ── */
  parts.push(txt(X0-10, R.card+16, '卡（容器）', 10.5, 'var(--pt-fg)', 'end', 'font-weight="800"'));
  parts.push(txt(X0-10, R.card+29, '容量 = 显存', 7.8, 'var(--pt-fg3)', 'end'));
  parts.push(txt(X0-10, R.card+40, '柱里那一份', 7.4, col, 'end'));
  parts.push(txt(X0-10, R.card+50, '就是它持有的', 7.4, col, 'end'));
  var CT = R.inp-13, CB = R.card+HR.card;             /* 柱顶（含输入行）/ 柱底 */
  for(var i=0;i<N;i++){
    var isSel = sel===colRanks[i], cx0 = sx(i)+gap/2, cw = slot-gap;
    var stI = coordsOf(colRanks[i], D).p;
    var memI = memParts(D, stI).reduce(function(a,x){ return a+x.bytes; }, 0);
    var frac = Math.min(1, memI/(D.hbm*Math.pow(2,30))), over = frac > .9;
    for(var gh=Math.min(groupsPer-1,2); gh>=1; gh--){  /* 同构卡退叠（真实张数由文字兜底） */
      var go = gh*3;
      colBack.push(rect(cx0+go, CT-go, cw, CB-CT, 'var(--pt-bg)', 'var(--pt-bd)', .6, 'stroke-dasharray="2 3" opacity="'+(.5-gh*.13).toFixed(2)+'" pointer-events="none"'));
    }
    /* 柱身：极淡体积感 + 虚线壁（容器边界），选中转实线 */
    colBack.push(rect(cx0, CT, cw, CB-CT, isSel?mix('var(--pt-fg)',5):mix('var(--pt-fg)',2), 'transparent', 0, 'pointer-events="none"')
      + wire3(cx0, CT, cw, CB-CT, isSel?'var(--pt-fg)':'var(--pt-bds)', isSel?1.6:1,
              isSel?'pointer-events="none"':'stroke-dasharray="7 3" pointer-events="none"'));
    /* 柱脚：门牌区（与柱身同宽，底色略深，读作"这根柱的脚") */
    colBack.push(rect(cx0, R.card, cw, HR.card, isSel?mix('var(--pt-fg)',8):mix('var(--pt-fg)',4), 'transparent', 0, 'pointer-events="none"'));
    inter.push('<g class="dimcol" data-g="'+colRanks[i]+'" style="cursor:pointer">'
      + rect(cx0, CT, cw, CB-CT, 'transparent', 'transparent', 0) + '</g>');
    /* 容量计：真实占用/HBM——容器约束画成条，不只是数字 */
    parts.push(rect(cx0+3, R.card+HR.card-11, cw-6, 6, mix('var(--pt-fg2)',10), 'transparent', 0, 'pointer-events="none"'));
    parts.push(rect(cx0+3, R.card+HR.card-11, (cw-6)*frac, 6, over?'var(--pt-danger)':mix(col,60), 'transparent', 0, 'pointer-events="none"'));
    if(cardTier===2){
      parts.push(txt(scx(i), R.card+14, dim+'_rank '+i, 8.4, col, 'middle', 'font-weight="700" pointer-events="none"'));
      parts.push(txt(scx(i), R.card+25, 'g='+colRanks[i], 7.4, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      if(groupsPer>1) parts.push(txt(scx(i), R.card+35, '×'+fmt(groupsPer)+' 张同构', 7, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      parts.push(txt(scx(i), R.card+HR.card-14, fmtGB(memI)+'/'+D.hbm+' GB', 7, over?'var(--pt-danger)':'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }else if(cardTier===1){
      parts.push(txt(scx(i), R.card+15, dim[0]+i, 8.6, col, 'middle', 'font-weight="800" pointer-events="none"'));
      parts.push(txt(scx(i), R.card+27, 'g='+colRanks[i], 6.8, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
      parts.push(txt(scx(i), R.card+HR.card-14, fmtGB(memI), 6.8, over?'var(--pt-danger)':'var(--pt-fg2)', 'middle', 'pointer-events="none"'));
    }else{
      parts.push(txt(scx(i), R.card+14, String(i), 7, col, 'middle', 'font-weight="700" pointer-events="none"'));
    }
  }
  if(tail>0){
    var tx0 = sx(N)+gap/2, tw = X0+MW-tx0-gap;
    parts.push(rect(tx0, R.card, tw, HR.card, mix('var(--pt-fg)',3), 'var(--pt-bds)', .8, 'stroke-dasharray="4 3" pointer-events="none"'));
    if(tw>50){
      parts.push(txt(tx0+tw/2, R.card+22, '+'+tail+' 份 · '+fmt(tail*groupsPer)+' 张卡', 8, 'var(--pt-fg2)', 'middle', 'font-weight="700" pointer-events="none"'));
      parts.push(txt(tx0+tw/2, R.card+34, '同构，宽度按比例', 7.2, 'var(--pt-fg3)', 'middle', 'pointer-events="none"'));
    }
  }
  say(R.card+14, '卡 = '+size+' 柱 × '+fmt(groupsPer)+' 张 = 全量 '+fmt(D.world),
      '柱宽=那一份的宽 · 点柱读五元组区间'
      + (cardTier===0?'（柱窄，只标序号）':cardTier===1?'（柱中，标 '+dim[0]+'i·g·占用）':''));
  /* 本刀对容量的贡献（反事实：这一维设回 1）——容量数字必须归因，否则会被算到本刀头上 */
  var mNow = memParts(D, 0).reduce(function(a,x){ return a+x.bytes; }, 0);
  var mOff = memWithoutKnife(D, dim, 0);
  var saved = mOff - mNow;
  parts.push(txt(RL, R.card+38, '本刀对容量的贡献', 8.6, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  if(saved > Math.pow(2,28)){
    parts.push(txt(RL, R.card+50, '若 '+DIMN[dim]+'=1：'+fmtGB(mOff)+' GB → 现在 '+fmtGB(mNow)+' GB', 7.8, col, 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+61, '本刀省下 '+fmtGB(saved)+' GB（÷'+size+'）· 其余由别的刀决定', 7.6, 'var(--pt-fg3)', 'start'));
  }else{
    parts.push(txt(RL, R.card+50, '若 '+DIMN[dim]+'=1：'+fmtGB(mOff)+' GB → 现在 '+fmtGB(mNow)+' GB', 7.8, 'var(--pt-danger)', 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+61, '一点没省——加 '+DIMN[dim]+' 不买余量（A3）', 7.6, 'var(--pt-danger)', 'start', 'font-weight="700"'));
    parts.push(txt(RL, R.card+72, '柱上这 '+fmtGB(mNow)+' GB 全是别的刀切出来的', 7.4, 'var(--pt-fg3)', 'start'));
  }

  /* ── 归属边界（§02）：此线以下各格内容开始不同 ── */
  var bY = {tp:(R.lay+HR.lay+R.op)/2, ep:(R.lay+HR.lay+R.op)/2, pp:(R.net+HR.net+R.lay)/2,
            cp:(R.inp+HR.inp+R.net)/2+3, dp:(R.inp+HR.inp+R.net)/2+3}[dim];
  parts.push('<line x1="'+(X0-30)+'" y1="'+bY+'" x2="'+(X0+MW+6)+'" y2="'+bY+'" style="stroke:'+col+';stroke-width:2;stroke-dasharray:9 5" pointer-events="none"/>');
  parts.push(txt(RL, bY-4, '归属边界（§02）', 9, col, 'start', 'font-weight="800"'));
  parts.push(txt(RL, bY+7, (dim==='cp'||dim==='dp')?'边界在输入——模型侧'+(dim==='dp'?'整套复制':'完整共有'):'此线以下，各格内容不同', 7.8, 'var(--pt-fg2)', 'start'));

  /* ── 通信（L5）：画在它发生的那一粒度层，格与格之间 ── */
  if(layerOn('L5')){
    var prim = dim==='cp' ? (['p2p','alltoall','allgather'].indexOf(ui.commPrim)>=0 ? ui.commPrim : 'p2p')
             : {tp:'allreduce', pp:'p2p', dp:'allreduce', ep:'alltoall'}[dim];
    var cy = {tp:R.op+HR.op+26, ep:R.op+HR.op+26, pp:R.lay+HR.lay+16, cp:R.inp+HR.inp+16, dp:R.net+HR.net+16}[dim];
    var pts = []; for(var a=0;a<N;a++) pts.push([scx(a), cy]);
    parts.push('<g opacity=".95" pointer-events="none">'+edgeSVG(pts, prim, col, {mid:dim, ring:dim==='cp'&&prim==='p2p'})+'</g>');
    var actB = D.mbs*(D.seq/D.cp)*D.hidden*2;
    function mb(b){ return b>=Math.pow(2,30) ? fmtGB(b)+' GB' : Math.round(b/Math.pow(2,20))+' MB'; }
    var commTxt = {tp:'TP AllReduce · 每层两下 · 每次≈'+mb(actB),
                   pp:'PP P2P · 有方向 · 每 μbatch ≈'+mb(actB),
                   dp:'DP 梯度 AllReduce · 步末一次 · 每卡≈'+mb(2*paramsPerCard(D,0)),
                   ep:'EP All-to-All · top-'+(D.topk||'—')+' 路由 · 各边载荷不等',
                   cp:{p2p:'CP Ring（P2P 逐跳传 KV 块）', alltoall:'CP Ulysses（All-to-All 换轴）', allgather:'CP 朴素（AllGather 收全序列）'}[prim]}[dim];
    var SCOPE = {tp:'作用域：层内（算子内部）· 每层 2 次，不跨层',
                 ep:'作用域：层内（MoE 层）· 每层 2 次 dispatch+combine，不跨层；路由逐层重算',
                 cp:'作用域：层内（attention 内部）· 每层一轮，不跨层',
                 pp:'作用域：跨层（层的边界）· stage 之间，每 μbatch 一次',
                 dp:'作用域：跨 step（整网之外）· 步末一次，层内不发生'}[dim];
    parts.push(txt(RL, cy-3, commTxt, 8.6, col, 'start', 'font-weight="700"'));
    parts.push(txt(RL, cy+8, SCOPE, 7.6, 'var(--pt-fg2)', 'start'));
  }

  /* ── 左侧粒度标尺：整网⊃层⊃算子⊃kernel 是同一份内容逐级放大；输入是另一个对象 ── */
  var spanN = '组内共有';
  var layShared = D.pp>1 ? '本组=stage0 段' : spanN;
  var ruler = {
    tp: [['输入 ②',spanN],['整网',spanN],['层',layShared],['算子',spanN+'·片各归各格'],['kernel','不跨柱']],
    pp: [['输入 ②',spanN],['整网',spanN+'·逻辑一张'],['层','各格一段·有序'],['算子','随层归属'],['kernel','不跨柱']],
    cp: [['输入 ②','s 轴切开'],['整网',spanN],['层',layShared],['算子',spanN+'·权重完整'],['kernel','不跨柱']],
    dp: [['输入 ②','b 轴切开'],['整网','复印·等大'],['层','复印·等大'],['算子','复印·等大'],['kernel','不跨柱']],
    ep: [['输入 ②',spanN],['整网',spanN],['层',layShared],['算子','桶各归各格'],['kernel','不跨柱']]
  }[dim];
  [['inp',R.inp,HR.inp],['net',R.net,HR.net],['lay',R.lay,HR.lay],['op',R.op,HR.op],['ker',R.ker,HR.ker]].forEach(function(rw, li){
    parts.push(txt(X0-10, rw[1]+13, ruler[li][0], 10.5, 'var(--pt-fg)', 'end', 'font-weight="700"'));
    parts.push(txt(X0-10, rw[1]+24, li===0 ? '激活体②的入口·'+ruler[0][1] : ruler[li][1], 7.8, 'var(--pt-fg3)', 'end'));
    if(li===0) parts.push(txt(X0-10, rw[1]+34, '≠ 激活体本身（中间结果 ×几千倍）', 7, 'var(--pt-fg3)', 'end'));
  });
  /* ⊃ 三跳各是各的关系：整网→层是**分层**（同宽重读，没放大）；层→算子与
     算子→kernel 才是**放大**（⊕，尺寸不守恒）——和图里那两只锥一一对应。 */
  [[R.net,HR.net,R.lay,'⊃ 分层（同宽）'],[R.lay,HR.lay,R.op,'⊃ 放大 ⊕'],[R.op,HR.op,R.ker,'⊃ 放大 ⊕']].forEach(function(pr){
    var y1 = pr[0]+pr[1]+2, y2 = pr[2]-2, xm = X0-118;
    parts.push('<line x1="'+xm+'" y1="'+y1+'" x2="'+xm+'" y2="'+y2+'" style="stroke:var(--pt-fg3);stroke-width:1;stroke-dasharray:2 3" pointer-events="none"/>');
    parts.push(txt(xm-4, (y1+y2)/2+3, pr[3], 7.6, 'var(--pt-fg3)', 'end'));
  });
  parts.push(txt(X0-122, (R.inp+HR.inp+R.net)/2+3, '⊥ 不在链上', 7.6, 'var(--pt-fg3)', 'end'));
  parts.push('<line x1="'+(X0-150)+'" y1="'+(R.net+2)+'" x2="'+(X0-150)+'" y2="'+(R.ker+HR.ker)+'" style="stroke:var(--pt-fg3);stroke-width:1.2;marker-end:url(#arrx)" pointer-events="none"/>');
  parts.push('<g transform="rotate(-90 '+(X0-156)+' '+((R.net+R.ker)/2)+')">'+txt(X0-156, (R.net+R.ker)/2, '粒度（坐标轴 §15）', 8.4, 'var(--pt-fg2)', 'middle', 'font-weight="700"')+'</g>');

  /* ── 全量对账 + 尺寸纪律（页脚一行，与切分链同一句纪律） ── */
  parts.push(txt(X0+MW, H-32, '全量 '+fmt(D.world)+' 卡 = '+size+' 份（'+DIMN[dim]+'）× 每份 '+fmt(groupsPer)+' 张同构卡'
    + (tail>0 ? ' · 逐柱画了前 '+N+' 份，余 '+tail+' 份在压缩带里（宽度按比例，未省面积）' : ' · '+size+' 份全部逐柱画出'), 8.8, 'var(--pt-fg2)', 'end', 'font-weight="600"'));
  parts.push(txt(X0+MW, H-18, '尺寸纪律：真切=面积守恒（份合起来=父块） · 复印=等大成叠（各自成框 + ≡） · 竖直对齐=映射（一份 → 它所在那根柱）', 8.4, 'var(--pt-fg)', 'end', 'font-weight="700"'));

  $('stage').innerHTML = '<svg viewBox="0 0 1080 '+H+'" preserveAspectRatio="xMidYMid meet">'+defsSVG()
    + '<g pointer-events="none">'+colBack.join('')+'</g>'
    + inter.join('')
    + '<g pointer-events="none">'+parts.join('')+'</g></svg>';

  renderDimBar(D, dim);
  /* 索引五元组条（§03）：本维认领哪根轴；rank元组 ⇄ 区间双链可逆（§07） */
  var AXQ = {tp:'h', pp:'ℓ', cp:'s', dp:'b', ep:'e'};
  var ivl = {tp:'tp_rank t ⇢ h∈[t·'+fmt(Math.floor(D.hidden/size))+', (t+1)·'+fmt(Math.floor(D.hidden/size))+')',

      body.push(txt(rc9[0], rc9[1]+3.5, pL9, 6.8, isSel9?'#fff':'var(--pt-fg3)', 'middle', 'font-weight="700"'));

  /* TP/EP/DP 选择器：三层分行，用 v 轴分隔而不是 w 轴深度 */
  var bandH = 0.09;
  var dpBandV = 0.04;
  var tpBandV = dpBandV + (K>1 ? bandH+0.02 : 0);
  var cpBandV = tpBandV + (cutTP && D.tp>1 ? bandH+0.02 : 0);
  var epBandV = cpBandV + (cutCP && D.cp>1 ? bandH+0.02 : 0);
  function railBand(vOff, n, mineI, cc, hxid, lab2, key){
    var bv = AR + vOff;
    /* 标签隔几个标一个，按**屏幕实宽**算而不是按份数：n≤16 这种判断只看份数，
       可转台一斜、缩放一小，8 个 EP 桶挤在几十像素里，标签照样叠成一坨。
       量出一格投影后到底有多宽，放不下就跳着标；选中的那个无论如何都标。 */
    var q0 = P(0, bv+bandH/2, 0, axOff), q1 = P(1/n, bv+bandH/2, 0, axOff);
    var cellPx = Math.abs(q1[0]-q0[0]);

      var mineB = b9===mineI;

      body.push(quad(cell, 'fill:'+(mineB?mix(cc,55):'url(#'+hxid+')')+';stroke:'+cc+';stroke-width:'+(mineB?1.4:.5)));
      if(b9 % lstep === 0 || mineB){
        var cc9 = P((ua+ub)/2, bv+bandH/2, 0, axOff);
        var lbT = lab2(b9);
        var pw = lbT.length*4.2+6, ph = 11;
        body.push('<rect x="'+(cc9[0]-pw/2)+'" y="'+(cc9[1]-ph/2+1)+'" width="'+pw+'" height="'+ph+'" rx="3" '
          +'style="fill:'+(mineB?cc:'var(--pt-bg)')+';stroke:'+cc+';stroke-width:'+(mineB?1.4:.6)+'"/>');
        body.push(txt(cc9[0], cc9[1]+3.5, lbT, 6.8, mineB?'#fff':'var(--pt-fg3)', 'middle', 'font-weight="700"'));
      }
      hit.push('<g class="cgrow">'+quad(cell, 'fill:transparent;cursor:pointer',
        'data-act="chainpick" data-k="'+key+'" data-i="'+b9+'"')+'</g>');

  }
  /* 轨的名字写 TP·SP：这条轨圈的那组卡**同时就是** SP 组——同一批卡、同一个组内
     序号，t 既是 h 上的第几片也是 s 上的第几段。只写 TP 的话，SP 在整张图上就没有
     任何常驻落点（切痕要选中卡才画，标签只有几行小字）。 */
  if(cutTP && D.tp>1 && !ui.cardMode) railBand(tpBandV, D.tp, co.t, VC.tp, 'hxTP', function(b9){ return 'TP·SP'+b9; }, 't');
  /* CP 的刻度：它和 TP 一样是一根真轴（world = TP × CP × PP × DP），只是切的
     方向不同——TP 那条带子上一格是一片 h，这条带子上一格是一段 s。 */
  if(cutCP && D.cp>1 && !ui.cardMode) railBand(cpBandV, D.cp, co.c, VC.cp, 'hxCP', function(b9){ return 'CP'+b9; }, 'c');
  if(cutEP && D.moe && D.ep>1 && !ui.cardMode){
    railBand(epBandV, D.ep, me?me.ep:0, VC.ep, 'hxEP',
      function(b9){ return 'EP'+b9; }, 'e');
  }
  /* DP 选择器已改为每份复印件底部的独立标签，不再用共享 railBand */
  /* ── 前板加标签：真图那一层的关键算子，和 3d-deck 上写的是同一行 ── */
  var lab = [];
  /* 顶视把 v 轴压扁：正面板的算子标签全塌到同一条基线上，只剩一行乱字——
     这套标注是给带竖直面的机位看的，顶视一律不画（组的门牌照旧）。 */
  /* 容量视图（netOff）里卡是空的——算子几何本来就没画（LQN=0），标签再挂上去
     就是一排指着空气的名字。放大之后它们还会跟着变大，糊在容量色带上。 */
  if(IXg && sh && !ui.netOff && (s >= 72 || zoomIn) && ui.viewTab !== 'top' && (cutDP || cutPP || cutCP || cutTP || cutEP)){
    /* 只挑几条：一层里 35 个算子全标出来就是糊墙，几条足够认出「这是真图那一层」。
       但**挑哪几条要跟着这一段真正含的层走**——原来写死了 dense_gate_up，于是
       每一段都写着「Gate Up Projection」，可 L2 之后根本没有 Dense FFN 了。
       现在：FFN 那一条按首层是 Dense 还是 MoE 换；含 L0 的那段多标词嵌入（入口），

    var lf = co.p*lps, ll = Math.min(L-1, lf+lps-1), pick = [];

       x=1325，各自往下走过 conv/norm/升维才在 attention_core 汇合）——只标
       q_a_proj 会让人以为 KV 落在 attention_core 那一个点上，两条都标才对得上
       「Q 在哪、KV 在哪」这个问题各有各的答案。 */
    pick.push(['input_layernorm', lf], ['attention_all_gather', lf, 'TP/SP AllGather'],

       Block Post RMSNorm 在投影上几乎同点，两条标签会叠字——色块本体照画。 */
    if(lf >= denseTop) pick.push(['shared_expert_mlp', lf]);
    if(ll === L-1) pick.push(['final_norm', L-1], ['lm_head', L-1], ['logits', L-1]);

       紧跟 input_tokens、attention_all_gather 紧跟 input_layernorm）——它们在场景
       坐标里离得够近，字号却是钉死的 6.4px，缩放拉近之后常常两行糊成一团（实机
       反馈：AllGather 和它上面那条算子名叠在一起）。挨个记上一条已放的 y，
       新的一条离得太近就顺势往下推，保持这条列表最基本的读序不乱。 */
    var labMinGap = 12, lastLabY = -Infinity;
    pick.forEach(function(it){
      var id = it[0];

      if(!n) return;
      /* 挑**第一条量得出区间的**切法，不能死取 parts[0]：Token IDs 的第一条是

         死取就什么都标不出来——它真正量得出的那条是 CP 切 seq。 */
      var s1 = sh[id], pl = (s1 && s1.parts) || [];
      var part = pl.filter(function(x){ return x && x.total > 0; })[0] || pl[0] || null;
      var pc = P((n.x - root.x)/GW, vOf(n.y), wOf(it[1]), off0);
      var ly = pc[1] + 2;

      lastLabY = ly;
      var tag = (part && part.total>0) ? ' · '+(part.dimName||'')+part.range[0]+'/'+part.total : '';

       · Dense 还是 MoE —— 交给层板的描边颜色（前几层青、其余中性），沿层深看过去
         颜色变的那一处就是模型换挡的地方，不需要文字；
       · 入口 / 出口 —— 只有两层有，给门牌。挂在它那层板的正上方，不拉引线：

  if(IXg && cutPP && L > 2 && ui.viewTab !== 'top'){
    /* 门牌只写两个字。这一屏上它是个**路标**——「这一头不重复」——具体不重复在
       哪几个算子、各被哪把刀切，展开写就是一条横贯半屏的长句，把它说明的那几层

    [[0, '入口', 'head'], [L-1, '出口', 'tail']].forEach(function(it, ii){

      var pt9 = P(0.5, -0.10 - ii*0.125, wOf(it[0]), off0);

      body.push('<rect x="'+(pt9[0]-w9/2)+'" y="'+(pt9[1]-h9/2)+'" width="'+w9+'" height="'+h9+'" rx="4" '
        +'style="fill:var(--pt-bg);stroke:var(--pt-fg2);stroke-width:1;opacity:.97"/>');
      body.push(txt(pt9[0], pt9[1]+3.6, esc(it[1]), 8, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
      /* 悬停靶子进 hit 层：body 整个是 pointer-events:none 的，挂在那儿收不到鼠标 */
      hit.push('<rect x="'+(pt9[0]-w9/2)+'" y="'+(pt9[1]-h9/2)+'" width="'+w9+'" height="'+h9+'" rx="8" '

  }

     「第 ℓ 层在哪张卡上」是这一屏最容易被说成单数的地方——数字写出来就没得含糊。 */
  if(revLi >= 0 && IXg){
    var hv9 = layerHome(D, revLi);

          hv9.frag > 1 ? ('各持 1/'+hv9.frag+'，无一张完整') : '每张持有完整的它',
          VC.dp, true, 7.4);

  var CID = 'scClip';

     纹路方向和刀的方向一致，斜着的锯 h、横着的锯 s，不用看颜色也认得出。
     SP 借 TP 的颜色（它就是 TP 组），但纹路归 s 那一边——同域不等于同轴。

  var HX = hatchDefsSVG();

     入口出口都是在列循环之后画的，插在中间照样会被它们压住。 */
  if(rankTags.length) body.push(rankTags.join(''));

    + '<g clip-path="url(#'+CID+')">' + body.join('') + lab.join('') + '</g>';

          step: 0, steps: [], zoom: zoomIn, cut: {dp:cutDP, pp:cutPP, cp:cutCP, tp:cutTP, ep:cutEP},

}

/* ═════════ 视图七 · 一个 step 的五幕：跟住一张卡走完全程 ═════════

   哪些事**只做一次**（开机 / 报到 / 备料），哪些事**每个 micro-batch 都重来**（进料 / 开算 / 接力）。
   把它讲成一个能复述的故事：跟住一张卡，从 128 个一模一样的进程，走到步末那一次梯度 AllReduce。
   第 4 幕是两条链唯一的交点——算子（逻辑侧末级）与 kernel 队列（物理侧末级）在 kernel 处碰头。 */
var ACTS = [
  {t:'开机',       s:'一模一样的进程',     once:true},
  {t:'报到',       s:'一维编号 → 四位门牌', once:true},
  {t:'备料',       s:'只建自己那一份',      once:true},
  {t:'进料',       s:'token 每步换一批',    once:false},
  {t:'开算',       s:'算子落成 kernel',     once:false},
  {t:'接力与收束', s:'流水线 + 步末 AllReduce', once:false}
];
function renderStory(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t,co.c,co.d,D) : null;
  var A = clamp(ui.act|0, 0, ACTS.length-1), act = ACTS[A];

  function rc(x,y,w,h,fill,stroke,sw,extra){
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(.4,w).toFixed(1)+'" height="'+Math.max(.4,h).toFixed(1)

  }

    if(w<=.3) return '';
    var s2 = '';
    if(dx>0){

        +(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '+(x+dx).toFixed(1)+','+(y-dy).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 70%, #fff 30%)" pointer-events="none"/>';
      s2 += '<polygon points="'+(x+w).toFixed(1)+','+y.toFixed(1)+' '+(x+w+dx).toFixed(1)+','+(y-dy).toFixed(1)+' '
        +(x+w+dx).toFixed(1)+','+(y+h-dy).toFixed(1)+' '+(x+w).toFixed(1)+','+(y+h).toFixed(1)
        +'" style="fill:color-mix(in srgb,'+fill+' 72%, #000 28%)" pointer-events="none"/>';

  /* 卡阵：行 = stage（PP），列 = stage 内平面（tp·cp·dp）——三个组在这个排布上各有各的形状 */
  function lattice(LX, LY, LW, LH, o){

    var dep = cw > 9 ? Math.min(5, cw*.22) : 0;
    for(var r=0; r<rows; r++) for(var c2=0; c2<cols; c2++){
      var gg = r*cols + c2;
      if(gg >= D.world) continue;
      var x = LX + c2*cw, y = LY + r*ch, hot = gg===g;
      var f = o.tint ? o.tint(gg, hot) : (hot ? 'var(--pt-fg)' : mix('var(--pt-fg)', 13));
      s2 += slab(x, y+dep, Math.max(.5,cw-Math.max(.35,cw*.09)), Math.max(.5,ch-Math.max(.35,ch*.14)), f, dep, dep*.6, 'pointer-events="none"');
    }
    /* 命中层单独铺一遍透明格。格子细到 2px 以下就不铺了——那时候点谁都是碰运气；
       但**格子照画**（份数是真的），只是把「这里点不动」如实说出来，不装成能点。 */
    if(cw < 2) s2 += txt(LX, LY-8, '格子已细到 '+cw.toFixed(1)+'px：'+fmt(D.world)+' 张全画出来了，但点选请用顶栏的「选中卡」输入框',
                         7.4, 'var(--pt-fg3)', 'start');

      var g2 = r2*cols + c3;

        +'" height="'+ch.toFixed(1)+'" style="fill:transparent;cursor:pointer" data-act="pickg" data-g="'+g2+'"></rect></g>';
    }
    /* 行标要看幕：开机那一幕门牌号还没算出来，标 stageN 就是提前泄题——
       那时只能标编号区间，并说明这个排法此刻还只是「为了摆得下」。 */
    for(var r3=0; r3<rows; r3++){
      var lo3 = r3*cols, hi3 = Math.min(D.world, (r3+1)*cols) - 1;
      s2 += o.plain
        ? txt(LX-7, LY+r3*ch+ch/2+3, lo3+'–'+hi3, 7.2, 'var(--pt-fg3)', 'end')
        : txt(LX-7, LY+r3*ch+ch/2+3, 'stage'+r3, 7.4, r3===co.p?VC.pp:'var(--pt-fg3)', 'end', r3===co.p?'font-weight="800"':'');
    }

  }
  function ring(p, col, rr){
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+rr+'" style="fill:none;stroke:'+col+';stroke-width:1.6"/>';
  }

  /* ── 幕头：每一幕都要回答「这一步做几次」 ── */
  parts.push(txt(28, 26, '第 '+A+' 幕 · '+act.t+' —— '+act.s, 13, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  var bw = act.once ? 96 : 128;
  parts.push(rc(28, 34, bw, 15, act.once?mix(VC.pp,16):mix(VC.dp,16), act.once?VC.pp:VC.dp, 1, 'rx="7"'));
  parts.push(txt(28+bw/2, 44.5, act.once?'只做一次':'每个 micro-batch 重来', 8, act.once?VC.pp:VC.dp, 'middle', 'font-weight="800"'));

function shardMap(D, g){
  var m = realModel(D); if(!m) return null;

/* ═ 训练数据标注：与 training-sidecar 同一套确定性合成口径（sin-hash 伪随机，

   在正视 / 侧视 / 3D 三个视角里读到的是同一个值，放大看字、悬停看提示、
   侧视看折线，对得上号。 */
function sdSeed(li, salt){
  var r = Math.sin((li + 1) * 12.9898 + (salt + 1) * 78.233) * 43758.5453;
  return r - Math.floor(r);

    amax: 6.8 + sdSeed(li, 3) * 2.9,
    grad: .42 + sdSeed(li, 4) * .72,
    wNorm: 21 + sdSeed(li, 5) * 11,
    uRatio: 1.2e-4 + sdSeed(li, 6) * 2.2e-4,

        one9 = !two9 && w*zs >= (String(n.label).length + tag.length)*3.2 + mtx9.length*3.0 + 8;
        if(!two9 && !one9){
          mtx9 = sdOpMetric(o.metricLi, n, D, Math.max(4, Math.floor((w*zs - nmW9 - 8)/3.0)));
          one9 = !!mtx9 && w*zs >= nmW9 + mtx9.length*3.0 + 8;
          if(!one9) mtx9 = '';
        }
      }
      if(labOn9)
        /* 名字后面挤成一行的读数（one9）：字号预算不能占（本来就是硬挤进去的），
           但色权可以——从「附注」的浅灰、常规粗细，提到跟名字同一档深色 + 粗体。 */
        txts.push(txt(x+w/2, y+h/2+(two9 ? -2.2 : 2)/zs,
                    esc(n.label)+esc(tag)+((one9 && !side9) ? '<tspan fill="'+metricColor(o.metricLi, n)+'" font-weight="700">  '+esc(mtx9)+'</tspan>' : ''),
                    5.4*fitK/zs, gh?'var(--pt-fg3)':'var(--pt-fg)', 'middle',
                    (dim?'font-weight="700" ':'')+HALO+'pointer-events="none"'));
      if(two9 && !side9)
        /* 读数才是这张卡真正被读的理由（名字只是找到它是谁）：单独成行时色权
           顶格给到 fg、加粗——不动字号预算（3.4–4.6，装得下几个字是算好的），
           只把视觉重量从「名字的附注」搬回「正文」，异常/接近阈值再往上加一档
           警示色（跟点开看到的完整明细同一个判断，不是另起一套）。 */
        txts.push(txt(x+w/2, y+h/2+5.8/zs, esc(mtx9),
                    Math.max(3.4, Math.min(4.6, o.fitLabel ? (w*zs)/(mtx9.length*0.62) : 4.6))/zs,
                    metricColor(o.metricLi, n), 'middle', 'font-weight="700" '+HALO+'pointer-events="none"'));
    }
    /* 点开这个算子看完整明细（图上写的只是摘要）。命中面走调用方给的 hit 层：
       body 层整体 pointer-events:none，提示与点击都只能挂在 hit 上。 */
    if(o.hitArr && o.metricLi != null && !gh && w*zs > 6 && h*zs > 3){
      o.hitArr.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)
        +'" style="fill:transparent;cursor:pointer" data-act="opdetail" data-nid="'+esc(n.id)+'" data-li="'+o.metricLi+'"'
        +' data-key="'+esc(o.hitKey||'')+'"><title>'+esc(n.label)+' · L'+o.metricLi+'：点开看完整读数</title></rect>');
    }
  });
  return out.join('') + acts.join('') + txts.join('');
}

/* ═════════ 视图六 · 映射（两个视角）═════════
   C「映射」这一段要答两个不同的问题，所以是两个视角，不是两张图：
     · 视角① 双链映射 —— 哪一级映到哪一级（结构）
     · 视角② 交集腔   —— 这张卡装了哪一块（载荷）
   默认给①：先知道刀落在哪一级，再看那一级交出来的腔是什么。 */
function renderSolid(D){
  if(ui.persp === 'cav') return renderSolidCav(D);
  return renderSolidMap(D);
}
/* ═════════ 视角① 双链映射（FIG 09 的三维化）═════════
   两条链都是包含链，各 5 级，但两条链的级与级并不对齐——所以连线是斜的，斜不是画风，是事实。
   全图真正的主张只有一句：四个并行维度全部收在「卡」这一级。
   往上两级（机 / 集群）只决定拓扑与带宽——它们不持有内容，所以画成空线框；
   往下两级（计算单元 / 片上 buffer）与并行完全无关——算子融合与 tiling 不跨卡、不通信。
   「卡」这一级不是一只盒子，是一整个卡阵平面（机内 8 卡 × 若干台机），四条梁全落在这个平面上；
   顺带就能核对两条常被念错的约束：TP 分片必须机内（组要落在同一行）· PP 划分可跨机（链本来就跨行）。
   机制框是扁的：机制是动作，不是容器——参照系里只有卡与流两个容器画成体。 */
function renderSolidMap(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var H = 700, parts = [], hits = [];
  var PER = 8, MACH = Math.ceil(D.world/PER);      /* 机 = 8 卡：FIG09 的拓扑假设，不由并行配置推出 */
  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function poly(pts, st, extra){ return '<polygon points="'+ptsStr(pts)+'" style="'+st+'" '+(extra||'')+'/>'; }
  /* 水平板：容器才有体积（斜投影，深度恒为 (dx,−dy)） */
  function plate(px,py,w,dx,dy,th,o){
    o = o || {};
    var st = 'stroke:'+(o.stroke||'var(--pt-bds)')+';stroke-width:'+(o.sw||1)+(o.dash?';stroke-dasharray:'+o.dash:'');
    var pc = o.pct || 0, base = o.base || 'var(--pt-fg)';
    function F(k){ return pc ? mix(base, Math.min(70, pc*k)) : 'none'; }

         + poly([[px,py],[px+w,py],[px+w,py+th],[px,py+th]], 'fill:'+F(2.1)+';'+st)
         + poly([[px+w,py],[px+w+dx,py-dy],[px+w+dx,py-dy+th],[px+w,py+th]], 'fill:'+F(3)+';'+st);

  function cell(px,py,w,dx,dy,a0,a1,b0,b1){       /* 板上 (a 沿宽, b 沿深) 的一格 */

  /* ── 卡阵平面：机内 8 卡 × MACH 台机，全量画出 ── */

/* ═════════ 视图六 · 交集腔：卡为什么是「这一块」 ═════════
   前五视图各答一问：单维答「一把刀怎么切」、刀序答「几把刀什么次序」、解剖答「卡里有什么」。
   这一张答最后一问——**为什么恰好是这一块**，而这一问只能靠三维说清楚。
   两个对象各有自己的索引空间，轴数不同（§03 五元组：恰好一根轴对一把刀）：
     · 权重体① = ℓ × h × e     三轴 ← PP 切 ℓ、TP 切 h、EP 切 e
     · 激活体② = ℓ × h × b × s 四轴 ← 多出 DP 切的 b、CP 切的 s
   每把刀是**一整片板**（切穿整只盒子，不是切一小块）；三片板相交剁出一个小长方体，
   那就是这张卡持有的全部——体积 ∶ 全盒 = 持有占比。卡不是缩小的整网，是**区间的交集**。
   两条不对称在轴数上直接看得见，不用一句口号：
     · DP 在①上**没有轴** → 它只能把整只盒子复印一叠，格子数与格子大小全不变
       ⇒ 换副本时腔纹丝不动、体积一点不少 = A3「加 DP 不买余量」的几何证明
       （数值证明在单维切分的反事实里：若 DP=1，同一张卡还是这么多字节。两处互相印证。）
     · EP 在②上没有轴 → 路由是动作（把 token 送去别的卡），不是静态切分。 */
function renderSolidCav(D){
  var g = (sel!==null && sel<D.world) ? sel : 0;
  var co = coordsOf(g, D), me = D.moe ? epOf(co.t, co.c, co.d, D) : null;
  var H = 880, parts = [], hits = [];
  var L1 = layerOn('L1'), L2 = layerOn('L2'), L3 = layerOn('L3'), L4 = layerOn('L4');
  var hK = Math.floor(D.hidden/D.tp), kE = D.moe ? D.experts/D.ep : 0, lps = D.layersPerStage;
  var SEC = !!ui.act2;

  /* ── 可转动投影：拖动时覆盖全局 proj，让 boxSVG / solidBox 自动拿到旋转后的坐标 ── */
  var origProj = proj;
  var cavYaw = ui.cavYaw||0, cavPitch = ui.cavPitch||0;
  var hasRot = Math.abs(cavYaw) > 1e-6 || Math.abs(cavPitch) > 1e-6;
  var rcx = 0, rcy = 0, rcz = 0;
  if(hasRot){
    var cryw = Math.cos(cavYaw), sryw = Math.sin(cavYaw);
    var crpch = Math.cos(cavPitch), srpch = Math.sin(cavPitch);
    proj = function(x,y,z,s){
      var dx = x-rcx, dy = y-rcy, dz = z-rcz;
      var rx = dx*cryw + dz*sryw;
      var rz = dz*cryw - dx*sryw;
      var ry = dy*crpch - rz*srpch;
      var rz2 = dy*srpch + rz*crpch;
      return origProj(rx+rcx, ry+rcy, rz2+rcz, s);
    };
    /* 实心盒（boxSVG fill）要按同一套旋转判面朝向——见 boxSVG 顶上的说明 */
    projRot = function(n){
      var rx = n[0]*cryw + n[2]*sryw, rz3 = n[2]*cryw - n[0]*sryw;
      var ry = n[1]*crpch - rz3*srpch; rz3 = n[1]*srpch + rz3*crpch;
      return [rx, ry, rz3];
    };
  }
  var TY = 322, TX1 = SEC ? 372 : 500, TX2 = 700, BW = 142, BH = 132;
  var BD1 = D.moe ? 104 : 40, BD2 = 104;
  /* 读数放**左栏**：右上角是常驻的读出卡（.pt-detail，304px），右栏会被它盖住——
     版面必须按真实的浮层排，不能画完了让读者自己去关卡片。 */
  var RX = 24, RW = 190;

  function ln(a,b,st){ return '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" style="'+st+'"/>'; }
  function p3(x,y,z){ return proj(x,y,z,1); }
  function hexPts(w,h,d){ /* 盒子的屏幕轮廓（等轴测下恒是这个六边形）——复印件只画剪影 */
    return [p3(0,h,0), p3(w,h,0), p3(w,0,0), p3(w,0,d), p3(0,0,d), p3(0,h,d)];
  }

  /* ── 一只索引空间盒 ──────────────────────────────────────────
     外框（结构线）+ 三组刀面（每把刀在三个可见面上留下的线）+ 三片板 + 交集腔 + 三根可点的轴尺。
     ax/ay/az = {n 份数, dim 哪把刀, i 本卡拿第几份, name 轴名, k chainpick 键, lab(i) 刻度文字}
     x 轴走屏幕右下、z 轴走左下、y 轴朝上——三根轴各由一把刀认领，认领关系写在轴尺上。 */
  function solidBox(o){
    var W = o.w, HH = o.h, DD = o.d, ax = o.ax, ay = o.ay, az = o.az;
    var dx = W/ax.n, dy = HH/ay.n, dz = DD/az.n;
    var x0 = ax.i*dx, y0 = ay.i*dy, z0 = az.i*dz;
    var body = '', hit = '', i;
    /* 份数大到画不下时降的是线宽与标注，不是份数——细密纹理本身就是「真切了这么多刀」 */
    function gridStyle(step, col){
      var sw = step>4?.9:step>2?.6:.4, op = step>4?.58:step>2?.42:.26;
      return 'stroke:'+col+';stroke-width:'+sw+';stroke-opacity:'+op;
    }
    if(L1){
      body += boxSVG(0,0,0,W,HH,DD,1,{wire:true, stroke:'var(--pt-bd)', sw:1, dash:'3 3'});
      var st = gridStyle(dy, VC[ay.dim]);
      for(i=1;i<ay.n;i++) body += ln(p3(0,i*dy,DD), p3(W,i*dy,DD), st) + ln(p3(W,i*dy,0), p3(W,i*dy,DD), st);
      st = gridStyle(dx*C, VC[ax.dim]);
      for(i=1;i<ax.n;i++) body += ln(p3(i*dx,HH,0), p3(i*dx,HH,DD), st) + ln(p3(i*dx,0,DD), p3(i*dx,HH,DD), st);
      st = gridStyle(dz*C, VC[az.dim]);
      for(i=1;i<az.n;i++) body += ln(p3(0,HH,i*dz), p3(W,HH,i*dz), st) + ln(p3(W,0,i*dz), p3(W,HH,i*dz), st);
    }
    /* 三片板：每把刀留下的区间**铺满另外两根轴**——刀是板不是块，这是「一整片切穿」的形 */
    if(L2){
      function slab(x,y,z,w,h,d,dim,n){
        /* n=1 = 这把刀没切开：板就是整只盒子，照常上色会把盒子刷成一片纯色，压淡且不描棱 */
        if(n===1) return '<g opacity=".07">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>';
        return '<g opacity=".26">'+boxSVG(x,y,z,w,h,d,1,{fill:VC[dim]})+'</g>'
             + boxSVG(x,y,z,w,h,d,1,{wire:true, stroke:VC[dim], sw:.7});
      }
      body += slab(0,0,z0,W,HH,Math.max(dz,.8), az.dim, az.n);
      body += slab(x0,0,0,Math.max(dx,.8),HH,DD, ax.dim, ax.n);
      body += slab(0,y0,0,W,Math.max(dy,.8),DD, ay.dim, ay.n);
      body += boxSVG(x0,y0,z0,dx,dy,dz,1,{fill:'var(--pt-fg)', stroke:'var(--pt-fg)', sw:1});
    }
    /* 腔的棱始终画：薄到 1px 也得能定位（dz 小 = 这张卡真的只占这么一薄片，不放大骗人）。
       data-cav 是给页外核对用的把手：换 DP 副本时 data-cav="w" 的坐标必须逐字不变（A3）。 */
    body += boxSVG(x0,y0,z0,Math.max(dx,.7),Math.max(dy,.7),Math.max(dz,.7),1,
                   {wire:true, stroke:o.cav||'var(--pt-fg)', sw:1.7,
                    attrs:' data-cav="'+(o.cavId||'')+'" data-cav-size="'+dx.toFixed(3)+','+dy.toFixed(3)+','+dz.toFixed(3)+'"'});
    /* ETP：在 e 腔**内部**再沿专家自己的 ffn 维切一刀（不是外面那根 h 轴，同属「算子内部」那一类） */
    if(o.etp>1) for(i=1;i<o.etp;i++){
      var ex = x0 + dx*i/o.etp;
      body += ln(p3(ex,y0+dy,z0), p3(ex,y0+dy,z0+dz), 'stroke:'+VC.ep+';stroke-width:.8;stroke-dasharray:2 2;stroke-opacity:.8');
    }

    /* 轴尺：刀在这根轴上留下的刻度。点一格换卡（复用 chainpick 的可逆坐标算术 §07）。
       画得下写全名，写不下降成序号，再写不下只标端点与选中——降的是标注，份数一个不少。 */
    function ruler(a, A, B, out, pad, anchor){
      var pa = p3(A[0],A[1],A[2]), pb = p3(B[0],B[1],B[2]);
      var vx = (pb[0]-pa[0])/a.n, vy = (pb[1]-pa[1])/a.n;
      var step = Math.sqrt(vx*vx+vy*vy), col = VC[a.dim];
      var tier = step > 34 ? 2 : step > 13 ? 1 : 0;
      var hw = Math.max(7, Math.min(24, step*.92));
      body += ln([pa[0]+out[0]*pad, pa[1]+out[1]*pad], [pb[0]+out[0]*pad, pb[1]+out[1]*pad], 'stroke:'+col+';stroke-width:1;stroke-opacity:.65');
      for(var j=0;j<a.n;j++){
        var hot = j===a.i;
        var mx = pa[0]+vx*(j+.5)+out[0]*pad, my = pa[1]+vy*(j+.5)+out[1]*pad;
        body += ln([pa[0]+vx*j+out[0]*pad, pa[1]+vy*j+out[1]*pad], [pa[0]+vx*j+out[0]*(pad+4), pa[1]+vy*j+out[1]*(pad+4)],
                   'stroke:'+col+';stroke-width:'+(hot?1.6:.7)+';stroke-opacity:'+(hot?1:.5));
        if(L4 && (tier===2 || tier===1 || hot || j===0 || j===a.n-1))
          body += txt(mx+out[0]*11, my+out[1]*11+3, esc(tier===2 ? a.lab(j) : String(j)), hot?8.6:7.3,
                      hot?col:'var(--pt-fg3)', anchor||'middle', hot?'font-weight="800"':'');
        if(a.k) hit += '<g class="cgrow"><rect x="'+(mx+out[0]*10-hw/2).toFixed(1)+'" y="'+(my+out[1]*10-7).toFixed(1)+'" width="'+hw.toFixed(1)+'" height="14" style="fill:transparent;cursor:pointer" data-act="chainpick" data-k="'+a.k+'" data-i="'+j+'"></rect></g>';
      }
      /* 轴名 = 「哪根轴 ← 哪把刀切了几份」，认领关系不靠记忆。
         挂在尺的**中点**：x 尺与 z 尺共用同一个下角，挂端点会叠成一行。 */
      var e2 = [(pa[0]+pb[0])/2+out[0]*(pad+27), (pa[1]+pb[1])/2+out[1]*(pad+27)];
      body += txt(e2[0], e2[1], esc(a.name)+' <tspan style="fill:'+col+'" font-weight="800">← '+DIMN[a.dim]+'×'+a.n+'</tspan>', 8.2, 'var(--pt-fg2)', anchor||'middle', 'font-weight="700"');
      return step;
    }
    ruler(ax, [0,0,DD], [W,0,DD], [-.5, C], 12);          /* x 尺：左下棱 */
    ruler(az, [W,0,0], [W,0,DD], [.5, C], 12);            /* z 尺：右下棱 */
    /* noY：ℓ 尺两只盒子共用一把 PP 刀，画两遍就成了「两把刀」的错觉，也挤掉两盒之间的间距 */
    if(!o.noY) ruler(ay, [0,0,DD], [0,HH,DD], [-1, 0], 14, 'end');
    return {body:body, hit:hit, dx:dx, dy:dy, dz:dz, x0:x0, y0:y0, z0:z0,
            cc:p3(x0+dx/2, y0+dy/2, z0+dz/2)};
  }

  /* ═══ 抬头 ═══ */
  parts.push(txt(600, 28, '一张卡 = 各轴区间的交集，不是缩小的整网', 13, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(600, 44, '每把刀是一整片板，切穿整只盒子；三片板相交剁出一个小长方体 —— 体积 ∶ 全盒 = 这张卡的持有占比', 9, 'var(--pt-fg2)'));

  /* ═══ 盒① 权重体：ℓ × h × e ═══ */
  rcx = BW/2; rcy = BH/2; rcz = BD1/2;
  var b1 = solidBox({w:BW, h:BH, d:BD1, etp:D.etp, cavId:'w',
    ax:{n:D.tp, dim:'tp', i:co.t, name:'h 隐藏维', k:'t', lab:function(i){ return '片'+i; }},
    ay:{n:D.pp, dim:'pp', i:co.p, name:'ℓ 层号',  k:'p', lab:function(i){ return 'L'+(i*lps)+'–L'+((i+1)*lps-1); }},
    az:{n:D.moe?D.ep:1, dim:'ep', i:me?me.ep:0, name:D.moe?'e 专家号':'e 轴不存在', k:D.moe?'e':'',
        lab:function(i){ return D.moe ? 'E'+(i*kE)+'–E'+((i+1)*kE-1) : '（稠密·无 e 轴）'; }}});
  /* DP 在这只盒子上没有轴：它只能整只复印。复印件与原盒**等大**（尺寸纪律：复印=等大成叠），
     格子数与格子大小一个不变——所以那一腔的体积与 DP 无关。 */
  var K1 = D.dp, oX = K1>1 ? Math.min(9, 46/(K1-1)) : 0, oY = K1>1 ? Math.min(6, 36/(K1-1)) : 0;
  for(var k1=K1-1; k1>=1; k1--){
    parts.push('<g transform="translate('+(TX1+k1*oX).toFixed(1)+','+(TY-k1*oY).toFixed(1)+')" opacity="'+(0.26+0.5*(1-k1/K1)).toFixed(2)+'">'
      + '<polygon points="'+ptsStr(hexPts(BW,BH,BD1))+'" style="fill:var(--pt-bg);stroke:'+VC.dp+';stroke-width:.7"/></g>');
  }
  parts.push('<g transform="translate('+TX1+','+TY+')">'+b1.body+'</g>');
  hits.push('<g transform="translate('+TX1+','+TY+')">'+b1.hit+'</g>');
  parts.push(txt(TX1-4, 92, '① 权重体 · 索引空间 '+(D.moe?'ℓ × h × e（三轴）':'ℓ × h（两轴，无 MoE）'), 11, 'var(--pt-fg)', 'middle', 'font-weight="800"'));
  parts.push(txt(TX1-4, 105, '被剁成 '+D.pp+'×'+D.tp+(D.moe?'×'+D.ep:'')+' = '+fmt(D.pp*D.tp*(D.moe?D.ep:1))+' 个腔，这张卡持有其中 1 个', 8.2, 'var(--pt-fg2)'));
  /* DP 副本尺：收起②之后它就没地方了，可它恰恰是 A3 的操作台——挪到①底下，
     位置反而更对：「换副本 → 看①的腔」本来就该在同一只盒子旁边完成。 */
  if(!SEC && D.dp>1){
    var DRY = TY + (BW+BD1)*S + 62, DRW = Math.min(320, Math.max(120, D.dp*16));
    var DRX = TX1 + (BW-BD1)*C/2 - DRW/2, dstep = DRW/D.dp;
    parts.push(txt(DRX+DRW/2, DRY-10, '换 DP 副本 —— A3 的操作台：腔的三条边长一个数都不会变', 8, VC.dp, 'middle', 'font-weight="700"'));
    parts.push(ln([DRX, DRY], [DRX+DRW, DRY], 'stroke:'+VC.dp+';stroke-width:1;stroke-opacity:.65'));
    for(var dq=0; dq<D.dp; dq++){
      var hotq = dq===co.d, mx2 = DRX+dstep*(dq+.5);
      parts.push(ln([DRX+dstep*dq, DRY], [DRX+dstep*dq, DRY+4], 'stroke:'+VC.dp+';stroke-width:'+(hotq?1.6:.7)+';stroke-opacity:'+(hotq?1:.5)));
      if(L4 && (dstep>22 || hotq || dq===0 || dq===D.dp-1))
        parts.push(txt(mx2, DRY+15, dstep>22?('副本'+dq):String(dq), hotq?8.6:7.3, hotq?VC.dp:'var(--pt-fg3)', 'middle', hotq?'font-weight="800"':''));
      hits.push('<g class="cgrow"><rect x="'+(mx2-Math.max(6,Math.min(22,dstep*.92))/2).toFixed(1)+'" y="'+(DRY+2).toFixed(1)
        +'" width="'+Math.max(6,Math.min(22,dstep*.92)).toFixed(1)+'" height="16" style="fill:transparent;cursor:pointer" data-act="chainpick" data-k="d" data-i="'+dq+'"></rect></g>');
    }
  }
  if(K1>1){
    parts.push(txt(TX1+BW*C+10, 128, '×'+D.dp+' 复印（DP）', 8.4, VC.dp, 'start', 'font-weight="800"'));
    parts.push(txt(TX1+BW*C+10, 139, '≡ 逐字节相同 · 等大', 7.2, VC.dp, 'start'));
    parts.push(txt(TX1+BW*C+10, 149, 'DP 在①上没有轴', 7.2, 'var(--pt-fg3)', 'start'));
  }

  /* 专家权重的 h 由 **ETP** 切，不由 TP 切：ETP=1 时它在 h 上压根没切开，
     所以①的腔对专家那一块其实更宽——虚线框标出来，字节占比高过体积占比的主因就看得见。 */
  if(D.moe && D.etp < D.tp){
    var ew = BW/D.etp, ex0 = (me.etp % D.etp)*ew;
    parts.push('<g transform="translate('+TX1+','+TY+')">'
      + boxSVG(ex0, b1.y0, b1.z0, ew, b1.dy, b1.dz, 1, {wire:true, stroke:VC.ep, sw:1.2, dash:'4 3'})+'</g>');
    var ec = proj(ex0+ew, b1.y0, b1.z0+b1.dz, 1);
    parts.push(txt(TX1+ec[0]+6, TY+ec[1]+11, '专家腔：h 由 ETP='+D.etp+' 切，比 TP 那一格宽', 7, VC.ep, 'start', 'font-weight="700"'));
  }

  /* ═══ 盒② 激活体：ℓ × s × b（h 是第 4 根轴，三维画不下，写在旁边） ═══ */
  rcx = BW*.86/2; rcy = BH*.86/2; rcz = BD2*.86/2;
  var b2 = SEC && solidBox({w:BW*.86, h:BH*.86, d:BD2*.86, cav:VC.dp, noY:true, cavId:'a',
    ax:{n:D.cp, dim:'cp', i:co.c, name:'s 序列位', k:D.cp>1?'c':'',
        lab:function(i){ return D.cp>1 ? '段'+i+'∪'+(2*D.cp-1-i) : '全部 s'; }},
    ay:{n:D.pp, dim:'pp', i:co.p, name:'ℓ 层号',  k:'', lab:function(i){ return 'L'+(i*lps); }},
    az:{n:D.dp, dim:'dp', i:co.d, name:'b 样本号', k:'d', lab:function(i){ return '副本'+i; }}});
  if(SEC){
    parts.push('<g transform="translate('+TX2+','+TY+')">'+b2.body+'</g>');
    hits.push('<g transform="translate('+TX2+','+TY+')">'+b2.hit+'</g>');
    parts.push(txt(TX2-4, 92, '② 激活体（第二视角）· 索引空间 ℓ × h × b × s（四轴）', 10.5, 'var(--pt-fg2)', 'middle', 'font-weight="800"'));
    parts.push(txt(TX2-4, 105, '同一把 DP 刀在这里是轴：整盒被真切成 '+D.dp+' 份（面积守恒），不是复印', 8.2, VC.dp));
    parts.push(txt(TX2-4, 117, 'h 是它的第 4 根轴（TP 也切它）· ℓ 与①同一把 PP 刀，尺不重复画', 7.4, 'var(--pt-fg3)'));
  }else{
    parts.push(txt(TX2+10, 300, '② 激活体（已收起）', 9.6, 'var(--pt-fg3)', 'middle', 'font-weight="700"'));
    parts.push(txt(TX2+10, 314, '点顶栏按钮重新展开：它多出 b（DP 切）与 s（CP 切）两根轴', 7.6, 'var(--pt-fg3)'));
  }

  /* ═══ 两只盒子共用的刀：ℓ 的刀面是同一片，横穿两只盒子（连线取两盒同一层高的前棱） ═══ */
  var yl = (co.p+.5)*BH/D.pp;                       /* 本卡那一层段的局部高度 */
  var yA = TY + BW*S - yl, yB = TY + BD2*S - yl;    /* ①的右前棱 / ②的左前棱，同一层段 */
  var gx0 = TX1+BW*C+8, gx1 = TX2-BD2*C-8;
  if(SEC){
    parts.push(ln([gx0, yA], [gx1, yB], 'stroke:'+VC.pp+';stroke-width:1;stroke-dasharray:5 4;stroke-opacity:.7'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 - 8, 'PP·TP 的刀面', 7.4, VC.pp, 'middle', 'font-weight="700"'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 + 4, '横穿两只盒子', 7.4, VC.pp, 'middle', 'font-weight="700"'));
    parts.push(txt((gx0+gx1)/2, (yA+yB)/2 + 15, 'ℓ、h 共有', 6.8, 'var(--pt-fg3)'));
  }

  /* ═══ 左栏读数：腔的坐标 —— 引线从腔拉过来，左右联动看得见 ═══ */
  var RY = 96;
  function row(y, k, v, col){
    parts.push(txt(RX, y, esc(k), 7.8, 'var(--pt-fg3)', 'start'));
    parts.push(txt(RX+RW, y, v, 8.4, col||'var(--pt-fg)', 'end', 'font-weight="700"'));
  }
  function hr(y){ parts.push(ln([RX, y], [RX+RW, y], 'stroke:var(--pt-bds);stroke-width:.7')); }
  function head(y, t, col){ parts.push(txt(RX, y, esc(t), 9.2, col||'var(--pt-fg)', 'start', 'font-weight="800"')); }
  parts.push(txt(RX, RY, '读数 · 这张卡 g='+g, 10.5, 'var(--pt-fg)', 'start', 'font-weight="800"'));
  parts.push(txt(RX, RY+12, '(tp'+co.t+' cp'+co.c+' dp'+co.d+' pp'+co.p+(me?' ep'+me.ep:'')+')　地址只标不画', 7.4, 'var(--pt-fg3)', 'start'));
  head(RY+32, '① 权重体腔'); hr(RY+36);
  row(RY+49, 'ℓ ← PP', 'L'+(co.p*lps)+'–L'+((co.p+1)*lps-1), VC.pp);
  row(RY+62, 'h ← TP', '['+fmt(co.t*hK)+', '+fmt((co.t+1)*hK)+')', VC.tp);
  row(RY+75, 'e ← EP', D.moe ? 'E'+(me.ep*kE)+'–E'+((me.ep+1)*kE-1) : '—（无 MoE）', D.moe?VC.ep:'var(--pt-fg3)');
  var vol = D.pp*D.tp*(D.moe?D.ep:1);
  /* 体积占比 = 索引空间里的份额；字节占比 = 真账（复制项不被任何刀切，所以略高）——两个数都给，差额说清 */
  var pcTot = (function(){ var D2={},k2; for(k2 in D) D2[k2]=D[k2]; D2.tp=1; D2.ep=1; D2.etp=1;
    var t=0,pi; for(pi=0;pi<D.pp;pi++) t += paramsPerCard(D2, pi); return t; })();
  var pcMine = paramsPerCard(D, co.p), bytePc = pcTot>0 ? pcMine/pcTot*100 : 0;
  row(RY+91, '体积占比', '1/'+fmt(vol)+' = '+(100/vol).toFixed(2)+'%');
  row(RY+104, '字节占比', bytePc.toFixed(2)+'%', 'var(--pt-fg2)');
  /* 两个数不等，原因要说准：本配置里主因是**专家权重的 h 由 ETP 切、不由 TP 切**，
     ETP=1 时它在 h 上根本没切开 —— 盒子上那只虚线框就是它。复制项只是次因。 */
  var etpGap = D.moe && D.etp < D.tp;
  parts.push(txt(RX, RY+116, etpGap ? '差额主因：专家权重只被 EP 切，h 方向没切——那要 ETP'

/* ══ 正视/侧视：本页自己的 SVG 重画（不再嵌 sidecar）═════════════════════
   内容与 model-architecture-training-sidecar 那两张一致——
     正视 = 完整一条主线：模型输入段（Token IDs / Position IDs / Attention Context /
            Embedding Weight → Parallel Embedding）+ 一层的算子 DAG（MLA attention ×
            Dense/MoE FFN × mHC 汇合）+ 主输出与 MTP 尾巴——画的就是 OPENPANGU_GRAPH

/* 斜纹/横纹的 defs：三个场景（netScene / frontScene / sideScene）共用同一套语义——

function hatchDefsSVG(k, suf){
  /* k = 当前缩放：纹样按 1/k 反除，放大后斜纹/横纹在屏幕上保持同样细密——
     不然 3.4 一格的纹被 wrapper 放大 5 倍就成了粗条纹（「线条没做缩放适配」）。
     suf = id 后缀：固定悬浮层（选择轨）在变换之外，要一套不缩放的纹样，id 不能撞。 */

      + '<rect width="'+pz+'" height="'+pz+'" style="fill:'+mix(col,7)+'"/>'
      + '<line x1="0" y1="0" x2="'+(rot?0:pz)+'" y2="'+(rot?pz:0)+'" style="stroke:'+col+';stroke-width:'+sw+'"/></pattern>';

  return pat('hxTP', 45, VC.tp) + pat('hxEP', -45, VC.ep) + pat('hxDP', 0, VC.dp)
       + pat('hxCP', 0, VC.cp) + pat('hxSP', 0, VC.tp);
}
/* 两头/分支的节点集合：正视按代表层二选一画 FFN 分支，卡维度下两头只属于首末段 */
var FS_HEAD = {input_tokens:1, embedding_weight:1, token_embedding:1, positions:1, attention_context:1};
var FS_TAIL = {final_norm:1, lm_head:1, lm_head_weight:1, logits:1, logits_allgather:1,
               mtp_input_norms:1, mtp_eh_proj:1, mtp_decoder_layer:1, mtp_head_weight:1,
               mtp_shared_head:1, mtp_logits:1};
var FS_DENSE = {dense_mlp:1, dense_gate_up:1, dense_silu:1, dense_down:1, dense_mlp_weights:1,
                ffn_all_gather:1, ffn_reduce_scatter:1};
var FS_MOE = {router_gate:1, route_topk:1, routed_expert_bank:1, moe_combine:1, router_weight:1,
              moe_all_to_all_dispatch:1, moe_all_to_all_combine:1, shared_expert_mlp:1,
              shared_expert_weights:1, expert_bank_weights:1, expert_parallel_state:1};
/* 整张真图（含补齐的 MTP 尾巴）的包围盒——EXTRA_NODES 探出 G.height 之外，量一次缓存 */
var FS_GB = null;
function frontBounds(){
  if(FS_GB) return FS_GB;
  var IX = graphIndex(); if(!IX) return null;
  var y0 = 1e9, y1 = -1e9, x0 = 1e9, x1 = -1e9;
  IX.G.nodes.forEach(function(n){
    x0 = Math.min(x0, n.x - n.width/2); x1 = Math.max(x1, n.x + n.width/2);
    y0 = Math.min(y0, n.y - n.height/2); y1 = Math.max(y1, n.y + n.height/2);

/* ── 地图式文字：正/侧视被 wrapper 按 zoom 整体放大，字按 FS_ZOOM_GROWTH 那个
   damping 跟着长，不是原地钉死——crisp 重绘时把字号、光晕、胶囊尺寸预先除回
   1/FS_Z，换到屏幕上就是「长，但比框慢」那条曲线；
   gesture 里的位图拉伸只是过渡，停手 0.4s 后就换成这份清晰的。
   FS_Z 由 frontScene / sideScene 每次渲染时设置（netScene 自己把 zoom 折进投影，
   不走这条）。缩得比 0.75 还小就不再缩小字：那时格子比字还小，字跟着缩只会

var FS_Z = 1;
/* ── 字号增益：把「场景单位」换算成真的屏幕像素 ────────────────────────────

   于是 5.4 单位的正文标注落到屏幕上只有 ~6.9px——放大之后字虽然不再变大（地图式
   是对的），但**定在了一个看不清的尺寸上**。这里量一次实际的「单位 → 像素」比，
   连同一个可读性系数一起折进 FS_Z：所有 X/FS_Z 的写法（字号、描边、圆角、门牌
   内边距、两头轨的行距）会一起等比变大，比例关系不变，只是整体到了能看清的档位。
   标签的显隐阈值用的也是同一个 FS_Z（w*zs > 字长×2.2），字变大之后阈值自动变严：
   出现得更晚，但一出现就是看得清的——这正是地图式标注该有的行为。
   量出来的比不写死：viewBox 宽度由舞台长宽比反解（与 renderChain 同一条式子），

var FS_PX = 11.5;                      /* 正文标注（基准 5.4 档）在屏幕上的目标像素 */
/* 反除的上限。gain 越大 = 字在**场景单位**里越大；而 gain 里的 vw/cw 就是
   1/缩放比，所以「gain 随窄而涨」等价于「画面缩小、字不缩」——版面是按字与格子的
   相对大小排的，字单方面涨上去就只能互相叠。实测重叠的文字对数（侧视）：

     上限   620px      1680px
     3.0    48 对      25 对      ← 原值：窄栏惨不忍睹，连基准宽度都已经在叠
     2.13   37 对      18 对
     1.7     9 对      24 对
     1.4     0 对       0 对      ← 现值

   1.4 之后 gain basically 被钉成常数，字在场景单位里不再随宽度变——于是整张图
   **长宽一起等比缩**，比例关系守住，窄栏里字小但不打架（要看清滚轮放大即可，
   缩放手势本来就在）。代价是窄栏里字确实小：620px 宽时约 6px。这是「48 对重叠的
   13px」与「不重叠的 6px」之间的取舍——叠在一起的字并不会因为大而更能读。 */
var FS_GAIN_MAX = 1.4;
/* 放大手势那一路的字号增长率。1.0 = 老的「地图式」：字完全钉死屏幕尺寸，
   滚轮从 1x 拉到 20x，框跟着长 20 倍，字一个像素都不多——实测（正视，1600×1000
   视口）文字高度从 100% 到 2000% 全程稳在 12px 上下，数字上没有「缩小」，但
   框涨了 20 倍字纹丝不动，观感就是「越放大字越小」（用户反馈，画布里普遍存在）。
   降到 0.35 之后字跟着放大手势一起长，只是长得比框慢：20x 时字约放大 20^0.35≈2.9
   倍，框还是放大 20 倍——字不再看着被落下，也没有跟框 1:1 长到处处打架。 */
var FS_ZOOM_GROWTH = 0.35;
/* 字号增长封顶：只降增长率（0.35）还不够——damping 之后字仍然没有上限，一路
   放大到 20x，字跟着长到远超相邻的读数行、悬浮提示预留的间距，照样在高倍缩放
   时撞在一起（实机反馈：AllGather/AllToAll 两行标注挤成一团，算子名和它自己
   的读数行糊在一起）。给增长率再加一道封顶：字最多长到基准的 1.6 倍就不再跟
   缩放涨了——「Math.max(zoom3^k, zoom3/CAP)」这个写法在 zoom3 较小时走前一项
   （跟着长），涨到前一项追上 zoom3/CAP 那条线（此时字已经到封顶）之后自动切到
   后一项，效果是「先长后平」，不是在某一帧生硬截断。 */
var FS_ZOOM_GROWTH_CAP = 1.6;
function fsBase(){
  var st = $('stage');
  var cw = (st && st.clientWidth) || 1680, ch = (st && st.clientHeight) || 889;
  var cAR = ch > 60 ? cw/ch : 1.9;
  var vw = clamp(Math.round(692*cAR), 1080, 2600);        /* = renderChain 里的 VW */
  var gain = (vw / cw) * (FS_PX / 5.4);                   /* 单位/像素 × 目标倍数 */
  var z9 = Math.max(1, ui.zoom3);
  var zoomTerm = Math.max(Math.pow(z9, FS_ZOOM_GROWTH), z9 / FS_ZOOM_GROWTH_CAP);
  return zoomTerm / clamp(gain, 1, FS_GAIN_MAX);

function fsTxt(x, y, t, size, fill, anchor, extra){
  extra = String(extra || '').replace(/stroke-width="([\d.]+)"/g, function(m, w9){
    return 'stroke-width="' + (parseFloat(w9)/FS_Z).toFixed(2) + '"';
  }).replace(/letter-spacing="([\d.]+)"/g, function(m, w9){
    return 'letter-spacing="' + (parseFloat(w9)/FS_Z).toFixed(2) + '"';
  });

/* SVG 胶囊门牌（DP0 / CP1 / TP·SP0 / ep3 / PP2…）：和 3D 轨上的同一套长相，
   屏幕尺寸恒定（/FS_Z）。点选走 hit 层的透明矩形（data-act=chainpick）。 */
/* 一串字在等宽字体里到底多宽：中日文字符是整个 em 宽，拉丁字符约 0.6em。
   一律按 0.62 估的话，「EP 组 0（4 列凑齐 64 专家）」这种中文串会比它的胶囊
   宽出近一半——字从两端探出胶囊，看着就是被切了一截。 */
function fsW(s, fs){
  var w = 0, i, c;

function fsPill(body, hit, x, y, label, col, on, act, fs){

  body.push('<rect x="'+(x-w/2).toFixed(1)+'" y="'+(y-h/2).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+(3.5/FS_Z).toFixed(2)
    +'" style="fill:'+(on?col:'var(--pt-bg)')+';stroke:'+col+';stroke-width:'+((on?1.4:.7)/FS_Z).toFixed(2)+'"/>');

  if(act && hit) hit.push('<rect x="'+(x-w/2-2).toFixed(1)+'" y="'+(y-h/2-2).toFixed(1)+'" width="'+(w+4).toFixed(1)+'" height="'+(h+4).toFixed(1)
    +'" style="fill:transparent;cursor:pointer" data-act="chainpick" data-k="'+act[0]+'" data-i="'+act[1]+'"/>');

/* 正视画的是**哪一层**（所有格画的是同一层）：反查了某层就画那一层；Rank 下画
   选中卡那段的中点层；否则画模型中段（MoE 配置跳过开头那两层 Dense）。
   抽成一支是因为工具条上那组换层步进要显示同一个数——两处各算各的迟早对不上。 */
function fsLayerOf(D){
  var L = D.layers, lps = D.layersPerStage;
  if(revLiOn(D)) return clamp(Math.floor(+ui.revLayer), 0, L-1);
  if(ui.cardMode){
    var co9 = coordsOf((sel !== null && sel < D.world) ? sel : 0, D);
    var pS9 = (ui.kPP && D.pp > 1) ? co9.p : 0;
    return Math.min(L-1, pS9*lps + (lps>>1));
  }
  return D.moe ? Math.min(L-1, Math.max(Math.min(2, L), Math.floor(L/2))) : Math.floor(L/2);
}

/* ═════════ 正视图（原生）：一层的完整主线 × DP·CP 方阵 × TP 行 ═════════
   格阵语法与旧 sidecar 方阵一致：列 = DP 外层 × CP 内层（col = d·CP + c），
   行 = Rank 打开时的 TP 片；EP 组按连续列成块、组间掰缝。每格是**完整一条主线**
   （输入段 + 代表层 + 输出与 MTP 尾巴），格内每个算子按 SHARD 表画切痕：
   竖切 = TP/EP（斜纹为非本卡片），横切 = SP/CP（横纹），attention 双刀成网格。 */
function frontScene(D, g, box){

  var pSel = cutPP ? co.p : 0;

  var liStage = Math.min(D.pp-1, Math.floor(li/lps));
  /* 单卡铺满：只画选中那一格，铺满整张画布。方阵是用来看「有多少份、各拿哪一块」的，
     而要读一层里每个算子的读数，方阵天然给不出版面——一格只有几十像素宽，得放到
     2000% 才看得清一行字。铺满之后同样的内容在 100% 就读得完，是同一张图的另一个
     取景，不是另一张图（用的还是同一个 graphSVG、同一份切痕与读数）。 */

     TP 片仍可切（画布下沿那条选组 HUD），只是不再同时铺在纵向上。 */

     原来「EP 组」挂在最上面、桶号在下面，同一件事被劈成上下两处；DP 又被 EP 组

     所以数据打开时不再按原比例缩放，改成「高度铺满一屏、宽度按可读性拉开」：

  var gridH = rows*cellH + (rows-1)*gapY;
  var gx0 = box.x + LM + Math.max(0, (iw + (cols-1)*gapX + nEpGap*epGapPx - gridW)/2);
  /* 内容比画布高时顶对齐：居中会把开头那几个算子推到画面外，读者一进来就得先往上拖 */
  var gy0 = box.y + TM + (gridH > ih ? 0 : Math.max(0, (ih + (rows-1)*gapY - gridH)/2));
  function cellX(cq){ return gx0 + cq*(cellW+gapX) + (epEvery ? Math.floor(cq/epEvery)*epGapPx : 0); }
  function cellY(r){ return gy0 + r*(cellH+gapY); }
  /* 算子命中面单独攒一叠、最后再叠上去：整格那只「选这张卡」的命中面在 DOM 里
     排在后面就会盖住它们，点算子会变成点卡。 */
  var body = [], hit = [], hitOps = [], defs9 = [];
  /* 门牌是**屏幕恒定**尺寸（fsPill 内部把字号与内边距一律按 1/FS_Z 反除），所以
     一切与门牌相邻的间距也必须按 1/FS_Z 走；写成场景固定量的话两者随缩放脱钩，

      var lab9 = labAll || (isF && effW >= 130) || (!hasSel && r === 0 && cq === 0 && effW >= 130);

      if(ui.cardMode && cutPP && pSel !== 0) Object.keys(FS_HEAD).forEach(function(k9){ ghostIds[k9] = 1; });
      if(ui.cardMode && cutPP && pSel !== D.pp-1) Object.keys(FS_TAIL).forEach(function(k9){ ghostIds[k9] = 1; });
      var op9 = (hasSel && !isF) ? .38 : 1;
      if(op9 < 1) body.push('<g opacity="'+op9+'">');
      /* 「本卡拿哪一份」只在真的有卡的时候才成立：Rank 打开时每一格就是一张具体的
         卡，实心那份是它持有的；Rank 关着又没选中任何卡时，co 会退化成 rank 0 的
         坐标——于是一进画面就有一份 TP0 被点实，看着像「已经选了 TP0」，其实什么
         都没选。这时 mine 给 -1：切痕照画（切成几份是事实），只是不指认哪一份是谁
         的（拿第几份才是选择）。 */
      var pick9 = ui.cardMode || hasSel;
      var cuts9 = {
        tp: cutTP ? {count:D.tp, mine:pick9 ? t9 : -1} : null,
        ep: cutEP ? {count:D.ep, mine:pick9 ? (me9 ? me9.ep : 0) : -1} : null,
        sp: cutTP ? {count:spN, mine:pick9 ? (cutCP ? c9 : 0)*D.tp + t9 : -1} : null,
        cp: cutCP ? {count:D.cp, mine:pick9 ? c9 : -1} : null
      };
      body.push(graphSVG({
        x:x+3, y:y+3, w:cellW-6, h:cellH-6, g:rk, D:D, zscale:FS_Z, metricLi:li,
        /* 只有放大到看得清标注时才铺算子命中面：没放大时一格里几十个算子挤在
           一百来个像素里，点谁都是碰运气，那时点整格选卡才是对的交互。 */
        hitArr:(effW >= 130 ? hitOps : null), hitKey:'f'+r+'_'+cq,
        fitLabel:wide,
        label:lab9, bounds:GB, ghostIds:ghostIds,
        ghostClu:(liDense || !D.moe) ? ['moe-block'] : [],

      if(op9 < 1) body.push('</g>');
      /* ep 桶号（每格自己的坐标导出，不是全局选中的那份）。落在 EP 组框**外面**：
         框底在 gy0+gridH+5，门牌是屏幕恒定高度，两者随缩放脱钩——原来锚在
         cellH+9 这个场景固定量上，1× 时门牌上沿正好压在框线上。 */
      if(cutEP && cellW >= 40){
        var eb = me9 ? me9.ep : 0;
        var kE9 = Math.round(D.experts/D.ep), e09 = eb*kE9;
        fsPill(body, hit, x + cellW/2, y + cellH + 7 + PILLH/2,
          'ep'+eb + (cellW >= 120 ? ' · E'+e09+'–E'+(e09+kE9-1) : ''), VC.ep,
          hasSel && me9 && epOf(co.t, co.c, co.d, D).ep === eb, ['e', eb], 6.6);
      }
      /* 点格子 = 选中这张卡（正交方阵里格子就是卡/复制体本身） */
      hit.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cellW.toFixed(1)+'" height="'+cellH.toFixed(1)
        +'" style="fill:transparent;cursor:pointer" class="cgrow" data-act="chainpick" data-k="card" data-i="'+rk+'"/>');

  /* ── 轴门牌：DP 跨组居中一排、CP 每列一枚、TP·SP 行头一列——它们就是卡的层级坐标 ── */
  /* 代表层徽章：所有格画的是**同一层**，写一次就够。原来每格头上重复一条，

     相邻两条互相叠加、描边光晕互相抠字，看起来就是一行乱码。axis 级的信息

  var yTop = gy0 - (PILLH/2 + 8/FS_Z);
  var yCP = 0;

  var yDP = yTop;
  var lbAll = 'L'+li + (ui.cardMode && cutPP ? ' · PP'+liStage : '') + ' · ' + (liDense ? 'Dense' : 'MoE')
    + ' 代表层' + (revOn ? '（层反查）' : '') + '——每格画的是同一层';
  body.push(fsTxt(gx0 + gridW/2, yDP - (PILLH/2 + 9/FS_Z), esc(lbAll), 7.2, 'var(--pt-fg2)', 'middle',
    'font-weight="800" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6"'));
  if(cutDP){
    var stepD = D.dp > 10 ? 2 : 1;
    /* 抽稀之后仍要把**最后一枚**画出来（读者得知道这排到哪儿收尾），但原来的写法是
       在抽稀序列之外硬补一枚：dp=16 抽出 0,2,…,14，再补一个 15，于是 DP14 与 DP15
       的间距只有其它相邻门牌的一半，两块贴在一起。改成先排好序列，末枚若与上一枚
       挨得比 stepD 还近，就让上一枚让位——间距宁可不均，也不能撞。 */
    var dIdx = [];

    if(dIdx[dIdx.length-1] !== DD-1){

      dIdx.push(DD-1);
    }

    });
  } else if(D.dp > 1 && cellW >= 60){
    fsPill(body, hit, gx0 + gridW/2, yDP, 'DP ×'+D.dp+'（刀抬起：副本重叠）', VC.dp, false, null, 6.4);
  }
  if(CC > 1){
    for(var cq2 = 0; cq2 < cols; cq2++){

    }

     叠着 N 片」缺字）。按门牌实宽把锚点夹回来，保证左沿不越过 box.x。 */
  function leftAnchor(halfW, want){ return Math.max(box.x + halfW + 2/FS_Z, want); }

    var lb9 = 'TP·SP ×'+D.tp, sb9 = '每格还叠着 '+D.tp+' 片';
    var lx9 = leftAnchor(Math.max(pillHalf(lb9, 6.6), fsW(sb9, 5.6/FS_Z)/2), gx0 - 28);
    fsPill(body, hit, lx9, gy0 + cellH/2, lb9, VC.tp, false, null, 6.6);
    /* 副标题贴着门牌下沿走（PILLH/2 + 一条缝 + 字的上伸），不写场景固定量 16 */
    body.push(fsTxt(lx9, gy0 + cellH/2 + PILLH/2 + 10/FS_Z, sb9, 5.6, 'var(--pt-fg3)', 'middle'));
  }

      if(rows > 1) return [r9];

    };
    var grpOf = function(cq9, t8){

      return Math.floor(((d8*D.cp + c8)*D.tp + t8) / GSZ);

    for(var cq3 = 0; cq3 < cols; cq3++) for(var r3 = 0; r3 < rows; r3++)

        else { span[m8].c0 = Math.min(span[m8].c0, cq3); span[m8].c1 = Math.max(span[m8].c1, cq3); }

      var bx = cellX(sp8.c0) - 5, bw = cellX(sp8.c1) + cellW + 5 - bx;
      var by9 = gy0 - 5, bh9 = gridH + 10;
      var on8 = false;
      body.push('<rect x="'+bx.toFixed(1)+'" y="'+by9.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh9.toFixed(1)

         桶号（每列一枚）与组名（跨列一枚）上下相邻，一眼看得出「这几列凑一组」。
         原来组名孤零零挂在最上面，和它框住的列隔着 DP/CP 两排门牌。 */

        'EP 组 '+m8+' · '+(sp8.c1-sp8.c0+1)+' 列凑齐 '+D.experts+' 专家', VC.ep, on8, null, 6.6);

  var CID = 'fsClip';
  var wrapped = '<defs>'+hatchDefsSVG(FS_Z)+defs9.join('')+'<clipPath id="'+CID+'"><rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'"/></clipPath></defs>'

/* ═════════ 侧视图（原生）：全部层沿层深排开 + PP Stage 分段 ═════════
   一列 = 一层，列里是**竖着的一根算子条**（条状而非块状：条与条之间留白，
   参考 sidecar 右视图那种边缘朝外的画法）。方位与 3D 侧视对齐：L0 在左、
   末层在右；输入列在左上（L0 之前）、输出 + MTP 列在右下（末层之后），
   两头都用「竖脊 + 每枚胶囊一根小刺」接进 mHC 主干，不再绕大弧。
   层与层不一样的证据全部保留：Dense→MoE 换挡带、两头、mHC residual ×4 主干。
   PP 是主角：段头横幅（附因子与每段卡数）、段边界、段间掰缝；Rank 打开时每段
   下方铺卡架（段 → 卡的层级）。文字全部地图式：屏幕字号恒定（1/zoom 反除），

function sideScene(D, g, box){
  var IXg = graphIndex(); if(!IXg) return null;

  if(!root) return null;

  var Zv = Math.max(0.2, ui.zoom3);
  var co = coordsOf(g, D), hasSel = sel !== null && sel < D.world;

  var L = D.layers, lps = D.layersPerStage, denseTop = D.moe ? Math.min(2, L) : L;
  var revOn = revLiOn(D), revLi = revOn ? clamp(Math.floor(+ui.revLayer), 0, L-1) : -1;
  var body = [], hit = [];
  /* ── 层内的行：decoder-stack 里的算子（含逐层补的 mHC FFN Merge），按真图 y 排 ── */
  var rows = [];
  IXg.G.nodes.forEach(function(n){
    if(!(n.kind === 'op' || n.id === 'shared_expert_mlp' || n.id === 'mhc_attention_post')) return;
    if(!inClu(n.parent, 'decoder-stack', clu)) return;

  var vT = 1e9, vB = -1e9;

  /* ── 布局 ── */
  var rackOn = ui.cardMode;
  /* 数据标注按「数据」多选逐类开关：关掉的那一类连同它占的版面一起收走，
     不留空档（三条带全关就没有顶部数据块，图直接从层刻度开始）。 */
  var lnStd = ui.mv.num, lnAmx = ui.mv.num, lnLat = ui.mv.perf;
  var laneN = (lnStd?1:0) + (lnAmx?1:0) + (lnLat?1:0);
  var smpOn = ui.mv.num || ui.mv.perf;              /* 采样读数行：σ/Amax 归数值、ms 归性能 */
  var railOn = ui.mv.grad || ui.mv.train;           /* 回传轨 + 梯度点 + Optimizer 轨 */
  var MET = laneN ? (12 + laneN*25 + (smpOn ? 16 : 2)) : (smpOn ? 26 : 0);
  var ANN = railOn ? 72 : (ui.mv.train ? 24 : 0);   /* 底部训练轨块（只剩 Checkpoint 时收窄） */
  /* 两侧边距要装得下屏幕恒定尺寸的头尾标签（字号增益之后它们比以前宽约 1.7 倍） */
  var TM = 74, BM = (rackOn ? 108 : 48) + ANN, LM = 200, RM = 205;

  var yRail = box.y + TM - 12;

  }
  var selStage = cutPP ? co.p : 0;

  var vis1 = cxC + (box.x + box.w - cxC - ui.panX3)/Zv + 40;
  /* 字号增益之后同一句话在屏幕上宽了约 1.7 倍，「装得下」的门槛要跟着抬——
     TG = 缩放/反除基准，正好就是那个增益倍数，直接乘在阈值上，两者永远同步。 */

  var opLab = colW * Zv >= 110 * TG;      /* 条在屏幕上宽到装得下横排字，才往条里写 */
  /* ── 段头横幅 + 段边界 ── */
  if(cutPP){
    var yH = box.y + 44;
    for(var st9 = 0; st9 < D.pp; st9++){
      var lo9 = st9 * lps, hi9 = Math.min(L - 1, (st9 + 1) * lps - 1);
      var xa = xOf(lo9), xb = xOf(hi9) + colW;

      +'" style="fill:transparent;cursor:help"><title>L'+lg9+' 的训练一步 · 反向激活梯度 ∂L/∂H norm '+sg9.grad.toFixed(2)
      +' · 本 microbatch 贡献 Δ∇W '+(sg9.grad*(.36+sdSeed(lg9,11)*.22)).toFixed(2)
      +' · step 累积 ∇W 8/8 · L2 '+(sg9.grad*(.78+sdSeed(lg9,12)*.45)).toFixed(2)+'</title></rect>');

  }
  /* Checkpoint 是「训练」这一类自己的读数：轨关掉了它照样该在（存盘节奏与
     optimizer step 的节奏本来就是两件事），只是没有轨的时候贴着底走。 */
  if(ui.mv.train)
    body.push(fsTxt(mx1, railOn ? (yOp + 12) : (y1 + 14), 'Checkpoint · every 1000 steps', 5.6, 'var(--pt-fg3)', 'end',
      'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.2"'));
  /* ── 行标签总览：没放大时在模型中列标一次（放大后换成条内逐个写，这排就收起） ── */
  if(!opLab && colW * Zv >= 1.1){
    var xm = (x0 + x1) / 2;
    var lastY = -1e9;
    rows.slice().sort(function(a,b){ return a.y - b.y; }).forEach(function(n9){
      if(FS_DENSE[n9.id]) return;
      var yc = rowY(n9.y);
      if(yc - lastY < 7.4/FS_Z) return;

      var by8 = (sh0 && sh0[n9.id] && sh0[n9.id].spec && sh0[n9.id].spec.by) || EXTRA_BY[n9.id] || [];

      if(n9.id === 'attention_core') lbl = lbl + ' · DSA/SWA 按层';
      var tag = b8 ? ' · '+(b8.dim === 'sp' ? 'SP' : b8.dim.toUpperCase())+'切'+(b8.axis||'') : '';
      body.push(fsTxt(xm, yc + 2/FS_Z, esc(lbl + tag), 6.2, b8 ? dimColor(b8.dim) : 'var(--pt-fg2)', 'middle',
        'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6"'));
    });
    var lastY2 = -1e9;
    rows.slice().sort(function(a,b){ return a.y - b.y; }).forEach(function(n9){
      if(!FS_DENSE[n9.id] || denseTop <= 0) return;
      var yc = rowY(n9.y);
      if(yc - lastY2 < 7.4/FS_Z) return;
      lastY2 = yc;
      var lbl = n9.id === 'ffn_all_gather' ? 'Dense TP/SP AllGather'
              : n9.id === 'ffn_reduce_scatter' ? 'Dense TP/SP Reduce-Scatter' : 'Dense '+n9.label.replace(/^Dense /,'');
      body.push(fsTxt(xOf(0) - 8, yc + 2/FS_Z, esc(lbl), 6, VC.tp, 'end',
        'font-weight="700" paint-order="stroke" stroke="var(--pt-bg)" stroke-width="2.6"'));
    });
  }
  /* ── 两头：输入（左上，L0 之前）与 输出 + MTP（右下，末层之后）──
     参考 sidecar 的画法：一根浅灰竖轨，每个算子一枚**紧凑小圆角标签**贴在轨旁、
     一根小刺接轨；轨再圆角拐进 mHC 主干。标签只写名字（切法在悬停提示里），
     所以两头永远收在左右边距内，不会盖住条带。方位与 3D 对齐：入口在 L0 侧、
     出口在末层侧。 */
  function sideTag(arr, x, yC, lbl, col, dashed, anchor){
    var f9 = 6.2/FS_Z, h9 = 13/FS_Z;
    var w9 = String(lbl).length*(f9*0.6) + 12/FS_Z;
    var xL = anchor === 'start' ? x : x - w9;
    arr.push('<rect x="'+xL.toFixed(1)+'" y="'+(yC-h9/2).toFixed(1)+'" width="'+w9.toFixed(1)+'" height="'+h9.toFixed(1)
      +'" rx="'+(3.5/FS_Z).toFixed(2)+'" style="fill:var(--pt-s1);stroke:'+col+';stroke-width:'+(0.8/FS_Z).toFixed(2)
      +(dashed?';stroke-dasharray:'+(3/FS_Z).toFixed(2)+' '+(2/FS_Z).toFixed(2):'')+'"/>');
    arr.push(fsTxt(xL + w9/2, yC + 2.2/FS_Z, esc(lbl), 6.2, 'var(--pt-fg)', 'middle', 'font-weight="700"'));
    return w9;
  }
  function track(xT, yA, yB){
    body.push('<rect x="'+(xT - 3/FS_Z).toFixed(1)+'" y="'+yA.toFixed(1)+'" width="'+(6/FS_Z).toFixed(2)
      +'" height="'+(yB - yA).toFixed(1)+'" rx="'+(3/FS_Z).toFixed(2)+'" style="fill:var(--pt-s2);stroke:var(--pt-bd);stroke-width:'+(0.5/FS_Z).toFixed(2)+'"/>');
  }
  var pitch = 19/FS_Z;
  /* 输入（左上）：标签在轨左，轨顶圆角拐进主干左端 */
  var headTags = [
    ['Token IDs · Pos · Ctx', VC.dp],
    ['Embedding Weight', cutTP ? VC.tp : 'var(--pt-bds)'],
    ['Parallel Embedding', cutTP ? VC.tp : 'var(--pt-bds)']
  ];
  var hTrackX = x0 - 22;
  var hy0 = yRail + 26/FS_Z;
  var hyB = hy0 + (headTags.length - 1)*pitch;
  body.push(fsTxt(hTrackX - 8/FS_Z, hy0 - 16/FS_Z, '模型输入 · 只在 L0 之前', 6, 'var(--pt-fg2)', 'end', 'font-weight="800"'));
  body.push('<path d="M'+hTrackX.toFixed(1)+' '+(hy0 - 8/FS_Z).toFixed(1)
    +' L'+hTrackX.toFixed(1)+' '+(yRail + 10/FS_Z).toFixed(1)
    +' Q'+hTrackX.toFixed(1)+' '+yRail.toFixed(1)+' '+(hTrackX + 10/FS_Z).toFixed(1)+' '+yRail.toFixed(1)
    +' L'+(x0 - 4).toFixed(1)+' '+yRail.toFixed(1)
    +'" style="fill:none;stroke:var(--pt-fg3);stroke-width:'+(1/FS_Z).toFixed(2)+';opacity:.8"/>');
  track(hTrackX, hy0 - 8/FS_Z, hyB + 8/FS_Z);
  headTags.forEach(function(hp, i){
    var py = hy0 + i*pitch;
    body.push('<line x1="'+(hTrackX - 3/FS_Z).toFixed(1)+'" y1="'+py.toFixed(1)+'" x2="'+(hTrackX - 9/FS_Z).toFixed(1)+'" y2="'+py.toFixed(1)
      +'" style="stroke:var(--pt-fg3);stroke-width:'+(0.9/FS_Z).toFixed(2)+';opacity:.8"/>');
    sideTag(body, hTrackX - 9/FS_Z, py, hp[0], hp[1], false, 'end');
  });
  hit.push('<rect x="'+(box.x + 4).toFixed(1)+'" y="'+(hy0 - 24/FS_Z).toFixed(1)+'" width="'+(hTrackX - box.x).toFixed(1)

  /* 输出 + MTP（右下）：标签在轨右，轨顶从主干右端圆角拐下来；两组之间留一口气 */
  var tailTags = [
    ['Final RMSNorm', cutTP ? VC.tp : 'var(--pt-bds)', false, 0],
    ['LM Head W → LM Head', cutTP ? VC.tp : 'var(--pt-bds)', false, 0],
    ['Logits All-Gather', VC.tp, true, 0],
    ['Logits', 'var(--pt-bds)', false, 0],
    ['MTP Input Norms', cutTP ? VC.tp : 'var(--pt-bds)', false, 1],
    ['EH Projection', cutTP ? VC.tp : 'var(--pt-bds)', false, 1],
    ['MTP Decoder ×3', 'var(--pt-bds)', false, 1],
    ['MTP Head W / Shared Head', cutTP ? VC.tp : 'var(--pt-bds)', false, 1],
    ['MTP Logits', 'var(--pt-bds)', false, 1]
  ];
  var mtpGap = 12/FS_Z;
  var tTrackX = x1 + 22;
  var tyEnd = y1 + (rackOn ? -6 : 2);
  var ty0 = tyEnd - (tailTags.length - 1)*pitch - mtpGap;
  function tagY(i){ return ty0 + i*pitch + (tailTags[i][3] ? mtpGap : 0); }
  /* 右对齐贴住画布右沿：左对齐的话这行比标签轨还长，尾巴会被 clip 切掉 */
  body.push(fsTxt(box.x + box.w - 8, ty0 - 16/FS_Z, '主输出 + MTP · 只在 L'+(L-1)+' 之后', 6, 'var(--pt-fg2)', 'end', 'font-weight="800"'));
  body.push('<path d="M'+(x1 + 4).toFixed(1)+' '+yRail.toFixed(1)
    +' L'+(tTrackX - 10/FS_Z).toFixed(1)+' '+yRail.toFixed(1)
    +' Q'+tTrackX.toFixed(1)+' '+yRail.toFixed(1)+' '+tTrackX.toFixed(1)+' '+(yRail + 10/FS_Z).toFixed(1)
    +' L'+tTrackX.toFixed(1)+' '+(ty0 - 8/FS_Z).toFixed(1)
    +'" style="fill:none;stroke:var(--pt-fg3);stroke-width:'+(1/FS_Z).toFixed(2)+';opacity:.8"/>');
  track(tTrackX, ty0 - 8/FS_Z, tyEnd + 8/FS_Z);
  tailTags.forEach(function(tp9, i){
    var py = tagY(i);
    body.push('<line x1="'+(tTrackX + 3/FS_Z).toFixed(1)+'" y1="'+py.toFixed(1)+'" x2="'+(tTrackX + 9/FS_Z).toFixed(1)+'" y2="'+py.toFixed(1)
      +'" style="stroke:var(--pt-fg3);stroke-width:'+(0.9/FS_Z).toFixed(2)+';opacity:.8"/>');
    sideTag(body, tTrackX + 9/FS_Z, py, tp9[0], tp9[1], tp9[2], 'start');
  });
  hit.push('<rect x="'+tTrackX.toFixed(1)+'" y="'+(ty0 - 24/FS_Z).toFixed(1)+'" width="'+(box.x + box.w - tTrackX - 4).toFixed(1)
    +'" height="'+(tailTags.length*pitch + mtpGap + 30/FS_Z).toFixed(1)+'" style="fill:transparent;cursor:help" data-tipk="tail"/>');
  /* ── 反查某一层：给那一列描个框 + 写清牵动多少张卡 ── */
  if(revOn){
    var rx = xOf(revLi);
    var hv = layerHome(D, revLi);
    body.push('<rect x="'+(rx-2).toFixed(1)+'" y="'+(y0-8).toFixed(1)+'" width="'+(colW+4).toFixed(1)+'" height="'+(y1-y0+14).toFixed(1)
      +'" rx="'+(3/FS_Z).toFixed(2)+'" style="fill:none;stroke:'+VC.dp+';stroke-width:'+(1.8/FS_Z).toFixed(2)+'"/>');
    fsPill(body, hit, rx + colW/2, y1 + 12, 'L'+revLi+' · '+fmt(hv.tot)+' 张卡'
      + (hv.frag > 1 ? '，各持 1/'+hv.frag : ''), VC.dp, true, null, 6.6);
  }
  /* ── Rank：选中卡的段框 + 每段的卡架（段 → 卡的层级）── */
  if(rackOn){
    if(cutPP){
      var sxa = xOf(selStage*lps) - 4, sxb = xOf(Math.min(L-1, (selStage+1)*lps - 1)) + colW + 4;
      body.push('<rect x="'+sxa.toFixed(1)+'" y="'+(y0-10).toFixed(1)+'" width="'+(sxb-sxa).toFixed(1)+'" height="'+(y1-y0+18).toFixed(1)
