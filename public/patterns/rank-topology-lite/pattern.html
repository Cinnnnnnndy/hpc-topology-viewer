<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="referrer" content="no-referrer" />
<title>模型分片与训练设备映射 · 简洁版</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./pattern.css" />
<!--
  rank-topology-lite —— /patterns/rank-topology-3d/ 的简洁版。两个本体各管一半，
  谁都不重新实现：

  · 没点开任何一张卡时：铺满整个视口的是 /rubik-pattern.html（逻辑魔方，同源
    iframe，盘古 ProMoE 预置 tp8·pp5·dp100·ep2 = 4000 卡全量）。它自己就是
    WebGL 实例化网格——素块、没有文字标签、没有显示/性能问题，这正是这一屏
    「未点击之前」想要的样子，不必在 SVG 矩阵里另外拼一套。
  · 点开一张卡（逻辑魔方自己 postMessage 上报的 rubik-select）之后，切换成
    /patterns/rank-topology-3d/pattern.html（同源 iframe，带上换算过的
    ?sel=），矩阵本体自己的选中态渲染——真实坐标、内存/容量读出、六档通信、
    兄弟卡高亮——原样接管，这一层不重新画一遍。逻辑魔方与并行拓扑各自的
    rank 编号公式不同（内部打包顺序不一样），切换时按 (tp,pp,dp) 坐标换算，
    不是直接把数字抄过去（见 pattern.js 里 rubikSelToMatrixSel 的注释）。
  · 矩阵内部再点一次选中卡，会切到它自己的"单卡下钻"档（连兄弟卡也隐去，
    看的是这一张卡内部），通过 pto:tier 消息把档位报回这一层，返回按钮与
    悬浮数据卡跟着换。「← 返回」按钮跟"点空白处"一个规矩——一次退一档。

  两边都不缩小、不加框，边到边铺满视口——拓扑本身就是全屏幕的画布，不是
  「一张卡片放中间」。选中卡之后，右下角悬浮一张数据卡（rank 坐标、层段、
  容量告警、兄弟卡数/显存构成明细），数据全部来自矩阵 iframe 上报的已算好的
  摘要，这一层不重算、不编数字。
-->
</head>
<body>
  <iframe id="rubikFrame" class="stage-frame" title="逻辑魔方（盘古 ProMoE · 4000 卡全量视图）"></iframe>
  <iframe id="matrixFrame" class="stage-frame is-hidden" title="rank-topology-3d 本体 · 选中卡详情"></iframe>

  <button id="backBtn" class="back-btn is-hidden" type="button">← 返回魔方视图</button>

  <aside id="briefCard" class="brief-card is-hidden" aria-live="polite"></aside>

  <a class="corner-link" href="../rank-topology-3d/pattern.html">简洁版 · 完整独立页 →</a>

  <script src="./pattern.js"></script>
</body>
</html>
