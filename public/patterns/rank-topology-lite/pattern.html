<head>

<title>模型分片与训练设备映射 · 简洁版</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./pattern.css" />
<!--
  rank-topology-lite —— /patterns/rank-topology-3d/ 的简洁版。

  拓扑本身就是全屏幕的无限画布——不是「一张卡片放中间」。中央这块 iframe
  就是 /patterns/rank-topology-3d/pattern.html 本体（?embed=1，同源，不是
  拷贝），铺满整个视口，边到边，不加框、不加标题条、不缩小。它自己的拖动/
  缩放/选组/换预置/换视角——矩阵自带的那一整套镜头与控制——原样在场，这一层
  什么都不裁剪、不额外包一层镜头。固定给它 preset=pangu·theme=dark：盘古
  ProMoE 4000 卡、它自己支持的深色 token，不额外注入样式。

  下钻一张卡（矩阵页自己上报的 postMessage pto:select）之后，那张卡的真实
  坐标浮成一张卫星卡贴在屏幕边上——像 Miro 贴便签一样浮在主画布上层，不占
  用、不缩小主画布本身的可视范围。
-->
</head>
<body>
  <iframe id="matrixFrame" class="matrix-frame" title="rank-topology-3d 本体（盘古 ProMoE · 4000 卡）"></iframe>

  <a class="corner-link" href="../rank-topology-3d/pattern.html">简洁版 · 完整独立页 →</a>

  <div id="satLayer" class="sat-layer"></div>

  <script src="./pattern.js"></script>
</body>
</html>
